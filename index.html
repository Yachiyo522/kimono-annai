ُدسّ الطرف الآخر بين طبقات الأوبي الملفوفة حول الخصر لتثبيته. وتُعدّ تنويعًا على عقدة كاتاباسامي (⁦katabasami⁩)، وتتميز بعقدة صغيرة مسطّحة. ولا يوجد رأي متفق عليه في أصل تسميتها.", "o": "يوكاتا (⁦yukata⁩) الرجال وملابسهم اليومية", "w": "كاكو أوبي (ويمكن للنساء ربطها بهانهابا أوبي، hanhaba obi)", "p": ["أسهل ربطًا من كاي نو كوتشي", "عقدتها مسطّحة، فلا تضغط على الظهر عند الجلوس", "في المناسبات الرسمية تُختار كاي نو كوتشي أو ما شابهها"]}, "t-yuzen": {"n": "تقنية صباغة كالرسم بالفرشاة", "tag": "تقنية تُصبغ فيها الزخارف بألوان متعددة كأنها تُرسم بالفرشاة.", "d": "يوزن (⁦yūzen⁩) تقنية صباغة يُقال إن ميازاكي يوزنساي (⁦Miyazaki Yūzensai⁩)، رسّام المراوح في كيوتو، نشرها في عصر إيدو. تُرسم حدود الزخرفة بعجينة مصنوعة من الأرز الدبق ونحوه لمنع تسرّب الألوان، ثم تُلوَّن المساحات داخلها بالفرشاة. وتتيح تصوير الزهور والمناظر الطبيعية كأنها لوحات فنية.", "o": "فوريسوده (⁦furisode⁩)، توميسوده (⁦tomesode⁩)، هومونغي (⁦hōmongi⁩)، تسوكيساغيه (⁦tsukesage⁩)", "w": "كيو-يوزن (Kyō-yūzen، كيوتو)، كاغا-يوزن (Kaga-yūzen، إيشيكاوا)، طوكيو تيغاكي-يوزن (Tokyo tegaki-yūzen، طوكيو)", "p": ["تتميز بخطوط حدود بيضاء رفيعة (إيتومه، itome) ترسمها العجينة", "يتميز كاغا-يوزن بالأزهار والنباتات الواقعية وبأوراق «مثقوبة بالحشرات» (⁦mushikui⁩)، ويتميز كيو-يوزن ببهائه بإضافة الزخرفة الذهبية والتطريز", "قد يستغرق صنع كيمونو واحد عدة أشهر"]}, "t-ise": {"n": "تقنية صباغة زخارف دقيقة بالقوالب الورقية", "tag": "تقنية تُصبغ فيها زخارف دقيقة بإتقان باستخدام قوالب من ورق واشي.", "d": "إيسه-كاتاغامي (⁦Ise-katagami⁩) قالب من ورق واشي (⁦washi⁩) ملصوق طبقاتٍ بعصارة الكاكي (كاكي-شيبو، kakishibu) ومحفور بالزخارف، يوضع على القماش ثم تُفرد العجينة فوقه، فتبقى الزخرفة دون صباغة عند صبغ القماش. وتُصنع هذه القوالب منذ القدم في شيروكو (⁦Shiroko⁩) وجيكه (⁦Jike⁩) بمدينة سوزوكا في محافظة ميه، وقد أتاحت زخارف بالغة الدقة مثل إيدو كومون (⁦Edo komon⁩).", "o": "إيدو كومون، كومون (⁦komon⁩)، يوكاتا (⁦yukata⁩)", "w": "القوالب: مدينة سوزوكا، محافظة ميه (شيروكو وجيكه) / الصباغة: طوكيو وكيوتو وغيرهما", "p": ["من الزخارف ما هو بالغ الدقة حتى يبدو سادة من بعيد", "إيسه-كاتاغامي (ويُكتب اسمها الرسمي بوصفها حرفة تقليدية بحرف كانجي مختلف) أداة حِرفية تقليدية معتمدة من الدولة", "تقنية حفر القوالب مصنّفة من الدولة ممتلكات ثقافية غير مادية مهمة"]}, "t-shibori": {"n": "تقنية الصباغة بربط القماش", "tag": "تقنية يُربط فيها القماش بالخيط ثم يُصبغ، فتنشأ زخارف بارزة ناعمة.", "d": "شيبوري (⁦shibori⁩) تقنية يُربط فيها جزء من القماش بالخيط، أو يُخاط ويُجمَّع، أو يُطوى، لمنع الصبغة من الوصول إليه، فتظهر الزخرفة بعد الصباغة. وفي أنواع مثل كانوكو شيبوري (⁦kanoko shibori⁩) تبقى آثار الربط نتوءات صغيرة بارزة، فتمنح القماش هيئة مجسّمة فريدة وملمسًا ناعمًا.", "o": "فوريسوده (⁦furisode⁩)، هومونغي (⁦hōmongi⁩)، هاوري (⁦haori⁩)، وشاح الأوبي (أوبي-آغيه، obi-age)، يوكاتا (⁦yukata⁩)", "w": "كيو-كانوكو شيبوري (Kyō-kanoko shibori، كيوتو)، أريماتسو-نارومي شيبوري (Arimatsu-Narumi shibori، آيتشي)", "p": ["سُمّي «كانوكو شيبوري»، المكوَّن من صفوف من النقاط الصغيرة، بهذا الاسم لشبهه ببقع ظهر صغير الغزال", "فوريسوده المغطّى كله بالشيبوري قطعة من أرفع المستويات، تُربط فيها مئات الآلاف من النقاط يدويًا", "كان أريماتسو-نارومي شيبوري في عصر إيدو هدية تذكارية رائجة لدى المسافرين على طريق توكايدو (⁦Tōkaidō⁩)"]}, "t-roketsu": {"n": "صباغة تحجب الزخارف بالشمع", "tag": "تقنية تُرسم فيها الزخارف بالشمع المذاب لمنع وصول الصبغة.", "d": "روكيتسو-زومه (⁦rōketsu-zome⁩) تقنية يوضع فيها الشمع المذاب على القماش بالفرشاة ونحوها، فلا تتسرب الصبغة إلى تلك المواضع عند الصباغة. وصلت إلى اليابان في عصر نارا، وما زالت أعمال منها محفوظة في مخزن شوسوئين (⁦Shōsōin⁩)، ثم انقطعت، وأحياها فنانو الصباغة في الفترة من عصر تايشو إلى عصر شووا. وتتسرب الصبغة إلى شقوق الشمع فتتكوّن خطوط تشقّق دقيقة تمنحها طابعًا فريدًا.", "o": "هومونغي (⁦hōmongi⁩)، تسوكيساغيه (⁦tsukesage⁩)، ناغويا أوبي (⁦Nagoya obi⁩)، فوكورو أوبي (⁦fukuro obi⁩) للأناقة", "w": "فنانون في كيوتو وفي أنحاء اليابان", "p": ["تُقدَّر بـ«زخرفة التشقّق» الناتجة عن تكسّر الشمع", "إحدى تقنيات الصباغة الثلاث في عصر نارا المعروفة بـ«سانكيتشي» (⁦sankechi⁩)", "تقوم على المبدأ نفسه الذي يقوم عليه الباتيك الإندونيسي"]}, "t-shishu": {"n": "تقنية التطريز بالخيوط", "tag": "تقنية تُطرَّز فيها الزخارف بخيوط الحرير والذهب والفضة فتبدو مجسّمة.", "d": "شيشو (⁦shishū⁩)، أي التطريز، تقنية زخرفية تُرسم فيها الزخارف بالإبرة باستخدام خيوط الحرير وخيوط الذهب والفضة. وكثيرًا ما تُضاف فوق الزخارف المصبوغة لتمنحها بهاءً وعمقًا، وللتطريز الياباني عشرات التقنيات. وأشهر أساليبه «كيونوي» (⁦kyōnui⁩) في كيوتو.", "o": "فوريسوده (⁦furisode⁩)، توميسوده (⁦tomesode⁩)، هومونغي (⁦hōmongi⁩)، هان-إيري (han-eri، الياقة الداخلية)، فوكورو أوبي (⁦fukuro obi⁩)، أوتشيكاكه (uchikake، رداء العروس)", "w": "كيونوي (كيوتو)، كاغا-نوي (Kaga-nui، إيشيكاوا)، تطريز إيدو (Edo shishū، طوكيو)", "p": ["تُفصل خيوط الحرير وتُبرم يدويًا للتحكم في اللمعان وتدرّج الألوان", "يزداد الكيمونو ثراءً في مظهره عند الجمع بين الصباغة والتطريز", "كلما كثر التطريز بدا الكيمونو أكثر بهاءً وفخامة (أما درجة الرسمية فيحددها نوع الكيمونو)"]}, "t-kinsai": {"n": "تقنية الزخرفة برقائق الذهب ومسحوقه", "tag": "تقنية تُزيَّن فيها الزخارف ببهاء برقائق الذهب ومسحوقه.", "d": "كينساي (⁦kinsai⁩) تقنية زخرفية توضع فيها مادة لاصقة (عجينة) على القماش بعد صبغه، ثم تُلصق فوقها رقائق الذهب أو مسحوقه لتزيين الزخارف. ويُضاف الذهب إلى حدود زخارف يوزن (⁦yūzen⁩) وبتلات أزهارها لإكسابها بريقًا، ولها أساليب كثيرة مثل «سوريهاكو» (⁦surihaku⁩) و«سوناغو» (⁦sunago⁩).", "o": "فوريسوده (⁦furisode⁩)، توميسوده (⁦tomesode⁩)، هومونغي (⁦hōmongi⁩)، فوكورو أوبي (⁦fukuro obi⁩)", "w": "كيوتو (تطورت مع كيو-يوزن، Kyō-yūzen)", "p": ["تبرز الزخارف حين يسقط عليها الضوء", "استُخدم سوريهاكو في عصر موموياما أيضًا في أزياء مسرح نو (⁦Noh⁩)", "قد تُستخدم الفضة والبلاتين إلى جانب الذهب"]}, "t-kasuri": {"n": "نسيج بزخارف باهتة الحواف", "tag": "نسيج يُحاك بخيوط مصبوغة على أجزاء مسبقًا، فتظهر زخارف تبدو باهتة الحواف.", "d": "كاسوري (⁦kasuri⁩) تقنية يُربط فيها جزء من الخيوط لمنع وصول الصبغة إليه، ثم تُنسج الخيوط المصبوغة على أجزاء لتكوين الزخرفة. وعند النسج تحدث إزاحات طفيفة فتبدو الحواف باهتة متقطعة، ومن هنا جاء اسم «كاسوري» (أي الأثر الباهت). ويتميز بملمس ريفي بسيط يبعث الدفء.", "o": "تسوموغي (⁦tsumugi⁩)، الكيمونو القطني، يوكاتا (⁦yukata⁩)، ملابس العمل مثل ساموئيه (⁦samue⁩)", "w": "كوروميه كاسوري (Kurume kasuri، فوكوكا)، إييو كاسوري (Iyo kasuri، إهيمه)، بينغو كاسوري (Bingo kasuri، هيروشيما) / ويُستخدم أيضًا في أوشيما تسوموغي (⁦Ōshima tsumugi⁩) ويوكي تسوموغي (⁦Yūki tsumugi⁩)", "p": ["أشهر ثلاثة أنواع من كاسوري في اليابان: كوروميه وإييو وبينغو", "الحواف الباهتة سحرٌ يتفرد به كاسوري المنسوج بخيوط مصبوغة على أجزاء", "توجد حول العالم تقنيات من الفصيلة نفسها تُعرف باسم «إيكات» (⁦ikat⁩)"]}, "t-tsumugi": {"n": "نسيج حريري من خيوط نُدف الحرير", "tag": "نسيج حريري بسيط ومتين يُحاك بخيوط غُزلت يدويًا من نُدف الحرير.", "d": "تسوموغي (⁦tsumugi⁩) في الأصل نسيج حريري يُصنع من خيوط ذات عُقد صغيرة (تسوموغي-إيتو، tsumugi-ito) تُغزل من نُدف الحرير (ماواتا، mawata) أو من الشرانق المعيبة والمزدوجة، وتُصبغ هذه الخيوط قبل النسج. وتمنحه عُقد الخيوط ملمسًا متموّجًا فريدًا ومظهرًا هادئًا قليل اللمعان. وما زال يوكي تسوموغي (⁦Yūki tsumugi⁩) يُصنع من خيوط نُدف الحرير المغزولة يدويًا، أما بعض الأنواع مثل أوشيما تسوموغي (⁦Ōshima tsumugi⁩) فتُنسج اليوم من خيوط الحرير ولم يبقَ لها من «تسوموغي» إلا الاسم. ولمعرفة تسوموغي بوصفه نوعًا من الكيمونو، يُرجى الاطلاع أيضًا على تبويب «الكيمونو».", "o": "كيمونو تسوموغي، هاوري (⁦haori⁩)، ناغويا أوبي (⁦Nagoya obi⁩)، هاسّون أوبي (⁦hassun obi⁩)", "w": "أوشيما تسوموغي (كاغوشيما)، يوكي تسوموغي (إيباراكي وتوتشيغي)، أوشيكوبي تسوموغي (Ushikubi tsumugi، إيشيكاوا)، شيوزاوا تسوموغي (Shiozawa tsumugi، نيغاتا) وغيرها", "p": ["تقنية يوكي تسوموغي، القائمة على خيوط نُدف الحرير المغزولة يدويًا وربط كاسوري (⁦kasuri⁩) يدويًا والنسج على النول الأرضي (جيباتا، jibata)، مصنّفة من الدولة ممتلكات ثقافية غير مادية مهمة (1956)، ومسجّلة أيضًا في قائمة اليونسكو للتراث الثقافي غير المادي (2010)", "يتميز أوشيما تسوموغي بلونه الأسود المائل إلى البني العميق الناتج عن الصباغة بالطين", "يُقال أيضًا إنه نشأ للاستفادة من الشرانق المعيبة"]}, "t-chirimen": {"n": "نسيج حريري بتجعيدات دقيقة", "tag": "نسيج حريري ليّن على سطحه تجعيدات دقيقة بارزة (شيبو، shibo).", "d": "تشيريمن (⁦chirimen⁩) نسيج حريري يُحاك بخيوط لُحمة (يوكو-إيتو، yoko-ito) مبرومة برمًا شديدًا، فإذا نُقّي القماش حاولت الخيوط أن تعود إلى حالتها فتتكوّن على سطحه تجعيدات دقيقة تُسمّى «شيبو». ولأن الصبغة تتشربه جيدًا وتظهر ألوانه زاهية جميلة، يُستخدم على نطاق واسع قماشًا للكيمونو المصبوغ مثل يوزن (⁦yūzen⁩).", "o": "كومون (⁦komon⁩)، هومونغي (⁦hōmongi⁩)، إيرومُوجي (⁦iromuji⁩)، تسوكيساغيه (⁦tsukesage⁩)، وشاح الأوبي (أوبي-آغيه، obi-age)، فوروشيكي (furoshiki، قماش اللف)", "w": "تانغو تشيريمن (Tango chirimen، كيوتو)، ناغاهاما تشيريمن (Nagahama chirimen، شيغا)", "p": ["يمثّل تانغو تشيريمن نسبة كبيرة من الأقمشة البيضاء المخصّصة للكيمونو في اليابان", "بحسب طريقة برم خيوط اللُّحمة وسُمكها، توجد أنواع مثل «هيتوكوشي» (⁦hitokoshi⁩) ذي التجعيد الدقيق، و«كوداي» (⁦kodai⁩) الأكبر قليلًا، و«أوني-شيبو» (⁦oni-shibo⁩) الأكبر منه", "لا تظهر عليه التجاعيد بسهولة، وملمسه ناعم ليّن (لكن يُرجى الحذر لأنه ينكمش بسهولة إذا ابتلّ)"]}}};

const AR_FIX={"UI": {}, "items": {"tomesode": {"d": "كورو-توميسوده (⁦kuro-tomesode⁩) ذو الأرضية السوداء هو أعلى الأزياء رسمية للنساء المتزوجات. يكون نصفه العلوي سادة، وتُرسم الزخارف الجالبة للحظ عند الذيل فقط، ويحمل خمسة شعارات للعائلة على الظهر وجانبي الصدر والكُمّين. أما إيرو-توميسوده (⁦iro-tomesode⁩) الملوَّن فيمكن أن ترتديه غير المتزوجات أيضًا؛ وإذا حمل خمسة شعارات للعائلة كان بمنزلة كورو-توميسوده، وإذا حمل ثلاثة شعارات أو شعارًا واحدًا عُدّ شبه رسمي.", "p": ["شعارات العائلة الخمسة علامة على أعلى درجات الرسمية", "الزخارف أسفل الخصر فقط", "يُنسَّق مع فوكورو أوبي (⁦fukuro obi⁩) مزيَّن بخيوط ذهبية وفضية"]}, "iromuji": {"d": "إيرومُوجي (⁦iromuji⁩) كيمونو (⁦kimono⁩) مصبوغ بلون واحد غير الأسود ولا زخارف عليه. إذا أُضيف إليه شعار العائلة صار شبه رسمي، ومن دونه يُلبس زيًّا رسميًا مخفَّفًا، وبتغيير الأوبي (⁦obi⁩) يصبح زيًّا أنيقًا غير رسمي. قطعة واحدة تناسب مناسبات كثيرة."}, "komon": {"d": "كومون (⁦komon⁩) كيمونو (⁦kimono⁩) أنيق للاستخدام اليومي، صُبغت عليه الزخرفة نفسها مرارًا في كل أنحائه. وكثير منه لا يكون لزخارفه اتجاه موحَّد للأعلى والأسفل، وهو مثالي للنزهات والخروج لتناول الطعام ومشاهدة العروض المسرحية."}, "tsumugi": {"d": "تسوموغي (⁦tsumugi⁩) «كيمونو منسوج» يُصنع من خيوط صُبغت قبل النسج. وكان يُصنع أصلًا من خيوط تُغزَل يدويًا من نُدف الحرير (ماواتا، mawata)، فيتميز بملمس ريفي بسيط ومتانة، وكان في البداية لباس المزارعين اليومي. ومنه أنواع عالية الثمن تُعدّ من الحرف التقليدية، مثل أوشيما تسوموغي (⁦Ōshima tsumugi⁩) ويوكي تسوموغي (⁦Yūki tsumugi⁩).", "p": ["مهما ارتفع ثمنه تبقى درجته يومية أو أنيقة غير رسمية، والأصل ألّا يُرتدى في المراسم كحفلات الزفاف", "يزداد ليونة وانسجامًا مع الجسم كلما ارتُدي", "أوشيما تسوموغي ويوكي تسوموغي وغيرهما مصنَّفة رسميًا في اليابان ضمن الحرف التقليدية"]}, "yukata": {"d": "يوكاتا (⁦yukata⁩) كيمونو (⁦kimono⁩) غير مبطَّن مصنوع غالبًا من القطن. بدأ بثوب «يوكاتابيرا» (⁦yukatabira⁩) الذي كان يُلبس عند الاستحمام في حمامات البخار في عصر هييان، ثم انتشر في عصر إيدو ثوبًا يُلبس بعد الاستحمام، وهو اليوم الزي المعتاد في مهرجانات الصيف وعروض الألعاب ا homongi:{n:"मुलाक़ाती किमोनो (होमोंगी)",tag:"किसी भी महिला के लिए अर्ध-औपचारिक किमोनो, जिसके नमूने सिलाई के आर-पार बहते हैं।",d:"विवाहित और अविवाहित, दोनों महिलाओं द्वारा पहना जाने वाला सुरुचिपूर्ण अर्ध-औपचारिक किमोनो। इसकी पहचान एबा-मोयो है: नमूना सिलाइयों के पार एक ही चित्र की तरह कंधे से आस्तीन और निचले किनारे तक बहता है।",o:"विवाह और दावतें (अतिथि के रूप में), पार्टियाँ, चाय समारोह, स्कूल के समारोह",w:"महिलाएँ, विवाहित या अविवाहित",p:["नमूना सिलाइयों के पार बिना टूटे जारी रहता है","पारिवारिक प्रतीक जोड़ने से औपचारिकता बढ़ जाती है","आम तौर पर फ़ुकुरो ओबी (औपचारिक ब्रोकेड कमरबंद) के साथ पहना जाता है"]},
iromuji:{n:"एकरंगी किमोनो",tag:"काले के अलावा किसी एक रंग में रंगा सादा किमोनो। इसकी औपचारिकता पारिवारिक प्रतीकों से तय होती है।",d:"काले के अलावा किसी एक रंग में रंगा किमोनो, जिस पर चित्रित नमूना नहीं होता। पारिवारिक प्रतीक के साथ यह अर्ध-औपचारिक परिधान बन जाता है; बिना प्रतीक के यह सजीले परिधान के रूप में चलता है, और हल्के ओबी के साथ इसे सैर-सपाटे के लिए भी पहना जा सकता है। एक ही किमोनो कई अवसरों के काम आता है।",o:"चाय समारोह, औपचारिक आयोजन, बच्चों के साथ मंदिर दर्शन, शोक सभाएँ (फीके रंगों में)",w:"महिलाएँ, विवाहित या अविवाहित",p:["कपड़े में हल्का बुना हुआ नमूना हो सकता है","एक पारिवारिक प्रतीक इसे अर्ध-औपचारिक बना देता है","फीके रंग शोक सभाओं में पहने जा सकते हैं"]},
komon:{n:"बारीक नमूने वाला किमोनो",tag:"छोटे दोहराए जाने वाले नमूने से भरा, रोज़मर्रा का सजीला किमोनो।",d:"पूरे कपड़े पर एक ही दोहराए जाने वाले नमूने से रंगा किमोनो, जिसे रोज़मर्रा के स्टाइलिश परिधान के रूप में पहना जाता है। नमूना अक्सर एक से अधिक दिशाओं में चलता है, और यह सैर, भोजन या शाम को थिएटर जाने के लिए एकदम उपयुक्त है।",o:"शहर में घूमना, मित्रों के साथ रात्रिभोज, थिएटर, कक्षाएँ, अनौपचारिक चाय सभाएँ",w:"महिलाएँ, विवाहित या अविवाहित",p:["पश्चिमी कपड़ों में एक अच्छी डे-ड्रेस जैसा","एदो कोमोन के कुछ नमूने (साम़े, ग्योगी, काकुदोशी) पारिवारिक प्रतीक जोड़ने पर सजीला परिधान बन जाते हैं","अक्सर नागोया ओबी के साथ पहना जाता है"]},
tsumugi:{n:"बुना हुआ रेशमी किमोनो",tag:"पहले से रंगे धागों से बुना मज़बूत, देहाती रोज़मर्रा का किमोनो।",d:"बुनाई से पहले रंगे गए धागों से बना बुना हुआ किमोनो। परंपरागत रूप से धागा रेशम के फाहे से हाथ से काता जाता है, जिससे मिट्टी जैसी बनावट और टिकाऊपन मिलता है; यह मूल रूप से किसान परिवारों का रोज़मर्रा का पहनावा था। ओशिमा और यूकी त्सुमुगी जैसी प्रसिद्ध किस्में बेशकीमती पारंपरिक शिल्प हैं।",o:"रोज़ की सैर, यात्रा, अनौपचारिक सभाएँ",w:"पुरुष और महिलाएँ",p:["कितना भी महँगा हो, इसे अनौपचारिक या स्मार्ट-कैज़ुअल माना जाता है और आम तौर पर विवाह जैसे समारोहों में नहीं पहना जाता","जितना अधिक पहनें, उतना नरम होता है और शरीर पर बेहतर बैठता है","ओशिमा और यूकी त्सुमुगी आधिकारिक रूप से मान्यता प्राप्त पारंपरिक शिल्प हैं"]},
yukata:{n:"गर्मियों का सूती किमोनो",tag:"गर्मियों के लिए हल्का, अनौपचारिक सूती किमोनो।",d:"बिना अस्तर का किमोनो, जो आम तौर पर सूती कपड़े का होता है। इसकी शुरुआत हेइआन काल में भाप-स्नान के दौरान पहने जाने वाले पतले वस्त्र 'युकाताबिरा' से हुई; एदो काल में यह नहाने के बाद पहनने के वस्त्र के रूप में फैला, और आज गर्मियों के त्योहारों तथा आतिशबाज़ी के लिए यह पारंपरिक पोशाक है। इसे हल्के अंतर्वस्त्र के ऊपर, नागाजुबान के बिना, लकड़ी की गेता चप्पलों और नंगे पैरों के साथ पहना जाता है।",o:"गर्मियों के त्योहार, आतिशबाज़ी, बोन नृत्य, गर्म पानी के झरनों वाली सराय में आरामदायक पहनावा",w:"पुरुष, महिलाएँ और बच्चे",p:["हमेशा बायाँ भाग दाएँ के ऊपर लपेटें। दायाँ ऊपर केवल मृतकों के लिए होता है","र्योकान (जापानी सराय) में दिया गया युकाता सराय के भीतर का अनौपचारिक पहनावा है (भोजन-कक्षों के नियम हर सराय में देखें)","पतले हानहाबा ओबी या मुलायम हेको ओबी से बाँधा जाता है, इसलिए खुद पहनना आसान है"]},
haori:{n:"किमोनो जैकेट",tag:"किमोनो के ऊपर पहनी जाने वाली छोटी जैकेट।",d:"किमोनो के ऊपर पहनी जाने वाली जैकेट, जो आगे डोरी से बंद होती है। महिलाओं के लिए यह गर्माहट और शैली के लिए अनौपचारिक पहनावा है। पुरुषों के लिए, पाँच पारिवारिक प्रतीकों वाला काला किमोनो और काला हाओरी, धारीदार सेंदाई-हीरा हाकामा के साथ, सबसे औपचारिक पोशाक (कुरो-मोनत्सुकी हाओरी हाकामा) है।",o:"महिलाएँ: रोज़ की सैर, गर्माहट / पुरुष: विवाह और समारोह (प्रतीकों और हाकामा के साथ)",w:"पुरुष और महिलाएँ",p:["आगे हाओरी-हिमो डोरी से बंद किया जाता है","कोट के विपरीत, इसे आम तौर पर घर के अंदर भी पहने रखा जा सकता है (पर चाय समारोह में उतार दिया जाता है)","अस्तर में अक्सर चटख, चंचल नमूने छिपे होते हैं, जो शैली का सूक्ष्म रूप हैं"]},
hakama:{n:"चुन्नटदार पतलून या स्कर्ट",tag:"किमोनो के ऊपर कमर से नीचे पहना जाने वाला चुन्नटदार परिधान।",d:"किमोनो के ऊपर पहना जाने वाला चुन्नटदार परिधान, जिसका आकार चौड़ी पतलून या स्कर्ट जैसा होता है। पुरुष इसे प्रतीक वाले हाओरी के साथ औपचारिक पोशाक के रूप में पहनते हैं, और स्नातक समारोह में यह महिलाओं की लोकप्रिय पोशाक है। इसे क्युदो, केंदो और आइकिदो जैसी मार्शल आर्ट में भी पहना जाता है।",o:"स्नातक समारोह, विवाह (दूल्हा), कमिंग-ऑफ़-एज डे (पुरुष), मार्शल आर्ट, शिंतो पुजारी और मंदिर-सेविकाएँ",w:"पुरुष और महिलाएँ",p:["पुरुषों के हाकामा में आगे पाँच और पीछे दो चुन्नटें होती हैं","माना जाता है कि सात चुन्नटें सात गुणों का प्रतीक हैं","दो शैलियाँ: बँटा हुआ उमानोरी (पतलून) और अंदोन (स्कर्ट)"]},

const TL={UI:{app:"Gabay sa Kimono",sub:"Kimono, obi, mga buhol ng obi, at mga teknik sa pagtitina at paghahabi, ipinaliwanag",pick:["Pumili ng kimono","Pumili ng obi","Pumili ng buhol","Pumili ng teknik"],f:"Pormalidad",occ:"Mga okasyon",who:"Sino ang nagsusuot",pts:"Magandang malaman",listen:"Pakinggan",say:"Pakinggan ang pangalan",varies:"Nag-iiba depende sa kasuotan",lv:["Kaswal","Smart casual","Pang-ayos","Semi-pormal","Pinakapormal"],lad:["Gaano kapormal ang bawat kimono?","Gaano kapormal ang bawat obi?","Gaano kapormal ang bawat buhol?","Tinina o hinabi?"],ladSub:"Mula sa pang-araw-araw na kasuotan (kaliwa) hanggang sa pinakapormal na kasuotan (kanan). I-tap ang pangalan para makita ang detalye.",foot:"Pangkalahatang gabay lamang ang mga antas ng pormalidad. Maaaring magbago ang pormalidad ng kasuotan depende sa lokal na kaugalian at sa napiling obi at aksesorya.",tabs:["Kimono","Obi (sinturon)","Mga buhol ng obi","Pagtitina at paghahabi"],withK:"Isinusuot kasama ng",knots:"Karaniwang mga buhol",obiUsed:"Obi na ginagamit",tSub:"Ang mga tinang kimono (somé) ay hinahabi muna nang puti bago tinain, at karaniwang mas pormal. Ang mga hinabing kimono (ori) ay hinahabi mula sa mga sinulid na tinina na noon pa, at karaniwang kaswal. Baligtad ang tuntunin sa obi: mas pormal ang hinabing obi (“tinang kimono, hinabing obi”). Pangkalahatang panuntunan ito at may mga eksepsiyon.",foundOn:"Makikita sa",areas:"Pangunahing pinagagawan",kindL:"Uri",kinds:["Pagtitina","Paghahabi at tela","Palamuti"]},
items:{
furisode:{n:"Pormal na kimono na may mahabang manggas",tag:"Ang pinakapormal na kimono para sa mga dalagang walang asawa, na may kapansin-pansing mahahabang manggas.",d:"Ipinangalan ito sa mahahaba at umuugoy na manggas (furi = umugoy, sode = manggas). Ito ang pinakamataas na uri ng pormal na kimono para sa mga babaeng walang asawa, na may matatapang na disenyong umaagos sa buong kasuotan.",o:"Coming-of-Age Day, kasal (bilang bisitang kamag-anak o kaibigang walang asawa), pagtatapos, Bagong Taon",w:"Mga babaeng walang asawa",p:["Humigit-kumulang 85–115 cm ang haba ng manggas","Isinusuot kasama ng masalimuot at marangyang buhol ng obi gaya ng fukura suzume","Noong araw, pinaniniwalaang nakapagtataboy ng malas at nakaaakit ng swerte ang pag-ugoy ng manggas"]},
tomesode:{n:"Pormal na kimono para sa mga babaeng may asawa",tag:"Ang pinakapormal na kimono para sa mga babaeng may asawa, na may disenyo lamang sa ibaba ng baywang.",d:"Ang itim na kuro-tomesode ang pinakamataas na uri ng pormal na kimono para sa mga babaeng may asawa. Payak ang itaas na bahagi, ang mga masuwerteng disenyo ay nasa laylayan lamang, at limang crest ng pamilya ang nasa likod, dibdib at manggas. Maaari ring isuot ng mga babaeng walang asawa ang may-kulay na iro-tomesode; kapag may limang crest, kapantay ito ng itim, at kapag isa o tatlong crest, semi-pormal.",o:"Kasal (isinusuot ng mga ina at malalapit na kamag-anak ng ikakasal), pormal na seremonya",w:"Mga babaeng may asawa (itim na bersyon)",p:["Ang limang crest ng pamilya ang tanda ng pinakamataas na pormalidad","Nasa ibaba lamang ng baywang ang disenyo","Isinusuot kasama ng ginto o pilak na brokadong obi"]},
homongi:{n:"Kimono sa pagbisita",tag:"Semi-pormal na kimono para sa sinumang babae, na ang disenyo ay umaagos sa mga tahi.",d:"Eleganteng semi-pormal na kimono na isinusuot ng mga babaeng may asawa at wala. Ang katangian nito ay ang eba-moyō: tuloy-tuloy ang disenyo sa mga tahi na parang iisang painting, mula balikat hanggang manggas at laylayan.",o:"Kasal at handaan (bilang bisita), mga party, tea ceremony, mga seremonya sa paaralan",w:"Mga babae, may asawa man o wala",p:["Tuloy-tuloy ang disenyo sa mga tahi","Tumataas ang pormalidad kapag nilagyan ng crest ng pamilya","Karaniwang isinusuot kasama ng fukuro obi (pormal na brokadong sinturon)"]},
iromuji:{n:"Kimono na iisang kulay",tag:"Payak na kimono na tininang iisang kulay maliban sa itim. Crest ang nagtatakda ng pormalidad.",d:"Kimonong tininang iisang kulay maliban sa itim, na walang ipininta na disenyo. Kapag may crest ng pamilya, nagiging semi-pormal na kasuotan; kapag wala, pang-ayos ito, at kapag may mas magaang obi, maaari pa itong isuot sa magagarang lakad. Isang kimono, maraming okasyon.",o:"Tea ceremony, pormal na okasyon, pagsama sa mga bata sa pagbisita sa dambana, burol at paggunita (sa mahinhing kulay)",w:"Mga babae, may asawa man o wala",p:["Maaaring may banayad na disenyong hinabi sa tela","Ang isang crest ng pamilya ay ginagawa itong semi-pormal","Maaaring isuot ang mahinhing kulay sa mga paggunita sa yumao"]},
komon:{n:"Kimono na maliliit ang disenyo",tag:"Magarang pang-araw-araw na kimono na puno ng maliliit at paulit-ulit na disenyo.",d:"Kimonong tininang buo ng iisang paulit-ulit na disenyo, isinusuot bilang magarang pang-araw-araw. Madalas na pasuray-suray ang direksyon ng disenyo, at bagay ito sa paglalakad, pagkain sa labas, o gabi sa teatro.",o:"Paglalakad sa bayan, hapunan kasama ang mga kaibigan, teatro, mga aralin, kaswal na tea gathering",w:"Mga babae, may asawa man o wala",p:["Katulad ng magandang day dress sa kanluraning kasuotan","Ang ilang disenyo ng Edo komon (same, gyōgi, kakudōshi) ay nagiging pang-ayos kapag nilagyan ng crest ng pamilya","Madalas na isinusuot kasama ng Nagoya obi"]},
tsumugi:{n:"Hinabing seda na kimono",tag:"Matibay at simpleng pang-araw-araw na kimono na hinabi mula sa sinulid na tinina na.",d:"Hinabing kimono mula sa mga sinulid na tinina bago habiin. Tradisyonal na hinahabing-kamay ang sinulid mula sa bulak ng seda, kaya may texture na makalupa at matibay; orihinal itong pang-araw-araw na kasuotan ng mga pamilyang magsasaka. Pinahahalagahang tradisyonal na sining ang mga kilalang uri gaya ng Ōshima at Yūki tsumugi.",o:"Pang-araw-araw na lakad, paglalakbay, kaswal na pagtitipon",w:"Mga lalaki at babae",p:["Gaano man kamahal, itinuturing itong kaswal o smart-casual at karaniwang hindi isinusuot sa mga seremonya gaya ng kasal","Habang mas madalas isuot, lumalambot at bumabagay sa katawan","Opisyal na kinikilalang tradisyonal na sining ang Ōshima at Yūki tsumugi"]},
yukata:{n:"Cotton na kimono para sa tag-init",tag:"Magaan at kaswal na cotton na kimono para sa tag-init.",d:"Kimonong walang lining na karaniwang yari sa cotton. Nagsimula ito bilang yukatabira, manipis na damit na isinusuot sa steam bath noong panahong Heian; naging damit pagkatapos maligo noong panahong Edo, at ngayon ay klasikong kasuotan sa mga pista sa tag-init at fireworks. Isinusuot ito sa ibabaw ng magaang panloob, nang walang nagajuban, kasama ang kahoy na geta at nakayapak.",o:"Mga pista sa tag-init, fireworks, sayaw ng Bon, pambahay sa mga inn na may hot spring",w:"Mga lalaki, babae at bata",p:["Laging ipatong ang kaliwang bahagi sa kanan. Kanan sa ibabaw ay para lamang sa yumao","Sa ryokan (inn sa Japan), kaswal na kasuotan sa loob ng inn ang ibinibigay na yukata (alamin ang patakaran ng bawat inn sa mga kainan)","Tinatalian ng makitid na hanhaba obi o malambot na heko obi, kaya madaling isuot nang mag-isa"]},
haori:{n:"Dyaket na kimono",tag:"Maikling dyaket na isinusuot sa ibabaw ng kimono.",d:"Dyaket na isinusuot sa ibabaw ng kimono at tinatalian sa harap ng kordon. Para sa mga babae, kaswal itong kasuotan para sa init at estilo. Para sa mga lalaki, ang itim na kimono at itim na haori na may tig-limang crest ng pamilya, kasama ang guhit-guhit na sendai-hira hakama, ang pinakapormal na kasuotan (kuro-montsuki haori hakama).",o:"Babae: pang-araw-araw na lakad, panlaban sa lamig / Lalaki: kasal at seremonya (may crest at hakama)",w:"Mga lalaki at babae",p:["Tinatalian sa harap ng kordong haori-himo","Hindi tulad ng amerikana, karaniwang puwedeng isuot sa loob ng bahay (ngunit hinuhubad sa tea ceremony)","Madalas may matatapang at malilikot na disenyo sa lining bilang banayad na estilo"]},
hakama:{n:"May pleats na pantalon o palda",tag:"May pleats na kasuotang isinusuot sa ibabaw ng kimono mula baywang pababa.",d:"May pleats na kasuotang isinusuot sa ibabaw ng kimono, hugis malapad na pantalon o palda. Isinusuot ito ng mga lalaki kasama ng haori na may crest bilang pormal na kasuotan, at popular ito sa mga babae sa pagtatapos. Isinusuot din ito sa martial arts gaya ng kyudo, kendo at aikido.",o:"Pagtatapos, kasal (lalaking ikakasal), Coming-of-Age Day (lalaki), martial arts, mga pari at miko ng dambana",w:"Mga lalaki at babae",p:["May limang pleats sa harap at dalawa sa likod ang hakama ng lalaki","Sinasabing sumasagisag ang pitong pleats sa pitong kabutihan","Dalawang istilo: hating umanori (pantalon) at andon (palda)"]},

const MS={UI:{app:"Panduan Kimono",sub:"Kimono, obi, simpulan obi dan teknik pewarnaan serta tenunan, diterangkan",pick:["Pilih kimono","Pilih obi","Pilih simpulan","Pilih teknik"],f:"Tahap rasmi",occ:"Majlis",who:"Siapa yang memakainya",pts:"Elok diketahui",listen:"Dengar",say:"Dengar nama",varies:"Berbeza mengikut pakaian",lv:["Santai","Smart casual","Segak","Separa rasmi","Paling rasmi"],lad:["Setinggi mana tahap rasmi setiap kimono?","Setinggi mana tahap rasmi setiap obi?","Setinggi mana tahap rasmi setiap simpulan?","Dicelup atau ditenun?"],ladSub:"Dari pakaian harian (kiri) hingga pakaian paling rasmi (kanan). Ketik nama untuk melihat butiran.",foot:"Tahap rasmi hanyalah panduan umum. Adat tempatan serta pilihan obi dan aksesori boleh mengubah tahap rasmi sesuatu pakaian.",tabs:["Kimono","Obi (tali pinggang)","Simpulan obi","Pewarnaan & tenunan"],withK:"Dipakai bersama",knots:"Simpulan lazim",obiUsed:"Obi yang digunakan",tSub:"Kimono celup (somé) ditenun putih dahulu kemudian diwarnakan, dan lazimnya lebih rasmi. Kimono tenun (ori) ditenun daripada benang yang telah diwarnakan lebih awal, dan lazimnya santai. Bagi obi, peraturannya terbalik: obi tenun lebih rasmi (“kimono celup, obi tenun”). Ini panduan umum dan ada pengecualian.",foundOn:"Terdapat pada",areas:"Kawasan pengeluaran utama",kindL:"Jenis",kinds:["Pewarnaan","Tenunan & kain","Hiasan"]},
items:{
furisode:{n:"Kimono rasmi berlengan panjang",tag:"Kimono paling rasmi untuk wanita belum berkahwin, dengan lengan panjang yang menawan.",d:"Dinamakan sempena lengannya yang panjang dan berayun (furi = berayun, sode = lengan). Ia kimono rasmi bertaraf tertinggi untuk wanita belum berkahwin, dihiasi corak berani yang mengalir di seluruh pakaian.",o:"Hari Akil Baligh (Coming-of-Age Day), majlis perkahwinan (sebagai saudara atau kawan yang belum berkahwin), konvokesyen, Tahun Baru",w:"Wanita belum berkahwin",p:["Lengan menjuntai sepanjang kira-kira 85–115 cm","Dipadankan dengan simpulan obi yang rumit dan mewah seperti fukura suzume","Dahulu dikatakan mengayun lengan menolak sial dan menarik tuah"]},
tomesode:{n:"Kimono rasmi untuk wanita berkahwin",tag:"Kimono paling rasmi untuk wanita berkahwin, bercorak hanya di bawah pinggang.",d:"Kuro-tomesode hitam ialah kimono rasmi bertaraf tertinggi untuk wanita berkahwin. Bahagian atas polos, corak bertuah hanya di bahagian hujung bawah, dan lima lambang keluarga (mon) diletakkan di belakang, dada dan lengan. Versi berwarna, iro-tomesode, juga boleh dipakai wanita belum berkahwin; dengan lima lambang ia setaraf dengan versi hitam, dan dengan satu atau tiga lambang ia separa rasmi.",o:"Majlis perkahwinan (dipakai oleh ibu dan saudara terdekat pengantin), upacara rasmi",w:"Wanita berkahwin (versi hitam)",p:["Lima lambang keluarga menandakan tahap rasmi tertinggi","Corak hanya di bawah pinggang","Dipakai bersama obi brokad emas atau perak"]},
homongi:{n:"Kimono lawatan",tag:"Kimono separa rasmi untuk mana-mana wanita, dengan corak yang mengalir merentasi jahitan.",d:"Kimono separa rasmi yang anggun, dipakai wanita berkahwin dan belum berkahwin. Cirinya ialah eba-moyō: corak bersambung merentasi jahitan seperti sebuah lukisan, mengalir dari bahu ke lengan hingga ke hujung.",o:"Majlis perkahwinan dan jamuan (sebagai tetamu), parti, majlis minum teh, upacara sekolah",w:"Wanita, berkahwin atau belum",p:["Corak bersambung tanpa putus merentasi jahitan","Menambah lambang keluarga meningkatkan tahap rasminya","Lazimnya dipakai bersama fukuro obi (tali pinggang brokad rasmi)"]},
iromuji:{n:"Kimono satu warna",tag:"Kimono polos yang dicelup satu warna selain hitam. Lambang menentukan tahap rasminya.",d:"Kimono yang dicelup satu warna selain hitam, tanpa corak lukisan. Dengan lambang keluarga ia menjadi pakaian separa rasmi; tanpa lambang ia pakaian segak, dan dengan obi yang lebih ringan ia boleh dipakai untuk bersiar-siar bergaya. Satu kimono, pelbagai majlis.",o:"Majlis minum teh, acara rasmi, mengiringi anak melawat kuil, majlis peringatan (warna suram)",w:"Wanita, berkahwin atau belum",p:["Kain mungkin mempunyai corak halus yang ditenun","Satu lambang keluarga menjadikannya separa rasmi","Warna suram boleh dipakai ke majlis peringatan"]},
komon:{n:"Kimono corak halus",tag:"Kimono harian yang bergaya, dipenuhi corak kecil berulang.",d:"Kimono yang dicelup keseluruhannya dengan corak berulang yang sama, dipakai sebagai pakaian harian bergaya. Corak sering menghala ke pelbagai arah, sesuai untuk berjalan-jalan, makan, atau malam di teater.",o:"Berjalan-jalan di bandar, makan malam bersama kawan, teater, kelas, majlis minum teh santai",w:"Wanita, berkahwin atau belum",p:["Serupa dengan gaun siang yang cantik dalam pakaian Barat","Sesetengah corak Edo komon (same, gyōgi, kakudōshi) menjadi pakaian segak apabila ditambah lambang keluarga","Sering dipakai bersama obi Nagoya"]},
tsumugi:{n:"Kimono sutera tenunan",tag:"Kimono harian yang kukuh dan bersahaja, ditenun daripada benang yang dicelup lebih awal.",d:"Kimono tenunan daripada benang yang dicelup sebelum ditenun. Secara tradisi benang dipintal tangan daripada kapas sutera, memberi tekstur kasar semula jadi dan ketahanan; asalnya pakaian harian keluarga petani. Jenis terkenal seperti Ōshima dan Yūki tsumugi dihargai sebagai kraf tradisional.",o:"Berjalan harian, melancong, perhimpunan santai",w:"Lelaki dan wanita",p:["Semahal mana pun, ia dianggap pakaian santai atau smart-casual dan lazimnya tidak dipakai ke upacara seperti perkahwinan","Semakin kerap dipakai, semakin lembut dan sesuai dengan badan","Ōshima dan Yūki tsumugi diiktiraf secara rasmi sebagai kraf tradisional"]},
yukata:{n:"Kimono kapas musim panas",tag:"Kimono kapas yang ringan dan santai untuk musim panas.",d:"Kimono tanpa kain lapik yang biasanya diperbuat daripada kapas. Ia bermula sebagai yukatabira, jubah nipis yang dipakai di tempat mandi wap zaman Heian; tersebar sebagai jubah selepas mandi pada zaman Edo, dan kini menjadi pakaian klasik untuk pesta musim panas dan pertunjukan bunga api. Ia dipakai di atas pakaian dalam yang ringan, tanpa nagajuban, bersama capal kayu geta dan berkaki ayam.",o:"Pesta musim panas, pertunjukan bunga api, tarian Bon, pakaian santai di penginapan mata air panas",w:"Lelaki, wanita dan kanak-kanak",p:["Sentiasa lipat bahagian kiri di atas kanan. Kanan di atas hanya untuk jenazah","Di ryokan (rumah penginapan Jepun), yukata yang disediakan ialah pakaian santai di dalam penginapan (semak peraturan setiap penginapan untuk ruang makan)","Diikat dengan obi hanhaba yang sempit atau obi heko yang lembut, jadi mudah dipakai sendiri"]},
haori:{n:"Jaket kimono",tag:"Jaket pendek yang dipakai di atas kimono.",d:"Jaket yang dipakai di atas kimono dan diikat di depan dengan tali. Bagi wanita, ia pakaian santai untuk kehangatan dan gaya. Bagi lelaki, kimono hitam dan haori hitam yang masing-masing mempunyai lima lambang keluarga, dipakai bersama hakama sendai-hira berjalur, ialah pakaian paling rasmi (kuro-montsuki haori hakama).",o:"Wanita: berjalan harian, kehangatan / Lelaki: perkahwinan dan upacara (dengan lambang dan hakama)",w:"Lelaki dan wanita",p:["Diikat di depan dengan tali haori-himo","Tidak seperti kot, ia biasanya boleh dipakai di dalam rumah (tetapi ditanggalkan semasa majlis minum teh)","Kain lapik sering menyembunyikan corak berani dan nakal sebagai gaya yang halus"]},
hakama:{n:"Seluar atau skirt berlipat",tag:"Pakaian berlipat yang dipakai di atas kimono dari pinggang ke bawah.",d:"Pakaian berlipat yang dipakai di atas kimono, berbentuk seperti seluar lebar atau skirt. Lelaki memakainya bersama haori berlambang sebagai pakaian rasmi, dan ia pakaian popular wanita ketika konvokesyen. Ia juga dipakai dalam seni bela diri seperti kyudo, kendo dan aikido.",o:"Konvokesyen, perkahwinan (pengantin lelaki), Hari Akil Baligh (lelaki), seni bela diri, paderi dan pembantu kuil Shinto",w:"Lelaki dan wanita",p:["Hakama lelaki mempunyai lima lipatan di depan dan dua di belakang","Tujuh lipatan itu dikatakan melambangkan tujuh kebajikan","Dua gaya: umanori berpecah (seluar) dan andon (skirt)"]},

items:{
furisode:{n:"நீண்ட கைகள் கொண்ட சம்பிரதாய கிமோனோ",tag:"திருமணமாகாத பெண்களுக்கான மிக உயர் சம்பிரதாய கிமோனோ; கண்கவர் நீண்ட கைகளுடன்."},
tomesode:{n:"திருமணமான பெண்களின் சம்பிரதாய கிமோனோ",tag:"திருமணமான பெண்களுக்கான மிக உயர் சம்பிரதாய கிமோனோ; இடைப்புக்குக் கீழ் மட்டுமே வடிவங்கள்."},
homongi:{n:"வருகை கிமோனோ",tag:"எந்தப் பெண்ணும் அணியக்கூடிய அரை சம்பிரதாய கிமோனோ; தையல்களைக் கடந்து ஓடும் வடிவங்கள்."},
iromuji:{n:"ஒரே நிற கிமோனோ",tag:"கறுப்பு தவிர ஒரே நிறத்தில் சாயமிட்ட எளிய கிமோனோ; குடும்பச் சின்னமே அதன் சம்பிரதாயத்தை நிர்ணயிக்கும்."},
komon:{n:"நுண் வடிவ கிமோனோ",tag:"சிறிய, திரும்பத் திரும்ப வரும் வடிவங்கள் நிறைந்த, அன்றாட நாகரிக கிமோனோ."},
tsumugi:{n:"நெய்த பட்டு கிமோனோ",tag:"முன்கூட்டியே சாயமிட்ட நூலால் நெய்யப்பட்ட உறுதியான, எளிய அன்றாட கிமோனோ."},
yukata:{n:"கோடைக்கால பருத்தி கிமோனோ",tag:"கோடைக்கான இலகுவான, எளிய பருத்தி கிமோனோ."},
haori:{n:"கிமோனோ மேலங்கி",tag:"கிமோனோவுக்கு மேல் அணியும் குட்டை மேலங்கி."},
hakama:{n:"மடிப்புகள் கொண்ட கால்சட்டை அல்லது பாவாடை",tag:"கிமோனோவுக்கு மேல் இடுப்பிலிருந்து கீழே அணியும் மடிப்பு ஆடை."},
"o-maru":{n:"மிக உயர் சம்பிரதாய ஒபி"},"o-fukuro":{n:"சம்பிரதாய ஒபி"},"o-nagoya":{n:"அன்றாடம் முதல் அலங்காரம் வரையான ஒபி"},"o-hanhaba":{n:"குறுகிய எளிய ஒபி"},"o-heko":{n:"மென்மையான இடைக்கச்சை"},"o-kaku":{n:"ஆண்களின் ஒபி"},
"n-otaiko":{n:"நிலையான மேளமுடிச்சு"},"n-tsunodashi":{n:"நாகரிகக் கொம்பு முடிச்சு"},"n-fukura":{n:"உருண்ட சிட்டுக்குருவி"},"n-tateya":{n:"சாய்ந்த அம்பு முடிச்சு"},"n-bunko":{n:"பாரம்பரிய ரிப்பன் முடிச்சு"},"n-darari":{n:"மைகோவின் தொங்கும் முடிச்சு"},"n-kai":{n:"ஆண்களின் பாரம்பரிய முடிச்சு"},"n-ronin":{n:"விரைவான தட்டை ரோனின் முடிச்சு"},
"t-yuzen":{n:"கையால் வரைந்த சாயமிடல்"},"t-ise":{n:"ஸ்டென்சில் சாயமிடல்"},"t-shibori":{n:"கட்டுச் சாயமிடல்"},"t-roketsu":{n:"மெழுகுத் தடுப்புச் சாயமிடல்"},"t-shishu":{n:"எம்பிராய்டரி"},"t-kinsai":{n:"தங்க இலை அலங்காரம்"},"t-kasuri":{n:"இகத் நெசவு"},"t-tsumugi":{n:"கையால் நூற்ற பட்டு நெசவு"},"t-chirimen":{n:"பட்டு கிரேப்"}}};
UI.ta=Object.assign({},UI.en,TA.UI);
ALL.forEach(k=>{k.t.ta=Object.assign({},k.t.en,TA.items[k.id]||{})});

/* ---------- App ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=["k","o","n","t"];
let lang="en", cur="furisode";
try{const s=localStorage.getItem("kg-lang"); if(s&&UI[s]) lang=s;}catch(e){}
{const h=location.hash.slice(1); if(ALL.some(k=>k.id===h)) cur=h;}
const item=()=>ALL.find(x=>x.id===cur);
const catOf=()=>item().cat;
const listOf=c=>ALL.filter(x=>x.cat===c);
const lastPick={k:"furisode",o:"o-fukuro",n:"n-otaiko",t:"t-yuzen"};
const canSpeak=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
const ICON_SPK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>`;

const STOP_L={en:"Stop",fr:"Arrêter",de:"Stopp",es:"Detener",it:"Ferma",zh:"停止",yue:"停止",ko:"정지",th:"หยุด",vi:"Dừng",ar:"إيقاف",hi:"रोकें",tl:"Ihinto",ms:"Henti",ta:"நிறுத்து",ja:"停止"};
const ICON_STOP=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>`;
let speakSeq=0;
function stopSpeak(){speakSeq++;try{if(canSpeak)speechSynthesis.cancel()}catch(e){}setListenState(false);}
function setListenState(on){const b=document.getElementById("listenBtn");if(!b)return;b.dataset.on=on?"1":"";b.setAttribute("aria-pressed",on?"true":"false");b.innerHTML=on?`${ICON_STOP}${STOP_L[lang]||"Stop"}`:`${ICON_SPK}${UI[lang].listen}`;}
function speak(text,code,track){
  if(!canSpeak) return;
  try{speechSynthesis.cancel();const my=++speakSeq;const u=new SpeechSynthesisUtterance(text);u.lang=code;u.rate=.95;
    if(track){u.onend=u.onerror=()=>{if(my===speakSeq)setListenState(false)};setListenState(true);}else setListenState(false);
    const vs=speechSynthesis.getVoices(),lc=code.toLowerCase().replace("_","-");const v=vs.find(v=>v.lang&&v.lang.toLowerCase().replace("_","-")===lc)||(code==="zh-HK"?vs.find(v=>/yue|hk|cantonese/i.test(v.lang+" "+v.name)):vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith(code.slice(0,2))));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function fText(k){const L=UI[lang];const [a,b]=k.f;return a===b?`${a} / 5 · ${L.lv[a-1]}`:`${a}–${b} / 5 · ${L.varies}`}
function factLabels(c){const L=UI[lang];return c==="k"?[L.occ,L.who]:c==="o"?[L.withK,L.knots]:c==="t"?[L.foundOn,L.areas]:[L.withK,L.obiUsed]}

function renderLangs(){
  $("#langs").innerHTML=LANGS.map(([c,n])=>`<button data-l="${c}" aria-pressed="${c===lang}"><span class="ln" lang="${hl(c)}">${n}</span><span class="lr" lang="ja">${JA_NAME[c]}</span></button>`).join("");
}
function renderTabs(){
  const c=catOf();
  $("#tabs").innerHTML=CATS.map((x,i)=>`<button role="tab" data-c="${x}" aria-selected="${x===c}"><span class="tk" lang="ja">${["着物","帯","帯結び","染織"][i]}</span>${lang==="ja"?"":`<span class="tl" lang="${hl(lang)}">${esc(UI[lang].tabs[i])}</span>`}</button>`).join("");
}
function renderList(){
  $("#list").innerHTML=listOf(catOf()).map(k=>{const t=k.t[lang];
    return `<button class="item" role="option" data-id="${k.id}" aria-selected="${k.id===cur}">
      <span class="thumb">${draw(k)}</span>
      <span><span class="k">${k.kanji}</span><span class="n">${esc(k.romaji)}${lang==="ja"?"":` · <span lang="${hl(lang)}">${esc(t.n)}</span>`}</span>
      ${k.cat==="t"?`<span class="chip sm">${esc(UI[lang].kinds[k.kind])}</span>`:`<span class="dots" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=k.f[1]&&i>=k.f[0]?"on":""}"></i>`).join("")}</span>`}</span></button>`}).join("");
}
function renderSheet(){
  const k=item(), t=k.t[lang], L=UI[lang], code=LANGS.find(l=>l[0]===lang)[2], [l1,l2]=factLabels(k.cat);
  $("#sheet").innerHTML=`
    <div class="figure">${draw(k)}</div>
    <div lang="${hl(lang)}" style="min-width:0">
      <div class="head"><span class="kanji" lang="ja">${k.kanji}</span>
        <span class="read"><span class="romaji">${k.romaji}</span><span class="kana" lang="ja">${k.kana}</span></span>
        ${canSpeak?`<button class="say" id="sayBtn">${ICON_SPK}${L.say}</button>`:""}</div>
      <p class="lname">${esc(t.n)}</p>
      <p class="tag">${esc(t.tag)}</p>
      ${k.cat==="t"?`<div class="meter"><span class="lab">${L.kindL}</span><span class="chip">${esc(L.kinds[k.kind])}</span></div>`:`<div class="meter"><span class="lab">${L.f}</span>
        <span class="bar" aria-hidden="true">${[1,2,3,4,5].map(i=>`<span class="${i>=k.f[0]&&i<=k.f[1]?"on":""}"></span>`).join("")}</span>
        <span class="val">${esc(fText(k))}</span></div>`}
      <p class="desc">${esc(t.d)}</p>
      <div class="facts"><div><h3>${l1}</h3><p>${esc(t.o)}</p></div><div><h3>${l2}</h3><p>${esc(t.w)}</p></div></div>
      <div class="points"><h3>${L.pts}</h3><ul>${t.p.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
      ${canSpeak?`<div class="actions"><button class="listen" id="listenBtn">${ICON_SPK}${L.listen}</button></div>`:""}
    </div>`;
  const s=$("#sayBtn"); if(s) s.onclick=()=>speak(k.kana,"ja-JP");
  const l=$("#listenBtn"); if(l) l.onclick=()=>{if(l.dataset.on)stopSpeak();else speak(`${lang==="ja"?k.kanji:k.romaji}. ${t.n}. ${t.d}`,code,true)};
}
function renderLadder(){
  const L=UI[lang], ci=CATS.indexOf(catOf());
  $("#ladTitle").textContent=L.lad[ci];
  const isT=catOf()==="t"; $("#lwrap").hidden=isT; $("#tgroups").hidden=!isT;
  if(isT){
    $("#tgroups").innerHTML=L.kinds.map((kn,g)=>`<div class="tg"><h3 lang="${hl(lang)}">${esc(kn)}</h3><div class="tgl">${TECH.filter(x=>x.kind===g).map(x=>`<button data-id="${x.id}" class="${x.id===cur?"sel":""}"><span lang="ja">${x.kanji}</span><span class="rom">${x.romaji}</span></button>`).join("")}</div></div>`).join("");
    return;
  }
  let h=`<div class="hd"></div>`+L.lv.map((v,i)=>`<div class="hd"><b>${i+1}</b><span lang="${hl(lang)}">${esc(v)}</span></div>`).join("");
  [...listOf(catOf())].sort((a,b)=>a.f[0]-b.f[0]||a.f[1]-b.f[1]).forEach((k,r)=>{
    h+=`<div class="lrow"><button data-id="${k.id}" lang="ja" style="grid-row:${r+2};grid-column:1">${k.kanji}<span class="rom">${k.romaji}</span></button>
      <div class="span ${k.id===cur?"sel":""}" style="grid-row:${r+2};grid-column:${k.f[0]+1} / ${k.f[1]+2}"></div></div>`;
  });
  $("#lgrid").innerHTML=h;
}
function renderText(){
  ["#appTitle","#appSub","#idxLabel","#ladTitle","#ladSub","#foot"].forEach(q=>{const e=$(q);if(e)e.lang=hl(lang)});
  const L=UI[lang], ci=CATS.indexOf(catOf());
  document.documentElement.lang=hl(lang);
  $("#appTitle").textContent=L.app; $("#appSub").textContent=L.sub; $("#idxLabel").textContent=L.pick[ci];
  $("#ladSub").textContent=catOf()==="t"?L.tSub:L.ladSub; $("#foot").textContent=L.foot;
}
function render(){renderLangs();renderTabs();renderText();renderList();renderSheet();renderLadder();}
function select(id,scroll){stopSpeak();cur=id;lastPick[item().cat]=id;renderTabs();renderText();renderList();renderSheet();renderLadder();
  try{history.replaceState(null,"","#"+id)}catch(e){}
  if(scroll&&window.matchMedia("(max-width:820px)").matches) $("#sheet").scrollIntoView({behavior:"smooth",block:"start"});
}
$("#langs").addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(!b)return;lang=b.dataset.l;
  try{localStorage.setItem("kg-lang",lang)}catch(e){} if(canSpeak)try{speechSynthesis.cancel()}catch(e){} render();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b&&b.dataset.c!==catOf())select(lastPick[b.dataset.c],false)});
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)select(b.dataset.id,true)});
$("#tgroups").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b){select(b.dataset.id,false);$("#sheet").scrollIntoView({behavior:"smooth",block:"start"})}});
$("#lgrid").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b){select(b.dataset.id,false);$("#sheet").scrollIntoView({behavior:"smooth",block:"start"})}});
$("#list").addEventListener("keydown",e=>{if(!["ArrowDown","ArrowUp","ArrowLeft","ArrowRight"].includes(e.key))return;e.preventDefault();
  const L=listOf(catOf()),i=L.findIndex(k=>k.id===cur),d=(e.key==="ArrowDown"||e.key==="ArrowRight")?1:-1,n=L[(i+d+L.length)%L.length].id;select(n,false);$(`.item[data-id="${n}"]`).focus();});
if(canSpeak) try{speechSynthesis.getVoices()}catch(e){}
lastPick[catOf()]=cur;
render();
</script>
</body>
</html>
