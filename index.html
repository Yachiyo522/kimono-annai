 ja:{n:"礼装・準礼装の帯",tag:"礼装から準礼装まで幅広く使う、格の高い帯です。",d:"表と裏を袋状に織る（または縫い合わせる）帯で、柄は表側だけにあります。丸帯より軽く扱いやすいため、現在の礼装用の帯の主流です。長さは約4m30cm以上、幅は約31cmです。",o:"留袖、振袖、訪問着、紋付きの色無地",w:"二重太鼓、ふくら雀、立て矢など",p:["二重太鼓は「喜びが重なる」という意味で慶事向き","金銀を使った柄は礼装用、しゃれ袋帯はおしゃれ用","長さがあるので華やかな変わり結びができる"]},
 en:{n:"Formal obi",tag:"A high-ranking obi for formal and semi-formal kimono.",d:"Woven as a tube, or with front and back sewn together, with the pattern on the front only. Lighter and easier to handle than the maru obi, it is today's standard formal obi. It is about 4.3 m or longer and about 31 cm wide.",o:"Tomesode, furisode, hōmongi, iromuji with a crest",w:"Double drum (nijū-daiko), fukura suzume, tateya and others",p:["The double drum knot means “joy layered on joy”, so it suits celebrations","Gold and silver designs are formal; sharé-bukuro styles are for fashion","Its length allows elaborate decorative knots"]},
 fr:{n:"Obi de cérémonie",tag:"Un obi de haut rang pour les kimonos formels et semi-formels.",d:"Tissé en forme de tube, ou dont l'endroit et l'envers sont cousus ensemble, il n'est décoré que sur l'endroit. Plus léger et plus pratique que le maru obi, c'est aujourd'hui l'obi de cérémonie standard. Il mesure environ 4,3 m ou plus, pour environ 31 cm de large.",o:"Tomesode, furisode, hōmongi, iromuji à blason",w:"Double tambour (nijū-daiko), fukura suzume, tateya, etc.",p:["Le double tambour signifie « la joie qui se répète » et convient aux célébrations","Les motifs or et argent sont formels ; les sharé-bukuro sont pour la mode","Sa longueur permet des nœuds décoratifs élaborés"]},
 de:{n:"Fest-Obi",tag:"Ein hochrangiger Obi für formelle und halbformelle Kimonos.",d:"Er wird als Schlauch gewebt oder aus Vorder- und Rückseite zusammengenäht, gemustert ist nur die Vorderseite. Leichter und handlicher als der Maru-Obi, ist er heute der Standard-Fest-Obi. Er ist etwa 4,3 m oder länger und etwa 31 cm breit.",o:"Tomesode, Furisode, Hōmongi, Iromuji mit Wappen",w:"Doppelte Trommel (Nijū-Daiko), Fukura-Suzume, Tateya u. a.",p:["Die doppelte Trommel steht für „Freude, die sich wiederholt“ und passt zu Feiern","Gold- und Silbermuster sind formell, Sharé-Bukuro-Obi dienen der Mode","Dank seiner Länge sind kunstvolle Zierknoten möglich"]},
 es:{n:"Obi de gala",tag:"Un obi de alto rango para kimonos formales y semiformales.",d:"Se teje en forma de tubo, o con el anverso y el reverso cosidos, y solo tiene dibujo por delante. Más ligero y manejable que el maru obi, es hoy el obi de gala estándar. Mide unos 4,3 m o más de largo y unos 31 cm de ancho.",o:"Tomesode, furisode, hōmongi, iromuji con blasón",w:"Tambor doble (nijū-daiko), fukura suzume, tateya, entre otros",p:["El tambor doble significa «alegría sobre alegría» y es ideal para celebraciones","Los dibujos dorados y plateados son formales; los sharé-bukuro, para moda","Su longitud permite nudos decorativos elaborados"]},
 zh:{n:"礼服与准礼服用腰带",tag:"从礼服到准礼服都能使用的高规格腰带。",d:"正反面织成袋状（或缝合而成）的腰带，只有正面有图案。比丸带轻便好用，是现今礼服腰带的主流。长约4.3米以上，宽约31厘米。",o:"留袖、振袖、访问着、带家纹的色无地",w:"二重太鼓、福良雀、立矢等",p:["二重太鼓寓意“喜上加喜”，适合喜庆场合","金银图案用于礼服，时尚袋带用于休闲","长度足够，可以系出华丽的花式结"]},
 ko:{n:"예복·준예복용 오비",tag:"예복부터 준예복까지 폭넓게 쓰는 격식 높은 오비.",d:"앞뒤를 자루 모양으로 짜거나 꿰매어 만든 오비로, 무늬는 앞면에만 있습니다. 마루오비보다 가볍고 다루기 쉬워 현재 예복용 오비의 주류입니다. 길이 약 4.3m 이상, 폭 약 31cm입니다.",o:"도메소데, 후리소데, 호몬기, 가문이 들어간 이로무지",w:"니주다이코(이중 북), 후쿠라스즈메, 다테야 등",p:["니주다이코는 '기쁨이 겹친다'는 뜻으로 경사에 어울림","금·은 무늬는 예복용, 샤레부쿠로오비는 멋내기용","길이가 길어 화려한 장식 매듭이 가능함"]}}},
{id:"o-nagoya",kanji:"名古屋帯",kana:"なごやおび",romaji:"Nagoya obi",f:[2,3],t:{
 ja:{n:"普段からお出かけまで使える帯",tag:"お太鼓結びを手軽にするために生まれた、使いやすい帯です。",d:"大正時代に名古屋で考案された帯です。お太鼓になる部分は普通の幅、胴に巻く部分はあらかじめ半分に折って仕立ててあります。袋帯より短く軽いので、一人でも結びやすいのが特長です。",o:"小紋、紬、色無地、カジュアルな訪問着",w:"一重太鼓（お太鼓）、角出し",p:["一重太鼓に結ぶため、慶事の礼装には使わない","染めの名古屋帯は気軽に、織りの名古屋帯は少し改まった場にも","長さは約3m60cm"]},
 en:{n:"Everyday-to-dressy obi",tag:"An easy-to-use obi created to make the drum knot simpler.",d:"Invented in Nagoya in the Taishō era (1912–1926). The part that forms the drum is full width, while the part wrapped around the waist is pre-folded in half. Shorter and lighter than a fukuro obi, it is easy to tie by yourself.",o:"Komon, tsumugi, iromuji, casual hōmongi",w:"Single drum (otaiko), tsunodashi",p:["Tied as a single drum, so it is not used with formal wear for celebrations","Dyed Nagoya obi are casual; woven ones suit slightly dressier occasions","About 3.6 m long"]},
 fr:{n:"Obi du quotidien aux sorties",tag:"Un obi pratique, créé pour simplifier le nœud en tambour.",d:"Inventé à Nagoya pendant l'ère Taishō (1912-1926). La partie qui forme le tambour est en pleine largeur, tandis que celle qui entoure la taille est pliée en deux à l'avance. Plus court et plus léger qu'un fukuro obi, il est facile à nouer seule.",o:"Komon, tsumugi, iromuji, hōmongi décontracté",w:"Tambour simple (otaiko), tsunodashi",p:["Noué en tambour simple, il ne se porte pas avec les tenues de cérémonie festives","Les Nagoya obi teints sont décontractés ; les tissés conviennent à des occasions plus habillées","Environ 3,6 m de long"]},
 de:{n:"Obi für Alltag und Ausgang",tag:"Ein praktischer Obi, entwickelt, um den Trommelknoten zu vereinfachen.",d:"Er wurde in der Taishō-Zeit (1912–1926) in Nagoya erfunden. Der Teil, der die Trommel bildet, hat volle Breite, der Teil um die Taille ist bereits zur Hälfte gefaltet. Kürzer und leichter als ein Fukuro-Obi, lässt er sich gut allein binden.",o:"Komon, Tsumugi, Iromuji, legerer Hōmongi",w:"Einfache Trommel (Otaiko), Tsunodashi",p:["Als einfache Trommel gebunden, daher nicht zur Festkleidung bei Feiern","Gefärbte Nagoya-Obi sind leger, gewebte passen auch zu festlicheren Anlässen","Etwa 3,6 m lang"]},
 es:{n:"Obi para diario y salidas",tag:"Un obi práctico, creado para simplificar el nudo de tambor.",d:"Se inventó en Nagoya en la era Taishō (1912-1926). La parte que forma el tambor tiene el ancho completo y la que rodea la cintura viene ya doblada por la mitad. Más corto y ligero que el fukuro obi, es fácil de atar uno mismo.",o:"Komon, tsumugi, iromuji, hōmongi informal",w:"Tambor sencillo (otaiko), tsunodashi",p:["Se ata como tambor sencillo, por eso no se usa con trajes de gala para celebraciones","Los Nagoya obi teñidos son informales; los tejidos sirven para ocasiones algo más formales","Mide unos 3,6 m de largo"]},
 zh:{n:"日常到外出都能用的腰带",tag:"为简化太鼓结而发明的实用腰带。",d:"大正时代（1912–1926）在名古屋发明的腰带。形成太鼓的部分为正常宽度，缠在腰部的部分预先对折缝好。比袋带短且轻，一个人也容易系好。",o:"小纹、紬、色无地、休闲款访问着",w:"一重太鼓（太鼓结）、角出",p:["系成一重太鼓，因此不用于喜庆礼服","染制的名古屋带较休闲，织制的可用于稍正式场合","长约3.6米"]},
 ko:{n:"평상시부터 외출까지 쓰는 오비",tag:"오타이코 매듭을 쉽게 하려고 고안된 실용적인 오비.",d:"다이쇼 시대(1912~1926)에 나고야에서 고안된 오비입니다. 오타이코가 되는 부분은 보통 폭이고, 허리에 감는 부분은 미리 반으로 접어 만들었습니다. 후쿠로오비보다 짧고 가벼워 혼자서도 매기 쉽습니다.",o:"고몬, 쓰무기, 이로무지, 캐주얼한 호몬기",w:"히토에다이코(오타이코), 쓰노다시",p:["홑 오타이코로 매므로 경사의 예복에는 쓰지 않음","염색 나고야오비는 캐주얼, 직조 나고야오비는 조금 격식 있는 자리에도","길이 약 3.6m"]}}},
{id:"o-hanhaba",kanji:"半幅帯",kana:"はんはばおび",romaji:"Hanhaba obi",f:[1,2],t:{
 ja:{n:"浴衣や普段着に使う細い帯",tag:"普通の帯の半分の幅の、カジュアルな帯です。",d:"幅が約15〜17cmと、普通の帯の半分ほどの細い帯です。軽くて結びやすく、浴衣や小紋・紬などの普段着に合わせます。結び方の種類がとても多く、リボンのような形など自由にアレンジを楽しめます。",o:"浴衣、小紋、紬、木綿やウールの着物",w:"文庫、貝の口、矢の字など",p:["帯枕などの小物が不要で、ひとりでも簡単","リバーシブルのものが多く、両面の色を見せる結び方も楽しめる","お太鼓より背中が平らなので、車の座席でも楽"]},
 en:{n:"Narrow casual obi",tag:"A casual obi about half the width of a standard one.",d:"About 15–17 cm wide, roughly half the width of a standard obi. Light and easy to tie, it is worn with yukata and everyday kimono such as komon and tsumugi. There are countless ways to tie it, including ribbon-like bows, so it is fun to arrange.",o:"Yukata, komon, tsumugi, cotton or wool kimono",w:"Bunko, kai-no-kuchi, ya-no-ji and others",p:["No obi pad or extra accessories needed, so it is easy to tie alone","Many are reversible, so knots can show both colors","Flatter on the back than a drum knot, comfortable in a car seat"]},
 fr:{n:"Obi étroit décontracté",tag:"Un obi décontracté, environ deux fois plus étroit qu'un obi standard.",d:"Large d'environ 15 à 17 cm, soit environ la moitié d'un obi standard. Léger et facile à nouer, il se porte avec le yukata et les kimonos du quotidien comme le komon et le tsumugi. Il existe d'innombrables façons de le nouer, dont des nœuds en forme de ruban.",o:"Yukata, komon, tsumugi, kimonos en coton ou en laine",w:"Bunko, kai-no-kuchi, ya-no-ji, etc.",p:["Pas besoin de coussinet ni d'accessoires : facile à nouer seule","Souvent réversible, le nœud peut montrer les deux couleurs","Plus plat dans le dos qu'un tambour, confortable en voiture"]},
 de:{n:"Schmaler, legerer Obi",tag:"Ein legerer Obi, etwa halb so breit wie ein normaler.",d:"Etwa 15–17 cm breit, also ungefähr halb so breit wie ein normaler Obi. Leicht und einfach zu binden, wird er zum Yukata und zu Alltagskimonos wie Komon und Tsumugi getragen. Es gibt unzählige Bindearten, auch schleifenartige, die viel Spielraum lassen.",o:"Yukata, Komon, Tsumugi, Kimonos aus Baumwolle oder Wolle",w:"Bunko, Kai-no-Kuchi, Ya-no-Ji u. a.",p:["Kein Obi-Kissen oder Zubehör nötig, daher leicht allein zu binden","Oft wendbar, sodass der Knoten beide Farben zeigen kann","Am Rücken flacher als eine Trommel, bequem im Autositz"]},
 es:{n:"Obi estrecho informal",tag:"Un obi informal de la mitad de ancho que uno estándar.",d:"Mide unos 15-17 cm de ancho, más o menos la mitad que un obi estándar. Ligero y fácil de atar, se lleva con yukata y con kimonos de diario como el komon y el tsumugi. Hay infinidad de formas de atarlo, incluidos lazos tipo cinta.",o:"Yukata, komon, tsumugi, kimonos de algodón o lana",w:"Bunko, kai-no-kuchi, ya-no-ji, entre otros",p:["No necesita almohadilla ni accesorios, así que es fácil atarlo uno mismo","Muchos son reversibles y el nudo puede mostrar ambos colores","Es más plano en la espalda que el tambor, cómodo en el asiento del coche"]},
 zh:{n:"浴衣和日常和服用的窄腰带",tag:"宽度约为普通腰带一半的休闲腰带。",d:"宽约15–17厘米，大约是普通腰带的一半。轻便易系，搭配浴衣以及小纹、紬等日常和服。系法种类繁多，可以系成蝴蝶结等各种造型，自由搭配。",o:"浴衣、小纹、紬、棉或羊毛和服",w:"文库结、贝之口、矢字结等",p:["不需要带枕等配件，一个人也能轻松系好","很多是双面的，系法可以同时展现两面颜色","背部比太鼓结平坦，坐车时也舒适"]},
 ko:{n:"유카타·평상복용 좁은 오비",tag:"보통 오비의 절반 폭인 캐주얼 오비.",d:"폭 약 15~17cm로 보통 오비의 절반 정도입니다. 가볍고 매기 쉬워 유카타나 고몬·쓰무기 같은 평상복에 맞춥니다. 리본 모양 등 매는 방법이 매우 다양해 자유롭게 연출할 수 있습니다.",o:"유카타, 고몬, 쓰무기, 면·울 기모노",w:"분코, 가이노쿠치, 야노지 등",p:["오비마쿠라 등 소품이 필요 없어 혼자서도 쉬움","양면 오비가 많아 두 가지 색을 살린 매듭도 가능","오타이코보다 등이 평평해 차 좌석에서도 편함"]}}},
{id:"o-heko",kanji:"兵児帯",kana:"へこおび",romaji:"Heko obi",f:[1,1],t:{
 ja:{n:"やわらかい布の帯",tag:"芯のない、やわらかな布でできた帯です。",d:"柔らかい布をそのまま帯にしたもので、芯が入っていません。もとは男性や子どもの普段の帯でしたが、今ではふんわりとした可愛らしさから、女性の浴衣用としても人気です。ちょうちょ結びのように簡単に結べます。",o:"浴衣、子どもの着物、男性の普段着",w:"ちょうちょ結び（リボン結び）など",p:["名前は鹿児島の若者「兵児」が締めていたことに由来","締め付けが少なく、とても楽","子どもの七五三や夏祭りの定番"]},
 en:{n:"Soft sash",tag:"An obi made of soft fabric with no stiffening.",d:"A length of soft fabric used as an obi, with no stiff interlining. It was originally an everyday sash for men and children, and today it is also popular with women for yukata because of its soft, fluffy look. It ties as easily as a bow.",o:"Yukata, children's kimono, men's casual wear",w:"Simple bow (chōcho-musubi) and others",p:["Named after the heko, young men of Kagoshima who wore it","Puts little pressure on the body, so it is very comfortable","A classic for children's kimono and summer festivals"]},
 fr:{n:"Ceinture souple",tag:"Un obi en tissu souple, sans renfort.",d:"Un simple pan de tissu souple utilisé comme obi, sans entoilage rigide. C'était à l'origine la ceinture quotidienne des hommes et des enfants ; aujourd'hui, les femmes l'apprécient aussi avec le yukata pour son aspect doux et vaporeux. Il se noue aussi facilement qu'un nœud papillon.",o:"Yukata, kimonos d'enfants, tenues masculines décontractées",w:"Simple nœud papillon (chōcho-musubi), etc.",p:["Son nom vient des heko, jeunes hommes de Kagoshima qui le portaient","Il serre peu et reste très confortable","Un classique pour les kimonos d'enfants et les fêtes d'été"]},
 de:{n:"Weicher Gürtel",tag:"Ein Obi aus weichem Stoff ohne Versteifung.",d:"Ein Stück weicher Stoff, das ohne steife Einlage als Obi dient. Ursprünglich war er der Alltagsgürtel von Männern und Kindern, heute ist er wegen seines weichen, duftigen Aussehens auch bei Frauen zum Yukata beliebt. Er lässt sich so einfach wie eine Schleife binden.",o:"Yukata, Kinderkimonos, legere Herrenkleidung",w:"Einfache Schleife (Chōcho-Musubi) u. a.",p:["Benannt nach den Heko, jungen Männern aus Kagoshima, die ihn trugen","Schnürt kaum ein und ist sehr bequem","Ein Klassiker für Kinderkimonos und Sommerfeste"]},
 es:{n:"Faja suave",tag:"Un obi de tela suave, sin refuerzo.",d:"Una pieza de tela suave que se usa como obi, sin entretela rígida. Originalmente era la faja diaria de hombres y niños, y hoy también es popular entre las mujeres con el yukata por su aspecto suave y vaporoso. Se ata tan fácil como un lazo.",o:"Yukata, kimonos infantiles, ropa informal masculina",w:"Lazo sencillo (chōcho-musubi), entre otros",p:["Su nombre viene de los heko, jóvenes de Kagoshima que lo usaban","Apenas aprieta y es muy cómodo","Un clásico en kimonos infantiles y festivales de verano"]},
 zh:{n:"柔软的布腰带",tag:"没有衬芯、用柔软布料制成的腰带。",d:"直接用柔软布料做成的腰带，没有衬芯。原本是男性和儿童的日常腰带，如今因其蓬松可爱的造型，也很受女性搭配浴衣的欢迎。像系蝴蝶结一样简单。",o:"浴衣、儿童和服、男性日常服装",w:"蝴蝶结等",p:["名称来自鹿儿岛被称为“兵儿”的年轻男子所系的腰带","几乎不勒身体，非常舒适","儿童七五三和夏日祭典的经典搭配"]},
 ko:{n:"부드러운 천 오비",tag:"심이 없는 부드러운 천으로 만든 오비.",d:"부드러운 천을 그대로 오비로 쓴 것으로, 심이 들어 있지 않습니다. 원래는 남성과 아이들의 평상복용 오비였지만, 지금은 폭신하고 귀여운 모양 덕분에 여성 유카타용으로도 인기입니다. 나비 리본처럼 간단히 묶을 수 있습니다.",o:"유카타, 아이 기모노, 남성 평상복",w:"나비 리본 매듭 등",p:["가고시마의 젊은이 '헤코'가 매던 데서 이름이 유래","조이는 느낌이 적어 매우 편함","아이들의 시치고산과 여름 축제의 단골 아이템"]}}},
{id:"o-kaku",kanji:"角帯",kana:"かくおび",romaji:"Kaku obi",f:[1,5],t:{
 ja:{n:"男性の帯",tag:"男性が締める、細くて張りのある帯です。",d:"幅約9〜10cm、長さ約4mの、硬く張りのある男性用の帯です。普段着から紋付羽織袴の礼装まで、男性の着物には基本的にこの帯を合わせます。博多織の「献上柄」が代表的です。",o:"男性の着物全般（浴衣・紬から紋付羽織袴まで）",w:"貝の口、浪人結び、一文字など",p:["腰骨の位置で、前下がり・後ろ上がりに締める","博多献上は、江戸時代に幕府へ献上されたことが名の由来","礼装には落ち着いた無地調の角帯を選ぶ"]},
 en:{n:"Men's obi",tag:"A narrow, stiff obi worn by men.",d:"A firm men's obi about 9–10 cm wide and about 4 m long. It is worn with almost every type of men's kimono, from everyday wear to formal montsuki haori hakama. The Hakata-ori “kenjō” pattern is the classic design.",o:"All men's kimono, from yukata and tsumugi to formal crested attire",w:"Kai-no-kuchi, rōnin musubi, ichimonji and others",p:["Tied at hip level, lower in front and higher in back","Hakata kenjō is named for being presented to the shogunate in the Edo period","For formal wear, choose a subdued, plain-looking obi"]},
 fr:{n:"Obi masculin",tag:"Un obi étroit et rigide porté par les hommes.",d:"Un obi masculin ferme d'environ 9 à 10 cm de large et 4 m de long. Il se porte avec presque tous les kimonos masculins, de la tenue quotidienne à la tenue de cérémonie à blasons (montsuki haori hakama). Le motif « kenjō » du tissage Hakata en est le modèle classique.",o:"Tous les kimonos masculins, du yukata et du tsumugi à la tenue de cérémonie à blasons",w:"Kai-no-kuchi, rōnin musubi, ichimonji, etc.",p:["Noué au niveau des hanches, plus bas devant et plus haut derrière","Le nom Hakata kenjō vient de son offrande au shogunat à l'époque d'Edo","Pour la cérémonie, on choisit un obi sobre d'aspect uni"]},
 de:{n:"Herren-Obi",tag:"Ein schmaler, fester Obi für Männer.",d:"Ein fester Herren-Obi, etwa 9–10 cm breit und etwa 4 m lang. Er wird zu fast allen Herrenkimonos getragen, vom Alltag bis zur formellen Wappenkleidung (Montsuki Haori Hakama). Das Hakata-Muster „Kenjō“ ist der Klassiker.",o:"Alle Herrenkimonos, vom Yukata und Tsumugi bis zur formellen Wappenkleidung",w:"Kai-no-Kuchi, Rōnin-Musubi, Ichimonji u. a.",p:["Auf Hüfthöhe gebunden, vorne tiefer und hinten höher","Hakata-Kenjō heißt so, weil es in der Edo-Zeit dem Shogunat überreicht wurde","Zur Festkleidung wählt man einen dezenten, schlicht wirkenden Obi"]},
 es:{n:"Obi masculino",tag:"Un obi estrecho y firme que llevan los hombres.",d:"Un obi masculino rígido de unos 9-10 cm de ancho y unos 4 m de largo. Se lleva con casi todos los kimonos de hombre, desde la ropa diaria hasta el atuendo formal con blasones (montsuki haori hakama). El dibujo «kenjō» del tejido Hakata es el diseño clásico.",o:"Todos los kimonos de hombre, del yukata y el tsumugi al atuendo formal con blasones",w:"Kai-no-kuchi, rōnin musubi, ichimonji, entre otros",p:["Se ata a la altura de la cadera, más bajo delante y más alto detrás","El Hakata kenjō debe su nombre a que se ofrecía al shogunato en la era Edo","Para ocasiones formales se elige un obi sobrio y de aspecto liso"]},
 zh:{n:"男性腰带",tag:"男性系的窄而挺括的腰带。",d:"宽约9–10厘米、长约4米的硬挺男用腰带。从日常服装到纹付羽织袴礼服，男性和服基本都搭配这种腰带。博多织的“献上纹样”是最具代表性的设计。",o:"所有男性和服（从浴衣、紬到纹付羽织袴）",w:"贝之口、浪人结、一文字等",p:["系在胯骨位置，前低后高","博多献上因江户时代进献给幕府而得名","礼服搭配素雅、近似素色的角带"]},
 ko:{n:"남성용 오비",tag:"남성이 매는 좁고 빳빳한 오비.",d:"폭 약 9~10cm, 길이 약 4m의 단단하고 빳빳한 남성용 오비입니다. 평상복부터 몬쓰키 하오리 하카마 예복까지, 남성 기모노에는 기본적으로 이 오비를 맞춥니다. 하카타오리의 '겐조 무늬'가 대표적입니다.",o:"남성 기모노 전반(유카타·쓰무기부터 몬쓰키 하오리 하카마까지)",w:"가이노쿠치, 로닌무스비, 이치몬지 등",p:["허리뼈 위치에서 앞은 낮게, 뒤는 높게 맴","하카타 겐조는 에도 시대 막부에 헌상된 데서 이름이 유래","예복에는 차분한 무지 느낌의 가쿠오비를 고름"]}}}
];

const KNOT=[
{id:"n-otaiko",kanji:"お太鼓",kana:"おたいこ",romaji:"Otaiko",f:[2,5],t:{
 ja:{n:"最も一般的な女性の帯結び",tag:"背中に四角い「太鼓」の形をつくる、最も一般的な帯結びです。",d:"背中にふくらんだ箱のような形をつくる、大人の女性の最も一般的な帯結びです。江戸時代の後期、亀戸天神の太鼓橋の完成を祝って深川の芸者が結んだのが始まりと言われます。",o:"訪問着、色無地、小紋、紬、留袖など幅広い着物",w:"名古屋帯（一重太鼓）、袋帯（二重太鼓）",p:["袋帯の二重太鼓は「喜びが重なる」として慶事に","弔事では「不幸が重ならない」よう一重太鼓にする","帯枕・帯揚げ・帯締めを使って形を整える"]},
 en:{n:"The standard drum knot",tag:"The most common knot, forming a square “drum” on the back.",d:"Forms a padded, box-like shape on the back and is the most common knot for adult women. It is said to have started in the late Edo period, when geisha of Fukagawa tied it to celebrate the completion of the Taiko-bashi (drum bridge) at Kameido Tenjin Shrine.",o:"A wide range of kimono, from hōmongi and iromuji to komon, tsumugi and tomesode",w:"Nagoya obi (single drum), fukuro obi (double drum)",p:["The double drum with a fukuro obi means “layered joy” and is used for celebrations","For funerals a single drum is used, so that sorrow is not “doubled”","Shaped with an obi pad (obi-makura), a scarf (obi-age) and a cord (obi-jime)"]},
 fr:{n:"Le nœud en tambour",tag:"Le nœud le plus courant, qui forme un « tambour » carré dans le dos.",d:"Il forme dans le dos une forme rembourrée en boîte et c'est le nœud le plus courant chez les femmes adultes. Il serait apparu à la fin de l'époque d'Edo, quand des geishas de Fukagawa l'auraient noué pour célébrer l'achèvement du Taiko-bashi (pont-tambour) du sanctuaire Kameido Tenjin.",o:"De nombreux kimonos, du hōmongi et de l'iromuji au komon, au tsumugi et au tomesode",w:"Nagoya obi (tambour simple), fukuro obi (double tambour)",p:["Le double tambour en fukuro obi signifie « joies superposées » et sert aux célébrations","Aux funérailles, on fait un tambour simple pour ne pas « doubler » le malheur","Mis en forme avec un coussinet (obi-makura), une écharpe (obi-age) et un cordon (obi-jime)"]},
 de:{n:"Der Trommelknoten",tag:"Der häufigste Knoten, der eine eckige „Trommel“ auf dem Rücken bildet.",d:"Er formt eine gepolsterte, kastenartige Form auf dem Rücken und ist der häufigste Knoten erwachsener Frauen. Er soll in der späten Edo-Zeit entstanden sein, als Geishas aus Fukagawa ihn zur Fertigstellung der Taiko-Bashi (Trommelbrücke) am Kameido-Tenjin-Schrein banden.",o:"Viele Kimonos, von Hōmongi und Iromuji bis Komon, Tsumugi und Tomesode",w:"Nagoya-Obi (einfache Trommel), Fukuro-Obi (doppelte Trommel)",p:["Die doppelte Trommel mit Fukuro-Obi steht für „gehäufte Freude“ und wird bei Feiern getragen","Bei Trauerfeiern bindet man eine einfache Trommel, damit sich Leid nicht „verdoppelt“","Geformt mit Obi-Kissen (Obi-Makura), Tuch (Obi-Age) und Kordel (Obi-Jime)"]},
 es:{n:"El nudo de tambor",tag:"El nudo más común, que forma un «tambor» cuadrado en la espalda.",d:"Forma en la espalda una figura acolchada como una caja y es el nudo más habitual entre las mujeres adultas. Se dice que nació a finales de la era Edo, cuando las geishas de Fukagawa lo ataron para celebrar la construcción del Taiko-bashi (puente tambor) del santuario Kameido Tenjin.",o:"Muchos kimonos, del hōmongi y el iromuji al komon, el tsumugi y el tomesode",w:"Nagoya obi (tambor sencillo), fukuro obi (tambor doble)",p:["El tambor doble con fukuro obi significa «alegrías que se suman» y se usa en celebraciones","En los funerales se hace un tambor sencillo para no «duplicar» la tristeza","Se le da forma con almohadilla (obi-makura), pañuelo (obi-age) y cordón (obi-jime)"]},
 zh:{n:"最常见的太鼓结",tag:"在背后形成方形“太鼓”的最常见系法。",d:"在背后形成饱满箱形的系法，是成年女性最常见的腰带结。据说始于江户时代后期，深川的艺伎为庆祝龟户天神太鼓桥落成而系出此结。",o:"访问着、色无地、小纹、紬、留袖等多种和服",w:"名古屋带（一重太鼓）、袋带（二重太鼓）",p:["袋带的二重太鼓寓意“喜上加喜”，用于喜庆场合","丧事用一重太鼓，寓意“不幸不再重复”","使用带枕、带扬、带缔来固定造型"]},
 ko:{n:"가장 일반적인 북 모양 매듭",tag:"등에 네모난 '북' 모양을 만드는 가장 일반적인 매듭.",d:"등에 부푼 상자 같은 모양을 만드는, 성인 여성의 가장 일반적인 오비 매듭입니다. 에도 시대 후기, 가메이도 덴진의 다이코바시(북 다리) 완공을 축하해 후카가와의 게이샤가 맨 것이 시초라고 합니다.",o:"호몬기, 이로무지, 고몬, 쓰무기, 도메소데 등 폭넓은 기모노",w:"나고야오비(홑 다이코), 후쿠로오비(이중 다이코)",p:["후쿠로오비의 이중 다이코는 '기쁨이 겹친다'는 뜻으로 경사에","장례에는 '불행이 겹치지 않도록' 홑 다이코로 맴","오비마쿠라·오비아게·오비지메로 모양을 잡음"]}}},
{id:"n-tsunodashi",kanji:"角出し",kana:"つのだし",romaji:"Tsunodashi",f:[1,2],t:{
 ja:{n:"粋な大人の帯結び",tag:"平たいお太鼓の両脇から帯の端が角のように出る、粋な結び方です。",d:"帯の両端が、平たいお太鼓の左右から角のようにのぞく結び方です。江戸時代から続く古い形で、低めに結び、帯枕を使わないこともあり、すっきりとした粋な印象が魅力です。",o:"小紋、紬など普段着・おしゃれ着",w:"名古屋帯、半幅帯、カジュアルな袋帯",p:["帯枕を使わない結び方もあり、背中が楽","大人の女性の「粋」を感じさせる","銀座結びも角出しの一種とされる"]},
 en:{n:"The chic horned knot",tag:"A chic knot with the obi ends sticking out like horns from a flat drum.",d:"The ends of the obi peek out like horns on both sides of a flat drum. It is an old style dating back to the Edo period, often tied low and sometimes without an obi pad, giving a neat, understated and stylish look.",o:"Komon, tsumugi and other everyday or fashionable kimono",w:"Nagoya obi, hanhaba obi, casual fukuro obi",p:["Can be tied without an obi pad, so it is comfortable on the back","Has an air of grown-up urban chic (iki)","The Ginza knot is considered a variation of tsunodashi"]},
 fr:{n:"Le nœud à cornes",tag:"Un nœud chic dont les extrémités dépassent comme des cornes d'un tambour plat.",d:"Les extrémités de l'obi dépassent comme des cornes des deux côtés d'un tambour plat. C'est un style ancien qui remonte à l'époque d'Edo, souvent noué bas et parfois sans coussinet, pour un look net, sobre et élégant.",o:"Komon, tsumugi et autres kimonos du quotidien ou de mode",w:"Nagoya obi, hanhaba obi, fukuro obi décontracté",p:["Peut se nouer sans coussinet, plus confortable pour le dos","Respire le chic citadin et raffiné (iki)","Le nœud Ginza en est considéré comme une variante"]},
 de:{n:"Der Hörnerknoten",tag:"Ein schicker Knoten, bei dem die Obi-Enden wie Hörner aus einer flachen Trommel ragen.",d:"Die Obi-Enden schauen wie Hörner zu beiden Seiten einer flachen Trommel hervor. Der Stil stammt aus der Edo-Zeit, wird oft tief und manchmal ohne Obi-Kissen gebunden und wirkt schlicht, aufgeräumt und elegant.",o:"Komon, Tsumugi und andere Alltags- oder Modekimonos",w:"Nagoya-Obi, Hanhaba-Obi, legerer Fukuro-Obi",p:["Kann ohne Obi-Kissen gebunden werden und ist bequem am Rücken","Strahlt erwachsene, städtische Eleganz (Iki) aus","Der Ginza-Knoten gilt als Variante des Tsunodashi"]},
 es:{n:"El nudo de cuernos",tag:"Un nudo elegante en el que los extremos del obi asoman como cuernos de un tambor plano.",d:"Los extremos del obi asoman como cuernos a ambos lados de un tambor plano. Es un estilo antiguo que se remonta a la era Edo; suele atarse bajo y a veces sin almohadilla, con un aire limpio, sobrio y elegante.",o:"Komon, tsumugi y otros kimonos de diario o de moda",w:"Nagoya obi, hanhaba obi, fukuro obi informal",p:["Puede atarse sin almohadilla, más cómodo para la espalda","Transmite una elegancia urbana y madura (iki)","El nudo Ginza se considera una variante del tsunodashi"]},
 zh:{n:"别致的角出结",tag:"腰带两端像角一样从扁平太鼓两侧露出的别致系法。",d:"腰带两端像角一样从扁平太鼓的左右两侧探出。这是源自江户时代的古老系法，常系得较低，有时不用带枕，给人清爽、低调而有品位的印象。",o:"小纹、紬等日常及时尚和服",w:"名古屋带、半幅带、休闲袋带",p:["可以不用带枕，背部较轻松","散发成熟女性的“粹”（都市风雅）","银座结被视为角出的一种"]},
 ko:{n:"멋스러운 뿔 모양 매듭",tag:"납작한 오타이코 양옆으로 오비 끝이 뿔처럼 나오는 멋스러운 매듭.",d:"오비 양끝이 납작한 오타이코의 좌우로 뿔처럼 살짝 나오는 매듭입니다. 에도 시대부터 이어진 오래된 형태로, 낮게 매고 오비마쿠라 없이 매기도 하여 깔끔하고 세련된 인상을 줍니다.",o:"고몬, 쓰무기 등 평상복·외출복",w:"나고야오비, 한하바오비, 캐주얼 후쿠로오비",p:["오비마쿠라 없이 맬 수도 있어 등이 편함","성숙한 여성의 '이키(세련미)'가 느껴짐","긴자 매듭도 쓰노다시의 일종으로 여겨짐"]}}},
{id:"n-fukura",kanji:"ふくら雀",kana:"ふくらすずめ",romaji:"Fukura suzume",f:[5,5],t:{
 ja:{n:"振袖のための華やかな帯結び",tag:"羽をふくらませた雀の姿をかたどった、振袖の代表的な帯結びです。",d:"冬の寒さに羽をふくらませた雀の姿をかたどり、左右に羽を広げた華やかな結び方です。「福良雀」とも書き、福を呼ぶ縁起の良い形として、振袖の帯結びの定番になっています。",o:"振袖（成人式・結婚式・卒業式など）",w:"袋帯（長さのあるもの）",p:["「福が良くなる」に通じる縁起の良い名前","未婚女性の礼装である振袖に合わせる","羽の大きさや角度で印象が変わる"]},
 en:{n:"The plump sparrow",tag:"The classic furisode knot, shaped like a sparrow puffed up against the cold.",d:"Modeled on a sparrow fluffing up its feathers in winter, with wings spread to the left and right. Its name can also be written with characters meaning “good fortune”, so it is considered lucky and is a standard knot for furisode.",o:"Furisode (Coming-of-Age Day, weddings, graduations)",w:"Long fukuro obi",p:["The name sounds like “increasing good fortune”","Paired with the furisode, the formal kimono of unmarried women","The size and angle of the wings change its look"]},
 fr:{n:"Le moineau gonflé",tag:"Le nœud classique du furisode, en forme de moineau gonflant ses plumes contre le froid.",d:"Il imite un moineau qui gonfle ses plumes en hiver, ailes déployées à gauche et à droite. Son nom peut aussi s'écrire avec des caractères signifiant « bonne fortune » : il porte donc chance et c'est un nœud classique pour le furisode.",o:"Furisode (fête de la majorité, mariages, remises de diplômes)",w:"Fukuro obi long",p:["Le nom évoque « une fortune qui grandit »","Associé au furisode, le kimono de cérémonie des femmes non mariées","La taille et l'angle des ailes changent son allure"]},
 de:{n:"Der aufgeplusterte Spatz",tag:"Der klassische Furisode-Knoten in Form eines Spatzen, der sich gegen die Kälte aufplustert.",d:"Er stellt einen Spatz dar, der im Winter sein Gefieder aufplustert, mit nach links und rechts ausgebreiteten Flügeln. Der Name lässt sich auch mit Schriftzeichen für „Glück“ schreiben, daher gilt er als glückbringend und ist ein Standardknoten zum Furisode.",o:"Furisode (Tag der Volljährigkeit, Hochzeiten, Abschlussfeiern)",w:"Langer Fukuro-Obi",p:["Der Name klingt wie „wachsendes Glück“","Gehört zum Furisode, dem Festkimono unverheirateter Frauen","Größe und Winkel der Flügel verändern die Wirkung"]},
 es:{n:"El gorrión esponjado",tag:"El nudo clásico del furisode, con forma de gorrión que se esponja por el frío.",d:"Imita a un gorrión que ahueca sus plumas en invierno, con las alas abiertas a izquierda y derecha. Su nombre también puede escribirse con caracteres que significan «buena fortuna», por eso se considera de buena suerte y es un nudo habitual para el furisode.",o:"Furisode (Día de la Mayoría de Edad, bodas, graduaciones)",w:"Fukuro obi largo",p:["El nombre suena a «fortuna que crece»","Se combina con el furisode, el kimono de gala de las solteras","El tamaño y el ángulo de las alas cambian su aspecto"]},
 zh:{n:"振袖专用的福良雀结",tag:"模仿麻雀蓬起羽毛御寒的姿态，振袖的代表性系法。",d:"模仿冬天麻雀蓬起羽毛的样子，左右展开双翼的华丽系法。也写作“福良雀”，被视为招福的吉祥造型，是振袖腰带结的经典。",o:"振袖（成人礼、婚礼、毕业典礼等）",w:"较长的袋带",p:["名称谐音“福气变好”，十分吉利","搭配未婚女性的礼服振袖","翅膀的大小和角度会改变整体印象"]},
 ko:{n:"후리소데를 위한 화려한 매듭",tag:"깃털을 부풀린 참새 모습을 본뜬 후리소데의 대표 매듭.",d:"겨울 추위에 깃털을 부풀린 참새의 모습을 본떠 좌우로 날개를 펼친 화려한 매듭입니다. '복(福)'이 담긴 한자로도 쓸 수 있어 복을 부르는 길한 형태로 여겨지며, 후리소데 매듭의 정석입니다.",o:"후리소데(성년의 날·결혼식·졸업식 등)",w:"길이가 긴 후쿠로오비",p:["'복이 좋아진다'는 뜻과 통하는 길한 이름","미혼 여성의 예복인 후리소데에 맞춤","날개의 크기와 각도에 따라 인상이 달라짐"]}}},
{id:"n-bunko",kanji:"文庫",kana:"ぶんこ",romaji:"Bunko",f:[1,5],t:{
 ja:{n:"リボン形の定番の帯結び",tag:"リボンのような形の、古くからある定番の帯結びです。",d:"左右に羽を広げ、中央から垂れが下がるリボンのような形の結び方です。江戸時代に武家の女性が結んだのが始まりと言われます。半幅帯で結べば浴衣の定番に、袋帯で結べば振袖にも合う華やかな形になります。",o:"浴衣、小紋、振袖（袋帯で結ぶ場合）",w:"半幅帯、袋帯、丸帯",p:["浴衣の帯結びとして最も人気がある","江戸時代の武家の女性の結び方が起源とされる","帯の種類によってカジュアルにも礼装にもなる"]},
 en:{n:"The classic bow",tag:"A long-established knot shaped like a ribbon bow.",d:"A ribbon-like bow with wings spread to the left and right and an end hanging down the center. It is said to have been tied by women of samurai families in the Edo period. Tied with a hanhaba obi it is the classic yukata look; tied with a fukuro obi it becomes a showy knot for furisode.",o:"Yukata, komon, furisode (when tied with a fukuro obi)",w:"Hanhaba obi, fukuro obi, maru obi",p:["The most popular knot for yukata","Said to come from the knot worn by samurai-family women in the Edo period","Casual or formal, depending on the obi used"]},
 fr:{n:"Le nœud papillon classique",tag:"Un nœud traditionnel en forme de nœud de ruban.",d:"Un nœud en forme de ruban, ailes déployées à gauche et à droite et une extrémité tombant au centre. Il aurait été porté par les femmes des familles de samouraïs à l'époque d'Edo. Avec un hanhaba obi, c'est le look classique du yukata ; avec un fukuro obi, il devient un nœud spectaculaire pour le furisode.",o:"Yukata, komon, furisode (noué avec un fukuro obi)",w:"Hanhaba obi, fukuro obi, maru obi",p:["Le nœud le plus populaire pour le yukata","Viendrait du nœud des femmes de samouraïs à l'époque d'Edo","Décontracté ou formel selon l'obi utilisé"]},
 de:{n:"Die klassische Schleife",tag:"Ein altbewährter Knoten in Form einer Schleife.",d:"Eine schleifenartige Form mit nach links und rechts ausgebreiteten Flügeln und einem in der Mitte herabhängenden Ende. Er soll in der Edo-Zeit von Frauen aus Samuraifamilien gebunden worden sein. Mit Hanhaba-Obi ist er der klassische Yukata-Look, mit Fukuro-Obi ein prächtiger Knoten zum Furisode.",o:"Yukata, Komon, Furisode (mit Fukuro-Obi gebunden)",w:"Hanhaba-Obi, Fukuro-Obi, Maru-Obi",p:["Der beliebteste Knoten zum Yukata","Soll auf den Knoten der Samurai-Frauen der Edo-Zeit zurückgehen","Je nach Obi leger oder formell"]},
 es:{n:"El lazo clásico",tag:"Un nudo tradicional con forma de lazo.",d:"Un lazo con alas abiertas a izquierda y derecha y un extremo que cae por el centro. Se dice que lo usaban las mujeres de familias samurái en la era Edo. Con un hanhaba obi es el look clásico del yukata; con un fukuro obi se convierte en un nudo vistoso para el furisode.",o:"Yukata, komon, furisode (atado con fukuro obi)",w:"Hanhaba obi, fukuro obi, maru obi",p:["El nudo más popular para el yukata","Se dice que viene del nudo de las mujeres samurái de la era Edo","Informal o formal según el obi que se use"]},
 zh:{n:"经典蝴蝶结造型",tag:"形似蝴蝶结、历史悠久的经典系法。",d:"左右展开双翼、中央垂下带尾的蝴蝶结造型。据说起源于江户时代武士家族女性的系法。用半幅带系是浴衣的经典造型，用袋带系则成为适合振袖的华丽结。",o:"浴衣、小纹、振袖（用袋带系时）",w:"半幅带、袋带、丸带",p:["浴衣最受欢迎的系法","据说源自江户时代武家女性的系法","根据腰带种类，可休闲也可正式"]},
 ko:{n:"리본 모양의 정석 매듭",tag:"리본 같은 모양의 오래된 정석 매듭.",d:"좌우로 날개를 펼치고 가운데로 끝자락이 늘어지는 리본 모양의 매듭입니다. 에도 시대 무사 가문의 여성이 매던 것이 시초라고 합니다. 한하바오비로 매면 유카타의 정석이 되고, 후쿠로오비로 매면 후리소데에도 어울리는 화려한 형태가 됩니다.",o:"유카타, 고몬, 후리소데(후쿠로오비로 맬 때)",w:"한하바오비, 후쿠로오비, 마루오비",p:["유카타 매듭으로 가장 인기","에도 시대 무사 가문 여성의 매듭이 기원으로 여겨짐","오비 종류에 따라 캐주얼도, 예복도 가능"]}}},
{id:"n-darari",kanji:"だらり",kana:"だらり",romaji:"Darari",f:[5,5],t:{
 ja:{n:"舞妓さんの帯結び",tag:"長い帯を足元近くまで垂らす、京都の舞妓さんの帯結びです。",d:"長さ5m以上もある「だらりの帯」を使い、両端を足首近くまで長く垂らす結び方です。京都の舞妓さんの象徴的な装いで、帯の端には所属する置屋の紋が入ります。江戸時代の町娘の流行が起源と言われます。",o:"舞妓の装い、花嫁衣装（引き振袖）",w:"丸帯（だらりの帯）",p:["舞妓さんならではの装いで、芸妓になるとお太鼓に変わる","垂れの先に置屋の紋が入る","京都・祇園や舞妓体験で目にすることが多い"]},
 en:{n:"The maiko's dangling knot",tag:"The knot of Kyoto's maiko, with long ends hanging almost to the ankles.",d:"Uses a darari obi more than 5 m long, with both ends hanging almost to the ankles. It is the iconic look of Kyoto's maiko (apprentice geisha), and the end of the obi bears the crest of the okiya (geisha house) she belongs to. It is said to have begun as a fashion among young townswomen in the Edo period.",o:"Maiko costume, bridal kimono (hiki-furisode)",w:"Maru obi (darari obi)",p:["Worn only by maiko; once she becomes a geiko, she switches to the drum knot","The hanging ends carry the okiya's crest","Most visitors see it in Kyoto's Gion district or at maiko makeover studios"]},
 fr:{n:"Le nœud pendant des maiko",tag:"Le nœud des maiko de Kyoto, aux longues extrémités qui tombent presque jusqu'aux chevilles.",d:"Il utilise un obi darari de plus de 5 m, dont les deux extrémités tombent presque jusqu'aux chevilles. C'est l'image emblématique des maiko (apprenties geishas) de Kyoto, et le bout de l'obi porte le blason de l'okiya (maison de geishas) à laquelle elle appartient. Il serait né d'une mode des jeunes citadines de l'époque d'Edo.",o:"Tenue de maiko, kimono de mariée (hiki-furisode)",w:"Maru obi (obi darari)",p:["Porté uniquement par les maiko ; devenue geiko, elle passe au nœud en tambour","Les pans tombants portent le blason de l'okiya","On le voit surtout dans le quartier de Gion à Kyoto ou lors de séances de déguisement en maiko"]},
 de:{n:"Der hängende Maiko-Knoten",tag:"Der Knoten der Maiko in Kyoto, dessen lange Enden fast bis zu den Knöcheln hängen.",d:"Dafür wird ein über 5 m langer Darari-Obi verwendet, dessen Enden fast bis zu den Knöcheln herabhängen. Er ist das Markenzeichen der Maiko (Geisha-Lehrlinge) in Kyoto; am Obi-Ende prangt das Wappen ihres Okiya (Geishahauses). Er soll als Mode junger Stadtfrauen der Edo-Zeit begonnen haben.",o:"Maiko-Kostüm, Brautkimono (Hiki-Furisode)",w:"Maru-Obi (Darari-Obi)",p:["Nur Maiko tragen ihn; als Geiko wechseln sie zum Trommelknoten","Die herabhängenden Enden tragen das Wappen des Okiya","Besucher sehen ihn meist in Kyotos Gion-Viertel oder in Maiko-Fotostudios"]},
 es:{n:"El nudo colgante de las maiko",tag:"El nudo de las maiko de Kioto, con extremos largos que llegan casi a los tobillos.",d:"Se usa un obi darari de más de 5 m, con ambos extremos colgando casi hasta los tobillos. Es la imagen icónica de las maiko (aprendices de geisha) de Kioto, y el extremo del obi lleva el blasón de su okiya (casa de geishas). Se dice que nació como moda de las jóvenes de la ciudad en la era Edo.",o:"Atuendo de maiko, kimono de novia (hiki-furisode)",w:"Maru obi (obi darari)",p:["Solo lo llevan las maiko; al convertirse en geiko pasan al nudo de tambor","Los extremos colgantes llevan el blasón de la okiya","Los visitantes suelen verlo en el barrio de Gion o en estudios de disfraz de maiko"]},
 zh:{n:"舞妓的垂带结",tag:"将长长的腰带垂到脚踝附近，京都舞妓的系法。",d:"使用长5米以上的“垂带”，两端长长地垂到接近脚踝。这是京都舞妓（见习艺伎）的标志性装扮，腰带末端印有所属置屋（艺伎馆）的家纹。据说起源于江户时代城市年轻女子的流行装扮。",o:"舞妓装扮、新娘和服（引振袖）",w:"丸带（垂带）",p:["只有舞妓系此结，成为艺伎后改系太鼓结","垂下的带尾上印有置屋的家纹","游客多在京都祇园或舞妓体验馆见到"]},
 ko:{n:"마이코의 늘어뜨린 매듭",tag:"긴 오비를 발목 가까이까지 늘어뜨리는 교토 마이코의 매듭.",d:"길이 5m가 넘는 '다라리 오비'를 써서 양끝을 발목 가까이까지 길게 늘어뜨리는 매듭입니다. 교토 마이코(견습 게이샤)의 상징적인 차림으로, 오비 끝에는 소속된 오키야(게이샤 집)의 가문이 들어갑니다. 에도 시대 마을 처녀들의 유행이 기원이라고 합니다.",o:"마이코 차림, 신부 의상(히키후리소데)",w:"마루오비(다라리 오비)",p:["마이코만 매며, 게이코가 되면 오타이코로 바꿈","늘어진 끝자락에 오키야의 가문이 들어감","관광객은 교토 기온이나 마이코 체험 스튜디오에서 많이 봄"]}}},
{id:"n-kai",kanji:"貝の口",kana:"かいのくち",romaji:"Kai-no-kuchi",f:[1,5],t:{
 ja:{n:"男性の帯結びの定番",tag:"男性の角帯の最も基本的な結び方です。",d:"結び目が二枚貝の口に似ていることから名付けられた、男性の角帯の代表的な結び方です。小さく平たい結び目で、ほどけにくく、普段着から紋付羽織袴まで幅広く使えます。女性が半幅帯で結ぶこともあります。",o:"男性の着物全般、女性の浴衣・普段着（半幅帯）",w:"角帯、半幅帯",p:["結び目は背中の中心から少しずらす","平たいので椅子の背もたれでもじゃまにならない","慣れれば1分ほどで結べる"]},
 en:{n:"The classic men's knot",tag:"The most basic knot for a man's kaku obi.",d:"Named because the knot resembles the open mouth of a clam. It is the standard knot for a man's kaku obi: small, flat and secure, it suits everything from everyday wear to formal crested attire. Women also tie it with a hanhaba obi.",o:"All men's kimono; women's yukata and casual kimono (with a hanhaba obi)",w:"Kaku obi, hanhaba obi",p:["The knot is placed slightly off the center of the back","Flat enough not to get in the way when leaning back in a chair","Once learned, it takes about a minute to tie"]},
 fr:{n:"Le nœud masculin classique",tag:"Le nœud de base du kaku obi masculin.",d:"Son nom vient de sa ressemblance avec la bouche entrouverte d'un coquillage. C'est le nœud standard du kaku obi masculin : petit, plat et solide, il convient de la tenue quotidienne à la tenue de cérémonie à blasons. Les femmes le nouent aussi avec un hanhaba obi.",o:"Tous les kimonos masculins ; yukata et kimonos décontractés féminins (avec un hanhaba obi)",w:"Kaku obi, hanhaba obi",p:["Le nœud se place légèrement décalé par rapport au centre du dos","Assez plat pour ne pas gêner contre un dossier","Une fois appris, il se noue en une minute environ"]},
 de:{n:"Der klassische Herrenknoten",tag:"Der grundlegendste Knoten für den Kaku-Obi der Männer.",d:"Er heißt so, weil der Knoten dem geöffneten Mund einer Muschel ähnelt. Er ist der Standardknoten für den Kaku-Obi: klein, flach und sicher, passend vom Alltag bis zur formellen Wappenkleidung. Auch Frauen binden ihn mit einem Hanhaba-Obi.",o:"Alle Herrenkimonos; Yukata und Alltagskimonos von Frauen (mit Hanhaba-Obi)",w:"Kaku-Obi, Hanhaba-Obi",p:["Der Knoten sitzt leicht seitlich der Rückenmitte","Flach genug, um beim Anlehnen nicht zu stören","Einmal gelernt, in etwa einer Minute gebunden"]},
 es:{n:"El nudo masculino clásico",tag:"El nudo más básico para el kaku obi masculino.",d:"Se llama así porque el nudo se parece a la boca abierta de una almeja. Es el nudo estándar del kaku obi masculino: pequeño, plano y firme, sirve desde la ropa diaria hasta el atuendo formal con blasones. Las mujeres también lo atan con un hanhaba obi.",o:"Todos los kimonos de hombre; yukata y kimonos informales de mujer (con hanhaba obi)",w:"Kaku obi, hanhaba obi",p:["El nudo se coloca ligeramente desplazado del centro de la espalda","Es tan plano que no molesta al apoyarse en una silla","Una vez aprendido, se ata en un minuto aproximadamente"]},
 zh:{n:"男性腰带结的经典",tag:"男性角带最基本的系法。",d:"因结形似张开的贝壳口而得名，是男性角带最具代表性的系法。结小而扁平、不易松开，从日常服装到纹付羽织袴礼服都适用。女性也会用半幅带系这种结。",o:"所有男性和服；女性浴衣及日常和服（半幅带）",w:"角带、半幅带",p:["结的位置稍微偏离背部中心","扁平，靠在椅背上也不碍事","学会后约一分钟就能系好"]},
 ko:{n:"남성 오비 매듭의 정석",tag:"남성 가쿠오비의 가장 기본적인 매듭.",d:"매듭이 조개의 벌어진 입과 닮았다고 해서 붙은 이름으로, 남성 가쿠오비의 대표 매듭입니다. 작고 납작하며 잘 풀리지 않아 평상복부터 몬쓰키 하오리 하카마까지 폭넓게 쓰입니다. 여성이 한하바오비로 매기도 합니다.",o:"남성 기모노 전반, 여성 유카타·평상복(한하바오비)",w:"가쿠오비, 한하바오비",p:["매듭은 등 중앙에서 약간 옆으로 비켜 둠","납작해서 의자 등받이에 기대도 불편하지 않음","익숙해지면 1분 정도면 맬 수 있음"]}}},
{id:"n-ronin",kanji:"浪人結び",kana:"ろうにんむすび",romaji:"Rōnin musubi",f:[1,1],t:{
 ja:{n:"くだけた雰囲気の男性の帯結び",tag:"結び目から帯の端を垂らした、くだけた雰囲気の男性の帯結びです。",d:"結んだ帯の端を、結び目から斜め下に垂らす男性の帯結びです。時代劇で主君を持たない浪人が結んでいた姿から名付けられたと言われ、肩の力の抜けたくだけた印象になります。",o:"男性の浴衣・普段着",w:"角帯、兵児帯",p:["簡単ですぐに結べる","改まった場では貝の口などを選ぶ","時代劇のような気軽な粋さを楽しめる"]},
 en:{n:"The relaxed rōnin knot",tag:"A relaxed men's knot with an end left hanging from the knot.",d:"A men's knot in which, after tying, one end of the obi is left hanging diagonally down from the knot. It is said to be named after the rōnin (masterless samurai) seen wearing it in period dramas, and it gives a laid-back, casual look.",o:"Men's yukata and casual kimono",w:"Kaku obi, heko obi",p:["Simple and quick to tie","For dressier occasions, choose kai-no-kuchi instead","Lets you enjoy a casual, period-drama style"]},
 fr:{n:"Le nœud décontracté du rōnin",tag:"Un nœud masculin décontracté, dont une extrémité pend depuis le nœud.",d:"Un nœud masculin où, une fois noué, une extrémité de l'obi pend en diagonale depuis le nœud. Son nom viendrait des rōnin (samouraïs sans maître) qui le portent dans les films d'époque ; il donne une allure détendue et décontractée.",o:"Yukata et kimonos décontractés masculins",w:"Kaku obi, heko obi",p:["Simple et rapide à nouer","Pour une occasion plus habillée, préférez le kai-no-kuchi","Un style décontracté digne des films de samouraïs"]},
 de:{n:"Der lässige Rōnin-Knoten",tag:"Ein lässiger Herrenknoten, bei dem ein Ende vom Knoten herabhängt.",d:"Ein Herrenknoten, bei dem nach dem Binden ein Obi-Ende schräg vom Knoten herabhängt. Er soll nach den Rōnin (herrenlosen Samurai) benannt sein, die ihn in historischen Filmen tragen, und wirkt locker und ungezwungen.",o:"Herren-Yukata und legere Kimonos",w:"Kaku-Obi, Heko-Obi",p:["Einfach und schnell gebunden","Für festlichere Anlässe lieber Kai-no-Kuchi wählen","Lässiger Stil wie aus einem Samuraifilm"]},
 es:{n:"El nudo relajado del rōnin",tag:"Un nudo masculino informal, con un extremo que cuelga del nudo.",d:"Un nudo masculino en el que, tras atarlo, un extremo del obi queda colgando en diagonal desde el nudo. Se dice que debe su nombre a los rōnin (samuráis sin señor) que lo llevan en las películas de época, y da un aire relajado e informal.",o:"Yukata y kimonos informales de hombre",w:"Kaku obi, heko obi",p:["Sencillo y rápido de atar","Para ocasiones más formales, mejor el kai-no-kuchi","Permite disfrutar de un estilo informal de película de samuráis"]},
 zh:{n:"随性的浪人结",tag:"结后让带端从结上垂下、风格随性的男性系法。",d:"系好后让腰带一端从结上斜斜垂下的男性系法。据说因古装剧中没有主君的浪人常系此结而得名，给人轻松随性的印象。",o:"男性浴衣及日常和服",w:"角带、兵儿带",p:["简单，很快就能系好","较正式的场合宜选择贝之口","可享受古装剧般的随性风格"]},
 ko:{n:"편안한 분위기의 로닌 매듭",tag:"매듭에서 오비 끝을 늘어뜨린 편안한 분위기의 남성 매듭.",d:"한 번 묶은 오비의 끝을 매듭에서 비스듬히 아래로 늘어뜨리는 남성 매듭입니다. 사극에서 주군이 없는 무사인 로닌이 매던 모습에서 이름이 붙었다고 하며, 힘을 뺀 캐주얼한 인상을 줍니다.",o:"남성 유카타·평상복",w:"가쿠오비, 헤코오비",p:["간단해서 금방 맬 수 있음","격식 있는 자리에는 가이노쿠치 등을 선택","사극 같은 편안한 멋을 즐길 수 있음"]}}}
];

K.forEach(k=>k.cat="k"); OBI.forEach(k=>k.cat="o"); KNOT.forEach(k=>k.cat="n");
const ALL=[...K,...OBI,...KNOT];

/* obi illustration: the strip drawn to scale (about 2.5px per cm) */
function obiSVG(id){

 en:{n:"Stencil dyeing",tag:"Dyeing fine, precise patterns using hand-cut paper stencils.",d:"A stencil called Ise-katagami, carved from layers of washi paper bonded with persimmon tannin, is laid on the fabric. Paste is spread over it, so the pattern is reserved when the cloth is dyed. The stencils have long been made in Shiroko and Jike in Suzuka (Mie Prefecture), and made possible the extremely fine patterns of Edo komon.",o:"Edo komon, komon, yukata",w:"Stencils: Suzuka, Mie (Shiroko and Jike) / Dyeing: Tokyo, Kyoto and elsewhere",p:["Some patterns are so fine that they look plain from a distance","Ise-katagami are an officially recognized traditional craft","The stencil-carving skills are designated an Important Intangible Cultural Property"]},
 fr:{n:"Teinture au pochoir",tag:"Teindre des motifs fins et précis à l'aide de pochoirs en papier découpés à la main.",d:"Un pochoir appelé Ise-katagami, découpé dans plusieurs couches de papier washi collées au tanin de kaki, est posé sur le tissu. On y étale une pâte, qui protège le motif lors de la teinture. Ces pochoirs sont fabriqués depuis longtemps à Shiroko et Jike, à Suzuka (préfecture de Mie), et ont permis les motifs extrêmement fins de l'Edo komon.",o:"Edo komon, komon, yukata",w:"Pochoirs : Suzuka, Mie (Shiroko et Jike) / Teinture : Tokyo, Kyoto, etc.",p:["Certains motifs sont si fins qu'ils semblent unis de loin","Les Ise-katagami sont un artisanat traditionnel reconnu","Leur technique de découpe est classée bien culturel immatériel important"]},
 de:{n:"Schablonenfärbung",tag:"Feine, präzise Muster mit handgeschnittenen Papierschablonen färben.",d:"Eine Schablone namens Ise-Katagami, geschnitten aus mehreren mit Kakitannin verklebten Lagen Washi-Papier, wird auf den Stoff gelegt. Darüber wird Paste gestrichen, die das Muster beim Färben aussparen lässt. Die Schablonen werden seit Langem in Shiroko und Jike in Suzuka (Präfektur Mie) hergestellt und ermöglichten die extrem feinen Muster des Edo-Komon.",o:"Edo-Komon, Komon, Yukata",w:"Schablonen: Suzuka, Mie (Shiroko und Jike) / Färben: Tokio, Kyoto u. a.",p:["Manche Muster sind so fein, dass sie aus der Ferne einfarbig wirken","Ise-Katagami sind anerkanntes traditionelles Kunsthandwerk","Die Schneidetechnik ist als wichtiges immaterielles Kulturgut ausgewiesen"]},
 es:{n:"Teñido con plantilla",tag:"Teñir dibujos finos y precisos con plantillas de papel cortadas a mano.",d:"Sobre la tela se coloca una plantilla llamada Ise-katagami, tallada en varias capas de papel washi unidas con tanino de caqui. Se extiende pasta por encima, que reserva el dibujo al teñir. Estas plantillas se fabrican desde hace mucho en Shiroko y Jike, en Suzuka (prefectura de Mie), e hicieron posibles los dibujos finísimos del Edo komon.",o:"Edo komon, komon, yukata",w:"Plantillas: Suzuka, Mie (Shiroko y Jike) / Teñido: Tokio, Kioto y otros",p:["Algunos dibujos son tan finos que de lejos parecen lisos","Los Ise-katagami son una artesanía tradicional reconocida","La técnica de tallado está declarada Bien Cultural Inmaterial Importante"]},
 zh:{n:"用型纸染细密图案的技法",tag:"用手工雕刻的和纸型纸，精确染出细密图案的技法。",d:"将用柿漆粘合多层和纸并雕刻图案制成的“伊势型纸”铺在布上，在上面刮上防染糊，染色时图案部分便会留白。型纸自古在三重县铃鹿市白子、寺家一带制作，造就了江户小纹等极其细密的花纹。",o:"江户小纹、小纹、浴衣",w:"型纸：三重县铃鹿市（白子、寺家）／染色：东京、京都等地",p:["有些花纹细到远看像素色","伊势型纸是日本国家认定的传统工艺品","型纸雕刻技术被指定为重要无形文化财"]},
 ko:{n:"종이 본으로 잔무늬를 염색하는 기법",tag:"손으로 새긴 종이 본을 사용해 섬세한 무늬를 정확하게 염색하는 기법.",d:"감물로 여러 겹 붙인 화지(和紙)에 무늬를 새긴 '이세 가타가미'를 원단 위에 놓고, 그 위에 풀을 발라 무늬 부분이 염색되지 않게 하는 기법입니다. 가타가미는 예로부터 미에현 스즈카시 시로코·지케 일대에서 만들어져 왔으며, 에도고몬 같은 매우 섬세한 무늬를 가능하게 했습니다.",o:"에도고몬, 고몬, 유카타",w:"본: 미에현 스즈카시(시로코·지케) / 염색: 도쿄, 교토 등",p:["멀리서 보면 무지처럼 보일 만큼 섬세한 무늬도 있음","이세 가타가미는 일본의 전통 공예품","본 조각 기술은 중요 무형문화재로 지정"]}}},
{id:"t-shibori",kanji:"絞り染め",kana:"しぼりぞめ",romaji:"Shibori-zome",kind:0,t:{
 ja:{n:"布をくくって染める技法",tag:"布を糸でくくって染め、ふっくらとした模様を生む技法です。",d:"布の一部を糸でくくったり、縫い縮めたり、折りたたんだりして染料が入らないようにし、模様を染め出す技法です。くくった跡が粒状の凹凸として残り、独特の立体感と柔らかな風合いが生まれます。",o:"振袖、訪問着、羽織、帯揚げ、浴衣",w:"京鹿の子絞（京都）、有松・鳴海絞（愛知）",p:["小さな粒が並ぶ「鹿の子絞り」は、子鹿の背の斑点に似ていることから","総絞りの振袖は数十万粒を手でくくる最高級品","有松・鳴海絞は江戸時代、東海道を行く旅人のみやげとして人気だった"]},
 en:{n:"Tie-dyeing",tag:"Binding the fabric with thread before dyeing to create soft, textured patterns.",d:"Parts of the fabric are bound with thread, stitched and gathered, or folded so the dye cannot reach them, leaving a pattern after dyeing. The binding leaves small raised bumps, giving the cloth a unique three-dimensional texture and softness.",o:"Furisode, hōmongi, haori, obi-age scarves, yukata",w:"Kyō-kanoko shibori (Kyoto), Arimatsu-Narumi shibori (Aichi)",p:["Kanoko shibori, with rows of tiny dots, is named after the spots on a fawn's back","A furisode covered entirely in shibori can have hundreds of thousands of hand-tied dots and is among the most luxurious kimono","Arimatsu-Narumi shibori was a famous souvenir for travelers on the Tōkaidō road in the Edo period"]},
 fr:{n:"Teinture à nœuds",tag:"Ligaturer le tissu avant la teinture pour créer des motifs doux et en relief.",d:"Des parties du tissu sont ligaturées avec du fil, cousues et froncées ou pliées pour que la teinture ne les atteigne pas, laissant un motif après teinture. Les ligatures laissent de petits reliefs qui donnent au tissu une texture en trois dimensions et une grande douceur.",o:"Furisode, hōmongi, haori, écharpes obi-age, yukata",w:"Kyō-kanoko shibori (Kyoto), Arimatsu-Narumi shibori (Aichi)",p:["Le kanoko shibori, aux rangées de petits points, doit son nom aux taches d'un faon","Un furisode entièrement en shibori peut compter des centaines de milliers de points noués à la main et fait partie des kimonos les plus luxueux","L'Arimatsu-Narumi shibori était un souvenir réputé des voyageurs de la route du Tōkaidō à l'époque d'Edo"]},
 de:{n:"Abbindefärbung",tag:"Den Stoff vor dem Färben mit Faden abbinden, um weiche, plastische Muster zu erzeugen.",d:"Teile des Stoffes werden mit Faden abgebunden, zusammengenäht und gerafft oder gefaltet, damit die Farbe sie nicht erreicht; nach dem Färben bleibt ein Muster. Das Abbinden hinterlässt kleine Erhebungen, die dem Stoff eine einzigartige plastische Struktur und Weichheit geben.",o:"Furisode, Hōmongi, Haori, Obi-Age-Tücher, Yukata",w:"Kyō-Kanoko-Shibori (Kyoto), Arimatsu-Narumi-Shibori (Aichi)",p:["Kanoko-Shibori mit Reihen winziger Punkte ist nach den Flecken eines Rehkitzes benannt","Ein vollständig in Shibori gefertigter Furisode kann Hunderttausende handgebundene Punkte haben und zählt zu den luxuriösesten Kimonos","Arimatsu-Narumi-Shibori war in der Edo-Zeit ein berühmtes Mitbringsel für Reisende auf der Tōkaidō-Straße"]},
 es:{n:"Teñido por atado",tag:"Atar la tela con hilo antes de teñirla para crear dibujos suaves y con relieve.",d:"Partes de la tela se atan con hilo, se cosen y fruncen o se doblan para que el tinte no llegue a ellas, dejando un dibujo tras el teñido. Los atados dejan pequeños relieves que dan a la tela una textura tridimensional única y gran suavidad.",o:"Furisode, hōmongi, haori, pañuelos obi-age, yukata",w:"Kyō-kanoko shibori (Kioto), Arimatsu-Narumi shibori (Aichi)",p:["El kanoko shibori, con hileras de puntitos, se llama así por las manchas del lomo de un cervatillo","Un furisode todo en shibori puede tener cientos de miles de puntos atados a mano y es de los kimonos más lujosos","El Arimatsu-Narumi shibori era un recuerdo famoso para los viajeros del camino Tōkaidō en la era Edo"]},
 zh:{n:"扎染技法",tag:"先用线扎紧布料再染色，形成柔软立体花纹的技法。",d:"将布料局部用线扎紧、缝缩或折叠，使染料无法渗入，从而染出图案。扎过的地方会留下颗粒状的凹凸，带来独特的立体感和柔软质地。",o:"振袖、访问着、羽织、带扬、浴衣",w:"京鹿子绞（京都）、有松·鸣海绞（爱知）",p:["布满小颗粒的“鹿子绞”因形似小鹿背上的斑点而得名","全身扎染的振袖需手工扎数十万颗，属最高级品","有松·鸣海绞是江户时代东海道上深受旅人喜爱的特产"]},
 ko:{n:"묶어서 염색하는 기법",tag:"천을 실로 묶어 염색해 볼록한 무늬를 만드는 기법.",d:"천의 일부를 실로 묶거나 꿰매어 오므리거나 접어서 염료가 들어가지 않게 하여 무늬를 내는 염색 기법입니다. 묶은 자국이 오톨도톨한 요철로 남아 독특한 입체감과 부드러운 질감이 생깁니다.",o:"후리소데, 호몬기, 하오리, 오비아게, 유카타",w:"교카노코시보리(교토), 아리마쓰·나루미시보리(아이치)",p:["작은 알갱이가 늘어선 '가노코시보리'는 아기 사슴 등의 반점을 닮아 붙은 이름","전체를 시보리로 한 후리소데는 수십만 개를 손으로 묶은 최고급품","아리마쓰·나루미시보리는 에도 시대 도카이도 길의 명물로 여행자에게 인기"]}}},
{id:"t-roketsu",kanji:"蠟纈染め",kana:"ろうけつぞめ",romaji:"Rōketsu-zome",kind:0,t:{
 ja:{n:"蠟で模様を防ぐ染め",tag:"溶かした蠟で模様を描いて防染する技法です。",d:"溶かした蠟を筆などで生地に置き、その部分に染料が入らないようにして染める技法です。奈良時代に伝わり、正倉院にも作品が残ります。蠟が割れた部分に染料がしみ込んでできる細かなひび模様が、独特の味わいになります。",o:"訪問着、付け下げ、名古屋帯、おしゃれ用の袋帯",w:"京都をはじめ全国の作家",p:["蠟のひび割れによる「亀裂模様」が魅力","奈良時代の「三纈（さんけち）」の一つ","インドネシアのバティックと同じ原理"]},
 en:{n:"Wax-resist dyeing",tag:"Painting the design in melted wax to keep the dye out.",d:"Melted wax is applied to the fabric with a brush or other tool so the dye cannot penetrate those areas. The technique arrived in Japan in the Nara period (8th century), and examples survive in the Shōsōin treasure house. Dye seeping into cracks in the wax creates fine crackle lines with a unique charm.",o:"Hōmongi, tsukesage, Nagoya obi, fashion fukuro obi",w:"Artists in Kyoto and throughout Japan",p:["Prized for the crackle pattern formed where the wax breaks","One of the three classic resist-dyeing methods of the Nara period","Works on the same principle as Indonesian batik"]},
 fr:{n:"Teinture à la cire",tag:"Dessiner le motif à la cire fondue pour empêcher la teinture de pénétrer.",d:"De la cire fondue est appliquée sur le tissu au pinceau ou avec un autre outil, afin que la teinture n'atteigne pas ces zones. La technique est arrivée au Japon à l'époque de Nara (VIIIe siècle), et des exemples sont conservés au Shōsōin. La teinture qui s'infiltre dans les fissures de la cire crée de fines craquelures au charme unique.",o:"Hōmongi, tsukesage, Nagoya obi, fukuro obi de mode",w:"Artisans de Kyoto et de tout le Japon",p:["Apprécié pour les craquelures formées là où la cire se brise","L'une des trois techniques classiques de teinture par réserve de l'époque de Nara","Même principe que le batik indonésien"]},
 de:{n:"Wachsreservefärbung",tag:"Das Muster mit geschmolzenem Wachs malen, damit die Farbe nicht eindringt.",d:"Geschmolzenes Wachs wird mit Pinsel oder anderen Werkzeugen auf den Stoff aufgetragen, damit die Farbe diese Stellen nicht erreicht. Die Technik kam in der Nara-Zeit (8. Jh.) nach Japan; Beispiele sind im Schatzhaus Shōsōin erhalten. Farbe, die in Risse im Wachs eindringt, erzeugt feine Craquelé-Linien mit besonderem Reiz.",o:"Hōmongi, Tsukesage, Nagoya-Obi, modische Fukuro-Obi",w:"Kunsthandwerker in Kyoto und ganz Japan",p:["Geschätzt für das Craquelé-Muster, das entsteht, wo das Wachs bricht","Eine der drei klassischen Reservefärbetechniken der Nara-Zeit","Funktioniert nach demselben Prinzip wie indonesisches Batik"]},
 es:{n:"Teñido con reserva de cera",tag:"Pintar el dibujo con cera derretida para que el tinte no penetre.",d:"Se aplica cera derretida sobre la tela con pincel u otras herramientas para que el tinte no llegue a esas zonas. La técnica llegó a Japón en la era Nara (siglo VIII) y se conservan ejemplos en el tesoro Shōsōin. El tinte que se filtra por las grietas de la cera crea finas líneas craqueladas con un encanto único.",o:"Hōmongi, tsukesage, Nagoya obi, fukuro obi de moda",w:"Artesanos de Kioto y de todo Japón",p:["Apreciado por el craquelado que se forma donde se rompe la cera","Una de las tres técnicas clásicas de teñido por reserva de la era Nara","Funciona con el mismo principio que el batik indonesio"]},
 zh:{n:"用蜡防染的蜡染技法",tag:"用熔化的蜡描绘图案进行防染的技法。",d:"用毛笔等工具把熔化的蜡涂在布上，使染料无法渗入该处，再进行染色。此技法于奈良时代传入日本，正仓院中仍保存着当时的作品。染料渗入蜡的裂缝而形成的细小冰裂纹，别有韵味。",o:"访问着、付下、名古屋带、时尚袋带",w:"以京都为首的日本各地工艺家",p:["蜡裂开形成的“冰裂纹”是其魅力所在","奈良时代“三缬”之一","与印度尼西亚的巴迪克蜡染原理相同"]},
 ko:{n:"밀랍으로 무늬를 막는 염색",tag:"녹인 밀랍으로 무늬를 그려 방염하는 기법.",d:"녹인 밀랍을 붓 등으로 원단에 발라 그 부분에 염료가 스며들지 않게 하여 염색하는 기법입니다. 나라 시대에 전해졌으며, 쇼소인에도 작품이 남아 있습니다. 밀랍이 갈라진 틈으로 염료가 스며들어 생기는 잔금 무늬가 독특한 멋을 냅니다.",o:"호몬기, 쓰케사게, 나고야오비, 멋내기용 후쿠로오비",w:"교토를 비롯한 일본 각지의 작가",p:["밀랍이 갈라져 생기는 '균열 무늬'가 매력","나라 시대 '삼힐(三纈)' 중 하나","인도네시아의 바틱과 같은 원리"]}}},
{id:"t-shishu",kanji:"刺繍",kana:"ししゅう",romaji:"Shishū",kind:2,t:{
 ja:{n:"糸で模様を縫い表す技法",tag:"絹糸や金銀糸で、模様を立体的に縫い表す技法です。",d:"絹糸や金糸・銀糸を使い、針で模様を縫い表す加飾技法です。染めた模様の上に施して華やかさや立体感を加えることが多く、日本刺繍には数十種類の技法があります。京都の「京繍（きょうぬい）」が代表的です。",o:"振袖、留袖、訪問着、半衿、袋帯、打掛",w:"京繍（京都）、加賀繍（石川）、江戸刺繍（東京）",p:["絹糸を手で撚り分けて、光沢や色の濃淡を表現する","染めと組み合わせると、より豊かな表情になる","刺繍が多いほど華やかで格調高い印象に"]},
 en:{n:"Embroidery",tag:"Stitching designs in silk and metallic threads for a raised, textured effect.",d:"A decorative technique in which designs are sewn with a needle using silk, gold and silver threads. It is often added on top of dyed patterns to bring sparkle and depth, and Japanese embroidery includes dozens of stitch techniques. Kyōnui from Kyoto is the best-known style.",o:"Furisode, tomesode, hōmongi, han-eri collars, fukuro obi, bridal uchikake",w:"Kyōnui (Kyoto), Kaga-nui (Ishikawa), Edo embroidery (Tokyo)",p:["Silk threads are split and twisted by hand to control shine and shading","Combining dyeing and embroidery adds richness","The more embroidery, the more lavish and dignified the look"]},
 fr:{n:"Broderie",tag:"Broder des motifs en fils de soie et de métal pour un effet en relief.",d:"Technique décorative où les motifs sont cousus à l'aiguille avec des fils de soie, d'or et d'argent. Elle s'ajoute souvent aux motifs teints pour apporter éclat et profondeur, et la broderie japonaise compte des dizaines de points. Le Kyōnui de Kyoto en est le style le plus connu.",o:"Furisode, tomesode, hōmongi, cols han-eri, fukuro obi, manteaux de mariée uchikake",w:"Kyōnui (Kyoto), Kaga-nui (Ishikawa), broderie d'Edo (Tokyo)",p:["Les fils de soie sont divisés et retordus à la main pour jouer sur la brillance et les nuances","Associer teinture et broderie enrichit le décor","Plus il y a de broderie, plus l'effet est somptueux et solennel"]},
 de:{n:"Stickerei",tag:"Muster mit Seiden- und Metallfäden sticken, für eine plastische Wirkung.",d:"Eine Verzierungstechnik, bei der Muster mit der Nadel aus Seiden-, Gold- und Silberfäden gestickt werden. Oft wird sie über gefärbten Mustern ergänzt, um Glanz und Tiefe zu verleihen; die japanische Stickerei kennt Dutzende Sticharten. Am bekanntesten ist Kyōnui aus Kyoto.",o:"Furisode, Tomesode, Hōmongi, Han-Eri-Kragen, Fukuro-Obi, Brautmantel Uchikake",w:"Kyōnui (Kyoto), Kaga-Nui (Ishikawa), Edo-Stickerei (Tokio)",p:["Seidenfäden werden von Hand geteilt und gedreht, um Glanz und Schattierung zu steuern","Die Kombination von Färben und Sticken wirkt besonders reich","Je mehr Stickerei, desto prächtiger und würdevoller die Wirkung"]},
 es:{n:"Bordado",tag:"Bordar dibujos con hilos de seda y metálicos para un efecto en relieve.",d:"Técnica decorativa en la que los dibujos se cosen con aguja usando hilos de seda, oro y plata. Suele añadirse sobre los dibujos teñidos para aportar brillo y profundidad, y el bordado japonés incluye decenas de puntadas. El Kyōnui de Kioto es el estilo más conocido.",o:"Furisode, tomesode, hōmongi, cuellos han-eri, fukuro obi, mantos nupciales uchikake",w:"Kyōnui (Kioto), Kaga-nui (Ishikawa), bordado de Edo (Tokio)",p:["Los hilos de seda se separan y retuercen a mano para controlar el brillo y los matices","Combinar teñido y bordado enriquece el diseño","Cuanto más bordado, más suntuoso y solemne es el aspecto"]},
 zh:{n:"刺绣",tag:"用丝线和金银线绣出立体图案的技法。",d:"用针以丝线、金线、银线绣出图案的装饰技法。常在染好的图案上加绣，增添华丽感和立体感。日本刺绣有数十种针法，以京都的“京绣”最具代表性。",o:"振袖、留袖、访问着、半衿、袋带、打褂",w:"京绣（京都）、加贺绣（石川）、江户刺绣（东京）",p:["手工劈分和捻合丝线，表现光泽和色彩浓淡","染色与刺绣结合，更显丰富","刺绣越多，越显华丽庄重"]},
 ko:{n:"자수",tag:"명주실과 금·은사로 무늬를 입체적으로 수놓는 기법.",d:"명주실이나 금사·은사로 바늘을 이용해 무늬를 수놓는 장식 기법입니다. 염색한 무늬 위에 더해 화려함과 입체감을 주는 경우가 많으며, 일본 자수에는 수십 가지 기법이 있습니다. 교토의 '교누이'가 대표적입니다.",o:"후리소데, 도메소데, 호몬기, 한에리, 후쿠로오비, 우치카케",w:"교누이(교토), 가가누이(이시카와), 에도 자수(도쿄)",p:["명주실을 손으로 나누고 꼬아 광택과 색의 농담을 표현","염색과 자수를 함께 쓰면 더욱 풍성해짐","자수가 많을수록 화려하고 격조 높은 인상"]}}},
{id:"t-kinsai",kanji:"金彩",kana:"きんさい",romaji:"Kinsai",kind:2,t:{
 ja:{n:"金箔・金粉で飾る技法",tag:"金箔や金粉で模様を華やかに飾る技法です。",d:"染め上がった生地に接着剤（糊）を置き、その上に金箔や金粉を貼って模様を飾る加飾技法です。友禅の模様の輪郭や花びらに金を添えて輝きを加えるほか、「摺り箔」「砂子」など多くの技法があります。",o:"振袖、留袖、訪問着、袋帯",w:"京都（京友禅とともに発展）",p:["光を受けて模様が浮かび上がる","桃山時代の「摺箔」は能装束にも使われた","金だけでなく銀やプラチナを使うこともある"]},
 en:{n:"Gold leaf decoration",tag:"Decorating patterns with gold leaf and gold powder.",d:"A decorative technique in which adhesive is applied to dyed fabric and gold leaf or gold powder is pressed onto it. Gold is added to the outlines and petals of yūzen designs to make them shine, and there are many methods, such as surihaku (stenciled leaf) and sunago (sprinkled flakes).",o:"Furisode, tomesode, hōmongi, fukuro obi",w:"Kyoto (developed alongside Kyō-yūzen)",p:["The pattern seems to glow as it catches the light","Surihaku of the Momoyama period was also used on Noh costumes","Silver and platinum are sometimes used as well as gold"]},
 fr:{n:"Décor à la feuille d'or",tag:"Rehausser les motifs de feuille et de poudre d'or.",d:"Technique décorative où l'on pose un adhésif sur le tissu teint avant d'y appliquer de la feuille ou de la poudre d'or. L'or souligne les contours et les pétales des motifs yūzen pour les faire briller, et il existe de nombreuses méthodes, comme le surihaku (feuille au pochoir) ou le sunago (paillettes saupoudrées).",o:"Furisode, tomesode, hōmongi, fukuro obi",w:"Kyoto (développé avec le Kyō-yūzen)",p:["Le motif semble s'illuminer à la lumière","Le surihaku de l'époque Momoyama ornait aussi les costumes de nô","On utilise parfois l'argent ou le platine en plus de l'or"]},
 de:{n:"Blattgoldverzierung",tag:"Muster mit Blattgold und Goldpuder verzieren.",d:"Eine Verzierungstechnik, bei der Klebstoff auf gefärbten Stoff aufgetragen und Blattgold oder Goldpuder daraufgedrückt wird. Gold betont Umrisse und Blütenblätter von Yūzen-Mustern und bringt sie zum Glänzen; es gibt viele Methoden, etwa Surihaku (Blattgold per Schablone) und Sunago (gestreute Flocken).",o:"Furisode, Tomesode, Hōmongi, Fukuro-Obi",w:"Kyoto (zusammen mit Kyō-Yūzen entwickelt)",p:["Das Muster scheint im Licht aufzuleuchten","Surihaku der Momoyama-Zeit wurde auch für Nō-Kostüme verwendet","Neben Gold werden manchmal Silber und Platin verwendet"]},
 es:{n:"Decoración con pan de oro",tag:"Decorar los dibujos con pan de oro y polvo de oro.",d:"Técnica decorativa en la que se aplica un adhesivo sobre la tela teñida y se presiona encima pan de oro o polvo de oro. El oro realza los contornos y pétalos de los dibujos yūzen, y existen muchos métodos, como el surihaku (pan de oro con plantilla) y el sunago (escamas espolvoreadas).",o:"Furisode, tomesode, hōmongi, fukuro obi",w:"Kioto (desarrollado junto al Kyō-yūzen)",p:["El dibujo parece iluminarse al recibir la luz","El surihaku de la era Momoyama también se usaba en los trajes de teatro nō","Además de oro, a veces se usa plata o platino"]},
 zh:{n:"金箔金粉装饰技法",tag:"用金箔和金粉为图案增添华丽光彩的技法。",d:"在染好的布料上涂上黏合剂，再贴上金箔或撒上金粉来装饰图案的技法。常用于为友禅图案的轮廓和花瓣添金增辉，另有“摺箔”“砂子”等多种技法。",o:"振袖、留袖、访问着、袋带",w:"京都（与京友禅一同发展）",p:["在光线下图案仿佛浮现出来","桃山时代的“摺箔”也用于能剧服装","除金以外，有时也使用银或铂金"]},
 ko:{n:"금박·금가루로 장식하는 기법",tag:"금박이나 금가루로 무늬를 화려하게 장식하는 기법.",d:"염색을 마친 원단에 접착제를 바르고 그 위에 금박이나 금가루를 붙여 무늬를 장식하는 기법입니다. 유젠 무늬의 윤곽이나 꽃잎에 금을 더해 빛나게 하며, '스리하쿠', '스나고' 등 다양한 기법이 있습니다.",o:"후리소데, 도메소데, 호몬기, 후쿠로오비",w:"교토(교유젠과 함께 발전)",p:["빛을 받으면 무늬가 떠오르듯 빛남","모모야마 시대의 '스리하쿠'는 노(能) 의상에도 쓰임","금 외에 은이나 백금을 쓰기도 함"]}}},
{id:"t-kasuri",kanji:"絣",kana:"かすり",romaji:"Kasuri",kind:1,t:{
 ja:{n:"かすれた模様の織物",tag:"先に染め分けた糸で織り、かすれたような模様を出す織物です。",d:"糸の一部をくくって防染し、染め分けた糸を使って織ることで模様を表す技法です。織るときにわずかなずれが生じ、輪郭がかすれたように見えることから「絣」と呼ばれます。素朴で温かみのある風合いが魅力です。",o:"紬、木綿の着物、浴衣、作務衣などの作業着",w:"久留米絣（福岡）、伊予絣（愛媛）、備後絣（広島）／大島紬・結城紬にも使われる",p:["日本三大絣は久留米・伊予・備後","輪郭のかすれは手仕事の証","世界では「イカット」と呼ばれる同系統の技法がある"]},
 en:{n:"Ikat weaving",tag:"Weaving with threads dyed in sections to create soft, blurred patterns.",d:"Parts of the threads are bound to resist the dye, and the resulting sectioned threads are woven to form the pattern. Slight shifts during weaving make the edges look blurred or ‘scratchy’, which gives kasuri its name. It is loved for its rustic, warm texture.",o:"Tsumugi, cotton kimono, yukata, work clothes such as samue",w:"Kurume kasuri (Fukuoka), Iyo kasuri (Ehime), Bingo kasuri (Hiroshima); also used in Ōshima and Yūki tsumugi",p:["Japan's three great kasuri are Kurume, Iyo and Bingo","The blurred edges are proof of handwork","Related techniques are known worldwide as ikat"]},
 fr:{n:"Tissage ikat",tag:"Tisser avec des fils teints par sections pour créer des motifs doux et flous.",d:"Des parties des fils sont ligaturées pour résister à la teinture, puis ces fils teints par sections sont tissés pour former le motif. De légers décalages pendant le tissage rendent les contours flous, d'où le nom de kasuri (« éraflé »). On l'aime pour sa texture rustique et chaleureuse.",o:"Tsumugi, kimonos en coton, yukata, vêtements de travail comme le samue",w:"Kurume kasuri (Fukuoka), Iyo kasuri (Ehime), Bingo kasuri (Hiroshima) ; aussi utilisé dans l'Ōshima et le Yūki tsumugi",p:["Les trois grands kasuri du Japon sont Kurume, Iyo et Bingo","Les contours flous sont la preuve d'un travail manuel","Des techniques apparentées sont connues dans le monde sous le nom d'ikat"]},
 de:{n:"Ikat-Weberei",tag:"Weben mit abschnittsweise gefärbten Fäden für weiche, verschwommene Muster.",d:"Teile der Fäden werden abgebunden, damit sie keine Farbe annehmen; die so abschnittsweise gefärbten Fäden werden zum Muster verwebt. Leichte Verschiebungen beim Weben lassen die Ränder verschwommen wirken, daher der Name Kasuri („verwischt“). Geschätzt wird die rustikale, warme Ausstrahlung.",o:"Tsumugi, Baumwollkimonos, Yukata, Arbeitskleidung wie Samue",w:"Kurume-Kasuri (Fukuoka), Iyo-Kasuri (Ehime), Bingo-Kasuri (Hiroshima); auch in Ōshima- und Yūki-Tsumugi verwendet",p:["Japans drei große Kasuri sind Kurume, Iyo und Bingo","Die verschwommenen Ränder sind ein Zeichen von Handarbeit","Verwandte Techniken sind weltweit als Ikat bekannt"]},
 es:{n:"Tejido ikat",tag:"Tejer con hilos teñidos por tramos para crear dibujos suaves y difuminados.",d:"Se atan partes de los hilos para que no absorban el tinte, y esos hilos teñidos por tramos se tejen formando el dibujo. Los ligeros desplazamientos al tejer hacen que los bordes se vean difuminados, de ahí el nombre kasuri («rozado»). Se aprecia por su textura rústica y cálida.",o:"Tsumugi, kimonos de algodón, yukata, ropa de trabajo como el samue",w:"Kurume kasuri (Fukuoka), Iyo kasuri (Ehime), Bingo kasuri (Hiroshima); también se usa en el Ōshima y el Yūki tsumugi",p:["Los tres grandes kasuri de Japón son Kurume, Iyo y Bingo","Los bordes difuminados son prueba del trabajo manual","En el mundo se conocen técnicas afines con el nombre de ikat"]},
 zh:{n:"飞白纹织物",tag:"用分段染色的线织出朦胧飞白图案的织物。",d:"将线的局部扎紧防染，用分段染色的线织出图案的技法。织造时产生的细微错位使图案轮廓看起来像擦痕般朦胧，因此称为“絣”。以朴素温暖的质感著称。",o:"紬、棉质和服、浴衣、作务衣等劳作服",w:"久留米絣（福冈）、伊予絣（爱媛）、备后絣（广岛）；大岛紬、结城紬也运用此技法",p:["日本三大絣为久留米、伊予、备后","轮廓的朦胧感是手工的证明","世界各地有被称为“伊卡特（Ikat）”的同类技法"]},
 ko:{n:"번진 듯한 무늬의 직물",tag:"구간별로 염색한 실로 짜서 번진 듯한 무늬를 내는 직물.",d:"실의 일부를 묶어 방염하고, 구간별로 염색된 실로 짜서 무늬를 표현하는 기법입니다. 짤 때 생기는 미세한 어긋남으로 윤곽이 스친 듯 번져 보여 '가스리'라고 부릅니다. 소박하고 따뜻한 질감이 매력입니다.",o:"쓰무기, 면 기모노, 유카타, 사무에 등 작업복",w:"구루메가스리(후쿠오카), 이요가스리(에히메), 빈고가스리(히로시마), 오시마쓰무기·유키쓰무기에도 쓰임",p:["일본 3대 가스리는 구루메·이요·빈고","윤곽의 번짐은 수작업의 증거","세계적으로 '이카트'라 불리는 같은 계열의 기법이 있음"]}}},
{id:"t-tsumugi",kanji:"紬",kana:"つむぎ",romaji:"Tsumugi",kind:1,t:{
 ja:{n:"真綿の糸で織る絹織物",tag:"真綿から手で紡いだ糸で織る、素朴で丈夫な絹織物です。",d:"繭を煮て広げた「真綿」から手で糸を引き出して紡ぎ、その糸を先に染めてから織る絹織物です。糸に節があるため、表面に独特の凹凸と、光沢を抑えた落ち着いた風合いが生まれます。着物の種類としての紬は「着物」タブもご覧ください。",o:"紬の着物、羽織、名古屋帯、八寸帯",w:"大島紬（鹿児島）、結城紬（茨城・栃木）、牛首紬（石川）、塩沢紬（新潟）など",p:["結城紬は国の重要無形文化財で、ユネスコ無形文化遺産にも登録","大島紬は泥染めによる深い黒褐色が特徴","くず繭を有効に使うために生まれた織物とも言われる"]},
 en:{n:"Hand-spun silk weaving",tag:"A sturdy, rustic silk fabric woven from threads hand-spun from silk floss.",d:"Cocoons are boiled and stretched into silk floss (mawata); threads are drawn out and spun by hand, dyed, and then woven. Because the threads are slightly uneven, the fabric has a distinctive texture and a soft, matte look. For tsumugi as a type of kimono, see the Kimono tab.",o:"Tsumugi kimono, haori, Nagoya obi, hassun obi",w:"Ōshima tsumugi (Kagoshima), Yūki tsumugi (Ibaraki and Tochigi), Ushikubi tsumugi (Ishikawa), Shiozawa tsumugi (Niigata) and others",p:["Yūki tsumugi is an Important Intangible Cultural Property and on UNESCO's Intangible Cultural Heritage list","Ōshima tsumugi is known for the deep black-brown of its mud dyeing","It is said to have begun as a way to use imperfect cocoons"]},
 fr:{n:"Tissage de soie filée à la main",tag:"Une soie solide et rustique, tissée de fils filés à la main à partir de bourre de soie.",d:"Les cocons sont bouillis et étirés en bourre de soie (mawata), dont on tire et file des fils à la main ; ces fils sont teints puis tissés. Comme ils sont légèrement irréguliers, le tissu présente une texture particulière et un aspect mat et doux. Pour le tsumugi en tant que type de kimono, voir l'onglet Kimonos.",o:"Kimonos tsumugi, haori, Nagoya obi, hassun obi",w:"Ōshima tsumugi (Kagoshima), Yūki tsumugi (Ibaraki et Tochigi), Ushikubi tsumugi (Ishikawa), Shiozawa tsumugi (Niigata), etc.",p:["Le Yūki tsumugi est un bien culturel immatériel important et figure au patrimoine immatériel de l'UNESCO","L'Ōshima tsumugi est connu pour le noir-brun profond de sa teinture à la boue","Il serait né pour utiliser les cocons imparfaits"]},
 de:{n:"Handgesponnene Seidenweberei",tag:"Ein robuster, rustikaler Seidenstoff aus handgesponnenen Fäden aus Seidenwatte.",d:"Kokons werden gekocht und zu Seidenwatte (Mawata) ausgezogen; daraus werden von Hand Fäden gesponnen, gefärbt und dann verwebt. Da die Fäden leicht unregelmäßig sind, hat der Stoff eine charakteristische Struktur und einen weichen, matten Glanz. Zu Tsumugi als Kimonoart siehe den Reiter „Kimonos“.",o:"Tsumugi-Kimonos, Haori, Nagoya-Obi, Hassun-Obi",w:"Ōshima-Tsumugi (Kagoshima), Yūki-Tsumugi (Ibaraki und Tochigi), Ushikubi-Tsumugi (Ishikawa), Shiozawa-Tsumugi (Niigata) u. a.",p:["Yūki-Tsumugi ist wichtiges immaterielles Kulturgut und UNESCO-Kulturerbe","Ōshima-Tsumugi ist für das tiefe Schwarzbraun seiner Schlammfärbung bekannt","Er soll entstanden sein, um unvollkommene Kokons zu verwerten"]},
 es:{n:"Tejido de seda hilada a mano",tag:"Una seda resistente y rústica, tejida con hilos hilados a mano a partir de borra de seda.",d:"Los capullos se hierven y se estiran hasta formar borra de seda (mawata), de la que se sacan e hilan hilos a mano, que se tiñen y luego se tejen. Como los hilos son algo irregulares, la tela tiene una textura característica y un aspecto mate y suave. Para el tsumugi como tipo de kimono, vea la pestaña Kimonos.",o:"Kimonos tsumugi, haori, Nagoya obi, hassun obi",w:"Ōshima tsumugi (Kagoshima), Yūki tsumugi (Ibaraki y Tochigi), Ushikubi tsumugi (Ishikawa), Shiozawa tsumugi (Niigata), entre otros",p:["El Yūki tsumugi es Bien Cultural Inmaterial Importante y Patrimonio Inmaterial de la UNESCO","El Ōshima tsumugi es famoso por el negro pardo intenso de su teñido con barro","Se dice que nació para aprovechar los capullos imperfectos"]},
 zh:{n:"用丝绵纺线织成的丝织品",tag:"用丝绵手纺的线织成，朴素结实的丝织品。",d:"将蚕茧煮后摊开制成“丝绵”，用手从中抽丝纺线，先染色再织成的丝织品。由于线有粗细节点，布面形成独特的凹凸质感和低调的哑光风格。紬作为和服种类的介绍请看“和服”分类。",o:"紬和服、羽织、名古屋带、八寸带",w:"大岛紬（鹿儿岛）、结城紬（茨城·栃木）、牛首紬（石川）、盐泽紬（新潟）等",p:["结城紬是日本重要无形文化财，并列入联合国教科文组织非物质文化遗产","大岛紬以泥染形成的深黑褐色著称","据说起源于为了有效利用次等蚕茧"]},
 ko:{n:"풀솜 실로 짠 명주 직물",tag:"풀솜에서 손으로 자은 실로 짠 소박하고 튼튼한 명주 직물.",d:"누에고치를 삶아 펼친 '풀솜'에서 손으로 실을 뽑아 잣고, 그 실을 먼저 염색한 뒤 짜는 명주 직물입니다. 실에 마디가 있어 표면에 독특한 요철과 차분한 무광의 질감이 생깁니다. 기모노 종류로서의 쓰무기는 '기모노' 탭을 참고하세요.",o:"쓰무기 기모노, 하오리, 나고야오비, 핫스노비",w:"오시마쓰무기(가고시마), 유키쓰무기(이바라키·도치기), 우시쿠비쓰무기(이시카와), 시오자와쓰무기(니가타) 등",p:["유키쓰무기는 일본 중요 무형문화재이자 유네스코 무형문화유산","오시마쓰무기는 진흙 염색으로 낸 깊은 흑갈색이 특징","품질이 낮은 고치를 활용하기 위해 생겨났다고도 함"]}}},
{id:"t-chirimen",kanji:"縮緬",kana:"ちりめん",romaji:"Chirimen",kind:1,t:{
 ja:{n:"細かなしぼのある絹織物",tag:"表面に細かな凹凸（しぼ）がある、しなやかな絹織物です。",d:"強く撚りをかけた緯糸（よこいと）で織り、精練すると撚りが戻ろうとして、表面に細かな凹凸「しぼ」が生まれる絹織物です。染料がよくなじみ発色が美しいため、友禅などの染めの着物の生地として広く使われます。",o:"小紋、訪問着、色無地、付け下げ、帯揚げ、風呂敷",w:"丹後ちりめん（京都）、長浜ちりめん（滋賀）",p:["丹後ちりめんは国内の着物用白生地の大きな割合を占める","しぼの大きさで「一越」「古代」「鬼しぼ」などの種類がある","しわになりにくく、しっとりとした手触り"]},
 en:{n:"Silk crepe",tag:"A supple silk fabric with a fine crinkled surface called shibo.",d:"Woven with tightly twisted weft threads. When the fabric is scoured, the threads try to untwist, creating a fine crinkled texture (shibo) on the surface. Because dye takes to it beautifully and colors come out vivid, it is widely used as the base cloth for dyed kimono such as yūzen.",o:"Komon, hōmongi, iromuji, tsukesage, obi-age scarves, furoshiki",w:"Tango chirimen (Kyoto), Nagahama chirimen (Shiga)",p:["Tango chirimen makes up a large share of Japan's white kimono fabric","Types such as hitokoshi, kodai and oni-shibo differ in the size of the crinkle","Resists wrinkles and has a soft, smooth feel"]},
 fr:{n:"Crêpe de soie",tag:"Une soie souple à la surface finement crêpée, appelée shibo.",d:"Elle est tissée avec des fils de trame fortement retordus. Au dégommage, les fils cherchent à se détordre, créant un fin crêpage (shibo) en surface. Comme la teinture y prend magnifiquement et que les couleurs sont éclatantes, elle sert largement de base aux kimonos teints, comme le yūzen.",o:"Komon, hōmongi, iromuji, tsukesage, écharpes obi-age, furoshiki",w:"Tango chirimen (Kyoto), Nagahama chirimen (Shiga)",p:["Le Tango chirimen représente une grande part du tissu blanc pour kimono au Japon","Les types hitokoshi, kodai et oni-shibo diffèrent par la taille du crêpage","Se froisse peu et offre un toucher doux et soyeux"]},
 de:{n:"Seidenkrepp",tag:"Ein geschmeidiger Seidenstoff mit fein gekräuselter Oberfläche, genannt Shibo.",d:"Er wird mit stark gedrehten Schussfäden gewebt. Beim Entbasten wollen sich die Fäden zurückdrehen, wodurch eine feine Kräuselung (Shibo) an der Oberfläche entsteht. Da Farbe wunderbar aufgenommen wird und leuchtend erscheint, dient er häufig als Grundstoff für gefärbte Kimonos wie Yūzen.",o:"Komon, Hōmongi, Iromuji, Tsukesage, Obi-Age-Tücher, Furoshiki",w:"Tango-Chirimen (Kyoto), Nagahama-Chirimen (Shiga)",p:["Tango-Chirimen macht einen großen Teil des weißen Kimonostoffs in Japan aus","Sorten wie Hitokoshi, Kodai und Oni-Shibo unterscheiden sich in der Größe der Kräuselung","Knittert kaum und fühlt sich weich und geschmeidig an"]},
 es:{n:"Crepé de seda",tag:"Una seda flexible con una superficie finamente rizada llamada shibo.",d:"Se teje con hilos de trama muy retorcidos. Al desgomar la tela, los hilos tienden a destorcerse y crean un fino rizado (shibo) en la superficie. Como absorbe muy bien el tinte y los colores quedan vivos, se usa mucho como tela base para kimonos teñidos como el yūzen.",o:"Komon, hōmongi, iromuji, tsukesage, pañuelos obi-age, furoshiki",w:"Tango chirimen (Kioto), Nagahama chirimen (Shiga)",p:["El Tango chirimen representa gran parte de la tela blanca para kimono de Japón","Tipos como hitokoshi, kodai y oni-shibo varían según el tamaño del rizado","Apenas se arruga y tiene un tacto suave y sedoso"]},
 zh:{n:"绉绸",tag:"表面有细小褶皱、柔软垂顺的丝织品。",d:"用强捻的纬线织成，精练时纬线回捻收缩，使布面形成细小的凹凸褶皱（“皱”）。由于吸色好、发色美丽，被广泛用作友禅等染色和服的布料。",o:"小纹、访问着、色无地、付下、带扬、风吕敷（包袱布）",w:"丹后绉绸（京都）、长滨绉绸（滋贺）",p:["丹后绉绸在日本和服白坯布中占很大份额","按褶皱大小分为“一越”“古代”“鬼皱”等种类","不易起皱，手感柔滑"]},
 ko:{n:"비단 크레이프",tag:"표면에 잔잔한 요철(시보)이 있는 부드러운 비단 직물.",d:"강하게 꼰 씨실로 짠 뒤 정련하면 꼬임이 풀리려 하면서 표면에 잔잔한 요철 '시보'가 생기는 비단 직물입니다. 염료가 잘 스며들고 발색이 아름다워 유젠 등 염색 기모노의 원단으로 널리 쓰입니다.",o:"고몬, 호몬기, 이로무지, 쓰케사게, 오비아게, 후로시키",w:"단고지리멘(교토), 나가하마지리멘(시가)",p:["단고지리멘은 일본 기모노용 흰 원단의 큰 비중을 차지","시보의 크기에 따라 '히토코시', '고다이', '오니시보' 등이 있음","잘 구겨지지 않고 촉촉한 감촉"]}}}
];

/* technique illustration: a fabric swatch */
function techSVG(id){
  const u="t"+(uid++);
  let base="#EDE6D8", defs="", art="";
  if(id==="t-yuzen"){
    base="#DCE6F0";
    const fl=(x,y,s,c)=>`<g transform="translate(${x} ${y}) scale(${s})">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-11" rx="8" ry="11" fill="${c}" stroke="#FFFFFF" stroke-width="1.4" transform="rotate(${a})"/>`).join("")}<circle r="5" fill="#E7B84A" stroke="#FFFFFF" stroke-width="1.2"/></g>`;
    art=`<path d="M30 190 C60 140 90 160 110 110 S160 60 175 40" stroke="#5B4636" stroke-width="5" fill="none"/>
      <path d="M110 110 C125 120 140 118 150 132" stroke="#5B4636" stroke-width="3" fill="none"/>
      <ellipse cx="70" cy="150" rx="16" ry="7" fill="#6E9A63" stroke="#FFFFFF" stroke-width="1.4" transform="rotate(-30 70 150)"/>
      <ellipse cx="135" cy="85" rx="16" ry="7" fill="#6E9A63" stroke="#FFFFFF" stroke-width="1.4" transform="rotate(20 135 85)"/>
      ${fl(150,130,1,"#D9708A")}${fl(95,105,.8,"#F2B5C3")}${fl(60,70,.7,"#8E7BB8")}${fl(160,60,.6,"#F2B5C3")}${fl(48,175,.6,"#D9708A")}`;
  } else if(id==="t-ise"){
    base="#2F4D6E";
    defs=`<pattern id="${u}" width="12" height="12" patternUnits="userSpaceOnUse">${[0,1,2,3,4].map(i=>{const a=Math.PI*(i/4);return `<circle cx="${6+5*Math.cos(a)}" cy="${12-5*Math.sin(a)}" r="0.9" fill="#E9EEF4"/>`}).join("")}<circle cx="6" cy="10" r="0.9" fill="#E9EEF4"/></pattern>`;
    art=`<rect x="20" y="26" width="160" height="180" fill="url(#${u})"/>
      <g transform="translate(130 150)"><rect x="-30" y="-24" width="60" height="48" rx="4" fill="#C7A36A" opacity=".9"/><path d="M-22 -14h44M-22 0h44M-22 14h44" stroke="#8C6A35" stroke-dasharray="2 3"/></g>`;
  } else if(id==="t-shibori"){
    base="#4B3F7A";
    defs=`<pattern id="${u}" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="4.6" fill="#E9E4F4"/><circle cx="8" cy="8" r="1.8" fill="#4B3F7A"/></pattern>`;
    art=`<path d="M20 26 H180 V120 Q140 100 100 128 T20 110 Z" fill="url(#${u})"/>
      <path d="M20 150 Q60 130 100 156 T180 146" stroke="#E9E4F4" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" fill="none"/>`;
  } else if(id==="t-roketsu"){
    base="#B5652F";
    art=`<g fill="#F3E6CF"><path d="M60 180 C40 120 70 60 130 40 C150 90 130 160 60 180Z"/><path d="M120 196 C120 160 150 130 182 126 L182 196Z"/></g>
      <g stroke="#B5652F" stroke-width="1" fill="none" opacity=".8"><path d="M70 160 L90 120 L84 90 M90 120 L112 104 M95 70 L104 92 L124 80 M60 140 L78 132 M140 160 L152 146 L170 150"/></g>
      <path d="M60 180 C80 140 100 90 130 40" stroke="#8A4A1F" stroke-width="2" fill="none"/>`;
  } else if(id==="t-shishu"){
    base="#24324A";
    const petal=(a,c)=>`<g transform="rotate(${a} 100 116)">${Array.from({length:9},(_,i)=>`<path d="M100 116 L${92+i*2} ${70+Math.abs(i-4)*3}" stroke="${c}" stroke-width="2"/>`).join("")}</g>`;
    art=`${[0,60,120,180,240,300].map((a,i)=>petal(a,i%2?"#F0C9D4":"#F7E0E7")).join("")}
      <circle cx="100" cy="116" r="9" fill="#D9B24C"/>${Array.from({length:8},(_,i)=>`<circle cx="${100+13*Math.cos(i*Math.PI/4)}" cy="${116+13*Math.sin(i*Math.PI/4)}" r="2" fill="#E8C766"/>`).join("")}
      <path d="M40 190 Q70 170 100 180 T170 176" stroke="#D9B24C" stroke-width="3" fill="none"/>`;
  } else if(id==="t-kinsai"){
    base="#1E1E26";
    defs=`<linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6DE8D"/><stop offset=".5" stop-color="#C9A040"/><stop offset="1" stop-color="#F1D27A"/></linearGradient>`;
    art=`<path d="M20 70 Q70 40 120 70 T180 64 L180 92 Q130 70 80 98 T20 100Z" fill="url(#${u})"/>
      <g transform="translate(110 150)">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-16" rx="11" ry="16" fill="none" stroke="url(#${u})" stroke-width="2.5" transform="rotate(${a})"/>`).join("")}<circle r="5" fill="url(#${u})"/></g>
      ${Array.from({length:40},(_,i)=>`<rect x="${24+((i*37)%150)}" y="${110+((i*53)%90)}" width="${1.5+i%3}" height="${1.5+i%3}" fill="#E8C766" opacity="${.5+(i%5)/10}"/>`).join("")}`;
  } else if(id==="t-kasuri"){
    base="#1F3354";
    const cross=(x,y)=>`<g transform="translate(${x} ${y})" fill="#E9EEF4">${[[-12,-3,24,6],[-3,-12,6,24]].map(([a,b,w,h])=>`<rect x="${a}" y="${b}" width="${w}" height="${h}"/>`).join("")}${[-12,-6,0,6].map(o=>`<rect x="${o}" y="-3" width="3" height="${6}" fill="#1F3354" opacity=".35"/>`).join("")}</g>`;
    defs=`<filter id="${u}"><feTurbulence type="fractalNoise" baseFrequency="0.9 0.05" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>`;
    art=`<g filter="url(#${u})">${[[50,60],[100,60],[150,60],[75,110],[125,110],[50,160],[100,160],[150,160]].map(([x,y])=>cross(x,y)).join("")}</g>`;
  } else if(id==="t-tsumugi"){
    base="#5B4838";
    art=Array.from({length:44},(_,i)=>{const y=30+i*4,c=["#6F5A47","#4C3B2D","#7C6650"][i%3];return `<path d="M20 ${y} H180" stroke="${c}" stroke-width="2.4"/>`+((i*7)%5===0?`<path d="M${30+(i*29)%130} ${y} h${8+i%7}" stroke="#A48B6C" stroke-width="3.4" stroke-linecap="round"/>`:"")}).join("");
  } else if(id==="t-chirimen"){
    base="#C85A6A";
    defs=`<filter id="${u}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="7" result="n"/><feDiffuseLighting in="n" lighting-color="#FFFFFF" surfaceScale="1.6" result="l"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting><feBlend in="SourceGraphic" in2="l" mode="multiply"/></filter>`;
    art=`<rect x="20" y="26" width="160" height="180" rx="6" fill="#E07888" filter="url(#${u})"/>`;
  }
  return `<svg viewBox="0 0 200 232" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>${defs}<clipPath id="${u}c"><rect x="20" y="26" width="160" height="180" rx="6"/></clipPath></defs>
    <rect x="23" y="30" width="160" height="180" rx="6" fill="#00000022"/>
    <g clip-path="url(#${u}c)"><rect x="20" y="26" width="160" height="180" fill="${base}"/>${art}</g>
    <rect x="20" y="26" width="160" height="180" rx="6" fill="none" stroke="#00000030"/></svg>`;
}
draw=function(k){return k.cat==="t"?techSVG(k.id):k.cat==="o"?obiSVG(k.id):k.cat==="n"?knotSVG(k.id):kimonoSVG(k.id)};
