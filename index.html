<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kimono Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: header with language switch; left = kimono index, right = detail sheet; below = formality ladder */
:root{
  --bg:#F1F0F3; --surface:#FBFAFC; --sunk:#E6E4EB;
  --ink:#1D2133; --muted:#5D6175; --line:#D3D0DB;
  --accent:#9E2A3A; --ai:#2D4A7A; --gold:#A8833A;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif SC","Noto Serif KR",serif;
  --body:"Zen Kaku Gothic New","Noto Sans Thai","Noto Sans Devanagari","Noto Sans Tamil","Hiragino Sans","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei","PingFang HK","Microsoft JhengHei","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161E; --surface:#1C1F2B; --sunk:#252938;
  --ink:#ECEAF2; --muted:#A3A6B8; --line:#343849;
  --accent:#E07A88; --ai:#8EA9DA; --gold:#D3B06A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161E; --surface:#1C1F2B; --sunk:#252938;
  --ink:#ECEAF2; --muted:#A3A6B8; --line:#343849;
  --accent:#E07A88; --ai:#8EA9DA; --gold:#D3B06A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:28px 20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.seal{width:52px;height:52px;border-radius:6px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,32px);line-height:1.2;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px 4px;font-size:14px;min-height:44px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;gap:2px}
.langs .lr{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.langs button[aria-pressed="true"] .lr{color:inherit;opacity:.75}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.tabs{display:flex;gap:6px;padding-top:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;border-bottom:3px solid transparent;padding:6px 14px 8px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;flex:none;min-height:44px}
.tabs button:hover{background:var(--sunk);border-radius:8px 8px 0 0}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent)}
.tabs .tk{font-family:var(--display);font-weight:800;font-size:19px}
.tabs .tl{font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-top:24px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}

.index-label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:4px}
@media (max-width:820px){
  .list{flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;scroll-snap-type:x mandatory}
  .item{flex:0 0 132px;flex-direction:column;align-items:flex-start;scroll-snap-align:start}
  .item .thumb{width:100%;height:84px}
}
.item{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px}
.item:hover{background:var(--sunk)}
.item[aria-selected="true"]{background:var(--surface);border-color:var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.thumb{width:48px;height:52px;flex:none;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.item .k{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2;display:block}
.item .n{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.dots{display:inline-flex;gap:3px;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,32px);display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px}
@media (max-width:640px){.sheet{grid-template-columns:minmax(0,1fr)}}
.figure{background:var(--sunk);border-radius:10px;aspect-ratio:200/230;max-width:100%;display:grid;place-items:center;padding:12px}
.figure svg{width:100%;height:100%}
@media (max-width:640px){.figure{max-width:260px;margin:0 auto;width:100%}}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.kanji{font-family:var(--display);font-weight:800;font-size:clamp(44px,7vw,64px);line-height:1;letter-spacing:.04em}
.read{display:flex;flex-direction:column;line-height:1.3}
.read .romaji{font-weight:700;font-size:17px;letter-spacing:.04em}
.read .kana{color:var(--muted);font-size:13px}
.say{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;min-height:34px}
.say svg{width:14px;height:14px}
.lname{margin:14px 0 4px;color:var(--ai);font-weight:700;font-size:16px}
.tag{font-family:var(--display);font-size:clamp(18px,2.4vw,22px);font-weight:700;line-height:1.5;margin:0 0 16px;text-wrap:balance}
.meter{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 14px;background:var(--sunk);border-radius:8px;margin-bottom:18px}
.meter .lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:1 1 180px;min-width:160px}
.bar span{height:8px;border-radius:2px;background:var(--line)}
.bar span.on{background:var(--accent)}
.meter .val{font-weight:700;font-size:14px}
.desc{margin:0 0 20px;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:20px}
@media (max-width:520px){.facts{grid-template-columns:minmax(0,1fr)}}
.facts h3,.points h3{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts p{margin:0}
.points ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.points li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.points li::before{content:"";width:10px;height:10px;margin-top:8px;border:2px solid var(--gold);border-radius:50%}
.actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.listen{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.listen svg{width:16px;height:16px}
.listen[data-on="1"]{background:var(--accent);color:#fff}

.ladder{margin-top:36px}
.ladder h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.ladder > p{margin:0 0 14px;color:var(--muted);font-size:14px}
.lgrid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.lgrid{display:grid;grid-template-columns:minmax(150px,max-content) repeat(5,minmax(70px,1fr));min-width:600px;column-gap:0;row-gap:6px}
.lgrid .hd{font-size:12px;color:var(--muted);text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line);line-height:1.3}
.lgrid .hd b{display:block;font-size:13px;color:var(--ink)}
.lrow{display:contents}
.lrow button{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;padding:4px 12px 4px 0;white-space:nowrap}
.lrow button:focus-visible{outline:2px solid var(--accent)}
.lrow .rom{font-family:var(--body);font-weight:400;font-size:11px;color:var(--muted);margin-left:6px}
.span{align-self:center;height:14px;border-radius:7px;background:var(--ai);opacity:.85;margin:0 6px}
.span.sel{background:var(--accent);opacity:1}
.cell{border-left:1px dashed var(--line)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ai)}
.chip.sm{font-size:11px;padding:1px 8px;margin-top:4px}
.tgroups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tgroups{grid-template-columns:minmax(0,1fr)}}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tg h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tgl{display:flex;flex-direction:column;gap:2px}
.tgl button{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;font-family:var(--display);font-weight:700;font-size:17px}
.tgl button:hover{background:var(--sunk)}
.tgl button.sel{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent)}
.tgl .rom{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-left:8px}
html[lang="th"] .lab,html[lang="th"] h3,html[lang="th"] .index-label,html[lang="th"] .tg h3{letter-spacing:0}
:not(html)[lang="ar"]{direction:rtl;unicode-bidi:isolate}
p:not(html)[lang="ar"],h1[lang="ar"],h2[lang="ar"],h3[lang="ar"],div[lang="ar"]{text-align:start}
[lang="ar"]{font-family:"Noto Sans Arabic",var(--body)}
.tag:is([lang="ar"] *),.brand h1[lang="ar"],#ladTitle[lang="ar"]{font-family:"Noto Sans Arabic",var(--display);font-weight:700}
html[lang="ar"] .lab,html[lang="ar"] h3,html[lang="ar"] .index-label,html[lang="ar"] .tg h3{letter-spacing:0;text-transform:none}
footer{margin-top:28px;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:in .35s ease both}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="seal" aria-hidden="true">和</div>
      <div><h1 id="appTitle">Kimono Guide</h1><p id="appSub"></p></div>
    </div>
    <nav class="langs" id="langs" aria-label="Language"></nav>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Category"></nav>

  <main>
    <section aria-labelledby="idxLabel">
      <p class="index-label" id="idxLabel"></p>
      <div class="list" id="list" role="listbox"></div>
    </section>
    <article class="sheet" id="sheet" aria-live="polite"></article>
  </main>

  <section class="ladder">
    <h2 id="ladTitle"></h2>
    <p id="ladSub"></p>
    <div class="lgrid-wrap" id="lwrap"><div class="lgrid" id="lgrid"></div></div>
    <div class="tgroups" id="tgroups" hidden></div>
  </section>
  <footer id="foot"></footer>
</div>

 es:{n:"Kimono formal de mangas largas",tag:"El kimono más formal para mujeres solteras, con mangas largas y vistosas.",d:"Su nombre significa «mangas que se balancean» (furi = balancear, sode = manga). Es la prenda de gala de mayor rango para mujeres solteras, decorada con motivos llamativos que recorren toda la prenda.",o:"Día de la Mayoría de Edad, bodas (como invitada), graduaciones, Año Nuevo",w:"Mujeres solteras",p:["Mangas de unos 85–115 cm de largo","Se combina con lazos de obi elaborados y decorativos","Antiguamente se decía que agitar las mangas alejaba la mala suerte y atraía la buena"]},
 zh:{n:"长袖礼服和服",tag:"未婚女性最高规格的礼服，袖子长而华丽。",d:"因袖子长而能摆动，故称“振袖”。这是未婚女性最正式的礼服，整件衣服绘有连贯的华丽图案。",o:"成人礼、婚礼（作为宾客）、毕业典礼、新年",w:"未婚女性",p:["袖长约85–115厘米","搭配华丽繁复的腰带结","据说挥动长袖可以驱邪、招来良缘"]},
 ko:{n:"긴 소매 예복",tag:"미혼 여성의 가장 격식 높은 예복. 길고 화려한 소매가 특징입니다.",d:"소매가 길게 흔들린다고 해서 '후리소데'라고 부릅니다. 미혼 여성이 입는 최고 격식의 예복으로, 옷 전체에 화려한 무늬가 이어져 있습니다.",o:"성년의 날, 결혼식(하객), 졸업식, 설날",w:"미혼 여성",p:["소매 길이 약 85~115cm","화려하고 장식적인 오비 매듭과 함께 착용","소매를 흔들면 액운을 쫓고 좋은 인연을 부른다고 전해짐"]}}},
{id:"tomesode",kanji:"留袖",kana:"とめそで",romaji:"Tomesode",f:[5,5],t:{
 ja:{n:"既婚女性の第一礼装",tag:"既婚女性の第一礼装。模様は裾にだけ入ります。",d:"黒地の「黒留袖」は既婚女性の最も格の高い礼装です。上半身は無地で、裾にだけ縁起の良い模様が描かれ、背・両胸・両袖に五つの家紋が入ります。色地の「色留袖」は未婚の方も着られます。",o:"結婚式（新郎新婦の母・親族として）、格式の高い式典",w:"既婚の女性（黒留袖）",p:["五つ紋は最も格が高い証","模様は腰より下だけ","金銀の袋帯を合わせる"]},
 en:{n:"Formal kimono for married women",tag:"The most formal kimono for married women, patterned only below the waist.",d:"The black kuro-tomesode is the highest-ranking formal kimono for married women. The upper body is plain, auspicious designs appear only along the hem, and five family crests are placed on the back, chest and sleeves. A colored version, iro-tomesode, can also be worn by unmarried women.",o:"Weddings (worn by mothers and close relatives of the couple), formal ceremonies",w:"Married women (black version)",p:["Five family crests mark the highest formality","Pattern appears only below the waist","Worn with a gold or silver brocade obi"]},
 fr:{n:"Kimono de cérémonie des femmes mariées",tag:"Le kimono le plus formel des femmes mariées, décoré uniquement sous la taille.",d:"Le kuro-tomesode noir est la tenue de cérémonie la plus haute pour les femmes mariées. Le haut est uni, des motifs porte-bonheur ornent seulement le bas, et cinq blasons familiaux sont placés dans le dos, sur la poitrine et les manches. La version en couleur, iro-tomesode, peut aussi être portée par les femmes non mariées.",o:"Mariages (portée par les mères et proches des mariés), cérémonies officielles",w:"Femmes mariées (version noire)",p:["Cinq blasons familiaux indiquent le plus haut degré de formalité","Motifs uniquement sous la taille","Porté avec un obi en brocart or ou argent"]},
 de:{n:"Festkimono für verheiratete Frauen",tag:"Der formellste Kimono für verheiratete Frauen, nur unterhalb der Taille gemustert.",d:"Der schwarze Kuro-Tomesode ist das höchste Festgewand verheirateter Frauen. Der Oberkörper ist schlicht, glückverheißende Motive zieren nur den Saum, und fünf Familienwappen sitzen auf Rücken, Brust und Ärmeln. Die farbige Variante, Iro-Tomesode, dürfen auch unverheiratete Frauen tragen.",o:"Hochzeiten (getragen von Müttern und nahen Verwandten des Brautpaars), offizielle Zeremonien",w:"Verheiratete Frauen (schwarze Variante)",p:["Fünf Familienwappen zeigen die höchste Formalität","Muster nur unterhalb der Taille","Getragen mit einem Obi aus Gold- oder Silberbrokat"]},
 es:{n:"Kimono formal para mujeres casadas",tag:"El kimono más formal para mujeres casadas, con dibujos solo por debajo de la cintura.",d:"El kuro-tomesode negro es la prenda de gala de mayor rango para mujeres casadas. La parte superior es lisa, los motivos de buena suerte aparecen solo en el bajo, y lleva cinco blasones familiares en la espalda, el pecho y las mangas. La versión de color, iro-tomesode, también pueden usarla mujeres solteras.",o:"Bodas (lo visten las madres y familiares cercanos de los novios), ceremonias oficiales",w:"Mujeres casadas (versión negra)",p:["Cinco blasones familiares indican la máxima formalidad","Dibujos solo por debajo de la cintura","Se lleva con un obi de brocado dorado o plateado"]},
 zh:{n:"已婚女性礼服",tag:"已婚女性最高规格的礼服，图案只在腰部以下。",d:"黑色的“黑留袖”是已婚女性最正式的礼服。上半身为素色，只在下摆绘有吉祥图案，背部、胸前和两袖共有五个家纹。彩色的“色留袖”未婚女性也可穿着。",o:"婚礼（新郎新娘的母亲及亲属穿着）、正式典礼",w:"已婚女性（黑留袖）",p:["五个家纹代表最高规格","图案只在腰部以下","搭配金银色织锦腰带"]},
 ko:{n:"기혼 여성 예복",tag:"기혼 여성의 가장 격식 높은 예복. 무늬는 허리 아래에만 있습니다.",d:"검은 바탕의 '구로토메소데'는 기혼 여성의 최고 격식 예복입니다. 상반신은 무늬가 없고 밑단에만 길한 문양이 그려져 있으며, 등·가슴·양 소매에 다섯 개의 가문(家紋)이 들어갑니다. 색이 있는 '이로토메소데'는 미혼 여성도 입을 수 있습니다.",o:"결혼식(신랑·신부의 어머니와 친척), 격식 있는 의식",w:"기혼 여성(검은색)",p:["다섯 개의 가문은 최고 격식의 표시","무늬는 허리 아래에만","금·은색 비단 오비와 함께 착용"]}}},
{id:"homongi",kanji:"訪問着",kana:"ほうもんぎ",romaji:"Hōmongi",f:[4,4],t:{
 ja:{n:"未婚・既婚を問わない準礼装",tag:"未婚・既婚を問わない準礼装。模様が縫い目をまたいでつながります。",d:"未婚・既婚を問わず着られる華やかな準礼装です。縫い目をまたいで一枚の絵のようにつながる「絵羽模様」が特徴で、肩から袖、裾へと模様が流れます。",o:"結婚式・披露宴（ゲストとして）、パーティー、お茶会、入学式・卒業式",w:"女性（未婚・既婚どちらも）",p:["模様が縫い目でとぎれず一枚の絵になる","紋を入れると格が上がる","袋帯を合わせるのが一般的"]},
 en:{n:"Visiting kimono",tag:"A semi-formal kimono for any woman, with designs that flow across the seams.",d:"An elegant semi-formal kimono worn by both married and unmarried women. Its hallmark is eba-moyō: the pattern continues across the seams like a single painting, flowing from shoulder to sleeve to hem.",o:"Weddings and receptions (as a guest), parties, tea ceremonies, school ceremonies",w:"Women, married or unmarried",p:["The pattern crosses the seams without breaking","Adding a family crest raises its formality","Usually worn with a fukuro obi (formal brocade sash)"]},
 fr:{n:"Kimono de visite",tag:"Un kimono semi-formel pour toutes les femmes, aux motifs qui traversent les coutures.",d:"Un élégant kimono semi-formel porté par les femmes mariées comme non mariées. Sa particularité est l'eba-moyō : le motif se prolonge par-dessus les coutures comme un seul tableau, des épaules aux manches jusqu'au bas.",o:"Mariages et réceptions (en tant qu'invitée), soirées, cérémonies du thé, cérémonies scolaires",w:"Femmes, mariées ou non",p:["Le motif traverse les coutures sans interruption","Un blason familial augmente son degré de formalité","Généralement porté avec un fukuro obi (ceinture de brocart)"]},
 de:{n:"Besuchskimono",tag:"Ein halbformeller Kimono für alle Frauen, dessen Muster über die Nähte hinweg verläuft.",d:"Ein eleganter, halbformeller Kimono für verheiratete wie unverheiratete Frauen. Typisch ist das Eba-Moyō: Das Muster läuft wie ein einziges Gemälde über die Nähte hinweg, von der Schulter über den Ärmel bis zum Saum.",o:"Hochzeiten und Empfänge (als Gast), Feiern, Teezeremonien, Schulfeiern",w:"Frauen, verheiratet oder unverheiratet",p:["Das Muster läuft ohne Unterbrechung über die Nähte","Ein Familienwappen erhöht die Formalität","Meist mit einem Fukuro-Obi (Brokatgürtel) getragen"]},
 es:{n:"Kimono de visita",tag:"Un kimono semiformal para cualquier mujer, con dibujos que cruzan las costuras.",d:"Un elegante kimono semiformal que visten tanto mujeres casadas como solteras. Su sello es el eba-moyō: el dibujo continúa sobre las costuras como una sola pintura, del hombro a la manga y hasta el bajo.",o:"Bodas y banquetes (como invitada), fiestas, ceremonias del té, ceremonias escolares",w:"Mujeres, casadas o solteras",p:["El dibujo cruza las costuras sin interrumpirse","Un blasón familiar eleva su formalidad","Suele llevarse con un fukuro obi (faja de brocado)"]},
 zh:{n:"准礼服和服",tag:"不论已婚未婚皆可穿着的准礼服，图案跨越缝线相连。",d:"不论已婚或未婚女性都可穿着的华丽准礼服。其特色是“绘羽图案”：图案跨越缝线连成一幅完整的画，从肩部延伸到袖子和下摆。",o:"婚礼及喜宴（宾客）、派对、茶会、入学及毕业典礼",w:"女性（已婚未婚皆可）",p:["图案跨越缝线不间断","加上家纹可提高规格","一般搭配袋带（织锦腰带）"]},
 ko:{n:"방문복",tag:"기혼·미혼 모두 입는 준예복. 무늬가 솔기를 넘어 이어집니다.",d:"기혼·미혼 구분 없이 입을 수 있는 화려한 준예복입니다. 무늬가 솔기를 넘어 한 폭의 그림처럼 이어지는 '에바 무늬'가 특징으로, 어깨에서 소매, 밑단까지 흐르듯 이어집니다.",o:"결혼식·피로연(하객), 파티, 다도회, 입학식·졸업식",w:"여성(기혼·미혼 모두)",p:["무늬가 솔기에서 끊기지 않고 이어짐","가문을 넣으면 격식이 올라감","보통 후쿠로오비(비단 오비)와 함께 착용"]}}},
{id:"iromuji",kanji:"色無地",kana:"いろむじ",romaji:"Iromuji",f:[3,4],t:{
 ja:{n:"一色染めの無地の着物",tag:"黒以外の一色で染めた無地の着物。紋の有無で格が変わります。",d:"黒以外の一色で染められた、模様のない着物です。紋を入れると準礼装に、紋がなければ気軽なおしゃれ着にもなり、帯の合わせ方次第で幅広い場面に対応できます。",o:"お茶会、式典、お宮参り・七五三の付き添い、法事（落ち着いた色の場合）",w:"女性（未婚・既婚どちらも）",p:["地紋（織りで表した模様）が入ることもある","一つ紋で準礼装になる","落ち着いた色は弔事にも着られる"]},
 en:{n:"Single-color kimono",tag:"A plain kimono dyed in one color other than black. Crests set its formality.",d:"A kimono dyed in a single color other than black, with no painted pattern. With a family crest it becomes semi-formal wear; without one it can be worn more casually. Changing the obi lets it suit many different occasions.",o:"Tea ceremonies, formal events, accompanying children to shrine visits, memorial services (in subdued colors)",w:"Women, married or unmarried",p:["The fabric may have a subtle woven-in pattern","One family crest makes it semi-formal","Subdued colors can be worn to memorial services"]},
 fr:{n:"Kimono uni",tag:"Un kimono uni teint d'une seule couleur autre que le noir. Les blasons fixent sa formalité.",d:"Un kimono teint d'une seule couleur autre que le noir, sans motif peint. Avec un blason familial, il devient une tenue semi-formelle ; sans blason, il se porte plus simplement. Selon l'obi choisi, il convient à de nombreuses occasions.",o:"Cérémonies du thé, cérémonies, accompagnement d'enfants au sanctuaire, services commémoratifs (couleurs sobres)",w:"Femmes, mariées ou non",p:["Le tissu peut porter un motif tissé discret","Un seul blason le rend semi-formel","Les couleurs sobres conviennent aux cérémonies du souvenir"]},
 de:{n:"Einfarbiger Kimono",tag:"Ein schlichter Kimono in einer Farbe außer Schwarz. Wappen bestimmen die Formalität.",d:"Ein in einer einzigen Farbe außer Schwarz gefärbter Kimono ohne aufgemaltes Muster. Mit Familienwappen wird er zur halbformellen Kleidung, ohne Wappen lässt er sich auch zwangloser tragen. Je nach Obi passt er zu vielen Anlässen.",o:"Teezeremonien, Zeremonien, Begleitung von Kindern beim Schreinbesuch, Gedenkfeiern (in gedeckten Farben)",w:"Frauen, verheiratet oder unverheiratet",p:["Der Stoff kann ein dezentes eingewebtes Muster haben","Ein Wappen macht ihn halbformell","Gedeckte Farben eignen sich auch für Gedenkfeiern"]},
 es:{n:"Kimono de un solo color",tag:"Un kimono liso teñido de un color que no sea negro. Los blasones marcan su formalidad.",d:"Un kimono teñido de un solo color distinto del negro, sin dibujos pintados. Con un blasón familiar se convierte en traje semiformal; sin él, puede llevarse de forma más informal. Según el obi, se adapta a muchas ocasiones.",o:"Ceremonias del té, actos ceremoniales, acompañar a niños al santuario, servicios conmemorativos (en colores sobrios)",w:"Mujeres, casadas o solteras",p:["La tela puede tener un sutil dibujo tejido","Un blasón lo convierte en semiformal","Los colores sobrios sirven para servicios conmemorativos"]},
 zh:{n:"素色和服",tag:"以黑色以外的单一颜色染成的素色和服，家纹决定规格。",d:"用黑色以外的单一颜色染成、没有绘制图案的和服。加上家纹就是准礼服，不加家纹则可作为较轻松的服装。根据腰带的搭配，可适用于多种场合。",o:"茶会、典礼、陪同孩子参拜神社、法事（素雅颜色）",w:"女性（已婚未婚皆可）",p:["布料上可能有低调的织纹","一个家纹即为准礼服","素雅的颜色也可用于法事"]},
 ko:{n:"단색 기모노",tag:"검은색 이외의 한 가지 색으로 염색한 무지 기모노. 가문의 유무로 격식이 정해집니다.",d:"검은색 이외의 한 가지 색으로 염색하고 그림 무늬가 없는 기모노입니다. 가문을 넣으면 준예복이 되고, 가문이 없으면 가볍게 입을 수 있습니다. 오비 조합에 따라 다양한 자리에 어울립니다.",o:"다도회, 의식, 아이의 신사 참배 동행, 추도 법회(차분한 색)",w:"여성(기혼·미혼 모두)",p:["원단에 은은한 직조 무늬가 들어가기도 함","가문 하나로 준예복이 됨","차분한 색은 추도 행사에도 착용 가능"]}}},
{id:"komon",kanji:"小紋",kana:"こもん",romaji:"Komon",f:[2,2],t:{
 ja:{n:"繰り返し模様のおしゃれ着",tag:"全体に小さな模様が繰り返される、おしゃれ着の着物です。",d:"着物全体に同じ模様が繰り返し染められた、普段のおしゃれ着です。模様の向きが上下で揃っていないものも多く、気軽なお出かけや食事、観劇などにぴったりです。",o:"街歩き、食事会、観劇、習い事、カジュアルなお茶会",w:"女性（未婚・既婚どちらも）",p:["洋服でいえばワンピースのような感覚","江戸小紋のような細かい柄は格が上がることも","名古屋帯を合わせることが多い"]},
 en:{n:"Fine-pattern kimono",tag:"A stylish everyday kimono covered in a small repeating pattern.",d:"A kimono dyed all over with the same repeating pattern, worn as stylish everyday wear. The pattern often runs in more than one direction, and it is perfect for outings, meals, or an evening at the theater.",o:"Strolling the town, dinners with friends, theater, lessons, casual tea gatherings",w:"Women, married or unmarried",p:["Similar to a nice day dress in Western clothing","Very fine patterns such as Edo komon can be dressier","Often worn with a Nagoya obi"]},
 fr:{n:"Kimono à petits motifs",tag:"Un kimono élégant du quotidien, couvert d'un petit motif répété.",d:"Un kimono teint sur toute sa surface d'un même motif répété, porté comme tenue élégante de tous les jours. Le motif est souvent orienté dans plusieurs sens. Idéal pour sortir, dîner ou aller au théâtre.",o:"Promenades en ville, dîners, théâtre, cours, cérémonies du thé informelles",w:"Femmes, mariées ou non",p:["Comparable à une jolie robe de ville","Les motifs très fins comme l'Edo komon peuvent être plus habillés","Souvent porté avec un Nagoya obi"]},
 de:{n:"Kimono mit kleinem Muster",tag:"Ein schicker Alltagskimono mit einem kleinen, sich wiederholenden Muster.",d:"Ein Kimono, der vollständig mit demselben sich wiederholenden Muster gefärbt ist und als schicke Alltagskleidung dient. Das Muster verläuft oft in mehrere Richtungen. Ideal für Ausflüge, Essen oder einen Theaterabend.",o:"Stadtbummel, Essen mit Freunden, Theater, Unterricht, zwanglose Teetreffen",w:"Frauen, verheiratet oder unverheiratet",p:["Vergleichbar mit einem eleganten Tageskleid","Sehr feine Muster wie Edo-Komon wirken festlicher","Oft mit einem Nagoya-Obi getragen"]},
 es:{n:"Kimono de estampado menudo",tag:"Un kimono elegante para el día a día, cubierto de un pequeño dibujo repetido.",d:"Un kimono teñido por completo con el mismo dibujo repetido, que se usa como ropa elegante del día a día. El dibujo suele ir en varias direcciones. Perfecto para salir, comer fuera o ir al teatro.",o:"Pasear por la ciudad, comidas, teatro, clases, reuniones de té informales",w:"Mujeres, casadas o solteras",p:["Equivale a un bonito vestido de día","Los dibujos muy finos, como el Edo komon, pueden ser más formales","Suele llevarse con un Nagoya obi"]},
 zh:{n:"满版小花纹和服",tag:"全身重复印染小图案的时尚日常和服。",d:"整件和服重复染有相同图案，是日常的时尚服装。图案方向往往不分上下，非常适合外出、聚餐或看戏。",o:"逛街、聚餐、看戏、学习才艺、轻松的茶会",w:"女性（已婚未婚皆可）",p:["相当于西式服装中的连衣裙","江户小纹等极细图案规格较高","多搭配名古屋带"]},
 ko:{n:"잔무늬 기모노",tag:"작은 무늬가 전체에 반복되는 멋스러운 평상복 기모노.",d:"기모노 전체에 같은 무늬가 반복해서 염색된 멋스러운 외출복입니다. 무늬의 위아래 방향이 정해지지 않은 것이 많으며, 나들이나 식사, 공연 관람에 잘 어울립니다.",o:"시내 나들이, 식사 모임, 공연 관람, 취미 수업, 가벼운 다도회",w:"여성(기혼·미혼 모두)",p:["양장의 원피스와 같은 감각","에도고몬처럼 아주 잔 무늬는 격식이 높아지기도 함","나고야오비와 함께 입는 경우가 많음"]}}},
{id:"tsumugi",kanji:"紬",kana:"つむぎ",romaji:"Tsumugi",f:[1,1],t:{
 ja:{n:"先染めの糸で織る普段着",tag:"先に染めた糸で織る、素朴で丈夫な普段着です。",d:"真綿から紡いだ糸を先に染めてから織る「織りの着物」です。素朴な風合いと丈夫さが魅力で、もとは農家の普段着でした。大島紬や結城紬のように、高価な伝統工芸品も多くあります。",o:"普段のお出かけ、旅行、カジュアルな集まり",w:"男女どちらも",p:["どんなに高価でも礼装には着ない","着るほど柔らかく体になじむ","大島紬・結城紬などは国の伝統的工芸品"]},
 en:{n:"Woven silk kimono",tag:"A sturdy, rustic everyday kimono woven from pre-dyed threads.",d:"A woven kimono: threads spun from silk floss are dyed first and then woven. Loved for its earthy texture and durability, it was originally everyday wear for farming families. Famous types such as Ōshima and Yūki tsumugi are prized traditional crafts.",o:"Everyday outings, travel, casual gatherings",w:"Men and women",p:["Never worn as formal wear, however expensive","Softens and fits the body better the more it is worn","Ōshima and Yūki tsumugi are officially recognized traditional crafts"]},
 fr:{n:"Kimono en soie tissée",tag:"Un kimono du quotidien, rustique et solide, tissé de fils teints à l'avance.",d:"Un kimono tissé : les fils, filés à partir de bourre de soie, sont d'abord teints puis tissés. Apprécié pour sa texture naturelle et sa solidité, c'était à l'origine le vêtement quotidien des familles paysannes. Les célèbres Ōshima et Yūki tsumugi sont des pièces d'artisanat traditionnel très recherchées.",o:"Sorties quotidiennes, voyages, réunions informelles",w:"Hommes et femmes",p:["Jamais porté en tenue de cérémonie, même s'il est coûteux","S'assouplit et épouse le corps au fil du temps","Ōshima et Yūki tsumugi sont des artisanats traditionnels reconnus"]},
 de:{n:"Gewebter Seidenkimono",tag:"Ein robuster, rustikaler Alltagskimono aus vorgefärbten Fäden.",d:"Ein gewebter Kimono: Die aus Seidenwatte gesponnenen Fäden werden zuerst gefärbt und dann verwebt. Geschätzt für seine natürliche Textur und Haltbarkeit, war er ursprünglich die Alltagskleidung von Bauernfamilien. Berühmte Sorten wie Ōshima- und Yūki-Tsumugi gelten als wertvolles traditionelles Kunsthandwerk.",o:"Alltägliche Ausflüge, Reisen, zwanglose Treffen",w:"Männer und Frauen",p:["Wird nie als Festkleidung getragen, auch wenn er teuer ist","Wird mit jedem Tragen weicher und anschmiegsamer","Ōshima- und Yūki-Tsumugi sind anerkanntes traditionelles Kunsthandwerk"]},
 es:{n:"Kimono de seda tejida",tag:"Un kimono cotidiano, rústico y resistente, tejido con hilos teñidos previamente.",d:"Un kimono tejido: los hilos, hilados a partir de borra de seda, se tiñen primero y luego se tejen. Apreciado por su textura natural y su resistencia, era originalmente la ropa diaria de las familias campesinas. Variedades famosas como el Ōshima y el Yūki tsumugi son valiosas artesanías tradicionales.",o:"Salidas cotidianas, viajes, reuniones informales",w:"Hombres y mujeres",p:["Nunca se usa como traje de gala, por caro que sea","Se suaviza y se adapta al cuerpo con el uso","El Ōshima y el Yūki tsumugi son artesanías tradicionales reconocidas"]},
 zh:{n:"先染织造丝绸和服",tag:"用先染色的丝线织成，朴素结实的日常和服。",d:"将丝绵纺成的线先染色再织造的“织物和服”。以朴素的质感和耐穿著称，原本是农家的日常服装。大岛紬、结城紬等是名贵的传统工艺品。",o:"日常外出、旅行、轻松的聚会",w:"男女皆可",p:["即使价格昂贵也不作为礼服穿着","越穿越柔软贴身","大岛紬、结城紬为日本国家认定的传统工艺品"]},
 ko:{n:"명주 직물 기모노",tag:"먼저 염색한 실로 짠 소박하고 튼튼한 평상복.",d:"풀솜에서 자은 실을 먼저 염색한 뒤 짜는 '직물 기모노'입니다. 소박한 질감과 튼튼함이 매력이며, 원래는 농가의 평상복이었습니다. 오시마쓰무기, 유키쓰무기 등은 귀한 전통 공예품입니다.",o:"일상 외출, 여행, 가벼운 모임",w:"남녀 모두",p:["아무리 비싸도 예복으로는 입지 않음","입을수록 부드러워지고 몸에 잘 맞음","오시마쓰무기·유키쓰무기는 일본의 전통 공예품"]}}},
{id:"yukata",kanji:"浴衣",kana:"ゆかた",romaji:"Yukata",f:[1,1],t:{
 ja:{n:"夏の木綿のカジュアル着物",tag:"木綿で仕立てた、夏の気軽な着物です。",d:"木綿などで作られた、裏地のない一重の着物です。入浴後に着た「湯帷子（ゆかたびら）」が始まりで、今では夏祭りや花火大会の定番の装いです。長襦袢を着ずに素肌の上に直接着て、素足に下駄を合わせます。",o:"夏祭り、花火大会、盆踊り、温泉旅館での館内着",w:"男女どちらも（子どもも）",p:["必ず左の衿を上に重ねる（右前）。逆は亡くなった方の装い","旅館の浴衣は館内着として気軽に着られる","半幅帯や兵児帯で、ひとりでも簡単に着られる"]},
 en:{n:"Summer cotton kimono",tag:"A light, casual cotton kimono for summer.",d:"An unlined kimono usually made of cotton. It began as a robe worn after bathing, and today it is the classic outfit for summer festivals and fireworks displays. It is worn directly over the skin without an under-kimono, with wooden geta sandals and bare feet.",o:"Summer festivals, fireworks displays, Bon dances, loungewear at hot-spring inns",w:"Men, women and children",p:["Always wrap the left side over the right. Right over left is only for the deceased","At a ryokan (Japanese inn), the yukata provided can be worn throughout the building","Tied with a narrow hanhaba obi or a soft heko obi, so it is easy to put on yourself"]},
 fr:{n:"Kimono d'été en coton",tag:"Un kimono d'été léger et décontracté, en coton.",d:"Un kimono sans doublure, généralement en coton. À l'origine, c'était un vêtement porté après le bain ; aujourd'hui, c'est la tenue classique des fêtes d'été et des feux d'artifice. Il se porte directement sur la peau, sans sous-kimono, avec des sandales en bois (geta) et les pieds nus.",o:"Fêtes d'été, feux d'artifice, danses de Bon, tenue d'intérieur dans les auberges thermales",w:"Hommes, femmes et enfants",p:["Croisez toujours le pan gauche sur le droit. L'inverse est réservé aux défunts","Dans un ryokan (auberge japonaise), le yukata fourni se porte dans tout l'établissement","Noué avec un obi étroit (hanhaba) ou souple (heko), facile à mettre seul"]},
 de:{n:"Sommerkimono aus Baumwolle",tag:"Ein leichter, zwangloser Baumwollkimono für den Sommer.",d:"Ein ungefütterter Kimono, meist aus Baumwolle. Ursprünglich wurde er nach dem Baden getragen, heute ist er das klassische Outfit für Sommerfeste und Feuerwerke. Er wird ohne Unterkimono direkt auf der Haut getragen, dazu Holzsandalen (Geta) und nackte Füße.",o:"Sommerfeste, Feuerwerke, Bon-Tänze, Hauskleidung in Onsen-Gasthäusern",w:"Männer, Frauen und Kinder",p:["Immer die linke Seite über die rechte legen. Rechts über links gilt nur für Verstorbene","Im Ryokan (japanisches Gasthaus) darf der bereitgestellte Yukata im ganzen Haus getragen werden","Gebunden mit einem schmalen Hanhaba-Obi oder weichen Heko-Obi, leicht selbst anzulegen"]},
 es:{n:"Kimono de verano de algodón",tag:"Un kimono de algodón, ligero e informal, para el verano.",d:"Un kimono sin forro, normalmente de algodón. Nació como una bata para después del baño y hoy es el atuendo clásico de los festivales de verano y los fuegos artificiales. Se lleva directamente sobre la piel, sin kimono interior, con sandalias de madera (geta) y los pies descalzos.",o:"Festivales de verano, fuegos artificiales, bailes de Bon, ropa de estar en posadas de aguas termales",w:"Hombres, mujeres y niños",p:["Cruce siempre el lado izquierdo sobre el derecho. Al revés solo se viste a los difuntos","En un ryokan (posada japonesa), el yukata que se ofrece puede usarse por todo el edificio","Se ata con un obi estrecho (hanhaba) o suave (heko), fácil de poner uno mismo"]},
 zh:{n:"夏季棉质和服",tag:"用棉布制作、适合夏天的轻便和服。",d:"通常用棉布制成、没有里衬的单层和服。起源于沐浴后穿的浴袍，如今是夏日祭典和烟花大会的经典装扮。不穿长衬衣，直接贴身穿着，赤脚搭配木屐。",o:"夏日祭典、烟花大会、盂兰盆舞、温泉旅馆的馆内服",w:"男女老少皆可",p:["务必左襟压在右襟上面，反过来是给逝者穿的方式","在日式旅馆，提供的浴衣可以穿着在馆内走动","系半幅带或兵儿带，自己也能轻松穿好"]},
 ko:{n:"여름 면 기모노",tag:"면으로 만든 가볍고 편안한 여름 기모노.",d:"주로 면으로 만든 안감 없는 홑겹 기모노입니다. 목욕 후에 입던 옷에서 시작되었으며, 지금은 여름 축제와 불꽃놀이의 대표적인 차림입니다. 속옷 기모노 없이 맨살 위에 바로 입고, 맨발에 나막신(게타)을 신습니다.",o:"여름 축제, 불꽃놀이, 본오도리(여름 춤 축제), 온천 료칸의 실내복",w:"남녀노소 모두",p:["반드시 왼쪽 깃을 오른쪽 위로 여밈. 반대는 고인에게 입히는 방식","료칸(일본 여관)에서 제공하는 유카타는 시설 안에서 입고 다녀도 됨","폭이 좁은 한하바오비나 부드러운 헤코오비로 혼자서도 쉽게 입을 수 있음"]}}},
{id:"haori",kanji:"羽織",kana:"はおり",romaji:"Haori",f:[1,5],t:{
 ja:{n:"着物の上に着る上着",tag:"着物の上に羽織る、丈の短い上着です。",d:"着物の上に羽織り、前を紐で留める上着です。女性の羽織は防寒やおしゃれのためのカジュアルなもの。男性は黒の紋付羽織に袴を合わせると第一礼装（紋付羽織袴）になります。",o:"女性：普段のお出かけ・防寒／男性：結婚式・式典（紋付羽織袴）",w:"男女どちらも",p:["前を「羽織紐」で留める","室内でも脱がなくてよいとされる","裏地（羽裏）に凝った柄を忍ばせる粋な文化がある"]},
 en:{n:"Kimono jacket",tag:"A short jacket worn over the kimono.",d:"A jacket worn over the kimono and fastened at the front with a cord. For women it is casual wear for warmth and style. For men, a black haori with family crests, worn with hakama, makes the most formal attire (montsuki haori hakama).",o:"Women: everyday outings, warmth / Men: weddings and ceremonies (with crests and hakama)",w:"Men and women",p:["Fastened at the front with a haori-himo cord","Traditionally it may be kept on indoors","Linings often hide bold, playful designs as a subtle form of style"]},
 fr:{n:"Veste de kimono",tag:"Une veste courte portée par-dessus le kimono.",d:"Une veste portée sur le kimono et fermée devant par un cordon. Pour les femmes, c'est un vêtement décontracté, pour se tenir chaud et pour l'élégance. Pour les hommes, un haori noir à blasons porté avec un hakama constitue la tenue la plus formelle (montsuki haori hakama).",o:"Femmes : sorties quotidiennes, se tenir chaud / Hommes : mariages et cérémonies (avec blasons et hakama)",w:"Hommes et femmes",p:["Fermée devant par un cordon, le haori-himo","Traditionnellement, on peut la garder à l'intérieur","La doublure cache souvent des motifs audacieux, une élégance discrète"]},
 de:{n:"Kimonojacke",tag:"Eine kurze Jacke, die über dem Kimono getragen wird.",d:"Eine Jacke, die über dem Kimono getragen und vorne mit einer Kordel geschlossen wird. Bei Frauen ist sie zwanglose Kleidung für Wärme und Stil. Bei Männern ergibt ein schwarzer Haori mit Familienwappen zusammen mit dem Hakama die formellste Kleidung (Montsuki Haori Hakama).",o:"Frauen: alltägliche Ausflüge, Wärme / Männer: Hochzeiten und Zeremonien (mit Wappen und Hakama)",w:"Männer und Frauen",p:["Vorne mit der Haori-Himo-Kordel geschlossen","Darf traditionell auch drinnen anbehalten werden","Das Futter verbirgt oft kühne, verspielte Motive als dezente Eleganz"]},
 es:{n:"Chaqueta de kimono",tag:"Una chaqueta corta que se lleva sobre el kimono.",d:"Una chaqueta que se lleva sobre el kimono y se cierra por delante con un cordón. Para las mujeres es una prenda informal, para abrigarse y lucir. Para los hombres, un haori negro con blasones junto con el hakama forma el atuendo más formal (montsuki haori hakama).",o:"Mujeres: salidas cotidianas, abrigo / Hombres: bodas y ceremonias (con blasones y hakama)",w:"Hombres y mujeres",p:["Se cierra por delante con un cordón llamado haori-himo","Tradicionalmente puede llevarse puesta en interiores","El forro suele esconder dibujos atrevidos, una elegancia discreta"]},
 zh:{n:"和服外套",tag:"穿在和服外面的短外套。",d:"穿在和服外面、前襟用绳带系住的外套。女性的羽织是用于保暖和时尚的休闲服装。男性穿黑色带家纹的羽织并搭配袴，就是最正式的礼服（纹付羽织袴）。",o:"女性：日常外出、保暖／男性：婚礼、典礼（纹付羽织袴）",w:"男女皆可",p:["前襟用“羽织纽”系住","传统上在室内也可以不脱","里衬常藏有大胆有趣的图案，是低调的讲究"]},
 ko:{n:"기모노 겉옷",tag:"기모노 위에 걸쳐 입는 짧은 겉옷.",d:"기모노 위에 입고 앞을 끈으로 여미는 겉옷입니다. 여성의 하오리는 보온과 멋을 위한 캐주얼 의상입니다. 남성은 가문이 들어간 검은 하오리에 하카마를 갖추면 최고 격식의 예복(몬쓰키 하오리 하카마)이 됩니다.",o:"여성: 일상 외출·보온 / 남성: 결혼식·의식(몬쓰키 하오리 하카마)",w:"남녀 모두",p:["앞을 '하오리히모' 끈으로 여밈","전통적으로 실내에서 벗지 않아도 됨","안감에 대담한 무늬를 넣어 은근한 멋을 즐김"]}}},
{id:"hakama",kanji:"袴",kana:"はかま",romaji:"Hakama",f:[2,5],t:{
 ja:{n:"着物の上にはく、ひだのある衣服",tag:"着物の上から腰にはく、ひだのある衣服です。",d:"着物の上からはく、プリーツ（ひだ）の入ったズボンやスカートのような衣服です。男性は紋付羽織と合わせて第一礼装に、女性は卒業式の装いとして人気です。弓道・剣道・合気道などの武道でも着用されます。",o:"卒業式、結婚式（新郎）、成人式（男性）、武道、神社の神職・巫女",w:"男女どちらも",p:["男性用は前に5本、後ろに2本のひだがある","7本のひだは人が守るべき七つの徳を表すと言われる","ズボン型の「馬乗袴」とスカート型の「行灯袴」がある"]},
 en:{n:"Pleated trousers or skirt",tag:"A pleated garment worn over the kimono from the waist down.",d:"A pleated garment worn over the kimono, shaped like wide trousers or a skirt. Men wear it with a crested haori as formal attire, and it is a popular outfit for women at graduation. It is also worn in martial arts such as kyudo, kendo and aikido.",o:"Graduations, weddings (groom), Coming-of-Age Day (men), martial arts, shrine priests and shrine maidens",w:"Men and women",p:["Men's hakama have five pleats in front and two in back","The seven pleats are said to represent seven virtues","Two styles: divided umanori (trousers) and andon (skirt)"]},
 fr:{n:"Pantalon-jupe plissé",tag:"Un vêtement plissé porté sur le kimono, à partir de la taille.",d:"Un vêtement plissé porté sur le kimono, en forme de pantalon large ou de jupe. Les hommes le portent avec un haori à blasons comme tenue de cérémonie, et c'est une tenue très prisée des femmes lors de la remise des diplômes. On le porte aussi dans les arts martiaux comme le kyūdō, le kendō et l'aïkido.",o:"Remises de diplômes, mariages (le marié), Fête de la majorité (hommes), arts martiaux, prêtres et prêtresses de sanctuaire",w:"Hommes et femmes",p:["Le hakama masculin a cinq plis devant et deux derrière","Les sept plis représenteraient sept vertus","Deux styles : umanori (pantalon) et andon (jupe)"]},
 de:{n:"Plissierter Hosenrock",tag:"Ein plissiertes Gewand, das über dem Kimono ab der Taille getragen wird.",d:"Ein plissiertes Gewand, das über dem Kimono getragen wird und einer weiten Hose oder einem Rock ähnelt. Männer tragen es mit einem Wappen-Haori als Festkleidung, bei Frauen ist es ein beliebtes Outfit zur Abschlussfeier. Auch in Kampfkünsten wie Kyudo, Kendo und Aikido wird es getragen.",o:"Abschlussfeiern, Hochzeiten (Bräutigam), Tag der Volljährigkeit (Männer), Kampfkünste, Shintō-Priester und Schreinmädchen",w:"Männer und Frauen",p:["Herren-Hakama haben vorne fünf und hinten zwei Falten","Die sieben Falten sollen sieben Tugenden darstellen","Zwei Formen: Umanori (Hose) und Andon (Rock)"]},
 es:{n:"Falda-pantalón plisada",tag:"Una prenda plisada que se lleva sobre el kimono de la cintura hacia abajo.",d:"Una prenda plisada que se lleva sobre el kimono, con forma de pantalón ancho o de falda. Los hombres la usan con un haori con blasones como traje de gala, y es un atuendo muy popular entre las mujeres en las graduaciones. También se usa en artes marciales como el kyudo, el kendo y el aikido.",o:"Graduaciones, bodas (el novio), Día de la Mayoría de Edad (hombres), artes marciales, sacerdotes y doncellas de santuario",w:"Hombres y mujeres",p:["El hakama masculino tiene cinco pliegues delante y dos detrás","Se dice que los siete pliegues representan siete virtudes","Dos estilos: umanori (pantalón) y andon (falda)"]},
 zh:{n:"褶裙裤",tag:"穿在和服外、从腰部往下的带褶衣物。",d:"穿在和服外面、带有褶裥的衣物，形状像宽腿裤或裙子。男性搭配纹付羽织作为最正式的礼服，女性则常在毕业典礼上穿着。弓道、剑道、合气道等武道也会穿着。",o:"毕业典礼、婚礼（新郎）、成人礼（男性）、武道、神社神职人员及巫女",w:"男女皆可",p:["男式袴前面五道褶、后面两道褶","七道褶据说代表七种美德","分为裤型“马乘袴”和裙型“行灯袴”"]},

let uid=0;
function kimonoSVG(id){
  const u="p"+(uid++);
  const S={
    furisode:{base:"#B5324A",obi:"#D9B24C",sb:192},
    tomesode:{base:"#1B1B1F",obi:"#D2B15C",sb:112},
    homongi:{base:"#C9D3E6",obi:"#C9C6CF",sb:112},
    iromuji:{base:"#8C79A6",obi:"#DCCBA6",sb:112},
    komon:{base:"#2E4C6B",obi:"#C9A05A",sb:112},
    tsumugi:{base:"#5B4838",obi:"#9A7B57",sb:112},
    yukata:{base:"#F3F5FA",obi:"#D9A23B",sb:112},

  } else if(id==="tomesode"){
    defs=`<pattern id="${u}f" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${S.base}"/></pattern>`;

      <path d="M58 184 Q80 168 100 180 T142 176 L142 228 L58 228Z" fill="#2D6E7E"/>
      <path d="M58 196 Q82 184 104 196 T142 192 L142 228 L58 228Z" fill="#D2B15C" opacity=".9"/>

      ${crest(84,52)}${crest(116,52)}${crest(30,62)}${crest(170,62)}`;
  } else if(id==="homongi"){
    defs=`<pattern id="${u}f" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="${S.base}"/></pattern>`;
    extra=`<g clip-path="url(#${u}c)" fill="none">
      <path d="M14 60 C50 70 70 120 96 150 S130 205 150 226" stroke="#6B4E3D" stroke-width="3"/>
      <path d="M60 110 C80 108 92 96 100 84" stroke="#6B4E3D" stroke-width="2"/>
      <path d="M120 180 C134 172 150 172 186 150" stroke="#6B4E3D" stroke-width="2"/></g>
      <g clip-path="url(#${u}c)">
      ${[[22,64],[40,72],[100,84],[94,150],[112,176],[132,206],[150,168],[176,154],[70,120]].map(([x,y],i)=>`<g transform="translate(${x} ${y}) scale(${i%2?.45:.6})">${flower(i%3?"#F3C6CF":"#FFFFFF","#C9A35A")}</g>`).join("")}</g>`;
  } else if(id==="iromuji"){
    defs=`<pattern id="${u}f" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="${S.base}"/><path d="M0 6 Q3 3 6 6 T12 6" stroke="#FFFFFF" stroke-opacity=".12" fill="none"/></pattern>`;
  } else if(id==="komon"){
    defs=`<pattern id="${u}f" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="${S.base}"/><circle cx="3.5" cy="3.5" r="1.6" fill="#E9D9B4"/><circle cx="10.5" cy="10.5" r="1.6" fill="#E9D9B4"/><path d="M8 3 l2 1.5 -2 1.5" stroke="#9FB8D6" fill="none" stroke-width="1"/></pattern>`;
  } else if(id==="tsumugi"){
    defs=`<pattern id="${u}f" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="${S.base}"/><path d="M0 4h16M0 12h16" stroke="#7A6450" stroke-width="2"/><path d="M5 0v16" stroke="#4A3A2C" stroke-width="2"/><path d="M10 6h4M2 14h3" stroke="#D8C7A8" stroke-width="1.5"/></pattern>`;
  } else if(id==="yukata"){
    defs=`<pattern id="${u}f" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="${S.base}"/>

      <circle cx="30" cy="8" r="1.4" fill="#5C7FB8"/></pattern>`;
  } else if(id==="haori"){
    defs=`<pattern id="${u}f" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#C9B79A"/><path d="M0 12L12 0" stroke="#A8936F" stroke-width="1.5"/></pattern>`;
  } else if(id==="hakama"){
    defs=`<pattern id="${u}f" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="${S.base}"/><g transform="translate(10 10) scale(.4)">${flower("#E6A8B5","#C9A35A")}</g></pattern>`;
  }
  const sb=S.sb;
  const body=`M60 28 L140 28 L144 226 L56 226 Z`;
  const sleeves=`M60 30 L14 40 Q8 41 8 48 L8 ${sb-6} Q8 ${sb} 14 ${sb} L60 ${sb} Z M140 30 L186 40 Q192 41 192 48 L192 ${sb-6} Q192 ${sb} 186 ${sb} L140 ${sb} Z`;
  let svg=`<svg viewBox="0 0 200 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><defs>${defs}<clipPath id="${u}c"><path d="${body} ${sleeves}"/></clipPath></defs>`;
  if(id==="hakama"){
    svg+=`<path d="${sleeves}" fill="${fill}" stroke="#00000033"/><path d="M60 28 L140 28 L140 110 L60 110Z" fill="${fill}" stroke="#00000033"/>
      ${collar("#FFFFFF")}
      <path d="M58 104 L142 104 L162 226 L38 226 Z" fill="#5A2A4E" stroke="#00000033"/>
      <path d="M58 104 L142 104 L142 112 L58 112Z" fill="#B5324A"/>
      ${[0,1,2,3,4].map(i=>{const x=72+i*14;return `<path d="M${x} 112 L${x-12+i*6} 226" stroke="#3E1C36" stroke-width="2"/>`}).join("")}
      <path d="M100 112 L100 226" stroke="#3E1C36" stroke-width="1" stroke-dasharray="3 3"/></svg>`;
    return svg;
  }
  svg+=`<path d="${sleeves}" fill="${fill}" stroke="#00000033"/><path d="${body}" fill="${fill}" stroke="#00000033"/>${extra}`;
  // front overlap line + collar
  svg+=`<path d="M95 66 L72 226" stroke="#00000040" stroke-width="1.2" fill="none"/>${collar(id==="tomesode"?"#FFFFFF":"#F5F1E8")}`;
  if(id==="haori"){
    // inner kimono visible at hem, haori outer shorter and open
    svg=`<svg viewBox="0 0 200 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><defs>${defs}</defs>
      <path d="M62 120 L138 120 L142 226 L58 226Z" fill="url(#${u}f)" stroke="#00000033"/>
      <path d="M86 28 L114 28 L116 120 L84 120Z" fill="url(#${u}f)"/>
      <path d="M90 100 L110 100 L110 120 L90 120Z" fill="${S.obi}"/>
      <path d="M60 30 L14 40 Q8 41 8 48 L8 122 Q8 128 14 128 L60 128 Z M140 30 L186 40 Q192 41 192 48 L192 122 Q192 128 186 128 L140 128 Z" fill="#2F2A33" stroke="#00000033"/>
      <path d="M60 28 L92 28 L92 164 L56 164 Z M108 28 L140 28 L144 164 L108 164Z" fill="#2F2A33" stroke="#00000033"/>
      <path d="M92 28 L88 164 M108 28 L112 164" stroke="#5A5262" stroke-width="5"/>
      <path d="M93 94 Q100 104 107 94" stroke="#F0E6CF" stroke-width="2.5" fill="none"/><circle cx="100" cy="101" r="3" fill="#F0E6CF"/>
      <path d="M86 26 L100 44" stroke="#F5F1E8" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M114 26 L97 50" stroke="#00000035" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M114 26 L97 50" stroke="#F5F1E8" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
    return svg;
  }
  if(id==="yukata"){svg+=`<path d="M57 100 L143 100 L143.4 118 L56.6 118 Z" fill="${S.obi}" stroke="#00000033"/><path d="M92 118 L84 146 L100 140 L116 146 L108 118Z" fill="${S.obi}" stroke="#00000033"/></svg>`;return svg;}
  svg+=`<path d="M57 96 L143 96 L143.6 124 L56.4 124 Z" fill="${S.obi}" stroke="#00000033"/>
    <path d="M57 108 L143 108" stroke="#00000022"/><path d="M57 113 L143 113" stroke="${id==='furisode'?'#B5324A':'#00000033'}" stroke-width="2"/>`;
  if(id==="furisode") svg+=`<path d="M70 124 Q60 150 72 160 M130 124 Q140 150 128 160" stroke="#D9B24C" stroke-width="5" fill="none" opacity=".9"/>`;
  return svg+`</svg>`;
}
function flower(petal,center){return `<g>${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-6" rx="4" ry="6" fill="${petal}" transform="rotate(${a})"/>`).join("")}<circle r="2.8" fill="${center}"/></g>`}
function crest(x,y){return `<g transform="translate(${x} ${y})"><circle r="5" fill="#FFFFFF"/><circle r="3.6" fill="none" stroke="#1B1B1F" stroke-width=".8"/><path d="M0 -3 L0 3 M-3 0 L3 0" stroke="#1B1B1F" stroke-width=".8"/></g>`}
function collar(c){return `<path d="M84 26 L100 56" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M116 26 L94 68" stroke="#00000035" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M116 26 L94 68" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>`}
