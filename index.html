統工藝品"]}, "yukata": {"n": "夏季棉質和服", "tag": "用棉布製作、適合夏天的輕便和服。", "d": "通常用棉布製成、沒有裏襯的單層和服。起源於沐浴後穿的浴袍，如今是夏日祭典和煙花大會的經典裝扮。不穿長襯衣，直接貼身穿着，赤腳搭配木屐。", "o": "夏日祭典、煙花大會、盂蘭盆舞、温泉旅館的館內服", "w": "男女老少皆可", "p": ["務必左襟壓在右襟上面，反過來是給逝者穿的方式", "在日式旅館，提供的浴衣可以穿着在館內走動", "系半幅帶或兵兒帶，自己也能輕鬆穿好"]}, "haori": {"n": "和服外套", "tag": "穿在和服外面的短外套。", "d": "穿在和服外面、前襟用繩帶繫住的外套。女性的羽織是用於保暖和時尚的休閒服裝。男性穿黑色帶家紋的羽織並搭配袴，就是最正式的禮服（紋付羽織袴）。", "o": "女性：日常外出、保暖／男性：婚禮、典禮（紋付羽織袴）", "w": "男女皆可", "p": ["前襟用「羽織紐」繫住", "傳統上在室內也可以不脱", "裏襯常藏有大膽有趣的圖案，是低調的講究"]}, "hakama": {"n": "褶裙褲", "tag": "穿在和服外、從腰部往下的帶褶衣物。", "d": "穿在和服外面、帶有褶襉的衣物，形狀像寬腿褲或裙子。男性搭配紋付羽織作為最正式的禮服，女性則常在畢業典禮上穿着。弓道、劍道、合氣道等武道也會穿着。", "o": "畢業典禮、婚禮（新郎）、成人禮（男性）、武道、神社神職人員及巫女", "w": "男女皆可", "p": ["男式袴前面五道褶、後面兩道褶", "七道褶據說代表七種美德", "分為褲型「馬乘袴」和裙型「行燈袴」"]}, "o-maru": {"n": "最高規格的禮服腰帶", "tag": "用寬幅布料對摺製成、規格最高的腰帶。", "d": "將約68厘米寬的織物對摺縫製而成，正反兩面都有圖案。華麗而厚重，直到20世紀初都是禮服腰帶的主流。如今主要用於新娘禮服和京都舞妓的「垂帶」。", "o": "新娘和服、振袖、舞妓裝扮", "w": "垂帶結、文庫結、福良雀等", "p": ["腰帶中規格最高", "兩面都有圖案，無論怎麼系都能展現花紋", "又長又重，系法需要熟練技巧"]}, "o-fukuro": {"n": "禮服與準禮服用腰帶", "tag": "從禮服到準禮服都能使用的高規格腰帶。", "d": "正反面織成袋狀（或縫合而成）的腰帶，只有正面有圖案。比丸帶輕便好用，是現今禮服腰帶的主流。長約4.3米以上，寬約31厘米。", "o": "留袖、振袖、訪問着、帶家紋的色無地", "w": "二重太鼓、福良雀、立矢等", "p": ["二重太鼓寓意「喜上加喜」，適合喜慶場合", "金銀圖案用於禮服，時尚袋帶用於休閒", "長度足夠，可以系出華麗的花式結"]}, "o-nagoya": {"n": "日常到外出都能用的腰帶", "tag": "為簡化太鼓結而發明的實用腰帶。", "d": "大正時代（1912–1926）在名古屋發明的腰帶。形成太鼓的部分為正常寬度，纏在腰部的部分預先對摺縫好。比袋帶短且輕，一個人也容易繫好。", "o": "小紋、紬、色無地、休閒款訪問着", "w": "一重太鼓（太鼓結）、角出", "p": ["系成一重太鼓，因此不用於喜慶禮服", "染制的名古屋帶較休閒，織制的可用於稍正式場合", "長約3.6米"]}, "o-hanhaba": {"n": "浴衣和日常和服用的窄腰帶", "tag": "寬度約為普通腰帶一半的休閒腰帶。", "d": "寬約15–17厘米，大約是普通腰帶的一半。輕便易系，搭配浴衣以及小紋、紬等日常和服。系法種類繁多，可以系成蝴蝶結等各種造型，自由搭配。", "o": "浴衣、小紋、紬、棉或羊毛和服", "w": "文庫結、貝之口、矢字結等", "p": ["不需要帶枕等配件，一個人也能輕鬆繫好", "很多是雙面的，系法可以同時展現兩面顏色", "背部比太鼓結平坦，坐車時也舒適"]}, "o-heko": {"n": "柔軟的布腰帶", "tag": "沒有襯芯、用柔軟布料製成的腰帶。", "d": "直接用柔軟布料做成的腰帶，沒有襯芯。原本是男性和兒童的日常腰帶，如今因其蓬鬆可愛的造型，也很受女性搭配浴衣的歡迎。像系蝴蝶結一樣簡單。", "o": "浴衣、兒童和服、男性日常服裝", "w": "蝴蝶結等", "p": ["名稱來自鹿兒島被稱為「兵兒」的年輕男子所繫的腰帶", "幾乎不勒身體，非常舒適", "兒童七五三和夏日祭典的經典搭配"]}, "o-kaku": {"n": "男性腰帶", "tag": "男性系的窄而挺括的腰帶。", "d": "寬約9–10厘米、長約4米的硬挺男用腰帶。從日常服裝到紋付羽織袴禮服，男性和服基本都搭配這種腰帶。博多織的「獻上紋樣」是最具代表性的設計。", "o": "所有男性和服（從浴衣、紬到紋付羽織袴）", "w": "貝之口、浪人結、一文字等", "p": ["系在胯骨位置，前低後高", "博多獻上因江戶時代進獻給幕府而得名", "禮服搭配素雅、近似素色的角帶"]}, "n-otaiko": {"n": "最常見的太鼓結", "tag": "在背後形成方形「太鼓」的最常見系法。", "d": "在背後形成飽滿箱形的系法，是成年女性最常見的腰帶結。據說始於江戶時代後期，深川的藝伎為慶祝龜户天神太鼓橋落成而系出此結。", "o": "訪問着、色無地、小紋、紬、留袖等多種和服", "w": "名古屋帶（一重太鼓）、袋帶（二重太鼓）", "p": ["袋帶的二重太鼓寓意「喜上加喜」，用於喜慶場合", "喪事用一重太鼓，寓意「不幸不再重複」", "使用帶枕、帶揚、帶締來固定造型"]}, "n-tsunodashi": {"n": "別緻的角出結", "tag": "腰帶兩端像角一樣從扁平太鼓兩側露出的別緻系法。", "d": "腰帶兩端像角一樣從扁平太鼓的左右兩側探出。這是源自江戶時代的古老系法，常系得較低，有時不用帶枕，給人清爽、低調而有品位的印象。", "o": "小紋、紬等日常及時尚和服", "w": "名古屋帶、半幅帶、休閒袋帶", "p": ["可以不用帶枕，背部較輕鬆", "散發成熟女性的「粹」（都市風雅）", "銀座結被視為角出的一種"]}, "n-fukura": {"n": "振袖專用的福良雀結", "tag": "模仿麻雀蓬起羽毛禦寒的姿態，振袖的代表性系法。", "d": "模仿冬天麻雀蓬起羽毛的樣子，左右展開雙翼的華麗系法。也寫作「福良雀」，被視為招福的吉祥造型，是振袖腰帶結的經典。", "o": "振袖（成人禮、婚禮、畢業典禮等）", "w": "較長的袋帶", "p": ["名稱諧音「福氣變好」，十分吉利", "搭配未婚女性的禮服振袖", "翅膀的大小和角度會改變整體印象"]}, "n-bunko": {"n": "經典蝴蝶結造型", "tag": "形似蝴蝶結、歷史悠久的經典系法。", "d": "左右展開雙翼、中央垂下帶尾的蝴蝶結造型。據說起源於江戶時代武士家族女性的系法。用半幅帶系是浴衣的經典造型，用袋帶系則成為適合振袖的華麗結。", "o": "浴衣、小紋、振袖（用袋帶系時）", "w": "半幅帶、袋帶、丸帶", "p": ["浴衣最受歡迎的系法", "據說源自江戶時代武家女性的系法", "根據腰帶種類，可休閒也可正式"]}, "n-darari": {"n": "舞妓的垂帶結", "tag": "將長長的腰帶垂到腳踝附近，京都舞妓的系法。", "d": "使用長5米以上的「垂帶」，兩端長長地垂到接近腳踝。這是京都舞妓（見習藝伎）的標誌性裝扮，腰帶末端印有所屬置屋（藝伎館）的家紋。據說起源於江戶時代城市年輕女子的流行裝扮。", "o": "舞妓裝扮、新娘和服（引振袖）", "w": "丸帶（垂帶）", "p": ["只有舞妓系此結，成為藝伎後改系太鼓結", "垂下的帶尾上印有置屋的家紋", "遊客多在京都祇園或舞妓體驗館見到"]}, "n-kai": {"n": "男性腰帶結的經典", "tag": "男性角帶最基本的系法。", "d": "因結形似張開的貝殼口而得名，是男性角帶最具代表性的系法。結小而扁平、不易鬆開，從日常服裝到紋付羽織袴禮服都適用。女性也會用半幅帶系這種結。", "o": "所有男性和服；女性浴衣及日常和服（半幅帶）", "w": "角帶、半幅帶", "p": ["結的位置稍微偏離背部中心", "扁平，靠在椅背上也不礙事", "學會後約一分鐘就能繫好"]}, "n-ronin": {"n": "隨性的浪人結", "tag": "結後讓帶端從結上垂下、風格隨性的男性系法。", "d": "繫好後讓腰帶一端從結上斜斜垂下的男性系法。據說因古裝劇中沒有主君的浪人常系此結而得名，給人輕鬆隨性的印象。", "o": "男性浴衣及日常和服", "w": "角帶、兵兒帶", "p": ["簡單，很快就能繫好", "較正式的場合宜選擇貝之口", "可享受古裝劇般的隨性風格"]}, "t-yuzen": {"n": "如繪畫般的染色技法", "tag": "像用畫筆作畫一樣，用多種顏色染出圖案的技法。", "d": "據說由江戶時代京都的扇面畫師宮崎友禪齋推廣的染色技法。先用以米為原料的防染糊勾出圖案輪廓，防止顏色滲開，再用毛筆在輪廓內上色。可以像繪畫一樣表現花卉和風景。", "o": "振袖、留袖、訪問着、付下", "w": "京友禪（京都）、加賀友禪（石川）、東京友禪（東京）", "p": ["特徵是防染糊留下的細白輪廓線", "加賀友禪偏好寫實花草甚至「蟲蛀」的葉子，京友禪常加金彩和刺繡", "一件和服可能需要數月才能完成"]}, "t-ise": {"n": "用型紙染細密圖案的技法", "tag": "用手工雕刻的和紙型紙，精確染出細密圖案的技法。", "d": "將用柿漆粘合多層和紙並雕刻圖案製成的「伊勢型紙」鋪在布上，在上面刮上防染糊，染色時圖案部分便會留白。型紙自古在三重縣鈴鹿市白子、寺家一帶製作，造就了江戶小紋等極其細密的花紋。", "o": "江戶小紋、小紋、浴衣", "w": "型紙：三重縣鈴鹿市（白子、寺家）／染色：東京、京都等地", "p": ["有些花紋細到遠看像素色", "伊勢型紙是日本國家認定的傳統工藝品", "型紙雕刻技術被指定為重要無形文化財"]}, "t-shibori": {"n": "扎染技法", "tag": "先用線紮緊布料再染色，形成柔軟立體花紋的技法。", "d": "將布料局部用線紮緊、縫縮或摺疊，使染料無法滲入，從而染出圖案。扎過的地方會留下顆粒狀的凹凸，帶來獨特的立體感和柔軟質地。", "o": "振袖、訪問着、羽織、帶揚、浴衣", "w": "京鹿子絞（京都）、有松·鳴海絞（愛知）", "p": ["佈滿小顆粒的「鹿子絞」因形似小鹿背上的斑點而得名", "全身扎染的振袖需手工扎數十萬顆，屬最高級品", "有松·鳴海絞是江戶時代東海道上深受旅人喜愛的特產"]}, "t-roketsu": {"n": "用蠟防染的蠟染技法", "tag": "用熔化的蠟描繪圖案進行防染的技法。", "d": "用毛筆等工具把熔化的蠟塗在布上，使染料無法滲入該處，再進行染色。此技法於奈良時代傳入日本，正倉院中仍保存着當時的作品。染料滲入蠟的裂縫而形成的細小冰裂紋，別有韻味。", "o": "訪問着、付下、名古屋帶、時尚袋帶", "w": "以京都為首的日本各地工藝家", "p": ["蠟裂開形成的「冰裂紋」是其魅力所在", "奈良時代「三纈」之一", "與印度尼西亞的巴迪克蠟染原理相同"]}, "t-shishu": {"n": "刺繡", "tag": "用絲線和金銀線繡出立體圖案的技法。", "d": "用針以絲線、金線、銀線繡出圖案的裝飾技法。常在染好的圖案上加繡，增添華麗感和立體感。日本刺繡有數十種針法，以京都的「京繡」最具代表性。", "o": "振袖、留袖、訪問着、半衿、袋帶、打褂", "w": "京繡（京都）、加賀繡（石川）、江戶刺繡（東京）", "p": ["手工劈分和捻合絲線，表現光澤和色彩濃淡", "染色與刺繡結合，更顯豐富", "刺繡越多，越顯華麗莊重"]}, "t-kinsai": {"n": "金箔金粉裝飾技法", "tag": "用金箔和金粉為圖案增添華麗光彩的技法。", "d": "在染好的布料上塗上黏合劑，再貼上金箔或撒上金粉來裝飾圖案的技法。常用於為友禪圖案的輪廓和花瓣添金增輝，另有「摺箔」「砂子」等多種技法。", "o": "振袖、留袖、訪問着、袋帶", "w": "京都（與京友禪一同發展）", "p": ["在光線下圖案彷彿浮現出來", "桃山時代的「摺箔」也用於能劇服裝", "除金以外，有時也使用銀或鉑金"]}, "t-kasuri": {"n": "飛白紋織物", "tag": "用分段染色的線織出朦朧飛白圖案的織物。", "d": "將線的局部紮緊防染，用分段染色的線織出圖案的技法。織造時產生的細微錯位使圖案輪廓看起來像擦痕般朦朧，因此稱為「絣」。以樸素温暖的質感著稱。", "o": "紬、棉質和服、浴衣、作務衣等勞作服", "w": "久留米絣（福岡）、伊予絣（愛媛）、備後絣（廣島）；大島紬、結城紬也運用此技法", "p": ["日本三大絣為久留米、伊予、備後", "輪廓的朦朧感是手工的證明", "世界各地有被稱為「伊卡特（Ikat）」的同類技法"]}, "t-tsumugi": {"n": "用絲綿紡線織成的絲織品", "tag": "用絲綿手紡的線織成，樸素結實的絲織品。", "d": "將蠶繭煮後攤開製成「絲綿」，用手從中抽絲紡線，先染色再織成的絲織品。由於線有粗細節點，布面形成獨特的凹凸質感和低調的啞光風格。紬作為和服種類的介紹請看「和服」分類。", "o": "紬和服、羽織、名古屋帶、八寸帶", "w": "大島紬（鹿兒島）、結城紬（茨城·栃木）、牛首紬（石川）、鹽澤紬（新潟）等", "p": ["結城紬是日本重要無形文化財，並列入聯合國教科文組織非物質文化遺產", "大島紬以泥染形成的深黑褐色著稱", "o": "Lễ Trưởng thành, đám cưới (với tư cách người thân hoặc bạn bè chưa kết hôn), lễ tốt nghiệp, Tết Nguyên đán", "w": "Phụ nữ chưa kết hôn", "p": ["Tay áo dài khoảng 85–115 cm", "Phối với các kiểu thắt obi cầu kỳ, lộng lẫy như fukura suzume", "Người xưa cho rằng vẫy tay áo dài giúp xua đuổi vận xui và mang lại nhân duyên tốt"]}, "tomesode": {"n": "Lễ phục của phụ nữ đã kết hôn", "tag": "Lễ phục trang trọng nhất của phụ nữ đã kết hôn, chỉ có họa tiết ở phần vạt dưới.", "d": "Kuro-tomesode nền đen là lễ phục trang trọng nhất của phụ nữ đã kết hôn. Phần thân trên để trơn, các họa tiết cát tường chỉ xuất hiện ở vạt áo, và năm gia huy được đặt ở lưng, hai bên ngực và hai tay áo. Phiên bản có màu, iro-tomesode, cũng có thể được phụ nữ chưa kết hôn mặc.", "o": "Đám cưới (do mẹ và người thân của cô dâu chú rể mặc), các nghi lễ trang trọng", "w": "Phụ nữ đã kết hôn (loại nền đen)", "p": ["Năm gia huy là dấu hiệu của mức trang trọng cao nhất", "Họa tiết chỉ có từ thắt lưng trở xuống", "Phối với fukuro obi thêu kim tuyến vàng bạc"]}, "homongi": {"n": "Kimono đi thăm viếng", "tag": "Lễ phục bán trang trọng cho mọi phụ nữ, với họa tiết liền mạch qua các đường may.", "d": "Một bộ lễ phục bán trang trọng thanh lịch, cả phụ nữ đã kết hôn lẫn chưa kết hôn đều có thể mặc. Đặc trưng của nó là eba-moyō: họa tiết nối liền qua các đường may như một bức tranh duy nhất, chảy từ vai xuống tay áo rồi đến vạt áo.", "o": "Đám cưới và tiệc cưới (với tư cách khách mời), tiệc, trà đạo, lễ khai giảng và lễ tốt nghiệp", "w": "Phụ nữ, đã kết hôn hay chưa đều được", "p": ["Họa tiết không bị đứt đoạn tại các đường may, tạo thành một bức tranh liền mạch", "Thêm gia huy sẽ nâng mức độ trang trọng", "Thường phối với fukuro obi"]}, "iromuji": {"n": "Kimono trơn một màu", "tag": "Kimono trơn nhuộm một màu (không phải màu đen). Gia huy quyết định mức độ trang trọng.", "d": "Kimono được nhuộm một màu duy nhất khác màu đen, không có họa tiết. Có gia huy thì thành lễ phục bán trang trọng; không có gia huy thì có thể mặc như trang phục dạo phố thanh lịch. Tùy cách phối obi, nó phù hợp với rất nhiều dịp khác nhau.", "o": "Trà đạo, các buổi lễ, đi cùng con trẻ đến đền (lễ Omiyamairi, Shichi-Go-San), lễ giỗ (với màu trầm)", "w": "Phụ nữ, đã kết hôn hay chưa đều được", "p": ["Vải có thể có hoa văn chìm được dệt sẵn (jimon)", "Một gia huy là đủ để thành lễ phục bán trang trọng", "Màu trầm có thể mặc trong các dịp tang lễ, giỗ chạp"]}, "komon": {"n": "Kimono họa tiết lặp lại", "tag": "Kimono dạo phố thanh lịch phủ kín họa tiết nhỏ lặp lại.", "d": "Kimono được nhuộm cùng một họa tiết lặp lại trên toàn bộ thân áo, dùng làm trang phục dạo phố thanh lịch hằng ngày. Họa tiết thường không theo một chiều trên dưới cố định, rất hợp để đi chơi, dùng bữa hay xem kịch.", "o": "Dạo phố, ăn uống cùng bạn bè, xem kịch, đi học năng khiếu, tiệc trà thân mật", "w": "Phụ nữ, đã kết hôn hay chưa đều được", "p": ["Tương tự một chiếc váy liền đẹp trong trang phục phương Tây", "Họa tiết rất nhỏ như Edo komon có thể trang trọng hơn", "Thường phối với Nagoya obi"]}, "tsumugi": {"n": "Kimono lụa dệt", "tag": "Kimono thường ngày mộc mạc, bền chắc, dệt từ sợi đã nhuộm sẵn.", "d": "Một loại kimono dệt: sợi kéo từ kén tơ được nhuộm trước rồi mới dệt. Được yêu thích nhờ chất vải mộc mạc và độ bền, ban đầu đây là trang phục thường ngày của các gia đình nông dân. Những loại nổi tiếng như Ōshima tsumugi và Yūki tsumugi là sản phẩm thủ công truyền thống quý giá.", "o": "Đi chơi thường ngày, du lịch, gặp gỡ thân mật", "w": "Cả nam và nữ", "p": ["Dù đắt đến đâu cũng không bao giờ được mặc làm lễ phục", "Càng mặc càng mềm và ôm vừa cơ thể", "Ōshima tsumugi và Yūki tsumugi được Nhà nước công nhận là sản phẩm thủ công truyền thống"]}, "yukata": {"n": "Kimono cotton mùa hè", "tag": "Kimono cotton nhẹ nhàng, thoải mái cho mùa hè.", "d": "Kimono một lớp không lót, thường làm bằng cotton. Khởi nguồn là áo choàng mặc sau khi tắm (yukatabira), ngày nay yukata là trang phục quen thuộc khi đi lễ hội mùa hè và xem pháo hoa. Yukata được mặc trực tiếp lên người, không có áo lót nagajuban, đi kèm guốc gỗ geta và để chân trần.", "o": "Lễ hội mùa hè, lễ hội pháo hoa, múa Bon, mặc trong khuôn viên nhà trọ suối nước nóng", "w": "Nam, nữ và trẻ em", "p": ["Luôn để vạt trái đè lên vạt phải. Vạt phải đè vạt trái chỉ dành cho người đã khuất", "Ở ryokan (nhà trọ kiểu Nhật), có thể thoải mái mặc yukata được cung cấp trong toàn bộ khuôn viên", "Thắt bằng hanhaba obi bản hẹp hoặc heko obi mềm, nên có thể tự mặc dễ dàng"]}, "haori": {"n": "Áo khoác kimono", "tag": "Áo khoác ngắn mặc bên ngoài kimono.", "d": "Áo khoác mặc bên ngoài kimono, cài phía trước bằng dây. Với phụ nữ, đây là trang phục thường ngày để giữ ấm và làm đẹp. Với nam giới, haori đen có gia huy phối cùng hakama tạo thành lễ phục trang trọng nhất (montsuki haori hakama).", "o": "Nữ: đi chơi thường ngày, giữ ấm / Nam: đám cưới và các buổi lễ (với gia huy và hakama)", "w": "Cả nam và nữ", "p": ["Cài phía trước bằng dây haori-himo", "Theo truyền thống, có thể mặc nguyên trong nhà mà không cần cởi ra", "Lớp lót (haura) thường ẩn giấu những họa tiết cầu kỳ, thể hiện nét sành điệu tinh tế"]}, "hakama": {"n": "Quần hoặc váy xếp ly", "tag": "Trang phục xếp ly mặc bên ngoài kimono, từ thắt lưng trở xuống.", "d": "Trang phục xếp ly mặc bên ngoài kimono, có dáng như quần ống rộng hoặc váy. Nam giới mặc cùng haori có gia huy làm lễ phục trang trọng nhất, còn phụ nữ rất ưa chuộng trong lễ tốt nghiệp. Hakama cũng được mặc khi luyện các môn võ như kyudo, kendo và aikido.", "o": "Lễ tốt nghiệp, đám cưới (chú rể), Lễ Trưởng thành (nam), võ thuật, thần quan và vu nữ tại đền thần đạo", "w": "Cả nam và nữ", "p": ["Hakama nam có 5 nếp ly phía trước và 2 nếp ly phía sau", "Bảy nếp ly được cho là tượng trưng cho bảy đức tính con người cần giữ", "Có hai kiểu: umanori dạng quần và andon dạng váy"]}, "o-maru": {"n": "Obi trang trọng nhất", "tag": "Obi trang trọng nhất, làm từ khổ vải rất rộng gập đôi.", "d": "Được dệt với khổ rộng khoảng 68 cm rồi gập đôi, họa tiết phủ kín cả hai mặt. Sang trọng và nặng, đây từng là obi lễ phục chủ đạo cho đến thời Minh Trị, Đại Chính (đầu thế kỷ 20). Ngày nay chủ yếu thấy trong trang phục cô dâu và “darari obi” buông dài của các maiko ở Kyoto.", "o": "Trang phục cô dâu, furisode, trang phục maiko", "w": "Darari, bunko, fukura suzume và các kiểu khác", "p": ["Loại obi có mức trang trọng cao nhất", "Có họa tiết ở cả hai mặt nên thắt kiểu nào cũng lộ hoa văn", "Dài và nặng nên cần tay nghề thành thạo mới thắt được"]}, "o-fukuro": {"n": "Obi lễ phục", "tag": "Obi cao cấp dùng cho kimono lễ phục và bán trang trọng.", "d": "Được dệt thành dạng ống (hoặc may ghép mặt trước với mặt sau), họa tiết chỉ có ở mặt trước. Nhẹ và dễ dùng hơn maru obi, đây là loại obi lễ phục phổ biến nhất hiện nay. Dài khoảng 4,3 m trở lên và rộng khoảng 31 cm.", "o": "Tomesode, furisode, hōmongi, iromuji có gia huy", "w": "Thắt trống đôi (nijū-daiko), fukura suzume, tateya và các kiểu khác", "p": ["Kiểu thắt trống đôi mang ý nghĩa “niềm vui chồng niềm vui”, nên hợp với dịp mừng", "Họa tiết vàng bạc dùng cho lễ phục; loại sharé-bukuro dùng để làm đẹp thường ngày", "Nhờ chiều dài lớn nên có thể thắt các kiểu cầu kỳ, lộng lẫy"]}, "o-nagoya": {"n": "Obi từ thường ngày đến dạo phố", "tag": "Obi dễ dùng, ra đời để việc thắt kiểu trống (otaiko) đơn giản hơn.", "d": "Được sáng chế tại Nagoya vào thời Đại Chính (1912–1926). Phần tạo hình “trống” giữ nguyên khổ rộng, còn phần quấn quanh eo được gập đôi may sẵn. Ngắn và nhẹ hơn fukuro obi nên dễ tự thắt.", "o": "Komon, tsumugi, iromuji, hōmongi kiểu giản dị", "w": "Thắt trống đơn (otaiko), tsunodashi", "p": ["Vì thắt trống đơn nên không dùng cho lễ phục trong các dịp mừng", "Nagoya obi nhuộm dùng cho dịp thường ngày; loại dệt hợp với dịp trang trọng hơn một chút", "Dài khoảng 3,6 m"]}, "o-hanhaba": {"n": "Obi bản hẹp thường ngày", "tag": "Obi thường ngày, bản rộng chỉ bằng khoảng một nửa obi thông thường.", "d": "Rộng khoảng 15–17 cm, chỉ bằng khoảng một nửa obi thông thường. Nhẹ và dễ thắt, dùng với yukata và kimono thường ngày như komon, tsumugi. Có vô số cách thắt, kể cả kiểu nơ như dải ruy băng, nên rất thú vị khi biến tấu.", "o": "Yukata, komon, tsumugi, kimono cotton hoặc len", "w": "Bunko, kai-no-kuchi, ya-no-ji và các kiểu khác", "p": ["Không cần gối đỡ obi hay phụ kiện khác, nên dễ tự thắt một mình", "Nhiều loại có hai mặt, nên có thể thắt khoe cả hai màu", "Phần lưng phẳng hơn kiểu thắt trống, ngồi ghế ô tô vẫn thoải mái"]}, "o-heko": {"n": "Đai vải mềm", "tag": "Obi làm từ vải mềm, không có lõi cứng.", "d": "Một dải vải mềm dùng làm obi, không có lớp lót cứng bên trong. Ban đầu là đai thường ngày của nam giới và trẻ em, ngày nay cũng được phụ nữ ưa chuộng khi mặc yukata nhờ vẻ mềm mại, bồng bềnh dễ thương. Thắt dễ dàng như thắt nơ.", "o": "Yukata, kimono trẻ em, trang phục thường ngày của nam giới", "w": "Nơ bướm đơn giản (chōcho-musubi) và các kiểu khác", "p": ["Tên gọi bắt nguồn từ “heko”, những chàng trai trẻ ở Kagoshima từng thắt loại đai này", "Ít gây bó chặt cơ thể nên rất thoải mái", "Lựa chọn quen thuộc cho trẻ em trong lễ Shichi-Go-San và lễ hội mùa hè"]}, "o-kaku": {"n": "Obi nam", "tag": "Obi bản hẹp, cứng cáp dành cho nam giới.", "d": "Obi nam cứng cáp, rộng khoảng 9–10 cm và dài khoảng 4 m. Được dùng với hầu như mọi loại kimono nam, từ trang phục thường ngày đến lễ phục montsuki haori hakama. Hoa văn “kenjō” của vải dệt Hakata là mẫu kinh điển.", "o": "Mọi loại kimono nam, từ yukata, tsumugi đến lễ phục có gia huy", "w": "Kai-no-kuchi, rōnin musubi, ichimonji và các kiểu khác", "p": ["Thắt ở ngang xương hông, phía trước thấp, phía sau cao", "Tên Hakata kenjō bắt nguồn từ việc được dâng lên Mạc phủ vào thời Edo", "Với lễ phục, nên chọn obi màu trầm, trông như vải trơn"]}, "n-otaiko": {"n": "Kiểu thắt trống tiêu chuẩn", "tag": "Kiểu thắt phổ biến nhất, tạo hình “trống” vuông ở sau lưng.", "d": "Tạo một khối phồng như chiếc hộp ở sau lưng, là kiểu thắt obi phổ biến nhất của phụ nữ trưởng thành. Tương truyền vào cuối thời Edo, các geisha vùng Fukagawa đã thắt kiểu này để mừng cây cầu Taiko-bashi (cầu trống) tại đền Kameido Tenjin được hoàn thành.", "o": "Nhiều loại kimono, từ hōmongi, iromuji đến komon, tsumugi và tomesode", "w": "Nagoya obi (trống đơn), fukuro obi (trống đôi)", "p": ["Kiểu trống đôi với fukuro obi mang ý nghĩa “niềm vui chồng chất”, dùng trong dịp mừng", "Trong tang lễ dùng trống đơn để nỗi buồn không bị “nhân đôi”", "Tạo dáng bằng gối đỡ obi (obi-makura), khăn obi (obi-age) và dây obi (obi-jime)"]}, "n-tsunodashi": {"n": "Kiểu thắt “sừng” thanh lịch", "tag": "Kiểu thắt sành điệu với hai đầu obi nhô ra như đôi sừng hai bên phần trống dẹt.", "d": "Hai đầu obi ló ra như đôi sừng ở hai bên phần “trống” (otaiko) dẹt. Đây là kiểu thắt cổ xưa có từ thời Edo, thường được thắt thấp và đôi khi không dùng gối đỡ obi (obi-makura), mang lại vẻ gọn gàng, nhã nhặn và đầy phong cách.", "o": "Komon, tsumugi và các loại kimono mặc thường ngày hoặc dạo phố", "w": "Nagoya obi, hanhaba obi, fukuro obi loại thường phục", "p": ["Có cách thắt không cần gối đỡ obi nên phần lưng rất thoải mái", "Toát lên nét thanh lịch, sành điệu của người phụ nữ trưởng thành (iki)", "Kiểu thắt Ginza cũng được xem là một biến thể của tsunodashi"]}, "n-fukura": {"n": "Chim sẻ xù lông", "tag": "Kiểu thắt obi tiêu biểu cho furisode, mô phỏng chú chim sẻ xù lông chống rét.", "d": "Lấy hình ảnh chú chim sẻ xù lông giữa mùa đông giá lạnh, với đôi cánh dang rộng sang hai bên, tạo nên vẻ rực rỡ. Tên gọi này còn được viết bằng những chữ Hán mang nghĩa “phúc lành”, nên được xem là hình dáng cát tường, gọi may mắn và là kiểu thắt quen thuộc nhất cho furisode.", "o": "Furisode (Lễ Thành nhân, đám cưới, lễ tốt nghiệp…)", "w": "Fukuro obi (loại dài)", "p": ["Tên gọi đồng âm với “phúc lành thêm đầy”, mang ý nghĩa may mắn", "Dùng với furisode – lễ phục của phụ nữ chưa kết hôn", "Kích thước và góc độ của đôi cánh làm thay đổi ấn tượng tổng thể"]}, "n-bunko": {"n": "Kiểu nơ truyền thống", "tag": "Kiểu thắt obi kinh điển có từ lâu đời, mang hình chiếc nơ.", "d": "Kiểu thắt hình chiếc nơ với hai cánh dang sang trái phải và một phần đuôi rủ xuống ở giữa. Tương truyền kiểu này bắt nguồn từ cách thắt của phụ nữ trong các gia đình samurai thời Edo. Thắt bằng hanhaba obi sẽ thành kiểu kinh điển cho yukata; thắt bằng fukuro obi sẽ thành kiểu rực rỡ hợp với cả furisode.", "o": "Yukata, komon, furisode (khi thắt bằng fukuro obi)", "w": "Hanhaba obi, fukuro obi, maru obi", "p": ["Kiểu thắt được ưa chuộng nhất khi mặc yukata", "Được cho là bắt nguồn từ cách thắt của phụ nữ gia đình samurai thời Edo", "Tùy loại obi mà có thể thành trang phục thường ngày hoặc lễ phục"]}, "n-darari": {"n": "Kiểu thắt buông dài của maiko", "tag": "Kiểu thắt của các maiko ở Kyoto, với hai đầu obi buông dài gần chạm mắt cá chân.", "d": "Sử dụng “darari obi” dài hơn 5 m, để hai đầu buông dài gần tới mắt cá chân. Đây là trang phục biểu tượng của các maiko (geisha tập sự) ở Kyoto, và phần đầu obi có in gia huy của okiya (nhà geisha) mà cô ấy trực thuộc. Kiểu thắt này được cho là bắt nguồn từ một trào lưu của các thiếu nữ phố thị thời Edo.", "o": "Trang phục maiko, trang phục cô dâu (hiki-furisode)", "w": "Maru obi (darari obi)", "p": ["Chỉ maiko mới thắt kiểu này; khi trở thành geiko sẽ chuyển sang kiểu otaiko", "Phần đuôi obi buông xuống có in gia huy của okiya", "Thường được bắt gặp ở khu Gion, Kyoto hoặc tại các dịch vụ trải nghiệm hóa trang maiko"]}, "n-kai": {"n": "Kiểu thắt kinh điển của nam giới", "tag": "Kiểu thắt cơ bản nhất cho kaku obi của nam giới.", "d": "Được đặt tên như vậy vì nút thắt trông giống miệng con sò đang hé mở. Đây là kiểu thắt tiêu biểu cho kaku obi của nam giới: nút nhỏ, dẹt và khó tuột, phù hợp từ trang phục thường ngày cho đến lễ phục có gia huy (montsuki haori hakama). Phụ nữ cũng có thể thắt kiểu này với hanhaba obi.", "o": "Mọi loại kimono nam; yukata và kimono thường ngày của nữ (với hanhaba obi)", "w": "Kaku obi, hanhaba obi", "p": ["Nút thắt được đặt lệch khỏi chính giữa lưng một chút", "Dẹt nên không bị vướng khi tựa lưng vào ghế", "Khi đã quen, chỉ mất khoảng 1 phút để thắt"]}, "n-ronin": {"n": "Kiểu thắt rōnin phóng khoáng", "tag": "Kiểu thắt phóng khoáng của nam giới, để một đầu obi buông xuống từ nút thắt.", "d": "Kiểu thắt obi của nam giới, trong đó sau khi thắt, một đầu obi được để buông chéo xuống từ nút thắt. Tương truyền tên gọi này xuất phát từ hình ảnh các rōnin (samurai không có chủ) trong phim cổ trang, mang lại vẻ thoải mái, phóng khoáng.", "o": "Yukata và kimono thường ngày của nam", "w": "Kaku obi, heko obi", "p": ["Đơn giản, thắt nhanh", "Ở những dịp trang trọng hơn, nên chọn kiểu kai-no-kuchi", "Cho bạn tận hưởng phong cách phóng khoáng như trong phim cổ trang"]}, "t-yuzen": {"n": "Nhuộm vẽ tay", "tag": "Kỹ thuật nhuộm hoa văn nhiều màu sắc như đang vẽ tranh bằng cọ.", "d": "Kỹ thuật nhuộm được cho là do Miyazaki Yūzensai, một họa sĩ vẽ quạt ở Kyoto, phổ biến vào thời Edo. Người thợ dùng hồ làm từ gạo nếp vẽ theo đường viền hoa văn để màu không bị loang, rồi dùng cọ tô màu vào bên trong. Hoa lá và phong cảnh có thể được thể hiện sống động như một bức tranh.", "o": "Furisode, tomesode, hōmongi, tsukesage", "w": "Kyō-yūzen (Kyoto), Kaga-yūzen (Ishikawa), Tokyo-yūzen (Tokyo)", "p": ["Đặc trưng bởi những đường viền trắng mảnh do lớp hồ để lại", "Kaga-yūzen chuộng hoa cỏ tả thực, kể cả lá bị sâu ăn; Kyō-yūzen thường thêm nhũ vàng và thêu để tăng vẻ lộng lẫy", "Một bộ kimono có thể mất đến vài tháng để hoàn thành"]}, "t-ise": {"n": "Nhuộm bằng khuôn giấy", "tag": "Kỹ thuật nhuộm hoa văn tinh xảo, chính xác bằng khuôn giấy cắt tay.", "d": "Khuôn giấy gọi là Ise-katagami, được khắc từ nhiều lớp giấy washi dán lại bằng nhựa hồng chát (kakishibu), được đặt lên vải. Hồ được phết lên trên để giữ lại hoa văn khi nhuộm vải. Khuôn giấy từ lâu đã được làm ở Shiroko và Jike thuộc thành phố Suzuka (tỉnh Mie), tạo nên những hoa văn cực kỳ tinh tế của Edo komon.", "o": "Edo komon, komon, yukata", "w": "Khuôn giấy: Suzuka, Mie (Shiroko và Jike) / Nhuộm: Tokyo, Kyoto và các nơi khác", "p": ["Có những hoa văn nhỏ đến mức nhìn từ xa trông như vải trơn", "Ise-katagami là nghề thủ công truyền thống được nhà nước công nhận", "Kỹ thuật khắc khuôn giấy được công nhận là Di sản Văn hóa Phi vật thể Quan trọng"]}, "t-shibori": {"n": "Nhuộm buộc thắt", "tag": "Buộc vải bằng chỉ trước khi nhuộm để tạo hoa văn mềm mại, có độ nổi.", "d": "Một phần vải được buộc bằng chỉ, khâu rút lại hoặc gấp lại để thuốc nhuộm không ngấm vào, từ đó tạo thành hoa văn sau khi nhuộm. Dấu buộc để lại những nốt nổi nhỏ, mang đến cho vải độ nổi khối độc đáo cùng cảm giác mềm mại.", "o": "Furisode, hōmongi, haori, khăn obi-age, yukata", "w": "Kyō-kanoko shibori (Kyoto), Arimatsu-Narumi shibori (Aichi)", "p": ["Kanoko shibori với những chấm nhỏ xếp hàng được đặt tên theo đốm trên lưng hươu con", "Furisode nhuộm shibori toàn bộ có thể có hàng trăm nghìn nốt buộc bằng tay, thuộc hàng kimono cao cấp nhất", "Arimatsu-Narumi shibori từng là món quà lưu niệm nổi tiếng của lữ khách trên con đường Tōkaidō thời Edo"]}, "t-roketsu": {"n": "Nhuộm sáp", "tag": "Vẽ hoa văn bằng sáp nóng chảy để ngăn thuốc nhuộm ngấm vào.", "d": "Sáp nóng chảy được phủ lên vải bằng cọ hoặc dụng cụ khác để thuốc nhuộm không thấm vào những chỗ đó. Kỹ thuật này du nhập vào Nhật Bản thời Nara (thế kỷ 8), và các tác phẩm vẫn còn được lưu giữ trong kho báu Shōsōin. Thuốc nhuộm thấm qua các vết nứt của sáp tạo nên những đường rạn li ti mang vẻ đẹp rất riêng.", "o": "Hōmongi, tsukesage, Nagoya obi, fukuro obi loại thời trang", "w": "Các nghệ nhân ở Kyoto và khắp Nhật Bản", "p": ["Được yêu thích nhờ hoa văn rạn hình thành ở chỗ sáp bị nứt", "Là một trong ba kỹ thuật nhuộm chống màu kinh điển thời Nara", "Cùng nguyên lý với vải batik của Indonesia"]}, "t-shishu": {"n": "Thêu", "tag": "Thêu hoa văn bằng chỉ tơ và chỉ kim tuyến, tạo hiệu ứng nổi khối.", "d": "Kỹ thuật trang trí dùng kim cùng chỉ tơ, chỉ vàng và chỉ bạc để thêu nên hoa văn. Thường được thêu chồng lên hoa văn nhuộm để tăng vẻ lộng lẫy và chiều sâu; nghệ thuật thêu Nhật Bản có đến hàng chục kỹ thuật khác nhau. Kyōnui của Kyoto là phong cách tiêu biểu nhất.", "o": "Furisode, tomesode, hōmongi, cổ áo han-eri, fukuro obi, áo cô dâu uchikake", "w": "Kyōnui (Kyoto), Kaga-nui (Ishikawa), thêu Edo (Tokyo)", "p": ["Sợi tơ được tách và se bằng tay để điều chỉnh độ bóng và sắc độ đậm nhạt", "Kết hợp nhuộm và thêu giúp hoa văn thêm phong phú, có hồn", "Càng thêu nhiều, trang phục càng lộng lẫy và trang trọng"]}, "t-kinsai": {"n": "Trang trí bằng vàng lá", "tag": "Trang trí hoa văn bằng vàng lá và bột vàng.", "d": "Kỹ thuật trang trí bằng cách phết chất kết dính lên vải đã nhuộm rồi dán vàng lá hoặc bột vàng lên trên. Vàng được điểm vào đường viền và cánh hoa của hoa văn yūzen để tăng độ lấp lánh, và có nhiều kỹ thuật khác nhau như surihaku (in vàng lá qua khuôn) hay sunago (rắc vụn vàng).", "o": "Furisode, tomesode, hōmongi, fukuro obi", "w": "Kyoto (phát triển cùng với Kyō-yūzen)", "p": ["Hoa văn như bừng sáng khi đón ánh sáng", "Surihaku thời Momoyama còn được dùng trên trang phục kịch Noh", "Ngoài vàng, đôi khi còn dùng bạc và bạch kim"]}, "t-kasuri": {"n": "Dệt ikat", "tag": "Dệt bằng sợi được nhuộm từng đoạn để tạo hoa văn mờ nhòe mềm mại.", "d": "Một phần sợi được buộc lại để chống màu, rồi dùng những sợi đã nhuộm từng đoạn đó để dệt nên hoa văn. Những xê dịch nhỏ khi dệt khiến đường viền trông mờ nhòe như “vết quệt”, và đó chính là nguồn gốc tên gọi kasuri. Loại vải này được yêu thích nhờ vẻ mộc mạc, ấm áp.", "o": "Tsumugi, kimono vải bông, yukata, trang phục lao động như samue", "w": "Kurume kasuri (Fukuoka), Iyo kasuri (Ehime), Bingo kasuri (Hiroshima); cũng được dùng trong Ōshima tsumugi và Yūki tsumugi", "p": ["Ba dòng kasuri lớn của Nhật Bản là Kurume, Iyo và Bingo", "Đường viền mờ nhòe là minh chứng của công việc thủ công", "Trên thế giới, các kỹ thuật tương tự được gọi là ikat"]}, "t-tsumugi": {"n": "Dệt lụa từ sợi xe tay", "tag": "Loại lụa mộc mạc, bền chắc, dệt từ sợi được xe tay từ bông tơ.", "d": "Kén tằm được luộc và kéo giãn thành bông tơ (mawata); sợi được rút ra và xe bằng tay, nhuộm trước rồi mới đem dệt. Vì sợi có những đốt không đều, mặt vải có độ sần đặc trưng và vẻ mờ, trầm nhã. Về tsumugi như một loại kimono, vui lòng xem thêm tab “Kimono”.", "o": "Kimono tsumugi, haori, Nagoya obi, hassun obi", "w": "Ōshima tsumugi (Kagoshima), Yūki tsumugi (Ibaraki và Tochigi), Ushikubi tsumugi (Ishikawa), Shiozawa tsumugi (Niigata) và các nơi khác", "p": ["Yūki tsumugi là Di sản Văn hóa Phi vật thể Quan trọng và được UNESCO ghi danh là Di sản Văn hóa Phi vật thể", "Ōshima tsumugi nổi tiếng với sắc nâu đen sâu lắng nhờ kỹ thuật nhuộm bùn", "Tương truyền loại vải này ra đời để tận dụng những kén tằm bị lỗi"]}, "t-chirimen": {"n": "Lụa crepe", "tag": "Loại lụa mềm mại với bề mặt nhăn li ti gọi là shibo.", "d": "Được dệt bằng sợi ngang se rất chặt. Khi vải được tinh luyện, sợi có xu hướng duỗi xoắn trở lại, tạo nên những nếp nhăn li ti (shibo) trên bề mặt. Vì vải ăn màu rất đẹp và màu lên tươi tắn, chirimen được dùng rộng rãi làm vải nền cho kimono nhuộm như yūzen.", "o": "Komon, hōmongi, iromuji, tsukesage, khăn obi-age, furoshiki", "w": "Tango chirimen (Kyoto), Nagahama chirimen (Shiga)", "p": ["Tango chirimen chiếm tỷ lệ lớn trong lượng vải trắng dùng may kimono tại Nhật Bản", "Có các loại như hitokoshi, kodai và oni-shibo, khác nhau ở kích thước nếp nhăn", "Ít bị nhàu, mang lại cảm giác mềm mại, mượt mà khi chạm vào"]}}}};

const FIX={"items": {"furisode": {"en": {"o": "Coming-of-Age Day, weddings (as an unmarried relative or friend), graduation, New Year", "p": ["Sleeves hang about 85–115 cm long", "Paired with elaborate, showy obi knots such as fukura suzume", "Swinging the sleeves was once said to ward off bad luck and attract good fortune"]}, "fr": {"o": "Fête de la majorité, mariages (en tant que parente ou amie non mariée), remise des diplômes, Nouvel An", "p": ["Manches d'environ 85 à 115 cm de long", "Associé à des nœuds d'obi élaborés et spectaculaires, comme le fukura suzume", "Faire balancer les manches passait autrefois pour éloigner le malheur et attirer la chance"], "d": "Son nom vient de ses longues manches qui se balancent (furi = balancer, sode = manche). C'est la tenue de cérémonie la plus formelle pour les femmes non mariées, ornée de motifs éclatants qui couvrent tout le vêtement."}, "de": {"o": "Tag der Volljährigkeit, Hochzeiten (als unverheiratete Verwandte oder Freundin), Abschlussfeiern, Neujahr", "p": ["Ärmel von etwa 85–115 cm Länge", "Kombiniert mit kunstvollen, prächtigen Obi-Knoten wie dem Fukura-Suzume", "Früher hieß es, das Schwingen der Ärmel vertreibe Unglück und ziehe Glück an"]}, "es": {"o": "Día de la Mayoría de Edad, bodas (como familiar o amiga soltera), graduaciones, Año Nuevo", "p": ["Mangas de unos 85–115 cm de largo", "Se combina con nudos de obi elaborados y vistosos, como el fukura suzume", "Antiguamente se decía que agitar las mangas alejaba la mala suerte y atraía la buena"]}, "zh": {"o": "成人礼、婚礼（以未婚亲友身份出席）、毕业典礼、新年", "p": ["袖长约85–115厘米", "搭配福良雀等华丽的腰带结", "据说挥动长袖可以驱邪、招来良缘"]}, "yue": {"o": "成人禮、婚禮（以未婚親友身份出席）、畢業典禮、新年", "p": ["袖長約85–115厘米", "搭配福良雀等華麗的腰帶結", "據說揮動長袖可以驅邪、招來良緣"]}, "ko": {"o": "성년의 날, 결혼식(미혼 친척·친구로 참석), 졸업식, 설날", "p": ["소매 길이 약 85~115cm", "후쿠라스즈메 등 화려한 오비 매듭과 함께 착용", "소매를 흔들면 액운을 쫓고 좋은 인연을 부른다고 전해짐"]}, "vi": {"o": "Lễ Trưởng thành, đám cưới (với tư cách người thân hoặc bạn bè chưa kết hôn), lễ tốt nghiệp, dịp Năm mới (Tết Dương lịch)"}}, "tomesode": {"ja": {"d": "黒地の「黒留袖」は既婚女性の最も格の高い礼装です。上半身は無地で、裾にだけ縁起の良い模様が描かれ、背・両胸・両袖に五つの家紋が入ります。色地の「色留袖」は未婚の方も着られ、五つ紋なら黒留袖と同格、三つ紋・一つ紋なら準礼装になります。"}, "en": {"d": "The black kuro-tomesode is the highest-ranking formal kimono for married women. The upper body is plain, auspicious designs appear only along the hem, and five family crests are placed on the back, chest and sleeves. A colored version, iro-tomesode, can also be worn by unmarried women; with five crests it ranks equal to the black version, and with one or three crests it is semi-formal."}, "fr": {"d": "Le kuro-tomesode noir est la tenue de cérémonie la plus formelle pour les femmes mariées. Le haut est uni, des motifs porte-bonheur ornent seulement le bas, et cinq blasons familiaux sont placés dans le dos, sur la poitrine et les manches. La version en couleur, iro-tomesode, peut aussi être portée par les femmes non mariées ; avec cinq blasons, elle a le même rang que la version noire, et avec trois blasons ou un seul, elle est semi-formelle.", "o": "Mariages (porté par les mères et proches des mariés), cérémonies officielles"}, "de": {"d": "Der schwarze Kuro-Tomesode ist das höchste Festgewand verheirateter Frauen. Der obere Teil ist ungemustert, glückverheißende Motive zieren nur den Saum, und fünf Familienwappen sitzen auf Rücken, Brust und Ärmeln. Die farbige Variante, Iro-Tomesode, dürfen auch unverheiratete Frauen tragen; mit fünf Wappen ist sie der schwarzen Variante gleichgestellt, mit einem oder drei Wappen ist sie halbformell."}, "es": {"d": "El kuro-tomesode negro es la prenda de gala de mayor rango para mujeres casadas. La parte superior es lisa, los motivos de buena suerte aparecen solo en el bajo, y lleva cinco blasones familiares en la espalda, el pecho y las mangas. La versión de color, iro-tomesode, también pueden usarla mujeres solteras; con cinco blasones tiene el mismo rango que la negra, y con uno o tres blasones es semiformal."}, "zh": {"d": "黑色的“黑留袖”是已婚女性最正式的礼服。上半身为素色，只在下摆绘有吉祥图案，背部、胸前和两袖共有五个家纹。彩色的“色留袖”未婚女性也可穿着：有五个家纹时与黑留袖同等规格，有三个或一个家纹时则为准礼服。"}, "yue": {"d": "黑色的「黑留袖」是已婚女性最正式的禮服。上半身為素色，只在下襬繪有吉祥圖案，背部、胸前和兩袖共有五個家紋。彩色的「色留袖」未婚女性也可穿着：有五個家紋時與黑留袖同等規格，有三個或一個家紋時則為準禮服。"}, "ko": {"d": "검은 바탕의 '구로토메소데'는 기혼 여성의 최고 격식 예복입니다. 상반신은 무늬가 없고 밑단에만 길한 문양이 그려져 있으며, 등·가슴·양 소매에 다섯 개의 가문(家紋)이 들어갑니다. 색이 있는 '이로토메소데'는 미혼 여성도 입을 수 있으며, 가문이 다섯 개면 구로토메소데와 같은 격이고, 세 개나 한 개면 준예복이 됩니다."}, "th": {"d": "คุโระ-โทเมะโซเดะ (kuro-tomesode) พื้นสีดำ เป็นกิโมโนชุดทางการระดับสูงสุดสำหรับหญิงที่แต่งงานแล้ว ช่วงลำตัวท่อนบนเป็นสีพื้นเรียบ มีลวดลายมงคลเฉพาะที่ชายกิโมโน และมีตราประจำตระกูล 5 ตำแหน่งที่หลัง หน้าอกทั้งสองข้าง และแขนเสื้อทั้งสองข้าง ส่วนแบบพื้นสี อิโระ-โทเมะโซเดะ (iro-tomesode) หญิงที่ยังไม่แต่งงานก็สวมได้ หากมีตรา 5 ตำแหน่งจะมีระดับเท่ากับแบบสีดำ และหากมีตรา 3 หรือ 1 ตำแหน่งจะเป็นชุดกึ่งทางการ"}, "vi": {"d": "Kuro-tomesode nền đen là lễ phục trang trọng nhất của phụ nữ đã kết hôn. Phần thân trên để trơn, các họa tiết cát tường chỉ xuất hiện ở vạt áo, và năm gia huy được đặt ở lưng, hai bên ngực và hai tay áo. Phiên bản nền màu, iro-tomesode, thì phụ nữ chưa kết hôn cũng có thể mặc; nếu có năm gia huy thì ngang hàng với kuro-tomesode, còn nếu có ba hoặc một gia huy thì là lễ phục bán trang trọng.", "p": ["Năm gia huy là dấu hiệu của mức trang trọng cao nhất", "Họa tiết chỉ có từ thắt lưng trở xuống", "Phối với fukuro obi dệt kim tuyến vàng bạc"]}}, "iromuji": {"ja": {"d": "黒以外の一色で染められた、模様のない着物です。紋を入れると準礼装に、紋がなければ略礼装として着られ、帯を替えればおしゃれ着にもなります。一枚で幅広い場面に対応できます。"}, "en": {"d": "A kimono dyed in a single color other than black, with no painted pattern. With a family crest it becomes semi-formal wear; without one it serves as dressy wear, and with a lighter obi it can even be worn for stylish outings. One kimono covers many occasions."}, "fr": {"d": "Un kimono teint d'une seule couleur autre que le noir, sans motif peint. Avec un blason familial, il devient une tenue semi-formelle ; sans blason, il se porte comme tenue habillée, et avec un obi plus léger, il convient même aux sorties chic décontractées. Un seul kimono couvre ainsi de nombreuses occasions.", "o": "Cérémonies du thé, événements officiels, accompagnement d'enfants au sanctuaire, cérémonies commémoratives (couleurs sobres)", "p": ["Le tissu peut porter un motif tissé discret", "Un seul blason le rend semi-formel", "Les couleurs sobres conviennent aux cérémonies commémoratives"]}, "de": {"d": "Ein in einer einzigen Farbe außer Schwarz gefärbter Kimono ohne aufgemaltes Muster. Mit Familienwappen wird er zur halbformellen Kleidung, ohne Wappen dient er als festliche Kleidung, und mit einem leichteren Obi eignet er sich sogar für gehoben-legere Anlässe. Ein einziger Kimono passt so zu vielen Gelegenheiten.", "o": "Teezeremonien, offizielle Anlässe, Begleitung von Kindern beim Schreinbesuch, Gedenkfeiern (in gedeckten Farben)"}, "es": {"d": "Un kimono teñido de un solo color distinto del negro, sin dibujos pintados. Con un blasón familiar se convierte en traje semiformal; sin él, sirve como traje de vestir, y con un obi más ligero puede llevarse incluso como informal elegante. Un solo kimono sirve para muchas ocasiones."}, "zh": {"d": "用黑色以外的单一颜色染成、没有图案的和服。加上家纹就是准礼服，不加家纹可作为简式礼服穿着，换一条腰带还能作为时尚外出服。一件就能应对多种场合。"}, "yue": {"d": "用黑色以外的單一顏色染成、沒有圖案的和服。加上家紋就是準禮服，不加家紋可作為簡式禮服穿着，換一條腰帶還能作為時尚外出服。一件就能應對多種場合。"}, "ko": {"d": "검은색 이외의 한 가지 색으로 염색한 무늬 없는 기모노입니다. 가문을 넣으면 준예복이 되고, 가문이 없으면 약식 예복으로 입을 수 있으며, 오비를 바꾸면 외출복으로도 입을 수 있습니다. 한 벌로 다양한 자리에 어울립니다."}, "th": {"d": "กิโมโนที่ย้อมด้วยสีเดียวซึ่งไม่ใช่สีดำ และไม่มีลวดลาย หากใส่ตราประจำตระกูลจะเป็นชุดกึ่งทางการ หากไม่มีตราก็สวมเป็นชุดออกงานได้ และเมื่อเปลี่ยนโอบิก็สวมเป็นชุดลำลองแบบสุภาพได้ด้วย กิโมโนตัวเดียวจึงใช้ได้ในหลากหลายโอกาส"}, "vi": {"d": "Kimono được nhuộm một màu duy nhất khác màu đen, không có họa tiết. Có gia huy thì thành lễ phục bán trang trọng; không có gia huy thì có thể mặc như trang phục trang trọng nhẹ, và khi đổi obi còn có thể mặc dạo phố thanh lịch. Chỉ một bộ mà phù hợp với rất nhiều dịp khác nhau."}}, "komon": {"ja": {"p": ["洋服でいえばワンピースのような感覚", "江戸小紋の「鮫」「行儀」「角通し」などは、紋を入れると略礼装にもなる", "名古屋帯を合わせることが多い"]}, "en": {"p": ["Similar to a nice day dress in Western clothing", "Some Edo komon patterns (same, gyōgi, kakudōshi) become dressy wear when a family crest is added", "Often worn with a Nagoya obi"]}, "fr": {"p": ["Comparable à une jolie robe de ville", "Certains motifs d'Edo komon (same, gyōgi, kakudōshi) deviennent une tenue habillée avec un blason familial", "Souvent porté avec un Nagoya obi"]}, "de": {"p": ["Vergleichbar mit einem eleganten Tageskleid", "Manche Edo-Komon-Muster (Same, Gyōgi, Kakudōshi) werden mit Familienwappen zur festlichen Kleidung", "Oft mit einem Nagoya-Obi getragen"]}, "es": {"p": ["Equivale a un bonito vestido de día", "Algunos dibujos de Edo komon (same, gyōgi, kakudōshi) pasan a ser de vestir si se añade un blasón familiar", "Suele llevarse con un Nagoya obi"]}, "zh": {"p": ["相当于西式服装中的连衣裙", "江户小纹中的“鲛”“行仪”“角通”等图案，加上家纹也可作为简式礼服", "多搭配名古屋带"]}, "yue": {"p": ["相當於西式服裝中的連身裙", "江戶小紋中的「鮫」「行儀」「角通」等圖案，加上家紋也可作為簡式禮服", "多搭配名古屋帶"]}, "ko": {"p": ["양장의 원피스와 같은 감각", "에도코몬의 '사메', '교기', '가쿠도시' 등은 가문을 넣으면 약식 예복으로도 입을 수 있음", "나고야오비와 함께 입는 경우가 많음"]}, "th": {"p": ["ถ้าเทียบกับเสื้อผ้าแบบตะวันตก ก็คล้ายชุดเดรสสวย ๆ", "ลายเอโดะโคมง (Edo komon) บางลาย เช่น ซาเมะ (same) เกียวงิ (gyōgi) และคาคุโดชิ (kakudōshi) หากใส่ตราประจำตระกูลก็สวมเป็นชุดออกงานได้", "มักสวมคู่กับนาโงยะโอบิ (Nagoya obi)"]}, "vi": {"p": ["Tương tự một chiếc váy liền đẹp trong trang phục phương Tây", "Một số họa tiết Edo komon như same, gyōgi, kakudōshi khi thêm gia huy có thể mặc như trang phục trang trọng nhẹ", "Thường phối với Nagoya obi"]}}, "tsumugi": {"ja": {"d": "先に染めた糸で織る「織りの着物」です。本来は真綿から手で紡いだ糸を使い、素朴な風合いと丈夫さが魅力で、もとは農家の普段着でした。大島紬や結城紬のように、高価な伝統工芸品も多くあります。", "p": ["どんなに高価でも格は普段着・おしゃれ着で、結婚式などの式典には着ないのが基本", "着るほど柔らかく体になじむ", "大島紬・結城紬などは国の伝統的工芸品"]}, "en": {"d": "A woven kimono made from threads dyed before weaving. Traditionally the thread is hand-spun from silk floss, giving an earthy texture and durability, and it was originally everyday wear for farming families. Famous types such as Ōshima and Yūki tsumugi are prized traditional crafts.", "p": ["However expensive, it counts as casual or smart-casual wear and is generally not worn to ceremonies such as weddings", "Softens and fits the body better the more it is worn", "Ōshima and Yūki tsumugi are officially recognized traditional crafts"]}, "fr": {"d": "Un kimono tissé avec des fils teints avant le tissage. Traditionnellement, ces fils sont filés à la main à partir de bourre de soie, ce qui lui donne une texture naturelle et une grande solidité ; c'était à l'origine le vêtement quotidien des familles paysannes. Les célèbres Ōshima et Yūki tsumugi sont des pièces d'artisanat traditionnel très recherchées.", "p": ["Aussi coûteux soit-il, il reste une tenue décontractée ou chic décontractée et ne se porte généralement pas aux cérémonies comme les mariages", "S'assouplit et épouse le corps au fil du temps", "L'Ōshima tsumugi et le Yūki tsumugi sont des artisanats traditionnels officiellement reconnus"]}, "de": {"d": "Ein gewebter Kimono aus Fäden, die vor dem Weben gefärbt werden. Traditionell werden die Fäden von Hand aus Seidenwatte gesponnen, was ihm eine natürliche Textur und Haltbarkeit verleiht; ursprünglich war er die Alltagskleidung von Bauernfamilien. Berühmte Sorten wie Ōshima- und Yūki-Tsumugi gelten als wertvolles traditionelles Kunsthandwerk.", "p": ["So teuer er auch sein mag, er gilt als Alltags- oder gehoben-legere Kleidung und wird in der Regel nicht zu Zeremonien wie Hochzeiten getragen", "Wird mit jedem Tragen weicher und anschmiegsamer", "Ōshima- und Yūki-Tsumugi sind anerkanntes traditionelles Kunsthandwerk"]}, "es": {"d": "Un kimono tejido con hilos teñidos antes de tejer. Tradicionalmente, el hilo se hila a mano a partir de borra de seda, lo que le da una textura natural y resistencia, y originalmente era la ropa diaria de las familias campesinas. Variedades famosas como el Ōshima y el Yūki tsumugi son valiosas artesanías tradicionales.", "p": ["Por caro que sea, se considera ropa informal o informal elegante y, por norma general, no se lleva a ceremonias como bodas", "Se suaviza y se adapta al cuerpo con el uso", "El Ōshima y el Yūki tsumugi son artesanías tradicionales reconocidas"]}, "zh": {"d": "用预先染色的线织成的“织的和服”。传统上使用以丝绵手纺的线，质感朴素、结实耐穿，原本是农家的日常服装。也有许多像大岛紬、结城紬这样名贵的传统工艺品。", "p": ["无论多昂贵，规格都属于日常服或时尚外出服，原则上不在婚礼等典礼上穿着", "越穿越柔软贴身", "大岛紬、结城紬等为日本国家认定的传统工艺品"]}, "yue": {"d": "用預先染色的線織成的「織的和服」。傳統上使用以絲綿手紡的線，質感樸素、結實耐穿，原本是農家的日常服裝。也有許多像大島紬、結城紬這樣名貴的傳統工藝品。", "p": ["無論多昂貴，規格都屬於日常服或時尚外出服，原則上不在婚禮等典禮上穿着", "越穿越柔軟貼身", "大島紬、結城紬等為日本國家認定的傳統工藝品"]}, "ko": {"d": "먼저 염색한 실로 짜는 '직조 기모노'입니다. 원래는 풀솜에서 손으로 자은 실을 쓰며, 소박한 질감과 튼튼함이 매력으로 본래 농가의 평상복이었습니다. 오시마쓰무기, 유키쓰무기처럼 값비싼 전통 공예품도 많습니다.", "p": ["아무리 비싸도 격은 평상복·외출복이며, 결혼식 등의 의식에는 입지 않는 것이 기본", "입을수록 부드러워지고 몸에 잘 맞음", "오시마쓰무기·유키쓰무기 등은 일본 국가 지정 전통 공예품"]}, "th": {"d": "กิโมโนแบบทอที่ทอจากเส้นด้ายซึ่งย้อมสีไว้ก่อน แต่เดิมใช้เส้นด้ายที่ปั่นด้วยมือจากใยไหม (มาวาตะ) มีเสน่ห์ที่เนื้อผ้าดูเรียบง่ายเป็นธรรมชาติและความทนทาน เดิมเป็นชุดใส่ประจำวันของครอบครัวเกษตรกร หลายชนิดเป็นงานหัตถกรรมดั้งเดิมที่มีราคาสูง เช่น โอชิมะซึมุงิ (Ōshima tsumugi) และยูกิซึมุงิ (Yūki tsumugi)", "p": ["ไม่ว่าจะราคาแพงแค่ไหน ก็ถือเป็นชุดลำลองหรือชุดลำลองแบบสุภาพ โดยหลักแล้วจึงไม่สวมไปงานพิธีอย่างงานแต่งงาน", "ยิ่งสวมบ่อยยิ่งนุ่มและเข้ากับรูปร่างมากขึ้น", "โอชิมะซึมุงิและยูกิซึมุงิได้รับการรับรองเป็นหัตถกรรมดั้งเดิมของประเทศ"]}, "vi": {"d": "Một loại kimono dệt từ sợi đã được nhuộm trước. Theo truyền thống, sợi được xe tay từ bông tơ (mawata), mang lại chất vải mộc mạc và độ bền; ban đầu đây là trang phục thường ngày của các gia đình nông dân. Nhiều loại là sản phẩm thủ công truyền thống đắt giá, như Ōshima tsumugi và Yūki tsumugi.", "p": ["Dù đắt đến đâu cũng chỉ được xem là trang phục thường ngày hoặc dạo phố thanh lịch, về cơ bản không mặc đến các buổi lễ như đám cưới", "Càng mặc càng mềm và ôm vừa cơ thể", "Ōshima tsumugi và Yūki tsumugi được Nhà nước công nhận là sản phẩm thủ công truyền thống"]}}, "yukata": {"ja": {"d": "木綿などで作られた、裏地のない一重の着物です。平安時代に蒸し風呂で入浴するときに着た「湯帷子（ゆかたびら）」が始まりで、江戸時代に湯上がり着として広まり、今では夏祭りや花火大会の定番の装いです。長襦袢は着ずに肌着の上に着て、素足に下駄を合わせます。", "p": ["必ず左の衿を上に重ねる（右前）。逆は亡くなった方の装い", "旅館の浴衣は館内着として気軽に着られる（食事処などのルールは施設ごとに確認を）", "半幅帯や兵児帯で、ひとりでも簡単に着られる"]}, "en": {"d": "An unlined kimono usually made of cotton. It began as the yukatabira, a thin robe worn while bathing in the steam baths of the Heian period; it spread as an after-bath robe in the Edo period, and today it is the classic outfit for summer festivals and fireworks displays. It is worn over a light undergarment, without the nagajuban under-kimono, with wooden geta sandals and bare feet.", "p": ["Always wrap the left side over the right. Right over left is only for the deceased", "At a ryokan (Japanese inn), the yukata provided is casual wear inside the inn (check each inn's rules for dining areas)", "Tied with a narrow hanhaba obi or a soft heko obi, so it is easy to put on yourself"]}, "fr": {"d": "Un kimono sans doublure, généralement en coton. Il est né du yukatabira, une fine robe portée pendant le bain dans les bains de vapeur de l'époque de Heian ; il s'est répandu comme vêtement de sortie de bain à l'époque d'Edo, et c'est aujourd'hui la tenue classique des fêtes d'été et des feux d'artifice. Il se porte sur un sous-vêtement léger, sans le sous-kimono nagajuban, avec des sandales en bois (geta) et les pieds nus.", "p": ["Croisez toujours le pan gauche sur le droit. L'inverse est réservé aux défunts", "Dans un ryokan (auberge japonaise), le yukata fourni se porte librement dans l'établissement (vérifiez les règles de chaque auberge pour les salles de repas)", "Noué avec un obi étroit (hanhaba) ou souple (heko), facile à mettre seul"]}, "de": {"d": "Ein ungefütterter Kimono, meist aus Baumwolle. Er geht auf den Yukatabira zurück, ein dünnes Gewand, das in der Heian-Zeit beim Baden im Dampfbad getragen wurde; in der Edo-Zeit verbreitete er sich als Kleidung nach dem Bad, und heute ist er das klassische Outfit für Sommerfeste und Feuerwerke. Er wird über leichter Unterwäsche, ohne den Unterkimono Nagajuban, getragen; dazu trägt man barfuß Holzsandalen (Geta).", "p": ["Immer die linke Seite über die rechte legen. Rechts über links gilt nur für Verstorbene", "Im Ryokan (japanisches Gasthaus) ist der bereitgestellte Yukata zwanglose Hauskleidung (für Speiseräume die Regeln des jeweiligen Hauses beachten)", "Gebunden mit einem schmalen Hanhaba-Obi oder weichen Heko-Obi, leicht selbst anzulegen"]}, "es": {"d": "Un kimono sin forro, normalmente de algodón. Nació del yukatabira, una bata fina que se llevaba al bañarse en los baños de vapor de la era Heian; en la era Edo se extendió como prenda para después del baño, y hoy es el atuendo clásico de los festivales de verano y los fuegos artificiales. Se lleva sobre una prenda interior ligera, sin el kimono interior nagajuban, con sandalias de madera (geta) y los pies descalzos.", "p": ["Cruce siempre el lado izquierdo sobre el derecho. Al revés solo se viste a los difuntos", "En un ryokan (posada japonesa), el yukata que se ofrece es ropa informal para usar dentro de la posada (consulte las normas de cada posada para los comedores)", "Se ata con un obi estrecho (hanhaba) o suave (heko), fácil de poner uno mismo"]}, "zh": {"d": "通常用棉布制成、没有里衬的单层和服。起源于平安时代在蒸汽浴中沐浴时穿着的“汤帷子”，江户时代作为浴后便服普及开来，如今是夏日祭典和烟花大会的经典装扮。不穿长襦袢（和服内衬），直接穿在贴身内衣外面，赤脚搭配木屐。", "o": "夏日祭典、烟花大会、盂兰盆舞、温泉旅馆内穿的便服", "p": ["务必左襟压在右襟上面，反过来是给逝者穿的方式", "旅馆提供的浴衣可作为馆内便服轻松穿着（餐厅等处的规定请向各旅馆确认）", "系半幅带或兵儿带，自己也能轻松穿好"]}, "yue": {"d": "通常用棉布製成、沒有裏襯的單層和服。起源於平安時代在蒸汽浴中沐浴時穿着的「湯帷子」，江戶時代作為浴後便服普及開來，如今是夏日祭典和煙花大會的經典裝扮。不穿長襦袢（和服內襯），直接穿在貼身內衣外面，赤腳搭配木屐。", "o": "夏日祭典、煙花大會、盂蘭盆舞、温泉旅館內穿的便服", "p": ["務必左襟壓在右襟上面，反過來是給逝者穿的方式", "旅館提供的浴衣可作為館內便服輕鬆穿着（餐廳等處的規定請向各旅館確認）", "繫半幅帶或兵兒帶，自己也能輕鬆穿好"]}, "ko": {"d": "주로 면으로 만든 안감 없는 홑겹 기모노입니다. 헤이안 시대에 증기 목욕을 할 때 입던 '유카타비라'가 시초로, 에도 시대에 목욕 후 입는 옷으로 널리 퍼졌으며, 지금은 여름 축제와 불꽃놀이의 대표적인 차림입니다. 나가주반(속옷 기모노)은 입지 않고 속옷 위에 바로 입으며, 맨발에 나막신(게타)을 신습니다.", "p": ["반드시 왼쪽 깃을 오른쪽 위로 여밈. 반대는 고인에게 입히는 방식", "료칸(일본 여관)에서 제공하는 유카타는 시설 안에서 편하게 입을 수 있음(식당 등의 규칙은 시설마다 확인)", "폭이 좁은 한하바오비나 부드러운 헤코오비로 혼자서도 쉽게 입을 수 있음"]}, "th": {"d": "กิโมโนชั้นเดียวไม่มีซับใน ส่วนใหญ่ทำจากผ้าฝ้าย มีต้นกำเนิดจาก “ยูกาตะบิระ” ชุดผ้าบางที่สวมขณะอาบน้ำในห้องอบไอน้ำสมัยเฮอัง ต่อมาในสมัยเอโดะแพร่หลายเป็นชุดสวมหลังอาบน้ำ ปัจจุบันเป็นชุดยอดนิยมสำหรับเทศกาลฤดูร้อนและงานดอกไม้ไฟ สวมทับเสื้อตัวในบาง ๆ โดยไม่ต้องใส่นางะจุบัง (ชุดตัวในของกิโมโน) และสวมรองเท้าไม้เกตะ (geta) โดยไม่สวมถุงเท้า", "p": ["ต้องทับสาบเสื้อด้านซ้ายไว้บนด้านขวาเสมอ การทับด้านขวาไว้บนเป็นการแต่งกายให้ผู้เสียชีวิตเท่านั้น", "ที่เรียวกัง (โรงแรมสไตล์ญี่ปุ่น) สามารถสวมยูกาตะที่ทางโรงแรมจัดให้เป็นชุดลำลองภายในโรงแรมได้ (สำหรับห้องอาหาร โปรดตรวจสอบกฎของแต่ละแห่ง)", "ผูกด้วยฮันฮาบะโอบิ (hanhaba obi) ที่มีขนาดแคบ หรือเฮโกะโอบิ (heko obi) ที่นุ่ม จึงสวมเองได้ง่าย"]}, "vi": {"d": "Kimono một lớp không lót, thường làm bằng cotton. Khởi nguồn là yukatabira – áo mỏng mặc khi tắm hơi vào thời Heian; đến thời Edo, nó trở nên phổ biến như áo mặc sau khi tắm, và ngày nay yukata là trang phục quen thuộc khi đi lễ hội mùa hè và xem pháo hoa. Yukata được mặc bên ngoài một lớp áo lót mỏng, không mặc nagajuban, đi kèm guốc gỗ geta và để chân trần.", "p": ["Luôn để vạt trái đè lên vạt phải. Vạt phải đè vạt trái chỉ dành cho người đã khuất", "Ở ryokan (nhà trọ kiểu Nhật), có thể thoải mái mặc yukata được cung cấp trong khuôn viên (riêng khu vực ăn uống, vui lòng kiểm tra quy định của từng nơi)", "Thắt bằng hanhaba obi bản hẹp hoặc heko obi mềm, nên có thể tự mặc dễ dàng"]}}, "haori": {"ja": {"d": "着物の上に羽織り、前を紐で留める上着です。女性の羽織は防寒やおしゃれのためのカジュアルなもの。男性は、黒羽二重に五つ紋を入れた着物と羽織に仙台平の袴を合わせると、第一礼装（黒紋付羽織袴）になります。", "p": ["前を「羽織紐」で留める", "コートと違い、室内でも脱がなくてよいとされる（茶席では脱ぐ）", "裏地（羽裏）に凝った柄を忍ばせる粋な文化がある"]}, "en": {"d": "A jacket worn over the kimono and fastened at the front with a cord. For women it is casual wear for warmth and style. For men, a black kimono and black haori each bearing five family crests, worn with striped sendai-hira hakama, make the most formal attire (kuro-montsuki haori hakama).", "p": ["Fastened at the front with a haori-himo cord", "Unlike a coat, it may usually be kept on indoors (but it is taken off at a tea ceremony)", "Linings often hide bold, playful designs as a subtle form of style"]}, "fr": {"d": "Une veste portée sur le kimono et fermée devant par un cordon. Pour les femmes, c'est un vêtement décontracté, pour se tenir chaud et pour l'élégance. Pour les hommes, un kimono et un haori noirs portant chacun cinq blasons familiaux, associés à un hakama rayé en sendai-hira, constituent la tenue la plus formelle (kuro-montsuki haori hakama).", "p": ["Fermée devant par un cordon, le haori-himo", "Contrairement à un manteau, on peut en général la garder à l'intérieur (mais on la retire lors d'une cérémonie du thé)", "La doublure cache souvent des motifs audacieux, une élégance discrète"], "o": "Femmes : sorties quotidiennes, se tenir chaud / Hommes : mariages et cérémonies (avec blasons et hakama)"}, "de": {"d": "Eine Jacke, die über dem Kimono getragen und vorne mit einer Kordel geschlossen wird. Bei Frauen ist sie zwanglose Kleidung für Wärme und Stil. Bei Männern ergeben ein schwarzer Kimono und ein schwarzer Haori mit jeweils fünf Familienwappen zusammen mit einem gestreiften Hakama aus Sendai-Hira die formellste Kleidung (Kuro-Montsuki Haori Hakama).", "p": ["Vorne mit der Haori-Himo-Kordel geschlossen", "Anders als ein Mantel darf sie meist auch drinnen anbehalten werden (bei der Teezeremonie legt man sie jedoch ab)", "Das Futter verbirgt oft kühne, verspielte Motive als dezente Eleganz"]}, "es": {"d": "Una chaqueta que se lleva sobre el kimono y se cierra por delante con un cordón. Para las mujeres es una prenda informal, para abrigarse y lucir. Para los hombres, un kimono y un haori negros con cinco blasones familiares cada uno, junto con un hakama de rayas de sendai-hira, forman el atuendo más formal (kuro-montsuki haori hakama).", "p": ["Se cierra por delante con un cordón llamado haori-himo", "A diferencia de un abrigo, normalmente puede llevarse puesta en interiores (pero se quita en la ceremonia del té)", "El forro suele esconder dibujos atrevidos, una elegancia discreta"]}, "zh": {"d": "穿在和服外面、前襟用绳带系住的外套。女性的羽织是用于保暖和时尚的休闲服装。男性穿黑色羽二重面料、带五个家纹的和服和羽织，再搭配仙台平袴，就是最正式的礼服（黑纹付羽织袴）。", "p": ["前襟用“羽织纽”系住", "与大衣不同，一般在室内也可以不脱（但茶席上要脱下）", "里衬常藏有大胆有趣的图案，是低调的讲究"]}, "yue": {"d": "穿在和服外面、前襟用繩帶繫住的外套。女性的羽織是用於保暖和時尚的休閒服裝。男性穿黑色羽二重面料、帶五個家紋的和服和羽織，再搭配仙台平袴，就是最正式的禮服（黑紋付羽織袴）。", "p": ["前襟用「羽織紐」繫住", "與大衣不同，一般在室內也可以不脱（但茶席上要脱下）", "裏襯常藏有大膽有趣的圖案，是低調的講究"]}, "ko": {"d": "기모노 위에 입고 앞을 끈으로 여미는 겉옷입니다. 여성의 하오리는 보온과 멋을 위한 캐주얼 의상입니다. 남성은 검은 하부타에 비단에 가문 다섯 개를 넣은 기모노와 하오리에 센다이히라 하카마를 갖추면 최고 격식의 예복(구로몬쓰키 하오리 하카마)이 됩니다.", "p": ["앞을 '하오리히모' 끈으로 여밈", "코트와 달리 실내에서 벗지 않아도 됨(다도 자리에서는 벗음)", "안감에 대담한 무늬를 넣어 은근한 멋을 즐김"]}, "th": {"d": "เสื้อคลุมที่สวมทับกิโมโนและผูกด้านหน้าด้วยเชือก สำหรับผู้หญิงเป็นเครื่องแต่งกายลำลองเพื่อความอบอุ่นและความสวยงาม สำหรับผู้ชาย เมื่อสวมกิโมโนและฮาโอริผ้าไหมฮาบุตาเอะสีดำที่มีตราประจำตระกูล 5 ตำแหน่ง คู่กับฮากามะ (hakama) ผ้าเซ็นไดฮิระ จะเป็นชุดทางการระดับสูงสุด (คุโระมนซึกิ ฮาโอริ ฮากามะ)", "p": ["ผูกด้านหน้าด้วยเชือกฮาโอริฮิโมะ (haori-himo)", "ต่างจากเสื้อโค้ต โดยทั่วไปสวมไว้ในอาคารได้โดยไม่ต้องถอด (แต่จะถอดออกในพิธีชงชา)", "มีวัฒนธรรมการซ่อนลวดลายสวยแปลกตาไว้ที่ซับใน เป็นความเก๋แบบเรียบง่าย"]}, "vi": {"d": "Áo khoác mặc bên ngoài kimono, cài phía trước bằng dây. Với phụ nữ, đây là trang phục thường ngày để giữ ấm và làm đẹp. Với nam giới, kimono và haori bằng lụa habutae đen có năm gia huy, phối cùng hakama vải sendai-hira, tạo thành lễ phục trang trọng nhất (kuro-montsuki haori hakama).", "p": ["Cài phía trước bằng dây haori-himo", "Khác với áo khoác ngoài, haori thường có thể mặc nguyên trong nhà (nhưng sẽ cởi ra khi dự trà đạo)", "Lớp lót (haura) thường ẩn giấu những họa tiết cầu kỳ, thể hiện nét sành điệu tinh tế"]}}, "o-maru": {"ja": {"d": "約68cmの幅で織った生地を二つに折って仕立てた帯で、表も裏も全体に柄があります。豪華で重く、戦前までは礼装の帯の主流でした。現在は花嫁衣装や、京都の舞妓さんの「だらりの帯」などで使われます。"}, "en": {"d": "Woven about 68 cm wide and folded in half, with the pattern covering both sides. Luxurious and heavy, it was the standard formal obi until before World War II. Today it is mainly seen in bridal wear and in the long darari obi of Kyoto's maiko."}, "fr": {"d": "Tissé sur environ 68 cm de large puis plié en deux, il est décoré sur ses deux faces. Luxueux et lourd, il était l'obi de cérémonie habituel jusqu'à la Seconde Guerre mondiale. Aujourd'hui, on le voit surtout dans les tenues de mariée et dans le long darari obi des maiko de Kyoto.", "p": ["Le type d'obi le plus prestigieux", "Comme il est décoré des deux côtés, le motif apparaît quel que soit le nœud", "Long et lourd, il demande du savoir-faire pour être noué"]}, "de": {"d": "Er wird etwa 68 cm breit gewebt und in der Mitte gefaltet, sodass beide Seiten gemustert sind. Prachtvoll und schwer, war er bis zum Zweiten Weltkrieg der übliche Fest-Obi. Heute sieht man ihn vor allem bei Brautkleidung und beim langen Darari-Obi der Maiko in Kyoto.", "o": "Brautkimono, Furisode, Maiko-Gewand", "p": ["Die ranghöchste Obi-Art", "Beidseitig gemustert, daher zeigt sich das Muster bei jedem Knoten", "Da er lang und schwer ist, erfordert das Binden Geschick"]}, "es": {"d": "Se teje con unos 68 cm de ancho y se dobla por la mitad, con dibujos en ambas caras. Lujoso y pesado, fue el obi de gala habitual hasta antes de la Segunda Guerra Mundial. Hoy se ve sobre todo en los trajes de novia y en el largo darari obi de las maiko de Kioto."}, "zh": {"d": "将约68厘米宽的织物对折缝制而成，正反两面都有图案。华丽而厚重，直到二战前都是礼服腰带的主流。如今主要用于新娘礼服和京都舞妓的“垂带”。"}, "yue": {"d": "將約68厘米寬的織物對摺縫製而成，正反兩面都有圖案。華麗而厚重，直到二戰前都是禮服腰帶的主流。如今主要用於新娘禮服和京都舞妓的「垂帶」。", "p": ["腰帶中規格最高", "兩面都有圖案，無論怎樣繫都能展現花紋", "又長又重，結法需要熟練技巧"]}, "ko": {"d": "약 68cm 폭으로 짠 원단을 반으로 접어 만든 오비로, 앞뒤 양면 전체에 무늬가 있습니다. 화려하고 무거우며, 제2차 세계대전 이전까지 예복용 오비의 주류였습니다. 지금은 주로 신부 의상이나 교토 마이코의 '다라리 오비'에 쓰입니다."}, "th": {"d": "ทอผ้าหน้ากว้างประมาณ 68 cm แล้วพับครึ่ง มีลวดลายทั่วทั้งสองด้าน หรูหราและหนัก เคยเป็นโอบิทางการมาตรฐานจนถึงก่อนสงครามโลกครั้งที่ 2 ปัจจุบันพบได้ในชุดเจ้าสาว และโอบิแบบ “ดาราริ” (darari) ที่ห้อยยาวของไมโกะ (maiko) แห่งเกียวโต"}, "vi": {"d": "Được dệt với khổ rộng khoảng 68 cm rồi gập đôi, họa tiết phủ kín cả hai mặt. Sang trọng và nặng, đây từng là obi lễ phục chủ đạo cho đến trước Chiến tranh thế giới thứ hai. Ngày nay chủ yếu thấy trong trang phục cô dâu và “darari obi” buông dài của các maiko ở Kyoto."}}, "o-fukuro": {"ja": {"d": "表と裏を袋状に織る（または縫い合わせる）帯で、柄は表側だけにあります。丸帯より軽く扱いやすいため、現在の礼装用の帯の主流です。長さは約4m20cm以上、幅は約31cmです。"}, "en": {"d": "Woven as a tube, or with front and back sewn together, with the pattern on the front only. Lighter and easier to handle than the maru obi, it is today's standard formal obi. It is about 4.2 m or longer and about 31 cm wide."}, "fr": {"d": "Tissé en forme de tube, ou dont l'endroit et l'envers sont cousus ensemble, il n'est décoré que sur l'endroit. Plus léger et plus pratique que le maru obi, c'est aujourd'hui l'obi de cérémonie standard. Il mesure environ 4,2 m ou plus, pour environ 31 cm de large.", "p": ["Le double tambour signifie « des joies qui se superposent » et convient aux célébrations", "Les motifs or et argent sont formels ; les sharé-bukuro se portent en tenue chic décontractée", "Sa longueur permet des nœuds décoratifs élaborés"]}, "de": {"d": "Er wird als Schlauch gewebt oder aus Vorder- und Rückseite zusammengenäht; gemustert ist nur die Vorderseite. Leichter und handlicher als der Maru-Obi, ist er heute der Standard-Fest-Obi. Er ist etwa 4,2 m oder länger und etwa 31 cm breit.", "p": ["Die doppelte Trommel steht für „Freude, die sich häuft“ und passt zu Feiern", "Gold- und Silbermuster sind formell, Sharé-Bukuro-Obi trägt man zu gehoben-legeren Anlässen", "Dank seiner Länge sind kunstvolle Zierknoten möglich"]}, "es": {"d": "Se teje en forma de tubo, o con el anverso y el reverso cosidos, y solo tiene dibujo por delante. Más ligero y manejable que el maru obi, es hoy el obi de gala estándar. Mide unos 4,2 m o más de largo y unos 31 cm de ancho.", "p": ["El tambor doble significa «alegría sobre alegría» y es ideal para celebraciones", "Los dibujos dorados y plateados son formales; los sharé-bukuro, para ocasiones informales elegantes", "Su longitud permite nudos decorativos elaborados"]}, "zh": {"d": "正反面织成袋状（或缝合而成）的腰带，只有正面有图案。比丸带轻便好用，是现今礼服腰带的主流。长约4.2米以上，宽约31厘米。"}, "yue": {"d": "正反面織成袋狀（或縫合而成）的腰帶，只有正面有圖案。比丸帶輕便好用，是現今禮服腰帶的主流。長約4.2米以上，寬約31厘米。", "p": ["二重太鼓寓意「喜上加喜」，適合喜慶場合", "金銀圖案用於禮服，時尚袋帶用於休閒", "長度足夠，可以繫出華麗的花式結"]}, "ko": {"d": "앞뒤를 자루 모양으로 짜거나 꿰매어 만든 오비로, 무늬는 앞면에만 있습니다. 마루오비보다 가볍고 다루기 쉬워 현재 예복용 오비의 주류입니다. 길이 약 4.2m 이상, 폭 약 31cm입니다.", "w": "니주다이코(이중 오타이코), 후쿠라스즈메, 다테야 등"}, "th": {"d": "ทอเป็นทรงถุง (หรือเย็บผ้าด้านหน้าและด้านหลังเข้าด้วยกัน) มีลวดลายเฉพาะด้านหน้า เบาและใช้งานง่ายกว่ามารุโอบิ (maru obi) จึงเป็นโอบิทางการมาตรฐานในปัจจุบัน ยาวประมาณ 4.2 m ขึ้นไป และกว้างประมาณ 31 cm"}, "vi": {"d": "Được dệt thành dạng ống (hoặc may ghép mặt trước với mặt sau), họa tiết chỉ có ở mặt trước. Nhẹ và dễ dùng hơn maru obi, đây là loại obi lễ phục phổ biến nhất hiện nay. Dài khoảng 4,2 m trở lên và rộng khoảng 31 cm."}}, "o-nagoya": {"ja": {"o": "小紋、紬、色無地、付け下げ、喪服（黒の名古屋帯）"}, "en": {"o": "Komon, tsumugi, iromuji, tsukesage, mourning kimono (black Nagoya obi)"}, "fr": {"n": "Obi pour le quotidien et les sorties", "o": "Komon, tsumugi, iromuji, tsukesage, kimono de deuil (Nagoya obi noir)", "p": ["Noué en tambour simple, il ne se porte pas avec les tenues de cérémonie festives", "Les Nagoya obi teints sont décontractés ; les tissés conviennent à des occasions plus habillées", "Environ 3,6 m de long"]}, "de": {"n": "Obi für Alltag und gehobene Anlässe", "o": "Komon, Tsumugi, Iromuji, Tsukesage, Trauerkimono (schwarzer Nagoya-Obi)"}, "es": {"o": "Komon, tsumugi, iromuji, tsukesage, kimono de luto (Nagoya obi negro)", "d": "Se inventó en Nagoya en la era Taishō (1912–1926). La parte que forma el tambor tiene el ancho completo y la que rodea la cintura viene ya doblada por la mitad. Más corto y ligero que el fukuro obi, es fácil de atar uno mismo."}, "zh": {"o": "小纹、紬、色无地、付下（简约版访问着）、丧服（黑色名古屋带）"}, "yue": {"o": "小紋、紬、色無地、付下（簡約版訪問着）、喪服（黑色名古屋帶）", "p": ["繫成一重太鼓，因此不用於喜慶禮服", "染製的名古屋帶較休閒，織製的可用於稍正式場合", "長約3.6米"]}, "ko": {"o": "고몬, 쓰무기, 이로무지, 쓰케사게(간략한 호몬기), 상복(검은 나고야오비)", "w": "히토에다이코(홑 오타이코), 쓰노다시", "p": ["히토에다이코로 매므로 경사의 예복에는 쓰지 않음", "염색 나고야오비는 캐주얼, 직조 나고야오비는 조금 격식 있는 자리에도", "길이 약 3.6m"]}, "th": {"n": "โอบิสำหรับใส่ประจำวันจนถึงออกนอกบ้าน", "o": "โคมง ซึมุงิ อิโระมุจิ ซึเคะซาเงะ (tsukesage) ชุดไว้ทุกข์ (นาโงยะโอบิสีดำ)"}, "vi": {"o": "Komon, tsumugi, iromuji, tsukesage, kimono tang (Nagoya obi màu đen)"}}, "o-heko": {"en": {"p": ["Named after the heko, young men of Kagoshima who wore it", "Puts little pressure on the body, so it is very comfortable", "A classic for children's Shichi-Go-San and summer festivals"]}, "fr": {"d": "Un simple pan de tissu souple utilisé comme obi, sans entoilage rigide. C'était à l'origine la ceinture quotidienne des hommes et des enfants ; aujourd'hui, les femmes l'apprécient aussi avec le yukata pour son aspect doux et vaporeux. Il se noue aussi facilement qu'un simple nœud à boucles.", "w": "Simple nœud à boucles (chōcho-musubi), etc.", "p": ["Son nom vient des heko, jeunes hommes de Kagoshima qui le portaient", "Il serre peu et reste très confortable", "Un classique pour le Shichi-Go-San des enfants et les fêtes d'été"]}, "de": {"p": ["Benannt nach den Heko, jungen Männern aus Kagoshima, die ihn trugen", "Schnürt kaum ein und ist sehr bequem", "Ein Klassiker für das Shichi-Go-San-Fest der Kinder und für Sommerfeste"]}, "es": {"d": "Una pieza de tela suave que se usa como obi, sin entretela rígida. Originalmente era la faja diaria de hombres y niños, y hoy también es popular entre las mujeres con el yukata por su aspecto suave y vaporoso. Se ata tan fácilmente como un lazo.", "p": ["Su nombre viene de los heko, jóvenes de Kagoshima que lo usaban", "Apenas aprieta y es muy cómodo", "Un clásico en el Shichi-Go-San infantil y los festivales de verano"]}, "yue": {"d": "直接用柔軟布料做成的腰帶，沒有襯芯。原本是男性和兒童的日常腰帶，如今因其蓬鬆可愛的造型，也很受女性搭配浴衣的歡迎。像繫蝴蝶結一樣簡單。"}, "th": {"w": "ผูกโบว์แบบเรียบง่าย (โชโช-มุซุบิ) และอื่น ๆ"}}, "n-otaiko": {"ja": {"d": "背中にふくらんだ箱のような形をつくる、大人の女性の最も一般的な帯結びです。江戸時代後期の文化14年（1817年）、亀戸天神の太鼓橋が再建された際の渡り初めで、深川の芸者が結んだのが始まりと言われます。"}, "en": {"d": "Forms a padded, box-like shape on the back and is the most common knot for adult women. It is said to have begun in 1817, late in the Edo period, when geisha of Fukagawa wore it to the opening ceremony of the rebuilt Taiko-bashi (drum bridge) at Kameido Tenjin Shrine."}, "fr": {"d": "Il dessine dans le dos un volume rembourré en forme de boîte et c'est le nœud le plus courant chez les femmes adultes. Il serait apparu en 1817, à la fin de l'époque d'Edo, lorsque des geishas de Fukagawa l'auraient porté lors de la cérémonie d'inauguration du Taiko-bashi (pont-tambour) reconstruit du sanctuaire Kameido Tenjin.", "p": ["Le double tambour en fukuro obi signifie « des joies qui se superposent » et sert aux célébrations", "Aux funérailles, on fait un tambour simple pour ne pas « doubler » le malheur", "Mis en forme avec un coussinet (obi-makura), une écharpe (obi-age) et un cordon (obi-jime)"], "tag": "Le nœud le plus courant, qui forme un « tambour » carré dans le dos."}, "de": {"d": "Er bildet auf dem Rücken eine gepolsterte Kastenform und ist der häufigste Knoten erwachsener Frauen. Er soll 1817, in der späten Edo-Zeit, entstanden sein, als Geishas aus Fukagawa ihn zur Einweihung der wiederaufgebauten Taiko-Bashi (Trommelbrücke) am Kameido-Tenjin-Schrein trugen.", "p": ["Die doppelte Trommel mit Fukuro-Obi steht für „Freude, die sich häuft“ und wird bei Feiern getragen", "Bei Trauerfeiern bindet man eine einfache Trommel, damit sich Leid nicht „verdoppelt“", "Geformt mit Obi-Kissen (Obi-Makura), Tuch (Obi-Age) und Kordel (Obi-Jime)"]}, "es": {"d": "Forma en la espalda una figura acolchada como una caja y es el nudo más habitual entre las mujeres adultas. Se dice que nació en 1817, a finales de la era Edo, cuando las geishas de Fukagawa lo llevaron en la ceremonia de inauguración del Taiko-bashi (puente tambor) reconstruido del santuario Kameido Tenjin."}, "zh": {"d": "在背后形成饱满箱形的系法，是成年女性最常见的腰带结。据说始于江户时代后期的文化十四年（1817年）：龟户天神的太鼓桥重建后举行首次过桥仪式时，深川的艺伎系出了此结。", "p": ["袋带的二重太鼓寓意“喜上加喜”，用于喜庆场合", "丧事用一重太鼓，寓意“不幸不再重复”", "使用带枕（衬垫）、带扬（绸巾）、带缔（系绳）来固定造型"]}, "yue": {"d": "在背後形成飽滿箱形的結法，是成年女性最常見的腰帶結。據說始於江戶時代後期的文化十四年（1817年）：龜戶天神的太鼓橋重建後舉行首次過橋儀式時，深川的藝伎繫出了此結。", "p": ["袋帶的二重太鼓寓意「喜上加喜」，用於喜慶場合", "喪事用一重太鼓，寓意「不幸不再重複」", "使用帶枕（襯墊）、帶揚（綢巾）、帶締（繫繩）來固定造型"], "tag": "在背後形成方形「太鼓」的最常見結法。"}, "ko": {"d": "등에 부푼 상자 같은 모양을 만드는, 성인 여성의 가장 일반적인 오비 매듭입니다. 에도 시대 후기인 분카 14년(1817년), 가메이도 덴진의 다이코바시(북 다리)가 재건되어 처음 건너는 행사가 열렸을 때 후카가와의 게이샤가 맨 것이 시초라고 합니다.", "w": "나고야오비(히토에다이코), 후쿠로오비(니주다이코)", "p": ["후쿠로오비의 니주다이코는 '기쁨이 겹친다'는 뜻으로 경사에", "장례에는 '불행이 겹치지 않도록' 히토에다이코로 맴", "오비마쿠라(받침)·오비아게(장식 천)·오비지메(장식 끈)로 모양을 잡음"]}, "th": {"d": "ผูกเป็นทรงพองคล้ายกล่องที่ด้านหลัง เป็นวิธีผูกที่พบบ่อยที่สุดสำหรับผู้หญิงวัยผู้ใหญ่ กล่าวกันว่าเริ่มขึ้นในปี 1817 ช่วงปลายสมัยเอโดะ เมื่อเกอิชาแห่งฟุคางาวะผูกแบบนี้ในพิธีข้ามสะพานครั้งแรกของสะพานไทโกะบาชิ (สะพานกลอง) ที่ศาลเจ้าคาเมอิโดะเท็นจินซึ่งสร้างขึ้นใหม่", "p": ["การผูกกลองสองชั้นด้วยฟุคุโระโอบิหมายถึง “ความยินดีที่ซ้อนกัน” จึงใช้ในงานมงคล", "ในงานศพจะผูกกลองชั้นเดียว เพื่อไม่ให้ความโศกเศร้า “ซ้อนกัน”", "จัดทรงด้วยหมอนรองโอบิ (obi-makura) ผ้าคาดเหนือโอบิ (obi-age) และเชือกผูกโอบิ (obi-jime)"]}, "vi": {"d": "Tạo một khối phồng như chiếc hộp ở sau lưng, là kiểu thắt obi phổ biến nhất của phụ nữ trưởng thành. Tương truyền kiểu này bắt đầu vào năm 1817, cuối thời Edo, khi các geisha vùng Fukagawa thắt kiểu này trong lễ khánh thành cây cầu Taiko-bashi (cầu trống) được xây lại tại đền Kameido Tenjin.", "p": ["Kiểu trống đôi với fukuro obi mang ý nghĩa “niềm vui chồng niềm vui”, dùng trong dịp mừng", "Trong tang lễ dùng trống đơn để nỗi buồn không bị “nhân đôi”", "Tạo dáng bằng gối đỡ obi (obi-makura), khăn obi (obi-age) và dây obi (obi-jime)"]}}, "n-bunko": {"ja": {"d": "左右に羽を水平に広げ、中央を手先で巻いて留める、リボンのような形の結び方です。江戸時代に武家の女性が結んだのが始まりと言われます。半幅帯で結べば浴衣の定番に、袋帯で結べば振袖にも合う華やかな形になります。"}, "en": {"d": "A ribbon-like bow with wings spread horizontally to the left and right and the center wrapped neatly with the other end. It is said to have been tied by women of samurai families in the Edo period. Tied with a hanhaba obi it is the classic yukata look; tied with a fukuro obi it becomes a showy knot for furisode."}, "fr": {"n": "Le nœud en ruban classique", "tag": "Un nœud traditionnel en forme de ruban.", "d": "Un nœud en forme de ruban, ailes déployées à l'horizontale à gauche et à droite, dont le centre est enveloppé proprement par l'autre extrémité. Il aurait été porté par les femmes des familles de samouraïs à l'époque d'Edo. Avec un hanhaba obi, c'est le look classique du yukata ; avec un fukuro obi, il devient un nœud spectaculaire pour le furisode."}, "de": {"d": "Ein schleifenartiger Knoten mit waagerecht nach links und rechts ausgebreiteten Flügeln, dessen Mitte sauber mit dem anderen Ende umwickelt wird. Er soll in der Edo-Zeit von Frauen aus Samuraifamilien gebunden worden sein. Mit Hanhaba-Obi ist er der klassische Yukata-Look, mit Fukuro-Obi ein prächtiger Knoten zum Furisode.", "p": ["Der beliebteste Knoten zum Yukata", "Soll auf den Knoten von Frauen aus Samuraifamilien der Edo-Zeit zurückgehen", "Je nach Obi leger oder formell"]}, "es": {"d": "Un lazo con las alas abiertas en horizontal a izquierda y derecha y el centro envuelto con el otro extremo. Se dice que lo usaban las mujeres de familias samurái en la era Edo. Con un hanhaba obi es el look clásico del yukata; con un fukuro obi se convierte en un nudo vistoso para el furisode.", "p": ["El nudo más popular para el yukata", "Se dice que viene del nudo de las mujeres de familias samurái de la era Edo", "Informal o formal según el obi que se use"]}, "zh": {"d": "左右水平展开双翼，中央用带头缠绕固定的蝴蝶结造型。据说起源于江户时代武士家族女性的系法。用半幅带系是浴衣的经典造型，用袋带系则成为适合振袖的华丽结。"}, "yue": {"d": "左右水平展開雙翼，中央用帶頭纏繞固定的蝴蝶結造型。據說起源於江戶時代武士家族女性的結法。用半幅帶繫是浴衣的經典造型，用袋帶繫則成為適合振袖的華麗結。", "tag": "形似蝴蝶結、歷史悠久的經典結法。", "o": "浴衣、小紋、振袖（用袋帶繫時）", "p": ["浴衣最受歡迎的結法", "據說源自江戶時代武家女性的結法", "根據腰帶種類，可休閒也可正式"]}, "ko": {"d": "좌우로 날개를 수평으로 펼치고, 가운데를 오비의 짧은 끝(데사키)으로 감아 고정하는 리본 모양의 매듭입니다. 에도 시대 무사 가문의 여성이 매던 것이 시초라고 합니다. 한하바오비로 매면 유카타의 정석이 되고, 후쿠로오비로 매면 후리소데에도 어울리는 화려한 형태가 됩니다."}, "th": {"n": "วิธีผูกโอบิทรงโบว์ยอดนิยม", "tag": "วิธีผูกโอบิทรงโบว์ริบบิ้นที่นิยมกันมาแต่โบราณ", "d": "วิธีผูกทรงโบว์ริบบิ้นที่กางปีกออกไปทางซ้ายและขวาในแนวนอน แล้วใช้ปลายโอบิอีกด้าน (เทซากิ) พันตรงกลางไว้ เชื่อกันว่าเริ่มจากหญิงในตระกูลซามูไรสมัยเอโดะ หากผูกด้วยฮันฮาบะโอบิจะเป็นลุคมาตรฐานของยูกาตะ หากผูกด้วยฟุคุโระโอบิจะกลายเป็นทรงที่หรูหราเหมาะกับฟุริโซเดะด้วย", "o": "ยูกาตะ โคมง ฟุริโซเดะ (เมื่อผูกด้วยฟุคุโระโอบิ)", "w": "ฮันฮาบะโอบิ ฟุคุโระโอบิ มารุโอบิ", "p": ["เป็นวิธีผูกโอบิที่นิยมที่สุดสำหรับยูกาตะ", "เชื่อกันว่ามีต้นกำเนิดจากวิธีผูกของหญิงตระกูลซามูไรในสมัยเอโดะ", "เป็นได้ทั้งลำลองและพิธีการ ขึ้นอยู่กับชนิดของโอบิ"]}, "vi": {"d": "Kiểu thắt hình chiếc nơ với hai cánh dang ngang sang trái phải, phần giữa được quấn gọn bằng đầu obi còn lại (tesaki). Tương truyền kiểu này bắt nguồn từ cách thắt của phụ nữ trong các gia đình samurai thời Edo. Thắt bằng hanhaba obi sẽ thành kiểu kinh điển cho yukata; thắt bằng fukuro obi sẽ thành kiểu rực rỡ hợp với cả furisode."}}, "n-darari": {"ja": {"d": "長さ約5mの「だらりの帯」を使い、両端を足首近くまで長く垂らす結び方です。京都の舞妓さんの象徴的な装いで、帯の端には所属する置屋の紋が入ります。江戸時代に女性の間で流行した結び方が、今も舞妓さんに受け継がれています。", "o": "舞妓の装い"}, "en": {"d": "Uses a darari obi about 5 m long, with both ends hanging almost to the ankles. It is the iconic look of Kyoto's maiko (apprentice geisha), and the end of the obi bears the crest of the okiya (geisha house) she belongs to. It was a fashionable knot among women in the Edo period and survives today in the maiko's attire.", "o": "Maiko attire", "p": ["The signature look of maiko; once she becomes a geiko, she switches to the drum knot", "The hanging ends carry the okiya's crest", "Most visitors see it in Kyoto's Gion district or at maiko makeover studios"]}, "fr": {"d": "Il utilise un darari obi d'environ 5 m, dont les deux extrémités tombent presque jusqu'aux chevilles. C'est l'image emblématique des maiko (apprenties geishas) de Kyoto, et le bout de l'obi porte le blason de l'okiya (maison de geishas) à laquelle appartient la maiko. Ce nœud, en vogue chez les femmes à l'époque d'Edo, se perpétue aujourd'hui dans la tenue des maiko.", "o": "Tenue de maiko", "w": "Maru obi (darari obi)", "p": ["La tenue emblématique des maiko ; devenue geiko, elle passe au nœud en tambour", "Les pans tombants portent le blason de l'okiya", "On le voit surtout dans le quartier de Gion à Kyoto ou lors de séances de déguisement en maiko"]}, "de": {"d": "Dafür wird ein etwa 5 m langer Darari-Obi verwendet, dessen Enden fast bis zu den Knöcheln herabhängen. Er ist das Markenzeichen der Maiko (Geisha-Lehrlinge) in Kyoto; am Obi-Ende prangt das Wappen ihres Okiya (Geishahauses). In der Edo-Zeit war dieser Knoten bei Frauen in Mode, und in der Kleidung der Maiko lebt er bis heute fort.", "o": "Maiko-Gewand", "p": ["Markenzeichen der Maiko; als Geiko wechseln sie zum Trommelknoten", "Die herabhängenden Enden tragen das Wappen des Okiya", "Besucher sehen ihn meist in Kyotos Gion-Viertel oder in Maiko-Fotostudios"]}, "es": {"d": "Se usa un darari obi de unos 5 m, con ambos extremos colgando casi hasta los tobillos. Es la imagen icónica de las maiko (aprendices de geisha) de Kioto, y el extremo del obi lleva el blasón de su okiya (casa de geishas). Fue un nudo de moda entre las mujeres de la era Edo y hoy perdura en el atuendo de las maiko.", "o": "Atuendo de maiko", "w": "Maru obi (darari obi)", "p": ["Es el sello de las maiko; al convertirse en geiko pasan al nudo de tambor", "Los extremos colgantes llevan el blasón de la okiya", "Los visitantes suelen verlo en el barrio de Gion de Kioto o en estudios de disfraz de maiko"]}, "zh": {"d": "使用长约5米的“垂带”，两端长长地垂到接近脚踝。这是京都舞妓（见习艺伎）的标志性装扮，腰带末端带有所属置屋（艺伎馆）的纹章。这种江户时代在女性之间流行的系法，至今仍由舞妓传承。", "o": "舞妓装扮", "p": ["舞妓特有的装扮，成为艺伎后改系太鼓结", "垂下的带尾上带有置屋的纹章", "游客多在京都祇园或舞妓体验馆见到"]}, "yue": {"d": "使用長約5米的「垂帶」，兩端長長地垂到接近腳踝。這是京都舞妓（見習藝伎）的標誌性裝扮，腰帶末端帶有所屬置屋（藝伎館）的紋章。這種江戶時代在女性之間流行的結法，至今仍由舞妓傳承。", "o": "舞妓裝扮", "p": ["舞妓特有的裝扮，成為藝伎後改繫太鼓結", "垂下的帶尾上帶有置屋的紋章", "遊客多在京都祇園或舞妓體驗館見到"], "tag": "將長長的腰帶垂到腳踝附近，京都舞妓的結法。"}, "ko": {"d": "길이 약 5m의 '다라리 오비'를 써서 양끝을 발목 가까이까지 길게 늘어뜨리는 매듭입니다. 교토 마이코(견습 게이샤)의 상징적인 차림으로, 오비 끝에는 소속된 오키야(게이샤 집)의 문장(紋)이 들어갑니다. 에도 시대에 여성들 사이에서 유행한 매듭이 지금도 마이코에게 이어지고 있습니다.", "o": "마이코 차림", "p": ["마이코만의 차림으로, 게이코가 되면 오타이코로 바꿈", "늘어진 끝자락에 오키야의 문장이 들어감", "관광객은 교토 기온이나 마이코 체험 스튜디오에서 많이 봄"]}, "th": {"n": "วิธีผูกโอบิของไมโกะ", "tag": "วิธีผูกโอบิของไมโกะแห่งเกียวโต ที่ปล่อยชายโอบิยาวห้อยลงเกือบถึงข้อเท้า", "d": "ใช้ “ดาราริโอบิ” (darari obi) ที่ยาวประมาณ 5 m และปล่อยปลายทั้งสองข้างห้อยยาวลงมาเกือบถึงข้อเท้า เป็นการแต่งกายอันเป็นสัญลักษณ์ของไมโกะ (เกอิชาฝึกหัด) แห่งเกียวโต ที่ปลายโอบิจะมีตราประจำโอกิยะ (okiya: บ้านเกอิชา) ที่เธอสังกัดอยู่ วิธีผูกนี้เคยเป็นที่นิยมในหมู่ผู้หญิงสมัยเอโดะ และยังคงสืบทอดอยู่ในการแต่งกายของไมโกะจนถึงปัจจุบัน", "o": "ชุดไมโกะ", "w": "มารุโอบิ (ดาราริโอบิ)", "p": ["เป็นการแต่งกายเฉพาะของไมโกะ เมื่อเลื่อนขั้นเป็นเกโกะ (geiko) จะเปลี่ยนไปผูกแบบกลอง (โอไทโกะ)", "ที่ปลายชายโอบิมีตราประจำโอกิยะ", "มักได้เห็นที่ย่านกิองในเกียวโต หรือในบริการแต่งตัวเป็นไมโกะ"]}, "vi": {"d": "Sử dụng “darari obi” dài khoảng 5 m, để hai đầu buông dài gần tới mắt cá chân. Đây là trang phục biểu tượng của các maiko (geisha tập sự) ở Kyoto, và phần đầu obi mang huy hiệu (mon) của okiya (nhà geisha) mà cô ấy trực thuộc. Kiểu thắt từng thịnh hành trong giới phụ nữ thời Edo này đến nay vẫn được các maiko gìn giữ.", "o": "Trang phục maiko", "p": ["Chỉ maiko mới thắt kiểu này; khi trở thành geiko sẽ chuyển sang kiểu otaiko", "Phần đuôi obi buông xuống mang huy hiệu của okiya", "Thường được bắt gặp ở khu Gion, Kyoto hoặc tại các dịch vụ trải nghiệm hóa trang maiko"]}}, "n-ronin": {"ja": {"n": "手軽で平たい男性の帯結び", "tag": "手先を斜め上にのぞかせる、手軽で平たい男性の角帯の結び方です。", "d": "貝の口と同じ要領でひと結びした後、手先を斜め上に折り上げ、垂れ先を胴に巻いた帯の間に差し込んで留める角帯の結び方です。「片ばさみ」の変形とされ、結び目が小さく平たいのが特長です。名前の由来には定説がありません。", "o": "男性の浴衣・普段着", "w": "角帯（女性は半幅帯でも）", "p": ["貝の口より簡単に結べる", "結び目が平たく、座っても背中に当たりにくい", "改まった場では貝の口などを選ぶ"]}, "en": {"n": "The quick, flat rōnin knot", "tag": "A quick, flat men's knot for the kaku obi, with one end peeking up at an angle.", "d": "Tied like kai-no-kuchi at first; then one end is folded up at an angle and the other is tucked down between the layers wrapped around the waist. Considered a variation of the katabasami knot, it is small and flat. The origin of the name is uncertain.", "o": "Men's yukata and casual kimono", "w": "Kaku obi (women can also use a hanhaba obi)", "p": ["Even simpler to tie than kai-no-kuchi", "The flat knot does not press into your back when seated", "For dressier occasions, choose kai-no-kuchi instead"]}, "fr": {"n": "Le nœud rōnin, rapide et plat", "tag": "Un nœud masculin rapide et plat pour le kaku obi, dont une extrémité pointe en biais vers le haut.", "d": "Il commence comme le kai-no-kuchi ; on replie ensuite une extrémité en biais vers le haut et on glisse l'autre vers le bas entre les tours de l'obi autour de la taille. Considéré comme une variante du nœud katabasami, il est petit et plat. L'origine de son nom est incertaine.", "w": "Kaku obi (les femmes peuvent aussi utiliser un hanhaba obi)", "p": ["Encore plus simple à nouer que le kai-no-kuchi", "Le nœud plat ne gêne pas le dos en position assise", "Pour une occasion plus habillée, préférez le kai-no-kuchi"]}, "de": {"n": "Der schnelle, flache Rōnin-Knoten", "tag": "Ein schneller, flacher Herrenknoten für den Kaku-Obi, bei dem ein Ende schräg nach oben hervorschaut.", "d": "Zunächst wie Kai-no-Kuchi gebunden; dann wird ein Ende schräg nach oben gefaltet und das andere zwischen die um die Taille gewickelten Lagen nach unten gesteckt. Er gilt als Variante des Katabasami-Knotens und ist klein und flach. Die Herkunft des Namens ist ungeklärt.", "o": "Yukata und legere Kimonos für Herren", "w": "Kaku-Obi (Frauen auch mit Hanhaba-Obi)", "p": ["Noch einfacher zu binden als Kai-no-Kuchi", "Der flache Knoten drückt im Sitzen nicht in den Rücken", "Für festlichere Anlässe lieber Kai-no-Kuchi wählen"]}, "es": {"n": "El nudo rōnin, rápido y plano", "tag": "Un nudo masculino rápido y plano para el kaku obi, con un extremo que asoma en diagonal hacia arriba.", "d": "Se empieza como el kai-no-kuchi; luego se dobla un extremo en diagonal hacia arriba y el otro se mete hacia abajo entre las vueltas del obi alrededor de la cintura. Se considera una variante del nudo katabasami y es pequeño y plano. El origen del nombre es incierto.", "w": "Kaku obi (las mujeres también pueden usar un hanhaba obi)", "p": ["Aún más fácil de atar que el kai-no-kuchi", "El nudo plano no molesta en la espalda al sentarse", "Para ocasiones más formales, mejor el kai-no-kuchi"]}, "zh": {"n": "简便扁平的浪人结", "tag": "让带头斜向上露出、简便扁平的男性角带系法。", "d": "先按贝之口的要领打一个结，再将带头斜向上折起，把带尾插进缠在腰上的腰带之间固定，是一种角带系法。被视为“片挟”结的变形，特点是结小而扁平。名称由来并无定论。", "w": "角带（女性也可用半幅带）", "p": ["比贝之口更容易系", "结扁平，坐下时也不易硌到背部", "较正式的场合宜选择贝之口等"]}, "yue": {"n": "簡便扁平的浪人結", "tag": "讓帶頭斜向上露出、簡便扁平的男性角帶結法。", "d": "先按貝之口的要領打一個結，再將帶頭斜向上折起，把帶尾插進纏在腰上的腰帶之間固定，是一種角帶結法。被視為「片挾」結的變形，特點是結小而扁平。名稱由來並無定論。", "w": "角帶（女性也可用半幅帶）", "p": ["比貝之口更容易繫", "結扁平，坐下時也不易硌到背部", "較正式的場合宜選擇貝之口等"]}, "ko": {"n": "간편하고 납작한 남성 매듭", "tag": "오비 끝을 비스듬히 위로 내보이는, 간편하고 납작한 남성 가쿠오비 매듭.", "d": "가이노쿠치와 같은 요령으로 한 번 묶은 뒤, 짧은 끝(데사키)을 비스듬히 위로 접어 올리고 긴 끝(다레)을 허리에 감은 오비 사이에 끼워 고정하는 가쿠오비 매듭입니다. '가타바사미'의 변형으로 여겨지며, 매듭이 작고 납작한 것이 특징입니다. 이름의 유래에는 정설이 없습니다.", "w": "가쿠오비(여성은 한하바오비로도)", "p": ["가이노쿠치보다 쉽게 맬 수 있음", "매듭이 납작해 앉아도 등에 잘 배기지 않음", "격식 있는 자리에는 가이노쿠치 등을 선택"]}, "th": {"n": "วิธีผูกโอบิผู้ชายแบบง่ายและแบน", "tag": "วิธีผูกคาคุโอบิ (kaku obi) ของผู้ชายที่ง่ายและแบน โดยให้ปลายโอบิโผล่ขึ้นมาในแนวเฉียง", "d": "ผูกหนึ่งครั้งแบบเดียวกับไคโนะคุจิ (kai-no-kuchi) จากนั้นพับปลายเทซากิ (ปลายสั้น) ขึ้นในแนวเฉียง แล้วสอดปลายทาเระ (ปลายยาว) เข้าไประหว่างชั้นโอบิที่พันรอบเอวเพื่อยึดไว้ ถือเป็นรูปแบบหนึ่งของการผูกแบบคาตะบาซามิ (katabasami) จุดเด่นคือปมมีขนาดเล็กและแบน ส่วนที่มาของชื่อยังไม่มีข้อสรุปแน่ชัด", "o": "ยูกาตะและกิโมโนลำลองของผู้ชาย", "w": "คาคุโอบิ (ผู้หญิงใช้ฮันฮาบะโอบิได้ด้วย)", "p": ["ผูกง่ายกว่าไคโนะคุจิ", "ปมแบน จึงไม่กดทับหลังเวลานั่ง", "ในโอกาสที่เป็นทางการกว่า ควรเลือกวิธีผูกอย่างไคโนะคุจิ"]}, "vi": {"n": "Kiểu thắt rōnin nhanh gọn, dẹt", "tag": "Kiểu thắt kaku obi nhanh gọn, dẹt của nam giới, với một đầu obi ló lên theo đường chéo.", "d": "Đầu tiên thắt một nút giống như kai-no-kuchi, sau đó gập đầu tesaki (đầu ngắn) chéo lên trên, rồi nhét đầu tare (đầu dài) vào giữa các lớp obi quấn quanh eo để cố định. Kiểu này được xem là một biến thể của kiểu thắt katabasami, đặc trưng bởi nút thắt nhỏ và dẹt. Nguồn gốc tên gọi đến nay vẫn chưa có lời giải thích chắc chắn.", "w": "Kaku obi (nữ cũng có thể dùng hanhaba obi)", "p": ["Thắt còn dễ hơn kai-no-kuchi", "Nút thắt dẹt nên khi ngồi không bị cấn lưng", "Ở những dịp trang trọng hơn, nên chọn kiểu kai-no-kuchi"]}}, "t-yuzen": {"ja": {"w": "京友禅（京都）、加賀友禅（石川）、東京手描友禅（東京）"}, "en": {"w": "Kyō-yūzen (Kyoto), Kaga-yūzen (Ishikawa), Tokyo tegaki-yūzen (Tokyo)"}, "fr": {"w": "Kyō-yūzen (Kyoto), Kaga-yūzen (Ishikawa), Tokyo tegaki-yūzen (Tokyo)", "p": ["Reconnaissable aux fins contours blancs laissés par la pâte", "Le Kaga-yūzen privilégie des fleurs réalistes, jusqu'aux feuilles rongées ; le Kyō-yūzen ajoute souvent or et broderie", "Un seul kimono peut demander plusieurs mois de travail"]}, "de": {"w": "Kyō-Yūzen (Kyoto), Kaga-Yūzen (Ishikawa), Tokyo-Tegaki-Yūzen (Tokio)"}, "es": {"w": "Kyō-yūzen (Kioto), Kaga-yūzen (Ishikawa), Tokyo tegaki-yūzen (Tokio)"}, "zh": {"o": "振袖、留袖、访问着、付下（简约版访问着）", "w": "京友禅（京都）、加贺友禅（石川）、东京手描友禅（东京）"}, "yue": {"o": "振袖、留袖、訪問着、付下（簡約版訪問着）", "w": "京友禪（京都）、加賀友禪（石川）、東京手描友禪（東京）"}, "ko": {"o": "후리소데, 도메소데, 호몬기, 쓰케사게(간략한 호몬기)", "w": "교유젠(교토), 가가유젠(이시카와), 도쿄 데가키유젠(도쿄)"}, "th": {"o": "ฟุริโซเดะ โทเมะโซเดะ โฮมงงิ ซึเคะซาเงะ (tsukesage)", "w": "เคียวยูเซ็น (เกียวโต) คางะยูเซ็น (อิชิกาวะ) โตเกียวเทงากิยูเซ็น (โตเกียว)", "p": ["สังเกตได้จากเส้นขอบสีขาวเส้นเล็ก ๆ (อิโตเมะ) ที่เกิดจากแป้งเปียก", "คางะยูเซ็น (Kaga-yūzen) โดดเด่นด้วยดอกไม้ใบหญ้าที่สมจริงจนถึงขั้นมีใบไม้ที่ถูกแมลงกัดกิน ส่วนเคียวยูเซ็น (Kyō-yūzen) มักเพิ่มความหรูหราด้วยทองและงานปัก", "กิโมโนหนึ่งตัวอาจใช้เวลาทำหลายเดือน"]}, "vi": {"w": "Kyō-yūzen (Kyoto), Kaga-yūzen (Ishikawa), Tokyo tegaki-yūzen (Tokyo)"}}, "t-ise": {"ja": {"p": ["遠目には無地に見えるほど細かい柄もある", "伊勢型紙（伝統的工芸品としての名称は「伊勢形紙」）は国指定の伝統的工芸用具", "型紙の彫刻技術は国の重要無形文化財に指定"]}, "en": {"p": ["Some patterns are so fine that they look plain from a distance", "Ise-katagami are a nationally designated traditional craft tool", "The stencil-carving skills are designated an Important Intangible Cultural Property"]}, "fr": {"p": ["Certains motifs sont si fins qu'ils semblent unis de loin", "Les Ise-katagami sont un outil artisanal traditionnel désigné par l'État", "Leur technique de découpe est classée bien culturel immatériel important"], "w": "Pochoirs : Suzuka, Mie (Shiroko et Jike) / Teinture : Tokyo, Kyoto, etc."}, "de": {"d": "Eine Schablone namens Ise-Katagami, geschnitten aus mehreren mit Kakitannin verklebten Lagen Washi-Papier, wird auf den Stoff gelegt. Darüber wird Paste gestrichen, die das Muster beim Färben ausspart. Die Schablonen werden seit Langem in Shiroko und Jike in Suzuka (Präfektur Mie) hergestellt und ermöglichten die extrem feinen Muster des Edo-Komon.", "p": ["Manche Muster sind so fein, dass sie aus der Ferne einfarbig wirken", "Ise-Katagami sind ein staatlich anerkanntes traditionelles Handwerkswerkzeug", "Die Schneidetechnik ist als wichtiges immaterielles Kulturgut ausgewiesen"]}, "es": {"p": ["Algunos dibujos son tan finos que de lejos parecen lisos", "Los Ise-katagami son una herramienta artesanal tradicional con designación oficial del Estado", "La técnica de tallado está declarada Bien Cultural Inmaterial Importante"]}, "zh": {"p": ["有些花纹细到远看像素色", "伊势型纸（作为传统工艺品的正式名称为“伊势形纸”）是日本国家指定的传统工艺用具", "型纸雕刻技术被指定为日本国家重要无形文化财"]}, "yue": {"p": ["有些花紋細到遠看像素色", "伊勢型紙（作為傳統工藝品的正式名稱為「伊勢形紙」）是日本國家指
