定的傳統工藝用具", "型紙雕刻技術被指定為日本國家重要無形文化財"]}, "ko": {"d": "감물로 여러 겹 붙인 화지(和紙)에 무늬를 새긴 '이세 가타가미'를 원단 위에 놓고, 그 위에 풀을 발라 무늬 부분이 염색되지 않게 하는 기법입니다. 가타가미는 예로부터 미에현 스즈카시 시로코·지케 일대에서 만들어져 왔으며, 에도코몬 같은 매우 섬세한 무늬를 가능하게 했습니다.", "o": "에도코몬, 고몬, 유카타", "p": ["멀리서 보면 무지처럼 보일 만큼 섬세한 무늬도 있음", "이세 가타가미(전통 공예품 지정 명칭은 한자로 '伊勢形紙')는 국가 지정 전통 공예 용구", "본 조각 기술은 국가 중요 무형문화재로 지정"]}, "th": {"d": "นำแม่พิมพ์ฉลุที่เรียกว่าอิเสะคาตากามิ (Ise-katagami) ซึ่งทำจากกระดาษวาชิหลายชั้นที่ประกบด้วยน้ำฝาดลูกพลับ (คากิชิบุ) และแกะสลักลวดลายไว้ มาวางบนผ้า แล้วปาดแป้งเปียกทับ เพื่อให้ลวดลายคงสีเดิมไว้เมื่อนำผ้าไปย้อม แม่พิมพ์เหล่านี้ผลิตกันมาแต่โบราณที่ชิโรโกะและจิเกะ เมืองซูซูกะ (จังหวัดมิเอะ) และทำให้เกิดลวดลายอันละเอียดยิบของเอโดะโคมง", "o": "เอโดะโคมง โคมง ยูกาตะ", "p": ["บางลายละเอียดมากจนมองจากระยะไกลดูเหมือนผ้าสีพื้น", "อิเสะคาตากามิได้รับการรับรองจากรัฐให้เป็นเครื่องมือสำหรับงานหัตถกรรมดั้งเดิม", "ทักษะการแกะแม่พิมพ์ได้รับการขึ้นทะเบียนเป็นสมบัติทางวัฒนธรรมที่จับต้องไม่ได้ที่สำคัญของประเทศ"]}, "vi": {"p": ["Có những hoa văn nhỏ đến mức nhìn từ xa trông như vải trơn", "Ise-katagami được Nhà nước công nhận là dụng cụ thủ công truyền thống", "Kỹ thuật khắc khuôn giấy được công nhận là Di sản Văn hóa Phi vật thể Quan trọng"]}}, "t-shibori": {"ja": {"d": "布の一部を糸でくくったり、縫い縮めたり、折りたたんだりして染料が入らないようにし、模様を染め出す技法です。鹿の子絞りなどでは、くくった跡が粒状の凹凸として残り、独特の立体感と柔らかな風合いが生まれます。"}, "en": {"d": "Parts of the fabric are bound with thread, stitched and gathered, or folded so the dye cannot reach them, leaving a pattern after dyeing. In techniques such as kanoko, the binding leaves small raised bumps, giving the cloth a unique three-dimensional texture and softness."}, "fr": {"d": "Des parties du tissu sont ligaturées avec du fil, cousues et froncées ou pliées pour que la teinture ne les atteigne pas, laissant un motif après teinture. Dans des techniques comme le kanoko, les ligatures laissent de petits reliefs qui donnent au tissu une texture en trois dimensions et une grande douceur."}, "de": {"d": "Teile des Stoffes werden mit Faden abgebunden, zusammengenäht und gerafft oder gefaltet, damit die Farbe sie nicht erreicht; nach dem Färben bleibt ein Muster. Bei Techniken wie Kanoko hinterlässt das Abbinden kleine Erhebungen, die dem Stoff eine einzigartige plastische Struktur und Weichheit geben."}, "es": {"d": "Partes de la tela se atan con hilo, se cosen y fruncen o se doblan para que el tinte no llegue a ellas, dejando un dibujo tras el teñido. En técnicas como el kanoko, los atados dejan pequeños relieves que dan a la tela una textura tridimensional única y gran suavidad."}, "zh": {"d": "将布料局部用线扎紧、缝缩或折叠，使染料无法渗入，从而染出图案。在鹿子绞等技法中，扎过的地方会留下颗粒状的凹凸，带来独特的立体感和柔软质地。"}, "yue": {"d": "將布料局部用線紮緊、縫縮或摺疊，使染料無法滲入，從而染出圖案。在鹿子絞等技法中，紮過的地方會留下顆粒狀的凹凸，帶來獨特的立體感和柔軟質地。", "n": "紮染技法", "p": ["佈滿小顆粒的「鹿子絞」因形似小鹿背上的斑點而得名", "全身紮染的振袖需手工紮數十萬顆，屬最高級品", "有松·鳴海絞是江戶時代東海道上深受旅人喜愛的特產"]}, "ko": {"d": "천의 일부를 실로 묶거나 꿰매어 오므리거나 접어서 염료가 들어가지 않게 하여 무늬를 내는 염색 기법입니다. 가노코시보리 등에서는 묶은 자국이 오톨도톨한 요철로 남아 독특한 입체감과 부드러운 질감이 생깁니다.", "o": "후리소데, 호몬기, 하오리, 오비아게(장식 천), 유카타"}, "th": {"d": "นำผ้าบางส่วนมามัดด้วยด้าย เย็บรูดให้ย่น หรือพับไว้ เพื่อไม่ให้สีย้อมซึมเข้าไป แล้วจึงย้อมให้เกิดลวดลาย ในเทคนิคอย่างคาโนโกะชิโบริ รอยมัดจะเหลือเป็นปุ่มนูนเล็ก ๆ ทำให้ผ้ามีมิติและสัมผัสนุ่มนวลที่เป็นเอกลักษณ์", "o": "ฟุริโซเดะ โฮมงงิ ฮาโอริ โอบิอาเกะ (ผ้าคาดเหนือโอบิ) ยูกาตะ", "w": "เคียวคาโนโกะชิโบริ (เกียวโต) อาริมัตซึ-นารุมิชิโบริ (ไอจิ)", "p": ["คาโนโกะชิโบริ (kanoko shibori) ที่มีจุดเล็ก ๆ เรียงกัน ได้ชื่อมาจากลายจุดบนหลังลูกกวาง", "ฟุริโซเดะที่ทำชิโบริทั้งตัวต้องมัดด้วยมือหลายแสนจุด และจัดเป็นกิโมโนชั้นสูงสุด", "อาริมัตซึ-นารุมิชิโบริเคยเป็นของฝากยอดนิยมของนักเดินทางบนถนนโทไกโดในสมัยเอโดะ"]}, "vi": {"d": "Một phần vải được buộc bằng chỉ, khâu rút lại hoặc gấp lại để thuốc nhuộm không ngấm vào, từ đó tạo thành hoa văn sau khi nhuộm. Ở các kỹ thuật như kanoko shibori, dấu buộc để lại những nốt nổi nhỏ, mang đến cho vải độ nổi khối độc đáo cùng cảm giác mềm mại."}}, "t-roketsu": {"ja": {"d": "溶かした蠟を筆などで生地に置き、その部分に染料が入らないようにして染める技法です。奈良時代に伝わり正倉院にも作品が残りますが、その後途絶え、大正〜昭和期に染色作家によって復興されました。蠟が割れた部分に染料がしみ込んでできる細かなひび模様が、独特の味わいになります。"}, "en": {"d": "Melted wax is applied to the fabric with a brush or other tool so the dye cannot penetrate those areas. The technique arrived in Japan by the Nara period (8th century) and examples survive in the Shōsōin treasure house; it later died out and was revived by textile artists in the 20th century. Dye seeping into cracks in the wax creates fine crackle lines with a unique charm."}, "fr": {"d": "De la cire fondue est appliquée sur le tissu au pinceau ou avec un autre outil, afin que la teinture n'atteigne pas ces zones. La technique est arrivée au Japon dès l'époque de Nara (VIIIe siècle), et des exemples sont conservés au Shōsōin ; elle a ensuite disparu, avant d'être relancée par des artistes teinturiers au XXe siècle. La teinture qui s'infiltre dans les fissures de la cire crée de fines craquelures au charme unique.", "o": "Hōmongi, tsukesage, Nagoya obi, fukuro obi chic décontracté"}, "de": {"d": "Geschmolzenes Wachs wird mit Pinsel oder anderen Werkzeugen auf den Stoff aufgetragen, damit die Farbe diese Stellen nicht erreicht. Die Technik kam spätestens in der Nara-Zeit (8. Jh.) nach Japan; Beispiele sind im Schatzhaus Shōsōin erhalten. Später geriet sie in Vergessenheit und wurde im 20. Jahrhundert von Textilkünstlern wiederbelebt. Farbe, die in Risse im Wachs eindringt, erzeugt feine Craquelé-Linien mit besonderem Reiz.", "o": "Hōmongi, Tsukesage, Nagoya-Obi, gehoben-legere Fukuro-Obi", "p": ["Geschätzt für das Craquelé-Muster, das entsteht, wo das Wachs bricht", "Eine der drei klassischen Reservefärbetechniken der Nara-Zeit", "Funktioniert nach demselben Prinzip wie die indonesische Batik"]}, "es": {"d": "Se aplica cera derretida sobre la tela con pincel u otras herramientas para que el tinte no llegue a esas zonas. La técnica llegó a Japón como tarde en la era Nara (siglo VIII) y se conservan ejemplos en el tesoro Shōsōin; después desapareció y fue recuperada por artistas del tinte en el siglo XX. El tinte que se filtra por las grietas de la cera crea finas líneas craqueladas con un encanto único.", "o": "Hōmongi, tsukesage, Nagoya obi, fukuro obi informal elegante"}, "zh": {"d": "用毛笔等工具把熔化的蜡涂在布上，使染料无法渗入该处，再进行染色。此技法于奈良时代传入日本，正仓院中仍保存着当时的作品；其后一度失传，到大正至昭和时期才由染色艺术家复兴。染料渗入蜡的裂缝而形成的细小冰裂纹，别有韵味。", "o": "访问着、付下（简约版访问着）、名古屋带、时尚袋带"}, "yue": {"d": "用毛筆等工具把熔化的蠟塗在布上，使染料無法滲入該處，再進行染色。此技法於奈良時代傳入日本，正倉院中仍保存着當時的作品；其後一度失傳，到大正至昭和時期才由染色藝術家復興。染料滲入蠟的裂縫而形成的細小冰裂紋，別有韻味。", "o": "訪問着、付下（簡約版訪問着）、名古屋帶、時尚袋帶", "p": ["蠟裂開形成的「冰裂紋」是其魅力所在", "奈良時代「三纈」之一", "與印尼蠟染（Batik）原理相同"]}, "ko": {"d": "녹인 밀랍을 붓 등으로 원단에 발라 그 부분에 염료가 스며들지 않게 하여 염색하는 기법입니다. 나라 시대에 전해져 쇼소인에도 작품이 남아 있지만, 이후 맥이 끊겼다가 다이쇼~쇼와 시대에 염색 작가들에 의해 부활했습니다. 밀랍이 갈라진 틈으로 염료가 스며들어 생기는 잔금 무늬가 독특한 멋을 냅니다.", "o": "호몬기, 쓰케사게(간략한 호몬기), 나고야오비, 멋내기용 후쿠로오비"}, "th": {"d": "ใช้พู่กันหรืออุปกรณ์อื่น ๆ ป้ายขี้ผึ้งหลอมละลายลงบนผ้า เพื่อไม่ให้สีย้อมซึมเข้าบริเวณนั้น เทคนิคนี้เข้ามาสู่ญี่ปุ่นในสมัยนาระ (ศตวรรษที่ 8) และยังมีผลงานหลงเหลืออยู่ในคลังสมบัติโชโซอิน แต่ต่อมาได้สูญหายไป ก่อนจะได้รับการฟื้นฟูโดยศิลปินงานย้อมในสมัยไทโชถึงโชวะ สีย้อมที่ซึมเข้าไปตามรอยแตกของขี้ผึ้งจะเกิดเป็นลายเส้นแตกละเอียดที่มีเสน่ห์เฉพาะตัว", "o": "โฮมงงิ ซึเคะซาเงะ นาโงยะโอบิ ฟุคุโระโอบิสำหรับแต่งตัวเก๋", "p": ["มีเสน่ห์อยู่ที่ลายเส้นแตกซึ่งเกิดจากรอยร้าวของขี้ผึ้ง", "เป็นหนึ่งในสามเทคนิคการย้อมแบบกันสีอันคลาสสิกของสมัยนาระ (ซังเคจิ)", "ใช้หลักการเดียวกับผ้าบาติกของอินโดนีเซีย"]}, "vi": {"d": "Sáp nóng chảy được phủ lên vải bằng cọ hoặc dụng cụ khác để thuốc nhuộm không thấm vào những chỗ đó. Kỹ thuật này du nhập vào Nhật Bản thời Nara (thế kỷ 8) và các tác phẩm vẫn còn được lưu giữ trong kho báu Shōsōin; về sau kỹ thuật bị thất truyền và được các nghệ nhân nhuộm phục hưng vào thời Đại Chính – Chiêu Hòa. Thuốc nhuộm thấm qua các vết nứt của sáp tạo nên những đường rạn li ti mang vẻ đẹp rất riêng."}}, "t-shishu": {"ja": {"p": ["絹糸を手で撚り分けて、光沢や色の濃淡を表現する", "染めと組み合わせると、より豊かな表情になる", "刺繍が多いほど華やかで豪華な印象に（格は着物の種類で決まる）"]}, "en": {"p": ["Silk threads are split and twisted by hand to control shine and shading", "Combining dyeing and embroidery adds richness", "More embroidery makes a kimono look more lavish (formality depends on the kimono type)"]}, "fr": {"p": ["Les fils de soie sont divisés et retordus à la main pour jouer sur la brillance et les nuances", "Associer teinture et broderie enrichit le décor", "Plus il y a de broderie, plus le kimono paraît somptueux (son niveau de formalité dépend du type de kimono)"]}, "de": {"d": "Eine Verzierungstechnik, bei der Muster mit der Nadel aus Seiden-, Gold- und Silberfäden gestickt werden. Oft wird sie auf gefärbte Muster gesetzt, um Glanz und Tiefe zu verleihen; die japanische Stickerei kennt Dutzende Sticharten. Am bekanntesten ist Kyōnui aus Kyoto.", "o": "Furisode, Tomesode, Hōmongi, Han-Eri-Kragen, Fukuro-Obi, Uchikake-Brautmäntel", "p": ["Seidenfäden werden von Hand geteilt und gedreht, um Glanz und Schattierung zu steuern", "Die Kombination von Färben und Sticken wirkt besonders reich", "Je mehr Stickerei, desto prächtiger wirkt der Kimono (die Formalitätsstufe hängt von der Kimonoart ab)"]}, "es": {"p": ["Los hilos de seda se separan y retuercen a mano para controlar el brillo y los matices", "Combinar teñido y bordado enriquece el diseño", "Cuanto más bordado, más suntuoso parece el kimono (la formalidad depende del tipo de kimono)"]}, "zh": {"o": "振袖、留袖、访问着、半衿（衬领）、袋带、打褂（新娘外褂）", "p": ["手工劈分和捻合丝线，表现光泽和色彩浓淡", "染色与刺绣结合，更显丰富", "刺绣越多，越显华美（规格取决于和服种类）"]}, "yue": {"o": "振袖、留袖、訪問着、半衿（襯領）、袋帶、打褂（新娘外褂）", "p": ["手工劈分和捻合絲線，表現光澤和色彩濃淡", "染色與刺繡結合，更顯豐富", "刺繡越多，越顯華美（規格取決於和服種類）"]}, "ko": {"o": "후리소데, 도메소데, 호몬기, 한에리(덧깃), 후쿠로오비, 우치카케(신부용 겉옷)", "p": ["명주실을 손으로 나누고 꼬아 광택과 색의 농담을 표현", "염색과 자수를 함께 쓰면 더욱 풍성해짐", "자수가 많을수록 화려하고 호화로운 인상(격은 기모노 종류에 따라 정해짐)"]}, "th": {"d": "เทคนิคการตกแต่งที่ใช้เข็มปักลวดลายด้วยด้ายไหม ด้ายทอง และด้ายเงิน มักปักทับบนลวดลายที่ย้อมไว้เพื่อเพิ่มความงดงามและมิติ งานปักญี่ปุ่นมีเทคนิคหลายสิบแบบ และเคียวนุย (Kyōnui) ของเกียวโตเป็นรูปแบบที่มีชื่อเสียงที่สุด", "o": "ฟุริโซเดะ โทเมะโซเดะ โฮมงงิ ฮันเอริ (ปกของชุดตัวใน) ฟุคุโระโอบิ อุจิคาเกะ (เสื้อคลุมเจ้าสาว)", "w": "เคียวนุย (เกียวโต) คางะนุย (อิชิกาวะ) งานปักเอโดะ (โตเกียว)", "p": ["ช่างจะแยกและฟั่นเส้นไหมด้วยมือ เพื่อควบคุมความเงางามและน้ำหนักสี", "เมื่อผสานงานย้อมเข้ากับงานปัก จะยิ่งได้ลวดลายที่มีชีวิตชีวา", "ยิ่งมีงานปักมาก ยิ่งดูงดงามหรูหรา (ส่วนระดับความเป็นทางการขึ้นอยู่กับประเภทของกิโมโน)"]}, "vi": {"p": ["Sợi tơ được tách và se bằng tay để điều chỉnh độ bóng và sắc độ đậm nhạt", "Kết hợp nhuộm và thêu giúp hoa văn thêm phong phú, có hồn", "Càng thêu nhiều, trang phục càng lộng lẫy, sang trọng (mức độ trang trọng do loại kimono quyết định)"]}}, "t-kasuri": {"ja": {"p": ["日本三大絣は久留米・伊予・備後", "輪郭のかすれは、染め分けた糸で織る絣ならではの味わい", "世界では「イカット」と呼ばれる同系統の技法がある"]}, "en": {"p": ["Japan's three great kasuri are Kurume, Iyo and Bingo", "The blurred edges are the signature charm of weaving with pre-dyed threads", "Related techniques are known worldwide as ikat"]}, "fr": {"d": "Des parties des fils sont ligaturées pour résister à la teinture, puis ces fils teints par sections sont tissés pour former le motif. De légers décalages pendant le tissage rendent les contours flous, d'où le nom de kasuri (« estompé »). On l'aime pour sa texture rustique et chaleureuse.", "p": ["Les trois grands kasuri du Japon sont Kurume, Iyo et Bingo", "Les contours flous sont le charme propre au tissage de fils teints à l'avance", "Des techniques apparentées sont connues dans le monde sous le nom d'ikat"], "w": "Kurume kasuri (Fukuoka), Iyo kasuri (Ehime), Bingo kasuri (Hiroshima) ; aussi utilisé dans l'Ōshima et le Yūki tsumugi"}, "de": {"p": ["Japans drei große Kasuri sind Kurume, Iyo und Bingo", "Die verschwommenen Ränder sind der typische Reiz des Webens mit vorgefärbten Fäden", "Verwandte Techniken sind weltweit als Ikat bekannt"]}, "es": {"d": "Se atan partes de los hilos para que no absorban el tinte, y esos hilos teñidos por tramos se tejen formando el dibujo. Los ligeros desplazamientos al tejer hacen que los bordes se vean difuminados, de ahí el nombre kasuri («desvaído»). Se aprecia por su textura rústica y cálida.", "p": ["Los tres grandes kasuri de Japón son Kurume, Iyo y Bingo", "Los bordes difuminados son el encanto propio de tejer con hilos teñidos de antemano", "En el mundo se conocen técnicas afines con el nombre de ikat"]}, "zh": {"p": ["日本三大絣为久留米、伊予、备后", "轮廓的朦胧感，是用分段染色的线织成的絣特有的韵味", "世界各地有被称为“伊卡特（Ikat）”的同类技法"]}, "yue": {"p": ["日本三大絣為久留米、伊予、備後", "輪廓的朦朧感，是用分段染色的線織成的絣特有的韻味", "世界各地有被稱為「伊卡特（Ikat）」的同類技法"]}, "ko": {"w": "구루메가스리(후쿠오카), 이요가스리(에히메), 빈고가스리(히로시마) / 오시마쓰무기·유키쓰무기에도 쓰임", "p": ["일본 3대 가스리는 구루메·이요·빈고", "윤곽의 번짐은 구간별로 염색한 실로 짜는 가스리만의 멋", "세계적으로 '이카트'라 불리는 같은 계열의 기법이 있음"]}, "th": {"d": "มัดด้ายบางส่วนไว้เพื่อกันสี แล้วนำด้ายที่ย้อมแยกสีเป็นช่วง ๆ มาทอให้เกิดลวดลาย ระหว่างทอจะเกิดการเหลื่อมเล็กน้อย ทำให้ขอบลายดูพร่าเลือนเหมือนรอยขูดขีด จึงได้ชื่อว่าคาซูริ (kasuri) ผ้าชนิดนี้เป็นที่รักเพราะสัมผัสที่เรียบง่ายและอบอุ่น", "o": "ซึมุงิ กิโมโนผ้าฝ้าย ยูกาตะ ชุดทำงานอย่างซามุเอะ (samue)", "w": "คุรุเมะคาซูริ (ฟุกุโอกะ) อิโยะคาซูริ (เอฮิเมะ) บิงโงะคาซูริ (ฮิโรชิมะ) / ยังใช้ในโอชิมะซึมุงิและยูกิซึมุงิด้วย", "p": ["สุดยอดคาซูริสามแห่งของญี่ปุ่น ได้แก่ คุรุเมะ อิโยะ และบิงโงะ", "ขอบลายที่พร่าเลือนคือเสน่ห์เฉพาะของคาซูริ ซึ่งทอจากด้ายที่ย้อมแยกสีไว้ก่อน", "เทคนิคในตระกูลเดียวกันนี้เป็นที่รู้จักทั่วโลกในชื่ออิกัต (ikat) ผ้ามัดหมี่ของไทยก็ใช้หลักการเดียวกัน"]}, "vi": {"p": ["Ba dòng kasuri lớn của Nhật Bản là Kurume, Iyo và Bingo", "Đường viền mờ nhòe là nét duyên đặc trưng của kasuri, loại vải dệt từ sợi đã nhuộm từng đoạn", "Trên thế giới, các kỹ thuật tương tự được gọi là ikat"]}}, "t-tsumugi": {"ja": {"d": "本来は、真綿やくず繭・玉繭から紡いだ節のある糸（紬糸）を先に染めてから織る絹織物です。糸の節による独特の凹凸と、光沢を抑えた落ち着いた風合いが生まれます。結城紬は今も真綿の手紡ぎ糸を使いますが、大島紬のように現在は絹糸で織られ「紬」の名だけが残るものもあります。着物の種類としての紬は「着物」タブもご覧ください。", "p": ["真綿の手紡ぎ糸・手くびり絣・地機で織る結城紬の技術は、国の重要無形文化財（1956年）で、ユネスコ無形文化遺産（2010年）にも登録", "大島紬は泥染めによる深い黒褐色が特徴", "くず繭を有効に使うために生まれた織物とも言われる"]}, "en": {"d": "Traditionally woven from slubbed threads spun from silk floss (mawata) or from irregular and double cocoons, which are dyed before weaving. The slubs give a distinctive texture and a soft, matte look. Yūki tsumugi is still made from hand-spun floss, while some, such as Ōshima tsumugi, are now woven from smooth silk thread and keep “tsumugi” only in the name. For tsumugi as a type of kimono, see the Kimono tab.", "p": ["The traditional Yūki tsumugi method (hand-spun floss, hand-tied kasuri, backstrap loom) is an Important Intangible Cultural Property (1956) and on UNESCO's Intangible Cultural Heritage list (2010)", "Ōshima tsumugi is known for the deep black-brown of its mud dyeing", "It is said to have begun as a way to use imperfect cocoons"]}, "fr": {"d": "Soie traditionnellement tissée à partir de fils irréguliers, filés à partir de bourre de soie (mawata) ou de cocons imparfaits et doubles, puis teints avant le tissage. Ces irrégularités donnent une texture particulière et un aspect mat et doux. Le Yūki tsumugi est toujours fait de bourre de soie filée à la main, tandis que d'autres, comme l'Ōshima tsumugi, sont aujourd'hui tissés en fil de soie lisse et ne gardent le mot « tsumugi » que dans leur nom. Pour le tsumugi en tant que type de kimono, voir l'onglet Kimonos.", "p": ["La technique traditionnelle du Yūki tsumugi (bourre filée à la main, kasuri noué à la main, métier à sangle dorsale) est un bien culturel immatériel important (1956) et figure au patrimoine culturel immatériel de l'UNESCO (2010)", "L'Ōshima tsumugi est connu pour le noir-brun profond de sa teinture à la boue", "Il serait né pour utiliser les cocons imparfaits"]}, "de": {"d": "Traditionell aus noppigen Fäden gewebt, die aus Seidenwatte (Mawata) oder aus unregelmäßigen und Doppelkokons gesponnen und vor dem Weben gefärbt werden. Die Noppen ergeben eine charakteristische Struktur und einen weichen, matten Glanz. Yūki-Tsumugi wird bis heute aus handgesponnener Seidenwatte gefertigt, während andere wie Ōshima-Tsumugi heute aus glattem Seidengarn gewebt werden und „Tsumugi“ nur noch im Namen tragen. Zu Tsumugi als Kimonoart siehe den Reiter „Kimonos“.", "p": ["Die traditionelle Yūki-Tsumugi-Technik (handgesponnene Seidenwatte, von Hand abgebundenes Kasuri, Rückengurtwebstuhl) ist wichtiges immaterielles Kulturgut (1956) und Immaterielles Kulturerbe der UNESCO (2010)", "Ōshima-Tsumugi ist für das tiefe Schwarzbraun seiner Schlammfärbung bekannt", "Er soll entstanden sein, um unvollkommene Kokons zu verwerten"]}, "es": {"d": "Tradicionalmente se teje con hilos irregulares, hilados a partir de borra de seda (mawata) o de capullos imperfectos y dobles, que se tiñen antes de tejer. Esas irregularidades dan una textura característica y un aspecto mate y suave. El Yūki tsumugi aún se hace con borra hilada a mano, mientras que otros, como el Ōshima tsumugi, se tejen hoy con hilo de seda liso y conservan «tsumugi» solo en el nombre. Para el tsumugi como tipo de kimono, vea la pestaña Kimonos.", "p": ["La técnica tradicional del Yūki tsumugi (borra hilada a mano, kasuri atado a mano, telar de cintura) es Bien Cultural Inmaterial Importante (1956) y Patrimonio Cultural Inmaterial de la UNESCO (2010)", "El Ōshima tsumugi es famoso por el negro pardo intenso de su teñido con barro", "Se dice que nació para aprovechar los capullos imperfectos"]}, "zh": {"d": "传统上是将丝绵或次等茧、双宫茧纺成的带有节点的线（紬线）先染色再织成的丝织品。线的节点形成独特的凹凸质感和低调的哑光风格。结城紬至今仍使用丝绵手纺线，但也有像大岛紬这样，现在改用普通丝线织造、只保留了“紬”之名的品种。紬作为和服种类的介绍请看“和服”分类。", "p": ["以丝绵手纺线、手扎絣、地机（原始织机）织造的结城紬技艺是日本国家重要无形文化财（1956年），并于2010年列入联合国教科文组织非物质文化遗产", "大岛紬以泥染形成的深黑褐色著称", "据说起源于为了有效利用次等蚕茧"]}, "yue": {"d": "傳統上是將絲綿或次等繭、雙宮繭紡成的帶有節點的線（紬線）先染色再織成的絲織品。線的節點形成獨特的凹凸質感和低調的啞光風格。結城紬至今仍使用絲綿手紡線，但也有像大島紬這樣，現在改用普通絲線織造、只保留了「紬」之名的品種。紬作為和服種類的介紹請看「和服」分類。", "p": ["以絲綿手紡線、手紮絣、地機（原始織機）織造的結城紬技藝是日本國家重要無形文化財（1956年），並於2010年列入聯合國教科文組織非物質文化遺產", "大島紬以泥染形成的深黑褐色著稱", "據說起源於為了有效利用次等蠶繭"]}, "ko": {"d": "본래는 풀솜이나 상한 고치·쌍고치에서 자은 마디 있는 실(쓰무기 실)을 먼저 염색한 뒤 짜는 명주 직물입니다. 실의 마디로 인해 독특한 요철과 광택을 억제한 차분한 질감이 생깁니다. 유키쓰무기는 지금도 풀솜을 손으로 자은 실을 쓰지만, 오시마쓰무기처럼 지금은 매끈한 명주실로 짜고 '쓰무기'라는 이름만 남은 것도 있습니다. 기모노 종류로서의 쓰무기는 '기모노' 탭을 참고하세요.", "o": "쓰무기 기모노, 하오리, 나고야오비, 핫슨오비", "p": ["풀솜을 손으로 자은 실, 손으로 묶는 가스리, 지바타(원시 베틀)로 짜는 유키쓰무기의 기술은 국가 중요 무형문화재(1956년)이자 유네스코 무형문화유산(2010년)", "오시마쓰무기는 진흙 염색으로 낸 깊은 흑갈색이 특징", "품질이 낮은 고치를 활용하기 위해 생겨났다고도 함"]}, "th": {"d": "แต่เดิมเป็นผ้าไหมที่ทอจากเส้นด้ายที่มีปุ่ม (ซึมุงิอิโตะ) ซึ่งปั่นจากใยไหม (มาวาตะ) หรือจากรังไหมที่ไม่สมบูรณ์และรังไหมแฝด โดยย้อมสีเส้นด้ายก่อนแล้วจึงนำไปทอ ปุ่มของเส้นด้ายทำให้ผ้ามีผิวสัมผัสที่เป็นเอกลักษณ์ และดูนุ่มนวลไม่มันวาว ยูกิซึมุงิยังคงใช้ด้ายที่ปั่นด้วยมือจากใยไหมจนถึงปัจจุบัน แต่บางชนิด เช่น โอชิมะซึมุงิ ปัจจุบันทอด้วยเส้นไหมธรรมดาและคงไว้เพียงชื่อ “ซึมุงิ” เท่านั้น สำหรับซึมุงิในฐานะประเภทของกิโมโน โปรดดูที่แท็บ “กิโมโน”", "o": "กิโมโนซึมุงิ ฮาโอริ นาโงยะโอบิ ฮัสซุนโอบิ (hassun obi)", "w": "โอชิมะซึมุงิ (คาโงชิมะ) ยูกิซึมุงิ (อิบารากิและโทจิงิ) อุชิคุบิซึมุงิ (อิชิกาวะ) ชิโอซาวะซึมุงิ (นีงาตะ) เป็นต้น", "p": ["เทคนิคการทอยูกิซึมุงิแบบดั้งเดิม (ด้ายปั่นมือจากใยไหม การมัดลายคาซูริด้วยมือ และการทอด้วยกี่เอวแบบดั้งเดิม “จิบาตะ”) ได้รับการขึ้นทะเบียนเป็นสมบัติทางวัฒนธรรมที่จับต้องไม่ได้ที่สำคัญของประเทศ (ปี 1956) และเป็นมรดกทางวัฒนธรรมที่จับต้องไม่ได้ของยูเนสโก (ปี 2010)", "โอชิมะซึมุงิโดดเด่นด้วยสีดำอมน้ำตาลเข้มจากการย้อมโคลน", "เชื่อกันว่าเริ่มต้นจากการนำรังไหมที่ไม่สมบูรณ์มาใช้ให้เกิดประโยชน์"]}, "vi": {"d": "Theo truyền thống, đây là loại lụa dệt từ sợi có đốt (tsumugi-ito) được xe từ bông tơ (mawata) hoặc từ kén phế phẩm, kén đôi; sợi được nhuộm trước rồi mới đem dệt. Những đốt trên sợi tạo nên mặt vải sần đặc trưng và vẻ mờ, trầm nhã. Yūki tsumugi đến nay vẫn dùng sợi xe tay từ bông tơ, trong khi một số loại như Ōshima tsumugi hiện được dệt bằng tơ tằm thông thường và chỉ còn giữ lại cái tên “tsumugi”. Về tsumugi như một loại kimono, vui lòng xem thêm tab “Kimono”.", "p": ["Kỹ thuật dệt Yūki tsumugi truyền thống (sợi xe tay từ bông tơ, buộc hoa văn kasuri bằng tay, dệt trên khung cửi đeo lưng jibata) là Di sản Văn hóa Phi vật thể Quan trọng (1956) và được UNESCO ghi danh là Di sản Văn hóa Phi vật thể (2010)", "Ōshima tsumugi nổi tiếng với sắc nâu đen sâu lắng nhờ kỹ thuật nhuộm bùn", "Tương truyền loại vải này ra đời để tận dụng những kén tằm bị lỗi"]}}, "t-chirimen": {"ja": {"p": ["丹後ちりめんは国内の着物用白生地の大きな割合を占める", "緯糸の撚り方や太さによって、しぼの細かい「一越」、大きめの「古代」、さらに大きい「鬼しぼ」などの種類がある", "しわが目立ちにくく、しっとりとした手触り（水に濡れると縮みやすいので注意）"]}, "en": {"p": ["Tango chirimen makes up a large share of Japan's white kimono fabric", "Depending on how the weft threads are twisted, there are types such as hitokoshi (fine crinkle), kodai (larger) and oni-shibo (very large)", "Wrinkles hardly show and it feels soft and supple (but it can shrink if it gets wet)"]}, "fr": {"d": "Ce crêpe est tissé avec des fils de trame fortement retordus. Au dégommage, les fils cherchent à se détordre, créant un fin crêpage (shibo) en surface. Comme la teinture y prend magnifiquement et que les couleurs sont éclatantes, il sert largement de base aux kimonos teints, comme le yūzen.", "p": ["Le Tango chirimen représente une grande part du tissu blanc pour kimono au Japon", "Selon la torsion et l'épaisseur des fils de trame, on distingue notamment le hitokoshi (crêpage fin), le kodai (plus marqué) et l'oni-shibo (très marqué)", "Les plis se voient peu et le toucher est doux et souple (attention : il peut rétrécir s'il est mouillé)"]}, "de": {"p": ["Tango-Chirimen macht einen großen Teil des weißen Kimonostoffs in Japan aus", "Je nach Drehung und Stärke der Schussfäden gibt es Sorten wie Hitokoshi (feine Kräuselung), Kodai (gröber) und Oni-Shibo (sehr grob)", "Falten fallen kaum auf, und er fühlt sich weich und geschmeidig an (kann jedoch bei Nässe einlaufen)"]}, "es": {"p": ["El Tango chirimen representa gran parte de la tela blanca para kimono de Japón", "Según la torsión y el grosor de los hilos de trama, hay tipos como el hitokoshi (rizado fino), el kodai (más marcado) y el oni-shibo (muy marcado)", "Las arrugas apenas se notan y tiene un tacto suave y flexible (pero puede encogerse si se moja)"]}, "zh": {"o": "小纹、访问着、色无地、付下（简约版访问着）、带扬、风吕敷（包袱布）", "p": ["丹后绉绸在日本和服白坯布中占很大份额", "根据纬线的捻法和粗细，分为褶皱细密的“一越”、较大的“古代”、更大的“鬼皱”等种类", "不易显出皱痕，手感柔润（遇水容易缩水，请注意）"]}, "yue": {"o": "小紋、訪問着、色無地、付下（簡約版訪問着）、帶揚、風呂敷（包袱布）", "p": ["丹後縐綢在日本和服白坯布中佔很大份額", "根據緯線的捻法和粗細，分為褶皺細密的「一越」、較大的「古代」、更大的「鬼皺」等種類", "不易顯出皺痕，手感柔潤（遇水容易縮水，請注意）"], "d": "用強捻的緯線織成，精練時緯線回捻收縮，使布面形成細小的凹凸褶皺（「皺」）。由於吸色好、發色美麗，被廣泛用作友禪等染色和服的布料。"}, "ko": {"w": "단고치리멘(교토), 나가하마치리멘(시가)", "o": "고몬, 호몬기, 이로무지, 쓰케사게(간략한 호몬기), 오비아게(장식 천), 후로시키", "p": ["단고치리멘은 일본 기모노용 흰 원단의 큰 비중을 차지", "씨실을 꼬는 방법과 굵기에 따라 시보가 잔 '히토코시', 조금 큰 '고다이', 더 큰 '오니시보' 등이 있음", "주름이 잘 눈에 띄지 않고 부드럽고 매끄러운 감촉(물에 젖으면 줄어들기 쉬우니 주의)"]}, "th": {"tag": "ผ้าไหมเนื้อพลิ้วที่ผิวมีรอยย่นละเอียดเรียกว่าชิโบะ (shibo)", "d": "ทอด้วยด้ายพุ่งที่ฟั่นเกลียวแน่น เมื่อนำผ้าไปขจัดกาว (การลอกกาวไหม) เส้นด้ายจะพยายามคลายเกลียว ทำให้เกิดผิวย่นละเอียด (ชิโบะ) บนผ้า เนื่องจากรับสีย้อมได้ดีและให้สีสันสดใส จึงนิยมใช้เป็นผ้าพื้นสำหรับกิโมโนแบบย้อม เช่น ยูเซ็น", "o": "โคมง โฮมงงิ อิโระมุจิ ซึเคะซาเงะ โอบิอาเกะ (ผ้าคาดเหนือโอบิ) ฟุโรชิกิ (ผ้าห่อของ)", "w": "ทังโงะชิริเมง (เกียวโต) นางาฮามะชิริเมง (ชิงะ)", "p": ["ทังโงะชิริเมงมีสัดส่วนสูงในบรรดาผ้าขาวสำหรับทำกิโมโนในญี่ปุ่น", "มีหลายชนิดตามวิธีฟั่นเกลียวและความหนาของด้ายพุ่ง เช่น ฮิโตโคชิ (รอยย่นละเอียด) โคได (รอยย่นใหญ่ขึ้น) และโอนิชิโบะ (รอยย่นใหญ่มาก)", "รอยยับไม่ค่อยเห็นชัด และมีสัมผัสนุ่มลื่น (ระวังผ้าหดเมื่อโดนน้ำ)"]}, "vi": {"p": ["Tango chirimen chiếm tỷ lệ lớn trong lượng vải trắng dùng may kimono tại Nhật Bản", "Tùy cách se và độ dày của sợi ngang mà có các loại như hitokoshi (nếp nhăn mịn), kodai (lớn hơn) và oni-shibo (rất lớn)", "Ít lộ nếp nhàu, cảm giác mềm mại, mượt mà khi chạm vào (lưu ý vải dễ co rút khi bị ướt)"]}}, "hakama": {"fr": {"o": "Remises de diplômes, mariages (le marié), fête de la majorité (hommes), arts martiaux, prêtres et prêtresses de sanctuaire", "p": ["Le hakama masculin a cinq plis devant et deux derrière", "Les sept plis représenteraient sept vertus", "Deux styles : umanori (pantalon) et andon (jupe)"]}, "de": {"o": "Abschlussfeiern, Hochzeiten (Bräutigam), Tag der Volljährigkeit (Männer), Kampfkünste, Shintō-Priester und Schreinjungfrauen (Miko)"}, "vi": {"o": "Lễ tốt nghiệp, đám cưới (chú rể), Lễ Trưởng thành (nam), võ thuật, thần quan và vu nữ tại đền Thần đạo"}}, "o-hanhaba": {"fr": {"d": "Large d'environ 15 à 17 cm, soit environ la moitié d'un obi standard. Léger et facile à nouer, il se porte avec le yukata et les kimonos du quotidien comme le komon et le tsumugi. Il existe d'innombrables façons de le nouer, dont des nœuds en forme de ruban : on peut s'amuser à varier les styles.", "p": ["Pas besoin de coussinet ni d'accessoires : facile à nouer seule", "Souvent réversible, le nœud peut montrer les deux couleurs", "Plus plat dans le dos qu'un tambour, confortable en voiture"]}, "de": {"p": ["Kein Obi-Kissen oder Zubehör nötig, daher leicht allein zu binden", "Oft wendbar, sodass der Knoten beide Farben zeigen kann", "Am Rücken flacher als eine Trommel, bequem beim Sitzen im Auto"]}, "es": {"tag": "Un obi informal de aproximadamente la mitad de ancho que uno estándar.", "d": "Mide unos 15–17 cm de ancho, más o menos la mitad que un obi estándar. Ligero y fácil de atar, se lleva con yukata y con kimonos de diario como el komon y el tsumugi. Hay infinidad de formas de atarlo, incluidos lazos tipo cinta, así que da mucho juego."}, "yue": {"d": "寬約15–17厘米，大約是普通腰帶的一半。輕便易繫，搭配浴衣以及小紋、紬等日常和服。結法種類繁多，可以繫成蝴蝶結等各種造型，自由搭配。", "p": ["不需要帶枕等配件，一個人也能輕鬆繫好", "很多是雙面的，結法可以同時展現兩面顏色", "背部比太鼓結平坦，坐車時也舒適"]}}, "n-tsunodashi": {"fr": {"tag": "Un nœud chic dont les extrémités de l'obi dépassent d'un tambour plat comme des cornes.", "o": "Komon, tsumugi et autres kimonos du quotidien ou chic décontracté"}, "de": {"o": "Komon, Tsumugi und andere Alltags- oder gehoben-legere Kimonos"}, "es": {"tag": "Un nudo elegante en el que los extremos del obi asoman de un tambor plano como cuernos.", "o": "Komon, tsumugi y otros kimonos de diario o informales elegantes"}, "yue": {"tag": "腰帶兩端像角一樣從扁平太鼓兩側露出的別緻結法。", "d": "腰帶兩端像角一樣從扁平太鼓的左右兩側探出。這是源自江戶時代的古老結法，常繫得較低，有時不用帶枕，給人清爽、低調而有品位的印象。"}, "th": {"n": "วิธีผูกโอบิสไตล์ผู้ใหญ่ที่แสนเก๋", "tag": "วิธีผูกสุดเก๋ที่ปลายโอบิยื่นออกมาเหมือนเขาจากทั้งสองข้างของทรงกลองแบน", "d": "ปลายโอบิทั้งสองข้างโผล่ออกมาเหมือนเขาจากด้านซ้ายและขวาของทรงกลองแบน (โอไทโกะ) เป็นรูปแบบเก่าแก่ที่สืบทอดมาตั้งแต่สมัยเอโดะ มักผูกในตำแหน่งค่อนข้างต่ำ และบางครั้งก็ไม่ใช้หมอนรองโอบิ ให้ลุคที่เรียบร้อย เรียบง่าย แต่มีสไตล์", "o": "โคมง ซึมุงิ และกิโมโนสำหรับใส่ประจำวันหรือแต่งตัวเก๋ ๆ", "w": "นาโงยะโอบิ ฮันฮาบะโอบิ ฟุคุโระโอบิแบบลำลอง", "p": ["มีวิธีผูกแบบไม่ใช้หมอนรองโอบิ จึงสบายหลัง", "ให้กลิ่นอายความเก๋แบบสาวผู้ใหญ่ชาวเมือง (อิกิ)", "การผูกแบบกินซะ (Ginza) ถือเป็นรูปแบบหนึ่งของซึโนะดาชิ"]}}, "n-fukura": {"fr": {"n": "Le moineau ébouriffé", "d": "Il imite un moineau qui gonfle ses plumes en hiver, ailes déployées à gauche et à droite. Son nom peut aussi s'écrire avec des caractères signifiant « bonne fortune » : il porte donc chance et c'est un nœud classique pour le furisode.", "p": ["Le nom évoque « une fortune qui grandit »", "Associé au furisode, le kimono de cérémonie des femmes non mariées", "La taille et l'angle des ailes changent son allure"]}, "zh": {"n": "搭配振袖的华丽腰带结", "d": "模仿冬天麻雀蓬起羽毛的样子，左右展开双翼的华丽系法。日文中也写作“福良雀”（意为福气美好），被视为招福的吉祥造型，是振袖腰带结的经典。"}, "yue": {"n": "搭配振袖的華麗腰帶結", "d": "模仿冬天麻雀蓬起羽毛的樣子，左右展開雙翼的華麗結法。日文中也寫作「福良雀」（意為福氣美好），被視為招福的吉祥造型，是振袖腰帶結的經典。", "tag": "模仿麻雀蓬起羽毛禦寒的姿態，振袖的代表性結法。"}, "th": {"n": "วิธีผูกโอบิอันงดงามสำหรับฟุริโซเดะ", "tag": "วิธีผูกโอบิยอดนิยมของฟุริโซเดะ ที่ได้แรงบันดาลใจจากนกกระจอกพองขนสู้ลมหนาว", "d": "ได้แรงบันดาลใจจากนกกระจอกที่พองขนในฤดูหนาว โดยกางปีกออกไปทางซ้ายและขวาอย่างสวยงาม ชื่อนี้ยังเขียนด้วยตัวอักษรที่มีความหมายว่า “โชคลาภ” ได้ด้วย จึงถือเป็นรูปทรงมงคลที่เรียกโชคดี และเป็นวิธีผูกมาตรฐานของฟุริโซเดะ", "o": "ฟุริโซเดะ (พิธีบรรลุนิติภาวะ งานแต่งงาน พิธีจบการศึกษา ฯลฯ)", "w": "ฟุคุโระโอบิ (แบบที่มีความยาวมาก)", "p": ["ชื่อพ้องเสียงกับ “โชคลาภที่เพิ่มพูน” จึงเป็นชื่อมงคล", "ใช้คู่กับฟุริโซเดะ ซึ่งเป็นชุดพิธีการของหญิงที่ยังไม่แต่งงาน", "ขนาดและมุมของปีกทำให้ลุคเปลี่ยนไป"]}, "vi": {"o": "Furisode (Lễ Trưởng thành, đám cưới, lễ tốt nghiệp…)"}}, "homongi": {"fr": {"d": "Un élégant kimono semi-formel porté par les femmes mariées comme non mariées. Sa particularité est l'eba-moyō : le motif se prolonge par-dessus les coutures comme un seul tableau, des épaules aux manches jusqu'au bas."}, "es": {"d": "Un elegante kimono semiformal que visten tanto mujeres casadas como solteras. Su sello distintivo es el eba-moyō: el dibujo continúa sobre las costuras como una sola pintura, del hombro a la manga y hasta el bajo."}, "yue": {"o": "婚禮及婚宴（賓客）、派對、茶會、入學及畢業典禮"}, "th": {"d": "กิโมโนกึ่งทางการที่สง่างาม สวมได้ทั้งหญิงที่แต่งงานแล้วและยังไม่แต่งงาน จุดเด่นคือ “เอบะโมโย” (eba-moyō) ลวดลายที่ต่อเนื่องข้ามตะเข็บเหมือนภาพวาดภาพเดียว ไหลจากไหล่สู่แขนเสื้อและลงไปถึงชายกิโมโน", "o": "งานแต่งงานและงานเลี้ยงฉลอง (ในฐานะแขก) งานปาร์ตี้ พิธีชงชา พิธีรับนักเรียนใหม่และพิธีจบการศึกษา"}}, "o-kaku": {"fr": {"d": "Un obi masculin ferme d'environ 9 à 10 cm de large et 4 m de long. Il se porte avec presque tous les kimonos masculins, de la tenue quotidienne à la tenue de cérémonie à blasons (montsuki haori hakama). Le motif « kenjō » du tissage Hakata en est le modèle classique."}, "es": {"d": "Un obi masculino rígido de unos 9–10 cm de ancho y unos 4 m de largo. Se lleva con casi todos los kimonos de hombre, desde la ropa diaria hasta el atuendo formal con blasones (montsuki haori hakama). El dibujo «kenjō» del tejido Hakata es el diseño clásico."}, "yue": {"tag": "男性繫的窄而硬挺的腰帶。", "p": ["繫在胯骨位置，前低後高", "博多獻上因江戶時代進獻給幕府而得名", "禮服搭配素雅、近似素色的角帶"]}, "ko": {"p": ["골반뼈 높이에서 앞은 낮게, 뒤는 높게 맴", "하카타 겐조는 에도 시대 막부에 헌상된 데서 이름이 유래", "예복에는 차분한 무지 느낌의 가쿠오비를 고름"]}, "th": {"d": "โอบิผู้ชายเนื้อแข็งอยู่ทรง กว้างประมาณ 9–10 cm และยาวประมาณ 4 m ใช้กับกิโมโนผู้ชายเกือบทุกประเภท ตั้งแต่ชุดใส่ประจำวันจนถึงชุดทางการมนซึกิ ฮาโอริ ฮากามะ ลาย “เค็นโจ” (kenjō) ของผ้าทอฮากาตะ (Hakata-ori) เป็นลวดลายคลาสสิก"}}, "n-kai": {"fr": {"d": "Son nom vient de sa ressemblance avec la bouche entrouverte d'un coquillage. C'est le nœud standard du kaku obi masculin : petit, plat et solide, il convient de la tenue quotidienne à la tenue de cérémonie à blasons. Les femmes le nouent aussi avec un hanhaba obi.", "o": "Tous les kimonos masculins ; yukata et kimonos décontractés féminins (avec un hanhaba obi)"}, "yue": {"tag": "男性角帶最基本的結法。", "d": "因結形似張開的貝殼口而得名，是男性角帶最具代表性的結法。結小而扁平、不易鬆開，從日常服裝到紋付羽織袴禮服都適用。女性也會用半幅帶繫這種結。"}, "th": {"n": "วิธีผูกโอบิมาตรฐานของผู้ชาย", "tag": "วิธีผูกคาคุโอบิ (kaku obi) ของผู้ชายที่พื้นฐานที่สุด", "d": "ได้ชื่อนี้เพราะปมมีลักษณะคล้ายปากหอยสองฝาที่อ้าออก เป็นวิธีผูกคาคุโอบิมาตรฐานของผู้ชาย ปมมีขนาดเล็ก แบน และไม่หลุดง่าย ใช้ได้ตั้งแต่ชุดลำลองไปจนถึงชุดพิธีการแบบมีตราประจำตระกูล (มนซึกิ ฮาโอริ ฮากามะ) ผู้หญิงก็ใช้ผูกกับฮันฮาบะโอบิได้เช่นกัน", "o": "กิโมโนผู้ชายทุกประเภท / ยูกาตะและกิโมโนลำลองของผู้หญิง (ผูกด้วยฮันฮาบะโอบิ)", "w": "คาคุโอบิ ฮันฮาบะโอบิ"}}, "t-kinsai": {"th": {"d": "เทคนิคการตกแต่งที่ทากาว (แป้งเปียก) ลงบนผ้าที่ย้อมเสร็จแล้ว จากนั้นแปะทองคำเปลวหรือผงทองลงไป มักเติมทองตามเส้นขอบหรือกลีบดอกไม้ของลายยูเซ็น เพื่อให้เปล่งประกาย และมีวิธีการอีกหลายแบบ เช่น ซุริฮาคุ (surihaku: ทองคำเปลวแบบใช้แม่พิมพ์) และซุนาโงะ (sunago: โรยเกล็ดทอง)", "o": "ฟุริโซเดะ โทเมะโซเดะ โฮมงงิ ฟุคุโระโอบิ", "w": "เกียวโต (พัฒนาควบคู่มากับเคียวยูเซ็น)", "p": ["ลวดลายดูโดดเด่นเปล่งประกายเมื่อกระทบแสง", "ซุริฮาคุในสมัยโมโมยามะยังถูกใช้กับเครื่องแต่งกายละครโนด้วย", "นอกจากทองแล้ว บางครั้งก็ใช้เงินหรือแพลทินัมด้วย"]}}}, "UI": {"ja": {"tSub": "「染めの着物」は白い生地を織ってから染めるもので、一般に格が高く礼装向き。「織りの着物」は先に染めた糸で織るもので、一般に普段着向きです。帯は逆に、織りの帯のほうが格上とされます（「染めの着物に織りの帯」）。いずれも一般的な目安で、例外もあります。"}, "en": {"tSub": "Dyed kimono (somé) are woven in white first and then dyed, and are generally more formal. Woven kimono (ori) are woven from threads dyed in advance, and are generally casual. For obi the rule is reversed: woven obi are the more formal (“dyed kimono, woven obi”). These are general guidelines, with exceptions."}, "fr": {"f": "Niveau de formalité", "lad": ["Kimonos : du plus simple au plus formel", "Obi : du plus simple au plus formel", "Nœuds : du plus simple au plus formel", "Teint ou tissé ?"], "tSub": "Les kimonos teints (somé) sont d'abord tissés en blanc puis teints ; ils sont en général plus formels et adaptés aux cérémonies. Les kimonos tissés (ori) sont faits de fils teints à l'avance et se portent en général au quotidien. Pour les obi, c'est l'inverse : les obi tissés sont les plus formels (« kimono teint, obi tissé »). Ce sont des repères généraux, avec des exceptions."}, "de": {"f": "Formalitätsstufe", "who": "Getragen von", "lv": ["Alltag", "Gehoben-leger", "Festlich", "Halbformell", "Hochformell"], "tSub": "Gefärbte Kimonos (Somé) werden zuerst weiß gewebt und dann gefärbt; sie gelten meist als formeller und eignen sich für feierliche Anlässe. Gewebte Kimonos (Ori) bestehen aus vorgefärbten Fäden und sind meist Alltagskleidung. Beim Obi ist es umgekehrt: Gewebte Obi sind die formelleren („gefärbter Kimono, gewebter Obi“). Das sind allgemeine Faustregeln, es gibt Ausnahmen."}, "es": {"lad": ["Formalidad de cada kimono", "Formalidad de cada obi", "Formalidad de cada nudo", "¿Teñido o tejido?"], "lv": ["Informal", "Informal elegante", "De vestir", "Semiformal", "Máxima formalidad"], "tSub": "Los kimonos teñidos (somé) se tejen primero en blanco y luego se tiñen; suelen ser más formales y apropiados para ceremonias. Los kimonos tejidos (ori) se hacen con hilos teñidos de antemano y suelen ser de uso diario. En los obi es al revés: los obi tejidos son los más formales («kimono teñido, obi tejido»). Son pautas generales, con excepciones."}, "zh": {"lv": ["日常", "时尚外出服", "简式礼服", "准礼服", "最高礼服"], "tSub": "染的和服（染物）先织成白坯布再染色，一般规格较高，适合作为礼服；织的和服（织物）用预先染色的线织成，一般适合日常穿着。腰带则相反，织的腰带规格更高（俗称“染的和服配织的腰带”）。以上均为一般标准，也有例外。"}, "yue": {"lv": ["日常", "時尚外出服", "簡式禮服", "準禮服", "最高禮服"], "tSub": "染的和服（染物）先織成白坯布再染色，一般規格較高，適合作為禮服；織的和服（織物）用預先染色的線織成，一般適合日常穿着。腰帶則相反，織的腰帶規格更高（俗稱「染的和服配織的腰帶」）。以上均為一般標準，也有例外。"}, "ko": {"occ": "입는 자리", "tSub": "염색 기모노(소메)는 흰 천을 먼저 짠 뒤 염색하며, 대체로 격식이 높아 예복에 알맞습니다. 직조 기모노(오리)는 미리 염색한 실로 짜며, 대체로 ALL.splice(ALL.findIndex(k=>k.id==="n-fukura")+1,0,{"id": "n-tateya", "kanji": "立て矢", "kana": "たてや", "romaji": "Tateya", "f": [5, 5], "cat": "n", "t": {"ja": {"n": "斜めの羽が華やかな振袖の帯結び", "tag": "羽を左肩から右下へ斜めに流す、華やかで立体感のある帯結びです。", "d": "帯の羽を左肩から右下へ斜めに渡す、左右非対称の帯結びです。斜めの羽を矢に見立てたことが名前の由来とされます。江戸時代に武家の奥女中が結んでいた形と言われ、今では振袖や花嫁の引き振袖の定番の一つです。", "o": "振袖（成人式・結婚式・卒業式など）、花嫁の引き振袖、七五三の子どもの着物", "w": "袋帯", "p": ["肩先からのぞく斜めの羽が特徴", "斜めの線で後ろ姿がすらりと見える", "羽にひだを加えるなどアレンジが多彩"]}, "en": {"n": "The diagonal arrow knot", "tag": "A showy, three-dimensional knot with wings sweeping diagonally from the left shoulder down to the right.", "d": "An asymmetrical knot in which the obi's wings run diagonally from the left shoulder down to the right. Its name is said to come from the diagonal wings being likened to an arrow (ya). It is said to have been worn by ladies-in-waiting in samurai households in the Edo period, and today it is one of the classic knots for furisode and for the bride's hiki-furisode.", "o": "Furisode (Coming-of-Age Day, weddings, graduations), bridal hiki-furisode, children's kimono for Shichi-Go-San", "w": "Fukuro obi", "p": ["Known for the diagonal wing peeking over the shoulder", "The diagonal line gives a slender, elegant back view", "Many variations, such as adding pleats to the wings"]}, "fr": {"n": "Le nœud en flèche", "tag": "Un nœud spectaculaire et en relief, aux ailes qui descendent en diagonale de l'épaule gauche vers la droite.", "d": "Un nœud asymétrique dont les ailes traversent le dos en diagonale, de l'épaule gauche vers le bas à droite. Son nom viendrait de ces ailes obliques, comparées à une flèche (ya). Il aurait été porté par les dames de compagnie des maisons de samouraïs à l'époque d'Edo ; c'est aujourd'hui l'un des nœuds classiques du furisode et du hiki-furisode de la mariée.", "o": "Furisode (fête de la majorité, mariages, remises de diplômes), hiki-furisode de mariée, kimonos d'enfants pour le Shichi-Go-San", "w": "Fukuro obi", "p": ["Reconnaissable à l'aile oblique qui dépasse de l'épaule", "La ligne diagonale affine la silhouette de dos", "Nombreuses variantes, par exemple avec des plis sur les ailes"]}, "de": {"n": "Der Pfeilknoten", "tag": "Ein prächtiger, plastischer Knoten, dessen Flügel diagonal von der linken Schulter nach rechts unten verlaufen.", "d": "Ein asymmetrischer Knoten, bei dem die Flügel des Obi diagonal von der linken Schulter nach rechts unten über den Rücken laufen. Der Name soll daher kommen, dass die schrägen Flügel an einen Pfeil (Ya) erinnern. Er soll in der Edo-Zeit von Hofdamen in Samuraihaushalten getragen worden sein und ist heute einer der klassischen Knoten zum Furisode und zum Hiki-Furisode der Braut.", "o": "Furisode (Tag der Volljährigkeit, Hochzeiten, Abschlussfeiern), Hiki-Furisode der Braut, Kinderkimonos zu Shichi-Go-San", "w": "Fukuro-Obi", "p": ["Typisch ist der schräge Flügel, der über der Schulter hervorschaut", "Die Diagonale lässt die Rückenansicht schlank und elegant wirken", "Viele Varianten, etwa mit Falten in den Flügeln"]}, "es": {"n": "El nudo de flecha", "tag": "Un nudo vistoso y con volumen, con alas que bajan en diagonal desde el hombro izquierdo hacia la derecha.", "d": "Un nudo asimétrico en el que las alas del obi cruzan la espalda en diagonal, del hombro izquierdo hacia abajo a la derecha. Se dice que su nombre viene de comparar esas alas inclinadas con una flecha (ya). Al parecer lo llevaban las damas de compañía de las casas samurái en la era Edo, y hoy es uno de los nudos clásicos del furisode y del hiki-furisode de la novia.", "o": "Furisode (Día de la Mayoría de Edad, bodas, graduaciones), hiki-furisode nupcial, kimonos infantiles para el Shichi-Go-San", "w": "Fukuro obi", "p": ["Destaca el ala inclinada que asoma por encima del hombro", "La línea diagonal estiliza la silueta de espaldas", "Muchas variantes, como añadir pliegues a las alas"]}, "zh": {"n": "斜翼华丽的振袖腰带结", "tag": "羽翼从左肩向右下方斜斜展开，华丽而立体的腰带结。", "d": "腰带的羽翼从左肩向右下方斜跨背部的不对称结法。据说因斜向的羽翼形似一支箭（矢）而得名。相传是江户时代武家奥女中（侍女）所系的样式，如今是振袖和新娘引振袖的经典结法之一。", "o": "振袖（成人礼、婚礼、毕业典礼等）、新娘引振袖、七五三儿童和服", "w": "袋带", "p": ["从肩头露出的斜向羽翼是其特征", "斜线让背影显得修长", "可在羽翼上加褶等，变化丰富"]}, "yue": {"n": "斜翼華麗的振袖腰帶結", "tag": "羽翼從左肩向右下方斜斜展開，華麗而立體的腰帶結。", "d": "腰帶的羽翼從左肩向右下方斜跨背部的不對稱結法。據說因斜向的羽翼形似一支箭（矢）而得名。相傳是江戶時代武家奧女中（侍女）所繫的樣式，如今是振袖和新娘引振袖的經典結法之一。", "o": "振袖（成人禮、婚禮、畢業典禮等）、新娘引振袖、七五三兒童和服", "w": "袋帶", "p": ["從肩頭露出的斜向羽翼是其特徵", "斜線令背影顯得修長", "可在羽翼上加褶等，變化豐富"]}, "ko": {"n": "비스듬한 날개가 화려한 후리소데 매듭", "tag": "날개를 왼쪽 어깨에서 오른쪽 아래로 비스듬히 흘리는, 화려하고 입체적인 매듭.", "d": "오비의 날개를 왼쪽 어깨에서 오른쪽 아래로 비스듬히 걸치는 좌우 비대칭 매듭입니다. 비스듬한 날개를 화살(矢)에 빗댄 데서 이름이 유래했다고 합니다. 에도 시대 무가의 시녀들이 매던 형태라고 전해지며, 지금은 후리소데와 신부의 히키후리소데에 쓰이는 대표 매듭 중 하나입니다.", "o": "후리소데(성년의 날·결혼식·졸업식 등), 신부의 히키후리소데, 시치고산 아이 기모노", "w": "후쿠로오비", "p": ["어깨 너머로 보이는 비스듬한 날개가 특징", "사선이 뒷모습을 날씬하게 보이게 함", "날개에 주름을 더하는 등 변형이 다양함"]}, "th": {"n": "วิธีผูกโอบิปีกเฉียงอันงดงามสำหรับฟุริโซเดะ", "tag": "วิธีผูกที่ให้ปีกโอบิพาดเฉียงจากไหล่ซ้ายลงไปทางขวาล่าง ดูงดงามและมีมิติ", "d": "วิธีผูกแบบไม่สมมาตรที่ให้ปีกของโอบิพาดเฉียงจากไหล่ซ้ายลงไปทางขวาล่าง กล่าวกันว่าชื่อนี้มาจากการเปรียบปีกที่เฉียงกับลูกธนู (ยะ) และเชื่อกันว่าเป็นแบบที่นางกำนัลในตระกูลซามูไรผูกในสมัยเอโดะ ปัจจุบันเป็นหนึ่งในวิธีผูกยอดนิยมสำหรับฟุริโซเดะและฮิกิฟุริโซเดะของเจ้าสาว", "o": "ฟุริโซเดะ (วันบรรลุนิติภาวะ งานแต่งงาน พิธีจบการศึกษา) ฮิกิฟุริโซเดะของเจ้าสาว กิโมโนเด็กในเทศกาลชิจิโกะซัง", "w": "ฟุคุโระโอบิ", "p": ["จุดเด่นคือปีกเฉียงที่โผล่พ้นไหล่", "เส้นเฉียงทำให้ด้านหลังดูเพรียวสง่า", "ดัดแปลงได้หลากหลาย เช่น เพิ่มจีบที่ปีก"]}, "vi": {"n": "Kiểu thắt cánh chéo lộng lẫy cho furisode", "tag": "Kiểu thắt lộng lẫy, có chiều sâu, với cánh obi chạy chéo từ vai trái xuống bên phải.", "d": "Kiểu thắt bất đối xứng, cánh obi vắt chéo qua lưng từ vai trái xuống phía dưới bên phải. Tên gọi được cho là bắt nguồn từ việc ví cánh chéo như một mũi tên (ya). Tương truyền đây là kiểu thắt của các thị nữ trong gia đình võ sĩ thời Edo; ngày nay là một trong những kiểu thắt kinh điển cho furisode và hiki-furisode của cô dâu.", "o": "Furisode (Lễ Trưởng thành, đám cưới, lễ tốt nghiệp), hiki-furisode của cô dâu, kimono trẻ em dịp Shichi-Go-San", "w": "Fukuro obi", "p": ["Nổi bật với cánh chéo nhô lên qua vai", "Đường chéo giúp dáng lưng trông thon thả", "Nhiều biến thể, chẳng hạn thêm nếp gấp cho cánh"]}}});

const IT={"UI": {"app": "Guida al kimono", "sub": "Kimono, obi, nodi e tecniche tessili spiegati", "pick": ["Scelga un kimono", "Scelga un obi", "Scelga un nodo", "Scelga una tecnica"], "f": "Formalità", "occ": "Occasioni", "who": "Chi lo indossa", "pts": "Da sapere", "listen": "Ascolta", "say": "Ascolta il nome", "varies": "Dipende dall'abbinamento", "lv": ["Informale", "Casual elegante", "Elegante", "Semiformale", "Massima formalità"], "lad": ["Formalità dei kimono", "Formalità degli obi", "Formalità dei nodi", "Tinto o tessuto?"], "ladSub": "Dall'abito di tutti i giorni (a sinistra) a quello di massima formalità (a destra). Tocchi un nome per vedere i dettagli.", "foot": "I livelli di formalità sono indicativi. Le usanze locali e la scelta dell'obi e degli accessori possono modificarli.", "tabs": ["Kimono", "Obi (fasce)", "Nodi dell'obi", "Tintura e tessitura"], "withK": "Si abbina a", "knots": "Nodi tipici", "obiUsed": "Obi utilizzato", "tSub": "I kimono tinti (somé) vengono prima tessuti in bianco e poi tinti, e sono in genere più formali e adatti alle cerimonie. I kimono tessuti (ori) sono realizzati con fili tinti in precedenza e sono in genere informali. Per gli obi vale il contrario: gli obi tessuti sono i più formali («kimono tinto, obi tessuto»). Sono indicazioni generali, con eccezioni.", "foundOn": "Usato per", "areas": "Principali zone di produzione", "kindL": "Tipo", "kinds": ["Tintura", "Tessitura e tessuti", "Decorazione"]}, "items": {"furisode": {"n": "Kimono formale a maniche lunghe", "tag": "Il kimono di massima formalità per le donne nubili, con maniche lunghe e sfarzose.", "d": "Deve il nome alle lunghe maniche che oscillano (furi = oscillare, sode = manica). È il kimono di massima formalità per le donne nubili, decorato con motivi vivaci che si estendono su tutto l'abito.", "o": "Festa della maggiore età, matrimoni (come parente o amica nubile), cerimonie di diploma, Capodanno", "w": "Donne nubili", "p": ["Le maniche sono lunghe circa 85–115 cm", "Si abbina a nodi dell'obi elaborati e vistosi, come il fukura suzume", "Si dice che far ondeggiare le lunghe maniche allontani la sfortuna e propizi un buon matrimonio"]}, "tomesode": {"n": "Kimono formale per donne sposate", "tag": "Il kimono di massima formalità per le donne sposate, decorato solo nella parte inferiore.", "d": "Il kuro-tomesode, a fondo nero, è il kimono di massima formalità per le donne sposate. La parte superiore è in tinta unita, i motivi di buon auspicio compaiono solo lungo l'orlo e cinque stemmi di famiglia sono posti sulla schiena, sul petto e sulle maniche. La versione a fondo colorato, l'iro-tomesode, può essere indossata anche dalle donne nubili: con cinque stemmi ha lo stesso rango del kuro-tomesode, con tre o uno è semiformale.", "o": "Matrimoni (indossato dalle madri e dalle parenti degli sposi), cerimonie solenni", "w": "Donne sposate (versione nera)", "p": ["I cinque stemmi di famiglia indicano la massima formalità", "Il motivo compare solo sotto la vita", "Si abbina a un fukuro obi in oro e argento"]}, "homongi": {"n": "Kimono da visita", "tag": "Un kimono semiformale per tutte le donne, con motivi che proseguono oltre le cuciture.", "d": "Un elegante kimono semiformale che possono indossare sia le donne sposate sia le nubili. La sua caratteristica è l'eba-moyō: il motivo prosegue oltre le cuciture come un unico dipinto, scorrendo dalle spalle alle maniche fino all'orlo.", "o": "Matrimoni e ricevimenti (come invitata), feste, cerimonie del tè, cerimonie scolastiche di ammissione e di diploma", "w": "Donne, sposate o nubili", "p": ["Il motivo attraversa le cuciture senza interrompersi, come un unico dipinto", "Aggiungendo uno stemma di famiglia la formalità aumenta", "Di solito si abbina a un fukuro obi (obi formale in broccato)"]}, "iromuji": {"n": "Kimono in tinta unita", "tag": "Un kimono in tinta unita, di un solo colore diverso dal nero. Lo stemma ne determina la formalità.", "d": "Un kimono tinto in un unico colore diverso dal nero, senza motivi decorativi. Con uno stemma di famiglia diventa semiformale; senza stemma si indossa come abito elegante e, cambiando l'obi, può diventare anche casual elegante. Un solo kimono si adatta a molte occasioni.", "o": "Cerimonie del tè, cerimonie ufficiali, accompagnare i bambini al santuario (omiyamairi, Shichi-Go-San), funzioni commemorative (in colori sobri)", "w": "Donne, sposate o nubili", "p": ["Il tessuto può presentare un motivo discreto ottenuto con la tessitura", "Con uno stemma di famiglia diventa semiformale", "Nei colori sobri si può indossare anche in occasione di lutti"]}, "komon": {"n": "Kimono a piccoli motivi", "tag": "Un kimono casual elegante, interamente coperto da un piccolo motivo ripetuto.", "d": "Un kimono tinto interamente con lo stesso motivo ripetuto, da indossare come abito casual elegante di tutti i giorni. Spesso il motivo non ha un unico verso dall'alto in basso, ed è perfetto per uscite informali, pranzi e cene o una serata a teatro.", "o": "Passeggiate in città, cene tra amici, teatro, lezioni, cerimonie del tè informali", "w": "Donne, sposate o nubili", "p": ["Equivale a un bel vestito da giorno nell'abbigliamento occidentale", "Alcuni motivi Edo komon (same, gyōgi, kakudōshi) diventano eleganti con l'aggiunta di uno stemma di famiglia", "Si abbina spesso a un Nagoya obi"]}, "tsumugi": {"n": "Kimono in seta tessuta", "tag": "Un kimono informale, robusto e rustico, tessuto con fili tinti in precedenza.", "d": "Un kimono tessuto con fili tinti prima della tessitura. Tradizionalmente si usa un filo filato a mano dalla bambagia di seta, che gli conferisce un aspetto rustico e grande resistenza; in origine era l'abito di tutti i giorni delle famiglie contadine. Molti tsumugi, come l'Ōshima e lo Yūki tsumugi, sono pregiati prodotti dell'artigianato tradizionale.", "o": "Uscite quotidiane, viaggi, incontri informali", "w": "Uomini e donne", "p": ["Per quanto costoso, resta un abito informale o casual elegante e di norma non si indossa a cerimonie come i matrimoni", "Più si indossa, più diventa morbido e si adatta al corpo", "L'Ōshima e lo Yūki tsumugi sono riconosciuti ufficialmente dallo Stato come artigianato tradizionale"]}, "yukata": {"n": "Kimono estivo di cotone", "tag": "Un kimono di cotone, leggero e informale, per l'estate.", "d": "Un kimono sfoderato, generalmente di cotone. Nasce dallo yukatabira, una veste sottile indossata durante i bagni di vapore nel periodo Heian; nel periodo Edo si diffuse come veste da dopo bagno e oggi è l'abito classico delle feste estive e degli spettacoli pirotecnici. Si indossa sopra un indumento intimo leggero, senza il nagajuban (sottokimono), con i sandali di legno geta a piedi nudi.", "o": "Feste estive, spettacoli pirotecnici, danze del Bon, abito da camera nelle locande termali", "w": "Uomini, donne e bambini", "p": ["Il lembo sinistro va sempre sovrapposto al destro: il contrario è riservato ai defunti", "In un ryokan (locanda giapponese) lo yukata fornito si indossa liberamente all'interno della struttura (per le sale da pranzo e simili verifichi le regole di ciascuna struttura)", "Si lega con uno stretto hanhaba obi o un morbido heko obi, quindi è facile da indossare da soli"]}, "haori": {"n": "Giacca da kimono", "tag": "Una giacca corta da indossare sopra il kimono.", "d": "Una giacca che si indossa sopra il kimono e si chiude sul davanti con un cordoncino. Per le donne è un capo informale, per proteggersi dal freddo e per eleganza. Per gli uomini, kimono e haori in seta nera con cinque stemmi di famiglia, abbinati all'hakama a righe in sendai-hira, costituiscono l'abito di massima formalità (kuro-montsuki haori hakama).", "o": "Donne: uscite quotidiane, protezione dal freddo / Uomini: matrimoni e cerimonie (con stemmi e hakama)", "w": "Uomini e donne", "p": ["Si chiude sul davanti con un cordoncino detto haori-himo", "A differenza di un cappotto, di norma si può tenere anche al chiuso (ma si toglie durante la cerimonia del tè)", "La fodera nasconde spesso disegni ricercati, segno di un'eleganza discreta"]}, "hakama": {"n": "Pantalone o gonna a pieghe", "tag": "Un indumento a pieghe che si indossa sopra il kimono, dalla vita in giù.", "d": "Un indumento a pieghe che si indossa sopra il kimono, simile a un ampio pantalone o a una gonna. Gli uomini lo indossano con un haori con stemmi come abito di massima formalità, mentre per le donne è un abbigliamento molto amato alle cerimonie di diploma. Si indossa anche in arti marziali come il kyudo, il kendo e l'aikido.", "o": "Cerimonie di diploma, matrimoni (lo sposo), Festa della maggiore età (uomini), arti marziali, sacerdoti e miko (fanciulle del santuario) shintoisti", "w": "Uomini e donne", "p": ["L'hakama maschile ha cinque pieghe davanti e due dietro", "Si dice che le sette pieghe rappresentino le sette virtù da rispettare", "Esistono due modelli: l'umanori, a pantalone, e l'andon, a gonna"]}, "o-maru": {"n": "L'obi più formale", "tag": "L'obi più formale, ricavato da un tessuto molto largo piegato a metà.", "d": "Tessuto con una larghezza di circa 68 cm e piegato a metà, presenta motivi su entrambi i lati. Sfarzoso e pesante, fino alla Seconda guerra mondiale era l'obi formale per eccellenza. Oggi si vede soprattutto negli abiti da sposa e nel lungo «darari obi» delle maiko di Kyoto.", "o": "Kimono da sposa, furisode, abito delle maiko", "w": "Darari, bunko, fukura suzume e altri", "p": ["Il tipo di obi di rango più alto", "Ha motivi su entrambi i lati, quindi il disegno si vede comunque lo si annodi", "Lungo e pesante, richiede grande esperienza per essere annodato"]}, "o-fukuro": {"n": "Obi formale", "tag": "Un obi di alto rango per kimono formali e semiformali.", "d": "Tessuto a tubo, oppure con diritto e rovescio cuciti insieme, ha il motivo solo sul diritto. Più leggero e maneggevole del maru obi, è oggi l'obi formale più diffuso. È lungo circa 4,2 m o più e largo circa 31 cm.", "o": "Tomesode, furisode, hōmongi, iromuji con stemma", "w": "Doppio tamburo (nijū-daiko), fukura suzume, tateya e altri", "p": ["Il nodo a doppio tamburo significa «gioie che si sommano», per questo è adatto alle occasioni liete", "I motivi in oro e argento sono formali; gli sharé-bukuro sono casual eleganti", "La sua lunghezza permette nodi decorativi elaborati"]}, "o-nagoya": {"n": "Obi dal quotidiano all'elegante", "tag": "Un obi pratico, nato per semplificare il nodo a tamburo.", "d": "Ideato a Nagoya nel periodo Taishō (1912–1926). La parte che forma il tamburo ha larghezza piena, mentre quella che si avvolge in vita è già piegata a metà. Più corto e leggero del fukuro obi, è facile da annodare da soli.", "o": "Komon, tsumugi, iromuji, tsukesage, kimono da lutto (Nagoya obi nero)", "w": "Tamburo singolo (otaiko), tsunodashi", "p": ["Si annoda a tamburo singolo, quindi non si usa con l'abbigliamento formale per le occasioni liete", "I Nagoya obi tinti sono informali; quelli tessuti si adattano anche a occasioni un po' più formali", "È lungo circa 3,6 m"]}, "o-hanhaba": {"n": "Obi stretto informale", "tag": "Un obi informale largo circa la metà di un obi normale.", "d": "Largo circa 15–17 cm, più o meno la metà di un obi normale. Leggero e facile da annodare, si abbina allo yukata e ai kimono di tutti i giorni come komon e tsumugi. I modi di annodarlo sono innumerevoli, anche a forma di fiocco, e variarli è un piacere.", "o": "Yukata, komon, tsumugi, kimono di cotone o di lana", "w": "Bunko, kai-no-kuchi, ya-no-ji e altri", "p": ["Non servono cuscinetto (obi-makura) né altri accessori, quindi è facile da annodare da soli", "Molti sono reversibili, con nodi che mostrano entrambi i colori", "Più piatto sulla schiena del nodo a tamburo, è comodo anche sul sedile dell'auto"]}, "o-heko": {"n": "Fascia morbida", "tag": "Un obi in tessuto morbido, senza rinforzo interno.", "d": "Una striscia di tessuto morbido usata come obi, senza rinforzo interno. In origine era la fascia di tutti i giorni di uomini e bambini; oggi è amata anche dalle donne per lo yukata, grazie al suo aspetto morbido e vaporoso. Si annoda facilmente, come un fiocco.", "o": "Yukata, kimono per bambini, abbigliamento informale maschile", "w": "Fiocco semplice (chōcho-musubi) e altri", "p": ["Il nome deriva dagli heko, i giovani di Kagoshima che lo portavano", "Stringe poco il corpo, quindi è molto comodo", "Un classico per lo Shichi-Go-San dei bambini e per le feste estive"]}, "o-kaku": {"n": "Obi maschile", "tag": "Un obi stretto e rigido indossato dagli uomini.", "d": "Un obi maschile rigido, largo circa 9–10 cm e lungo circa 4 m. Si abbina praticamente a ogni tipo di kimono maschile, dall'abito di tutti i giorni fino al formale montsuki haori hakama. Il motivo «kenjō» dell'Hakata-ori è il disegno classico.", "o": "Tutti i kimono maschili, dallo yukata e dallo tsumugi all'abito formale con stemmi", "w": "Kai-no-kuchi, rōnin musubi, ichimonji e altri", "p": ["Si annoda all'altezza delle anche, più basso davanti e più alto dietro", "L'Hakata kenjō deve il nome al fatto di essere stato offerto in dono allo shogunato nel periodo Edo", "Per l'abbigliamento formale si sceglie un obi sobrio, dall'aspetto in tinta unita"]}, "n-otaiko": {"n": "Il classico nodo a tamburo", "tag": "Il nodo più comune, che forma un «tamburo» squadrato sulla schiena.", "d": "Forma sulla schiena una sagoma gonfia, simile a una scatola, ed è il nodo dell'obi più comune per le donne adulte. Si dice sia nato nel 1817, alla fine del periodo Edo, quando le geisha di Fukagawa lo indossarono per l'inaugurazione del ricostruito Taiko-bashi (ponte a tamburo) del santuario Kameido Tenjin.", "o": "Un'ampia gamma di kimono: hōmongi, iromuji, komon, tsumugi, tomesode e altri", "w": "Nagoya obi (tamburo singolo), fukuro obi (doppio tamburo)", "p": ["Il doppio tamburo con il fukuro obi significa «gioie che si sommano» e si usa per le occasioni liete", "Per i lutti si usa il tamburo singolo, perché il dolore non si «raddoppi»", "La forma si modella con un cuscinetto (obi-makura), una sciarpa (obi-age) e un cordoncino (obi-jime)"]}, "n-tsunodashi": {"n": "Il nodo raffinato dal fascino adulto", "tag": "Un nodo raffinato in cui le estremità dell'obi spuntano come corna ai lati di un tamburo piatto.", "d": "Le due estremità dell'obi fanno capolino come corna ai lati di un tamburo piatto. È una forma antica, in uso fin dal periodo Edo: si lega piuttosto in basso, talvolta senza cuscinetto per l'obi, e colpisce per il suo aspetto sobrio e raffinato.", "o": "Komon, tsumugi e altri kimono per tutti i giorni o di tendenza", "w": "Nagoya obi, hanhaba obi, fukuro obi informale", "p": ["Esiste anche una versione senza cuscinetto per l'obi, più comoda per la schiena", "Evoca l'eleganza disinvolta (iki) della donna adulta", "Anche il nodo Ginza è considerato una variante dello tsunodashi"]}, "n-fukura": {"n": "Il nodo sontuoso per il furisode", "tag": "Il nodo dell'obi più rappresentativo del furisode, ispirato a un passero che gonfia le piume.", "d": "Ispirato a un passero che gonfia le piume per ripararsi dal freddo invernale, è un nodo sontuoso con le ali aperte a destra e a sinistra. Il nome si può scrivere anche con caratteri che significano «buona fortuna»: considerato di buon auspicio, è diventato un classico tra i nodi dell'obi per il furisode.", "o": "Furisode (cerimonia della maggiore età, matrimoni, cerimonie di laurea o diploma, ecc.)", "w": "Fukuro obi lungo", "p": ["Un nome di buon auspicio, che richiama l'idea di «fortuna che cresce»", "Si abbina al furisode, il kimono da cerimonia delle donne nubili", "La grandezza e l'angolazione delle ali ne cambiano l'aspetto"]}, "n-tateya": {"n": "Il sontuoso nodo per furisode dalle ali oblique", "tag": "Un nodo sontuoso e tridimensionale, con le ali che scendono in diagonale dalla spalla sinistra verso destra.", "d": "Nodo dell'obi asimmetrico, in cui le ali scendono in diagonale dalla spalla sinistra verso il basso a destra. Si ritiene che il nome derivi dal paragone tra le ali oblique e una freccia (ya). Si dice che fosse il nodo delle dame al servizio delle famiglie samurai nel periodo Edo; oggi è uno dei classici per il furisode e per l'hiki-furisode della sposa.", "o": "Furisode (cerimonia della maggiore età, matrimoni, cerimonie di laurea o diploma, ecc.), hiki-furisode della sposa, kimono dei bambini per lo Shichi-Go-San", "w": "Fukuro obi", "p": ["Si riconosce dall'ala obliqua che spunta sopra la spalla", "La linea diagonale rende la figura slanciata vista da dietro", "Numerose varianti, ad esempio con pieghe aggiunte alle ali"]}, "n-bunko": {"n": "Il classico nodo a fiocco", "tag": "Un nodo classico di antica tradizione, a forma di fiocco.", "d": "Nodo a forma di fiocco, con le ali distese orizzontalmente a destra e a sinistra e il centro avvolto e fermato con l'altra estremità dell'obi. Si dice che abbia avuto origine dal nodo delle donne delle famiglie samurai nel periodo Edo. Legato con un hanhaba obi è il classico dello yukata; legato con un fukuro obi diventa un nodo sontuoso, adatto anche al furisode.", "o": "Yukata, komon, furisode (se legato con un fukuro obi)", "w": "Hanhaba obi, fukuro obi, maru obi", "p": ["Il nodo dell'obi più amato per lo yukata", "Si ritiene derivi dal nodo delle donne delle famiglie samurai del periodo Edo", "A seconda del tipo di obi, può essere informale o da cerimonia"]}, "n-darari": {"n": "Il nodo delle maiko", "tag": "Il nodo delle maiko di Kyoto, con il lungo obi che ricade quasi fino ai piedi.", "d": "Si usa un «darari obi» lungo circa 5 m, le cui due estremità ricadono quasi fino alle caviglie. È l'abbigliamento simbolo delle maiko (apprendiste geisha) di Kyoto, e all'estremità dell'obi compare lo stemma dell'okiya (casa delle geisha) a cui appartengono. Questo nodo, di moda tra le donne del periodo Edo, si tramanda ancora oggi nell'abbigliamento delle maiko.", "o": "Abbigliamento delle maiko", "w": "Maru obi (darari obi)", "p": ["È tipico delle maiko: quando diventano geiko passano al nodo a tamburo", "Sulle estremità pendenti compare lo stemma dell'okiya", "Lo si vede spesso a Gion, a Kyoto, o nelle esperienze di trasformazione in maiko"]}, "n-kai": {"n": "Il classico nodo maschile", "tag": "Il nodo più semplice e basilare per il kaku obi maschile.", "d": "Deve il nome alla somiglianza del nodo con la bocca di una conchiglia bivalve. È il nodo più rappresentativo per il kaku obi maschile: piccolo, piatto e difficile da sciogliere, si adatta a tutto, dall'abbigliamento quotidiano fino al completo formale con haori e hakama con stemma di famiglia. Talvolta lo legano anche le donne, con un hanhaba obi.", "o": "Tutti i kimono maschili; yukata e kimono informali femminili (con hanhaba obi)", "w": "Kaku obi, hanhaba obi", "p": ["Il nodo va posizionato leggermente spostato rispetto al centro della schiena", "Essendo piatto, non dà fastidio contro lo schienale della sedia", "Con un po' di pratica, si lega in circa un minuto"]}, "n-ronin": {"n": "Il nodo maschile piatto e pratico", "tag": "Un nodo maschile per kaku obi, semplice e piatto, con un'estremità che spunta in diagonale verso l'alto.", "d": "Si inizia con un primo nodo come per il kai-no-kuchi; poi un'estremità viene ripiegata in diagonale verso l'alto e l'altra viene infilata tra gli strati dell'obi avvolto in vita per fissarla. Considerato una variante del nodo katabasami, si distingue per il nodo piccolo e piatto. Sull'origine del nome non esiste una spiegazione certa.", "o": "Yukata e kimono informali maschili", "w": "Kaku obi (le donne possono usare anche un hanhaba obi)", "p": ["Ancora più semplice da legare del kai-no-kuchi", "Il nodo piatto non preme sulla schiena quando si è seduti", "Nelle occasioni più formali è preferibile scegliere il kai-no-kuchi o simili"]}, "t-yuzen": {"n": "La tintura che dipinge come un quadro", "tag": "Una tecnica che tinge i motivi in molti colori, come se si dipingesse con il pennello.", "d": "Tecnica di tintura che si dice sia stata diffusa nel periodo Edo da Miyazaki Yūzensai, pittore di ventagli di Kyoto. Con una pasta a base di riso glutinoso si tracciano i contorni del motivo per evitare che i colori sbavino, poi l'interno viene colorato a pennello. Fiori e paesaggi possono essere resi come in un dipinto.", "o": "Furisode, tomesode, hōmongi, tsukesage", "w": "Kyō-yūzen (Kyoto), Kaga-yūzen (Ishikawa), Tokyo tegaki-yūzen (Tokyo)", "p": ["Si riconosce dalle sottili linee bianche di contorno (itome) lasciate dalla pasta", "Il Kaga-yūzen predilige fiori e piante realistici, fino alle foglie «rosicchiate dagli insetti»; il Kyō-yūzen si distingue per lo sfarzo delle decorazioni in oro e dei ricami", "Un solo kimono può richiedere diversi mesi di lavoro"]}, "t-ise": {"n": "La tintura a stampino per motivi minuti", "tag": "Una tecnica che tinge con precisione motivi minuti usando stampini di carta washi.", "d": "Sul tessuto si posa un «Ise-katagami», uno stampino intagliato in fogli di carta washi incollati tra loro con tannino di cachi; sopra si stende la pasta, così che il motivo resti in riserva durante la tintura. Gli stampini si producono da secoli a Shiroko e Jike, nella città di Suzuka (prefettura di Mie), e hanno reso possibili i motivi estremamente minuti dell'Edo komon.", "o": "Edo komon, komon, yukata", "w": "Stampini: Suzuka, prefettura di Mie (Shiroko e Jike) / Tintura: Tokyo, Kyoto e altre località", "p": ["Alcuni motivi sono così minuti da sembrare in tinta unita da lontano", "Gli Ise-katagami sono riconosciuti dallo Stato come strumento artigianale tradizionale", "Le tecniche di intaglio degli stampini sono designate Importante Bene Culturale Immateriale dello Stato"]}, "t-shibori": {"n": "La tintura a legatura", "tag": "Una tecnica che lega il tessuto con il filo prima di tingerlo, creando motivi morbidi e in rilievo.", "d": "Alcune parti del tessuto vengono legate con il filo, cucite e arricciate oppure piegate, in modo che il colorante non vi penetri e il motivo emerga con la tintura. In tecniche come il kanoko shibori, i punti legati lasciano piccoli rilievi granulosi che conferiscono al tessuto una tridimensionalità unica e una mano morbida.", "o": "Furisode, hōmongi, haori, sciarpe obi-age, yukata", "w": "Kyō-kanoko shibori (Kyoto), Arimatsu-Narumi shibori (Aichi)", "p": ["Il kanoko shibori, con file di minuscoli puntini, deve il nome alla somiglianza con le macchie sul dorso di un cerbiatto", "Un furisode interamente in shibori, con centinaia di migliaia di puntini legati a mano, è un prodotto di altissimo pregio", "Nel periodo Edo l'Arimatsu-Narumi shibori era un souvenir molto apprezzato dai viaggiatori lungo la strada del Tōkaidō"]}, "t-roketsu": {"n": "La tintura a riserva con cera", "tag": "Una tecnica che disegna i motivi con cera fusa per impedire al colore di penetrare.", "d": "La cera fusa viene stesa sul tessuto con un pennello o altri strumenti, così che il colorante non penetri in quelle zone. Giunta in Giappone nel periodo Nara (VIII secolo), di cui restano esemplari nello Shōsōin, la tecnica cadde poi in disuso e fu riportata in vita da artisti tintori tra il periodo Taishō e il periodo Shōwa. Il colorante che si infiltra nelle crepe della cera crea sottili venature dal fascino unico.", "o": "Hōmongi, tsukesage, Nagoya obi, fukuro obi di tendenza", "w": "Artisti di Kyoto e di tutto il Giappone", "p": ["Apprezzata per le «venature craquelé» che si formano dove la cera si crepa", "Una delle tre tecniche di tintura a riserva del periodo Nara (sankechi)", "Si basa sullo stesso principio del batik indonesiano"]}, "t-shishu": {"n": "L'arte di ricamare i motivi", "tag": "Una tecnica che ricama i motivi in rilievo con fili di seta, d'oro e d'argento.", "d": "Tecnica decorativa in cui i motivi vengono realizzati ad ago con fili di seta, d'oro e d'argento. Spesso si aggiunge sopra i motivi tinti per dare sfarzo e tridimensionalità; il ricamo giapponese comprende decine di tecniche diverse. Lo stile più rappresentativo è il kyōnui di Kyoto.", "o": "Furisode, tomesode, hōmongi, colletti han-eri, fukuro obi, uchikake nuziali", "w": "Kyōnui (Kyoto), Kaga-nui (Ishikawa), ricamo Edo (Tokyo)", "p": ["I fili di seta vengono divisi e ritorti a mano per rendere lucentezza e sfumature di colore", "Abbinato alla tintura, conferisce un'espressività ancora più ricca", "Più ricami ci sono, più il kimono appare sontuoso (il grado di formalità dipende dal tipo di kimono)"]}, "t-kinsai": {"n": "Decorazione con foglia e polvere d'oro", "tag": "Una tecnica che impreziosisce i motivi con foglia d'oro e polvere d'oro.", "d": "Tecnica decorativa in cui si stende un adesivo (pasta) sul tessuto già tinto e vi si applicano foglia o polvere d'oro per decorare i motivi. Oltre a dare luce ai contorni e ai petali dei motivi yūzen, comprende molte tecniche, come il surihaku (foglia applicata a stampino) e il sunago (scaglie spolverate).", "o": "Furisode, tomesode, hōmongi, fukuro obi", "w": "Kyoto (sviluppatasi insieme al Kyō-yūzen)", "p": ["Quando cattura la luce, il motivo sembra risaltare", "Nel periodo Momoyama il surihaku era usato anche per i costumi del teatro Nō", "Oltre all'oro, si usano talvolta anche argento e platino"]}, "t-kasuri": {"n": "Il tessuto dai motivi sfumati", "tag": "Un tessuto realizzato con fili tinti a sezioni prima della tessitura, che crea motivi dall'aspetto sfumato.", "d": "Alcune parti dei fili vengono legate per proteggerle dal colore, e i fili così tinti a sezioni vengono tessuti per formare il motivo. Durante la tessitura si creano lievi sfasature che rendono i contorni come sbiaditi: da qui il nome kasuri. È amato per la sua mano rustica e calda.", "o": "Tsumugi, kimono di cotone, yukata, abiti da lavoro come il samue", "w": "Kurume kasuri (Fukuoka), Iyo kasuri (Ehime), Bingo kasuri (Hiroshima); usato anche negli Ōshima tsumugi e Yūki tsumugi", "p": ["I tre grandi kasuri del Giappone sono Kurume, Iyo e Bingo", "I contorni sfumati sono il fascino tipico del kasuri, tessuto con fili tinti a sezioni", "Nel mondo esistono tecniche affini note come ikat"]}, "t-tsumugi": {"n": "Il tessuto di seta da filo di bambagia", "tag": "Un tessuto di seta rustico e resistente, realizzato con fili filati a mano dalla bambagia di seta.", "d": "Tradizionalmente è un tessuto di seta realizzato con fili irregolari e nodosi, filati dalla bambagia di seta (mawata) o da bozzoli difettosi e doppi, e tinti prima della tessitura. I nodi del filo creano una superficie dalla trama caratteristica e un aspetto morbido e opaco. Lo Yūki tsumugi usa ancora oggi filo di bambagia filato a mano, mentre alcuni, come l'Ōshima tsumugi, sono oggi tessuti con filo di seta e conservano il termine «tsumugi» solo nel nome. Per lo tsumugi come tipo di kimono, consultate anche la scheda “Kimono”.", "o": "Kimono tsumugi, haori, Nagoya obi, hassun obi", "w": "Ōshima tsumugi (Kagoshima), Yūki tsumugi (Ibaraki e Tochigi), Ushikubi tsumugi (Ishikawa), Shiozawa tsumugi (Niigata) e altri", "p": ["La tecnica dello Yūki tsumugi (filo di bambagia filato a mano, kasuri legato a mano, telaio a cinghia dorsale) è Importante Bene Culturale Immateriale dello Stato (1956) ed è iscritta nella lista del Patrimonio culturale immateriale dell'UNESCO (2010)", "L'Ōshima tsumugi è noto per il profondo bruno-nero ottenuto con la tintura nel fango", "Si dice che sia nato per sfruttare al meglio i bozzoli difettosi"]}, "t-chirimen": {"n": "La seta dalla fine increspatura", "tag": "Un tessuto di seta morbido e flessuoso, con una fine increspatura in superficie chiamata shibo.", "d": "Tessuto di seta realizzato con fili di trama a forte torsione. Durante la purga, i fili tendono a sciogliere la torsione, creando sulla superficie una fine increspatura chiamata shibo. Poiché assorbe bene il colorante e restituisce colori brillanti, è molto usato come base per i kimono tinti, ad esempio con lo yūzen.", "o": "Komon, hōmongi, iromuji, tsukesage, sciarpe obi-age, furoshiki", "w": "Tango chirimen (Kyoto), Nagahama chirimen (Shiga)", "p": ["Il Tango chirimen rappresenta una quota importante dei tessuti bianchi per kimono prodotti in Giappone", "A seconda della torsione e dello spessore dei fili di trama, esistono varianti come lo hitokoshi (increspatura fine), il kodai (più marcata) e l'oni-shibo (ancora più marcata)", "Le pieghe si notano poco e al tatto è morbido e setoso (attenzione: se si bagna tende a restringersi)"]}}};

ات", "tag": "الزي الأكثر رسمية للنساء المتزوجات، وزخارفه عند الذيل فقط.", "d": "كورو-توميسوده (⁦kuro-tomesode⁩) ذو الأرضية السوداء هو أعلى الأزياء رسمية للنساء المتزوجات. يكون نصفه العلوي سادة، وتُرسم الزخارف الجالبة للحظ عند الذيل فقط، ويحمل خمسة شعارات للعائلة على الظهر والصدر والكُمّين. أما إيرو-توميسوده (⁦iro-tomesode⁩) الملوَّن فيمكن أن ترتديه غير المتزوجات أيضًا؛ وإذا حمل خمسة شعارات للعائلة كان بمنزلة كورو-توميسوده، وإذا حمل ثلاثة أو شعارًا واحدًا عُدّ شبه رسمي.", "o": "حفلات الزفاف (بصفة والدة العروسين أو قريبتهما)، المراسم الرسمية الرفيعة", "w": "النساء المتزوجات (كورو-توميسوده)", "p": ["شعارات العائلة الخمسة علامة على أعلى درجات الرسمية", "الزخارف أسفل الخصر فقط", "يُنسَّق مع فوكورو أوبي (⁦fukuro obi⁩) مزيَّن بالذهبي والفضي"]}, "homongi": {"n": "زي شبه رسمي للمتزوجات وغير المتزوجات", "tag": "زي شبه رسمي لجميع النساء، تمتد زخارفه عبر خطوط الخياطة.", "d": "هومونغي (⁦hōmongi⁩) زي شبه رسمي أنيق ترتديه النساء المتزوجات وغير المتزوجات على حد سواء. يتميز بزخرفة إيبا-مويو (⁦eba-moyō⁩) التي تتصل عبر خطوط الخياطة كأنها لوحة واحدة، فتنساب من الكتف إلى الكُمّ ثم إلى الذيل.", "o": "حفلات الزفاف والاستقبال (بصفة ضيفة)، الحفلات، مجالس الشاي، حفلات بدء الدراسة والتخرج", "w": "النساء (المتزوجات وغير المتزوجات)", "p": ["لا تنقطع الزخرفة عند خطوط الخياطة فتبدو لوحة واحدة", "إضافة شعار العائلة ترفع درجة رسميته", "يُنسَّق عادةً مع فوكورو أوبي (⁦fukuro obi⁩)"]}, "iromuji": {"n": "كيمونو سادة مصبوغ بلون واحد", "tag": "كيمونو سادة مصبوغ بلون واحد غير الأسود، وتتحدد رسميته بوجود شعار العائلة.", "d": "إيرومُوجي (⁦iromuji⁩) كيمونو (⁦kimono⁩) مصبوغ بلون واحد غير الأسود ولا زخارف عليه. إذا أُضيف إليه شعار العائلة صار شبه رسمي، ومن دونه يُلبس رسميًا مخفَّفًا، وبتغيير الأوبي (⁦obi⁩) يصبح أنيقًا غير رسمي. قطعة واحدة تناسب مناسبات كثيرة.", "o": "مجالس الشاي، المراسم، مرافقة الأطفال في زيارة المعبد الأولى ومناسبة شيتشي-غو-سان (⁦Shichi-Go-San⁩)، مراسم التأبين (إذا كان بلون هادئ)", "w": "النساء (المتزوجات وغير المتزوجات)", "p": ["قد يحمل القماش زخرفة خفيفة منسوجة فيه (جيمون، jimon)", "يصبح ش )", "w": "كاي نو كوتشي (⁦kai-no-kuchi⁩)، رونين موسوبي (⁦rōnin musubi⁩)، إيتشيمونجي (⁦ichimonji⁩) وغيرها", "p": ["يُربط عند مستوى عظم الورك، منخفضًا في الأمام ومرتفعًا في الخلف", "سُمّي هاكاتا كينجو بهذا الاسم لأنه كان يُقدَّم هديةً إلى الشوغونية في عصر إيدو", "في الأزياء الرسمية يُختار أوبي بلون هادئ يبدو سادة"]}, "n-otaiko": {"n": "عقدة الأوبي النسائية الأكثر شيوعًا", "tag": "عقدة الأوبي الأكثر شيوعًا، تشكّل «طبلًا» مربعًا على الظهر.", "d": "أوتايكو (⁦otaiko⁩) هي عقدة الأوبي (⁦obi⁩) الأكثر شيوعًا لدى النساء البالغات، وتشكّل على الظهر هيئة منتفخة تشبه الصندوق. يُقال إنها بدأت في عام 1817 في أواخر عصر إيدو، حين ربطتها غيشا (⁦geisha⁩) حي فوكاغاوا في مراسم العبور الأول لجسر تايكوباشي (جسر الطبل) بعد إعادة بنائه في معبد كاميدو تينجين.", "o": "أنواع كثيرة من الكيمونو، مثل هومونغي (⁦hōmongi⁩) وإيرومُوجي (⁦iromuji⁩) وكومون (⁦komon⁩) وتسوموغي (⁦tsumugi⁩) وتوميسوده (⁦tomesode⁩)", "w": "ناغويا أوبي (Nagoya obi، الطبل المفرد)، فوكورو أوبي (fukuro obi، الطبل المزدوج)", "p": ["عقدة الطبل المزدوج بفوكورو أوبي تعني «تراكُب الأفراح»، فتُستخدم في المناسبات السعيدة", "في مناسبات العزاء تُستخدم عقدة الطبل المفرد حتى «لا تتراكب الأحزان»", "يُضبط شكلها باستخدام وسادة الأوبي (أوبي-ماكورا، obi-makura) ووشاح الأوبي (أوبي-آغيه، obi-age) ورباط الأوبي (أوبي-جيمه، obi-jime)"]}, "n-tsunodashi": {"n": "عقدة أوبي أنيقة للسيدات الناضجات", "tag": "عقدة أنيقة يبرز فيها طرفا الأوبي كالقرنين من جانبي طبل مسطّح.", "d": "تسونوداشي (⁦tsunodashi⁩) عقدة يطلّ فيها طرفا الأوبي (⁦obi⁩) كالقرنين من يمين ويسار عقدة الطبل (أوتايكو، otaiko) المسطّحة. وهي هيئة قديمة متوارثة منذ عصر إيدو، تُربط منخفضة قليلًا، وقد تُربط أحيانًا دون وسادة الأوبي، فتتميز بمظهر أنيق بسيط ينمّ عن ذوق رفيع.", "o": "كومون (⁦komon⁩)، تسوموغي (⁦tsumugi⁩) وغيرهما من الملابس اليومية والأنيقة غير الرسمية", "w": "ناغويا أوبي (⁦Nagoya obi⁩)، هانهابا أوبي (⁦hanhaba obi⁩)، فوكورو أوبي (⁦fukuro obi⁩) غير الرسمي", "p": ["من طرق ربطها ما لا يحتاج إلى وسادة الأوبي، فتكون مريحة للظهر", "تعكس أناقة المرأة الناضجة وذوقها الرفيع («إيكي»، iki)", "تُعدّ عقدة غينزا (⁦Ginza musubi⁩) نوعًا من تسونوداشي"]}, "n-fukura": {"n": "عقدة أوبي بهيجة لفوريسوده", "tag": "عقدة الأوبي المميِّزة لفوريسوده، على هيئة عصفور دوري نفش ريشه.", "d": "فوكورا سوزومه (⁦fukura suzume⁩) عقدة بهيجة تحاكي هيئة عصفور الدوري وقد نفش ريشه من برد الشتاء، وينبسط جناحاها يمينًا ويسارًا. ويُكتب اسمها أيضًا بحروف كانجي تتضمن معنى «الحظ»، فتُعدّ هيئة مباركة تجلب الحظ، وقد أصبحت العقدة المعتادة لأوبي (⁦obi⁩) فوريسوده (⁦furisode⁩).", "o": "فوريسوده (يوم بلوغ سن الرشد، حفلات الزفاف، حفلات التخرج وغيرها)", "w": "فوكورو أوبي (⁦fukuro obi⁩) طويل", "p": ["اسم مبارك يوحي بمعنى «ازدياد الحظ»", "تُنسَّق مع فوريسوده، الزي الرسمي للنساء غير المتزوجات", "يتغير مظهرها بحسب حجم الجناحين وزاويتهما"]}, "n-tateya": {"n": "عقدة فوريسوده بهيجة بجناح مائل", "tag": "عقدة أوبي بهيجة ذات هيئة مجسّمة، يمتد جناحاها مائلَين من الكتف الأيسر إلى أسفل اليمين.", "d": "تاتيا (⁦tateya⁩) عقدة أوبي (⁦obi⁩) غير متماثلة، يمتد فيها جناحا الأوبي مائلَين من الكتف الأيسر نحو أسفل اليمين. ويُقال إن اسمها جاء من تشبيه الجناح المائل بالسهم (يا، ya). ويُروى أنها الهيئة التي كانت تربطها وصيفات قصور الساموراي في عصر إيدو، وهي اليوم من العُقد المعتادة لفوريسوده (⁦furisode⁩) ولثوب العروس هيكي-فوريسوده (⁦hiki-furisode⁩).", "o": "فوريسوده (يوم بلوغ سن الرشد، حفلات الزفاف، حفلات التخرج وغيرها)، هيكي-فوريسوده للعروس، كيمونو الأطفال في مناسبة شيتشي-غو-سان (⁦Shichi-Go-San⁩)", "w": "فوكورو أوبي (⁦fukuro obi⁩)", "p": ["تتميز بالجناح المائل الذي يطلّ من فوق الكتف", "يُظهر الخط المائل القوام من الخلف ممشوقًا", "تنويعاتها كثيرة، كإضافة طيّات إلى الجناحين"]}, "n-bunko": {"n": "عقدة أوبي كلاسيكية على شكل فيونكة", "tag": "عقدة أوبي كلاسيكية عريقة على هيئة فيونكة الشريط.", "d": "بونكو (⁦bunko⁩) عقدة على هيئة فيونكة الشريط، ينبسط فيها الجناحان أفقيًا يمينًا ويسارًا، ويُلفّ وسطها بطرف الأوبي (⁦obi⁩) لتثبيته. ويُقال إن نساء أسر الساموراي في عصر إيدو أول من ربطها. فإذا رُبطت بهانهابا أوبي (⁦hanhaba obi⁩) كانت العقدة المعتادة مع يوكاتا (⁦yukata⁩)، وإذا رُبطت بفوكورو أوبي (⁦fukuro obi⁩) صارت هيئة بهيجة تناسب فوريسوده (⁦furiso
